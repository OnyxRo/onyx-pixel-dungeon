apply plugin: 'java-library'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    api project(':SPD-classes')
    implementation project(':services')
}

// lets javac list every error at once, which is how ported code gets fixed in few rounds
tasks.withType(JavaCompile) { options.compilerArgs += ["-Xmaxerrs", "3000"] }
