items.weapon.melee.gun.hg.rbachistka.desc=A handgun Cherino uses when purging someone.\n\nWithout even needing to pull the trigger, simply aiming down the barrel and shouting "Purge!" is enough to carry out the purge.
items.weapon.melee.gun.hg.rbachistka.stats_desc=This firearm has a low chance to purge enemies, causing them to disappear into thin air.
