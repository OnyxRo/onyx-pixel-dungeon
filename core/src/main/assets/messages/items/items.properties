items.artifacts.necronomicon$soulbound.desc=This creature's soul is chained to the Necronomicon. Its final death may become a new servant.
items.potions.towerpotionrules.excess=%d excess healing potions were placed on the ground.
items.trinkets.twindemoneyes.name=Twin Demon Eyes
items.trinkets.twindemoneyes.desc=These precision-made miniature eyes stare in unison, bringing back memories of dreadful nights. Surprisingly, both fit into your right eye socket without pain. They seem to follow the paths of ranged attacks, alternately locking onto a target to unleash powerful magic, at the cost of persistent blindness.
items.trinkets.twindemoneyes.typical_stats_desc=Typically, after a ranged weapon hits a target, these eyes lock onto it for _%1$d turns_, revealing its position regardless of your sight range but blinding you for the same _%1$d turns_. Before identification, you cannot tell which lock mode the eyes currently use.\n\nUpgrading these eyes requires a great deal of alchemical energy.
items.trinkets.twindemoneyes.stats_desc_flame=At this level, these eyes precisely lock onto a target hit by a ranged weapon for _%1$d turns_, revealing its position regardless of sight range but blinding you for the same _%1$d turns_. During the lock, the _Flame Eye_ intermittently fires a cursed-flame missile to burn the target. When the lock ends, it switches to the other mode.\n\nUpgrading these eyes requires a great deal of alchemical energy.
items.trinkets.twindemoneyes.stats_desc_laser=At this level, these eyes lock onto a target hit by a ranged weapon for _%1$d turns_, revealing its position and blinding you for _%1$d turns_. Current mode: _Laser Eye_. It charges during the lock, then fires a ray and changes mode.
items.trinkets.twindemoneyes.flame_eye=flame eye
items.trinkets.twindemoneyes.laser_eye=laser eye
items.trinkets.twindemoneyes$eyelock.name_flame=Precise Lock (Flame Eye)
items.trinkets.twindemoneyes$eyelock.name_laser=Precise Lock (Laser Eye)
items.trinkets.twindemoneyes$eyelock.desc_flame=The Flame Eye focuses on the target most recently hit by a ranged weapon.\n\nDuring the lock, it intermittently fires a cursed-flame missile, dealing _%1$d damage_ and applying cursed burning. The first hit burns for _%2$d turns_; later hits burn for _%3$d turns_. It switches to the Laser Eye when the lock ends.\n\nTurns remaining: %4$d
items.trinkets.twindemoneyes$eyelock.desc_laser=The Laser Eye focuses on the target most recently hit by a ranged weapon.\n\nDuring the lock, it charges continuously. When the lock ends, it fires a powerful beam through all creatures along a path of up to 12 tiles, dealing _%1$d–%2$d random magical damage_ based on its current charge. The beam cannot be evaded. It then switches to the Flame Eye.\n\nTurns remaining: %3$d
items.trinkets.twindemoneyes.mode_changed_laser=Your right eye has switched to laser eye.
items.trinkets.twindemoneyes.mode_changed_flame=Your right eye has switched to flame eye.

