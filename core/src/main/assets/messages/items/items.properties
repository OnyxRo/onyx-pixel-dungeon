items.allies.firedragon$dragon.desc=Fire dragons are more durable and damaging than their other counterparts, in addition to being immune to fire. They will set enemies and terrain on fire, however, so watch out!
items.allies.waterdragon.name=Water Dragon Crystal
items.allies.waterdragon.already_spawned=The Crystal isn't charged
