items.weapon.melee.relicmeleeweapons.neptunestrident.desc=A possession of Neptune himself, this Trident is most useful in water.
items.weapon.melee.relicmeleeweapons.neptunestrident.stats_desc=This is a rather slow weapon\nThis weapon has extra reach\nThis is a slightly accurate weapon
items.weapon.melee.relicmeleeweapons.neptunestrident.ac_activate=FLOOD
items.weapon.melee.relicmeleeweapons.relicenchantments.voltage.name=%s of voltage
items.weapon.melee.relicmeleeweapons.relicenchantments.voltage.desc=The Voltage enchantment causes a weapon to arc electricity to several targets nearby as well as the direct one.
items.weapon.melee.relicmeleeweapons.relicenchantments.voltage.activated=Unleash the waters!
