items.weapon.melee.quick.pocketknife.desc=A small pocket knife. While it may not deal significant damage to enemies, it can be quite helpful for protecting yourself in emergencies. Upgrading this weapon will allow you to consume it to enhance upgrade another me
items.weapon.melee.quick.pocketknife.stats_desc=This weapon has to be used from quickslots; it cannot be equipped normally.
