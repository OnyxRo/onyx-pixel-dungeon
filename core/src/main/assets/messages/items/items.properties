items.weapon.melee.halberd.name=Halberd
items.weapon.melee.halberd.desc=A halberd is a two-handed pole weapon that came to prominent use during the 14th and 15th centuries. The word halberd may come from the German words Halm, and Barte. In modern-day German, the weapon is called a Hellebarde. In historical European martial arts, professional halberd practitioners are referred to as halberdiers.
