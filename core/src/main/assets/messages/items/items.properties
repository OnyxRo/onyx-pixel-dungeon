items.weapon.missiles.darts.dart.desc=These simple shafts of spike-tipped wood are weighted to fly true and sting their prey with a flick of the wrist. They can be tipped with seeds to gain bonus effects when thrown.
items.weapon.missiles.darts.dart.unlimited_uses=Due to their simple construction darts will effectively last forever.

items.weapon.missiles.darts.displacingdart.name=displacing dart
items.weapon.missiles.darts.displacingdart.desc=These darts are tipped with a fadeleaf-based compound which will teleport their target a short distance away.

items.weapon.missiles.darts.healingdart.name=healing dart
items.weapon.missiles.darts.healingdart.desc=These darts are tipped with a sungrass-based compound which grants a burst of healing to their target. The dart itself is still harmful to enemies, but will not harm allies.

items.weapon.missiles.darts.holydart.name=holy dart
items.weapon.missiles.darts.holydart.desc=These darts are tipped with a starflower-based compound which infuses holy energy into their target. Allies and regular enemies will become blessed, but undead or demonic enemies will take heavy damage. The dart itself is still harmful to enemies, but will not harm allies.

items.weapon.missiles.darts.incendiarydart.name=incendiary dart
items.weapon.missiles.darts.incendiarydart.desc=These darts are tipped with a firebloom-based compound which will burst into brilliant flames on impact.

items.weapon.missiles.darts.paralyticdart.name=paralytic dart
items.weapon.missiles.darts.paralyticdart.desc=These darts are tipped with an earthroot-based compound which will paralyze their target for a short time.

items.weapon.missiles.darts.poisondart.name=poison dart
items.weapon.missiles.darts.poisondart.desc=These darts are tipped with a sorrowmoss-based compound which will poison their target.

items.weapon.missiles.darts.rotdart.name=rot dart
items.weapon.missiles.darts.rotdart.desc=These wicked darts are tipped with an acidic rotberry-based compound, which will aggressively eat through anything the dart comes into contact with. Powerful foes will resist most of the effect, but the corrosion is strong enough to easily kill most standard enemies. These last longer than other tipped darts, but their durability cannot be boosted.
items.weapon.missiles.darts.rotdart.discover_hint=You can create this item using a seed from a specific quest.

items.weapon.missiles.darts.shockingdart.name=shocking dart
items.weapon.missiles.darts.shockingdart.desc=These darts are tipped with a stormvine-based compound which will deliver a nasty shock to their target.

items.weapon.missiles.darts.tippeddart.ac_clean=CLEAN
items.weapon.missiles.darts.tippeddart.clean_title=Clean Darts
items.weapon.missiles.darts.tippeddart.clean_desc=This action will remove the seed tipping on your darts, reverting them back to regular darts.
items.weapon.missiles.darts.tippeddart.clean_all=clean all
items.weapon.missiles.darts.tippeddart.clean_one=clean one
items.weapon.missiles.darts.tippeddart.cancel=cancel
items.weapon.missiles.darts.tippeddart.uses_left=This stack of darts has _%d/%d_ uses left before one tip wears off.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_But these are of such high quality that they will effectively last forever._
items.weapon.missiles.darts.tippeddart.about_to_break=Your dart's tip is about to expire.
items.weapon.missiles.darts.tippeddart.has_broken=Your dart's tip has expired.
items.weapon.missiles.darts.tippeddart.discover_hint=You can buy this item in a shop, or create it using a seed.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=This weapon inflicts cripple on its target.
items.weapon.missiles.bolas.desc=These unusual ranged weapons aren't very damaging, but do an excellent job of slowing their target.


items.weapon.missiles.fishingspear.name=fishing spear
items.weapon.missiles.fishingspear.desc=Tiny throwing spears that work well as an improvised weapon despite being designed for fishing.

items.weapon.missiles.forcecube.name=force cube
items.weapon.missiles.forcecube.ondeath=You killed yourself with your own Force Cube...
items.weapon.missiles.forcecube.stats_desc=This weapon spreads the force of its impact over a small area, hitting everything nearby.
items.weapon.missiles.forcecube.desc=These oddly-shaped magical cubes are small enough to hold in your hand, but are incredibly heavy.

items.weapon.missiles.heavyboomerang.name=heavy boomerang
items.weapon.missiles.heavyboomerang.stats_desc=This weapon circles back to the location it was thrown from after five turns.
items.weapon.missiles.heavyboomerang.desc=This large boomerang is difficult to wield effectively, but will deal considerable damage.

items.weapon.missiles.javelin.name=javelin
items.weapon.missiles.javelin.desc=These larger throwing spears are weighted to keep the spike at their tip foremost as they sail through the air.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.missiles.kunai.desc=These small knives are very powerful in the hands of a skilled user.

items.weapon.missiles.missileweapon.stats_known=This set of _tier-%1$d_ thrown weapons deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use.
items.weapon.missiles.missileweapon.stats_unknown=Typically this set of _tier-%1$d_ thrown weapons deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Probably this weapon is too heavy for you.
items.weapon.missiles.missileweapon.distance=Thrown weapons are more accurate at range, but less accurate up close.
items.weapon.missiles.missileweapon.durability=Thrown weapons will wear out and break as they are used.
items.weapon.missiles.missileweapon.uses_left=This set of thrown weapons has _%d/%d_ uses left before one breaks.
items.weapon.missiles.missileweapon.unlimited_uses=This set is of such high quality that it will effectively last forever.
items.weapon.missiles.missileweapon.unknown_uses=Typically this set of thrown weapons will have _%d_ uses before one breaks.
items.weapon.missiles.missileweapon.curse_discover=This thrown weapon is cursed!
items.weapon.missiles.missileweapon.about_to_break=Your thrown weapon is about to break.
items.weapon.missiles.missileweapon.has_broken=One of your thrown weapons has broken.
items.weapon.missiles.missileweapon.dust=The thrown weapon crumbles to dust as you touch it.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=If the last thrown weapon in your enhanced thrown weapon set breaks, the set will be permanently lost. Are you sure you want to throw it?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Yes
items.weapon.missiles.missileweapon.break_upgraded_warn_no=No
items.weapon.missiles.missileweapon$placeholder.name=thrown weapon

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikens can be thrown instantly with a 20 turn cooldown.
items.weapon.missiles.shuriken.desc=These star-shaped pieces of metal with razor-sharp blades can be quickly thrown while on the move.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Shuriken Cooldown
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=You have recently thrown a shuriken instantly, and must wait before doing it again. Shurikens can still be thrown, but at normal weapon speed.\n\nTurns Remaining: %s.

items.weapon.missiles.throwingclub.name=throwing club
items.weapon.missiles.throwingclub.stats_desc=This weapon doesn't stick to enemies and can be collected instantly.
items.weapon.missiles.throwingclub.desc=A fairly simple but durable thrown weapon, essentially a large rock fastened to a stick.

items.weapon.missiles.throwinghammer.name=throwing hammer
items.weapon.missiles.throwinghammer.stats_desc=This weapon doesn't stick to enemies and can be collected instantly.
items.weapon.missiles.throwinghammer.desc=These hefty hammers are designed to be thrown at an enemy. Their smooth all-metal construction means they are quite durable.

items.weapon.missiles.throwingknife.name=throwing knife
items.weapon.missiles.throwingknife.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.missiles.throwingknife.desc=These lightweight knives are balanced to arc through the air right into their target.
items.weapon.missiles.throwingknife.discover_hint=One of the heroes starts with this item.

items.weapon.missiles.throwingspear.name=throwing spear
items.weapon.missiles.throwingspear.desc=These lightweight spears have thin frames which are designed to be thrown, and not thrusted.

items.weapon.missiles.throwingspike.name=throwing spike
items.weapon.missiles.throwingspike.desc=These durable pointed shafts of metal are meant to be thrown into distant enemies.
items.weapon.missiles.throwingspike.discover_hint=One of the heroes starts with this item.

items.weapon.missiles.throwingstone.name=throwing stone
items.weapon.missiles.throwingstone.desc=These stones are sanded down to make them able to be thrown with more power than a regular stone.
items.weapon.missiles.throwingstone.discover_hint=One of the heroes starts with this item.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=This weapon inflicts _%1$d-%2$d bleed_ to its target.
items.weapon.missiles.tomahawk.typical_stats_desc=This weapon typically inflicts _%1$d-%2$d bleed_ to its target.
items.weapon.missiles.tomahawk.desc=These throwing axes have a serrated edge that tears as they stick to an enemy.

items.weapon.missiles.trident.name=trident
items.weapon.missiles.trident.desc=Massive throwing spears with three deadly prongs on the end. They are powerful, but quite heavy.


items.weapon.spiritbow.name=spirit bow
items.weapon.spiritbow.ac_shoot=SHOOT
items.weapon.spiritbow.prompt=Choose a target
items.weapon.spiritbow.stats=The bow cannot be directly upgraded, but will instead steadily grow stronger as you level up. At your current level, arrows shot from the bow will deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.spiritbow.desc=A bow made out of ancient magical wood. The bow's string and etchings glow with a pale blue light. When the string is pulled this bow will conjure a magical arrow which can be fired at an enemy.
items.weapon.spiritbow.discover_hint=One of the heroes starts with this item.

items.weapon.weapon.identify=You are now familiar enough with your weapon to identify it.
items.weapon.weapon.too_heavy=Because of your inadequate strength this weapon will hinder your attack speed, accuracy, and ability to surprise attack.
items.weapon.weapon.excess_str=Because of your excess strength, you will deal _0-%d bonus damage_ with this weapon.
items.weapon.weapon.hardening_gone=The hardening on this weapon has worn off!
items.weapon.weapon.incompatible=Interaction of different types of magic has negated the enchantment on this weapon!
items.weapon.weapon.cursed_worn=Because this weapon is cursed, you are powerless to remove it.
items.weapon.weapon.cursed=You can feel a malevolent magic lurking within this weapon.
items.weapon.weapon.weak_cursed=Despite the curse, you are able to unequip this weapon.
items.weapon.weapon.not_cursed=This weapon is free of malevolent magic.
items.weapon.weapon.faster=It is augmented to enhance _speed._
items.weapon.weapon.stronger=It is augmented to enhance _damage._
items.weapon.weapon.enchanted=it has a _%s._
items.weapon.weapon.enchant_hardened=It has been _hardened._
items.weapon.weapon.hardened_no_enchant=This weapon has been _hardened,_ but is not currently enchanted.
items.weapon.weapon$enchantment.enchant=enchantment
items.weapon.weapon$enchantment.rankings_desc=Killed by an enchantment
items.weapon.weapon$enchantment.discover_hint=You can find an item with this effect randomly in the dungeon, or try to apply it to an item yourself.


###misc items
items.amulet.name=amulet of yendor
items.amulet.ac_end=END THE GAME
items.amulet.desc=The Amulet of Yendor is the most powerful artifact known to human or dwarf kind. Its shimmering crystals contain incredible and wondrous power.
items.amulet.desc_origins=The origins of the amulet are unknown. History says that the King of Dwarves boasted that he had discovered the artifact shortly before the Dwarven civilization cut off all contact. How did he find it? How did Yog-Dzewa take it from him? Questions for another time perhaps, all that matters now is the amulet is yours!
items.amulet.desc_ascent=The origins of the amulet are unknown, but clearly it has been heavily influenced by Yog-Dzewa's power. The dungeon seems to be bending to Yog's will as you move through it, making enemies much more plentiful and powerful! You're also no longer able to activate or discard the amulet, almost as if it is cursed.
items.amulet.ascent_title=Ascension
items.amulet.ascent_desc=You begin to feel Yog-Dzewa's great and terrible power radiating from the amulet. Ascending back through the dungeon as a mortal might be more difficult than you thought!\n\nIf you continue ascending with the amulet the dungeon will become more dangerous, teleports between floors will be disabled, and you will only be able to win the game by defeating enemies as you ascend through the dungeon!\n\nYou can leave the amulet here for now if you want to ascend without starting this challenge, or activate the amulet before ascending to end the game normally.
items.amulet.ascent_yes=Continue!
items.amulet.ascent_no=Stop for Now
items.amulet.discover_hint=You can find this item at the bottom of the dungeon...

items.ankh.name=ankh
items.ankh.ac_bless=BLESS
items.ankh.bless=You bless the ankh with magical water.
items.ankh.desc=This ancient symbol of immortality grants the ability to return to life after death. Most items will be dropped where you died, but can be reclaimed if you return to it. Using a full waterskin, the ankh can be blessed with extra strength.
items.ankh.desc_blessed=This ancient symbol of immortality grants the ability to return to life after death. The ankh has been blessed and is now much stronger. The Ankh will sacrifice itself to save you in a moment of deadly peril.
items.ankh.discover_hint=You can buy this item in a shop.

items.arcaneresin.name=arcane resin
items.arcaneresin.prompt=Select a wand
items.arcaneresin.ac_apply=APPLY
items.arcaneresin.level_too_high=That wand is too powerful for resin to improve.
items.arcaneresin.not_enough=You don't have enough resin for that!
items.arcaneresin.apply=You coat your wand with resin, increasing its power!
items.arcaneresin.desc=This fine powder shimmers between shades of purple and white. It can act as an amplifier to magical energies, increasing the level of wands when it is applied to them!\n\nUpgrading a wand costs 1, 2, or 3 resin depending on the wand's initial level. Resin can upgrade wands to a maximum of +3.\n\nResin upgrades are _overridden by other upgrade sources_ however (such as scrolls of upgrade), and do not apply when imbuing a wand into the Mage's staff.
items.arcaneresin.discover_hint=You can craft this item via alchemy.

items.brokenseal.name=broken seal
items.brokenseal.ac_affix=AFFIX
items.brokenseal.prompt=Select an armor
items.brokenseal.unknown_armor=You must identify whether that armor is cursed or not first.
items.brokenseal.cursed_armor=The seal won't apply to cursed armor.
items.brokenseal.affix=You affix the seal to your armor!
items.brokenseal.desc=A wax seal, affixed to armor as a symbol of valor. It has a faded rune of protection engraved in the center, and is cracked in half across the middle.\n\nA memento from his home, the seal helps the warrior persevere. While wearing the seal the warrior will instantly gain shielding when he is about to be damaged to half health or lower.\n\nThe seal can be _affixed to armor,_ and moved between armors. It can carry a single upgrade with it, so long as that upgrade was applied to the armor while the seal was attached to it.
items.brokenseal.inscribed=The seal is inscribed with a _%s._
items.brokenseal.choose_title=Choose a Glyph
items.brokenseal.choose_desc=Both this armor and the broken seal are carrying a glyph. Pick which glyph should be kept.\n\nArmor Glyph: %1$s\nBroken Seal Glyph: %2$s\n\nNote that if you pick the glyph that is currently on the armor, the seal will not be able to transfer it later.
items.brokenseal.discover_hint=One of the heroes starts with this item.
items.brokenseal$warriorshield.name=Warrior Shield
items.brokenseal$warriorshield.desc_active=The Warrior's broken seal is currently helping him persevere, granting him shielding on top of his health. There is a cooldown after the shielding initially triggers before it can be used again.\n\nThis shield does not decay over time, but will end if no enemies are nearby for a few turns. When it ends, any unused shielding will reduce the cooldown, up to a max of 50%%.\n\nShield remaining: %1$d.\n\nCurrent Cooldown: %2$d.
items.brokenseal$warriorshield.desc_cooldown=The Warrior has recently gained shielding from his broken seal, and must wait until he can benefit from its shielding effect again.\n\nTurns Remaining: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=The Warrior's shield cooldown is currently negative, meaning that when his shield activates the cooldown will be lower than the usual 150 turns. The shield cooldown can be reduced to as low as -150 turns, which means it will immediately be available again once it is activated.\n\nCurrent cooldown: %d.

items.dewdrop.name=dewdrop
items.dewdrop.already_full=You already have full health.
items.dewdrop.desc=A crystal clear dewdrop.\n\nDue to the magic of this place, pure water has minor restorative properties.

items.equipableitem.curse_detected=You sense that the item is cursed just before you equip it!
items.equipableitem.unequip_cursed=You can't remove a cursed item!
items.equipableitem.ac_equip=EQUIP
items.equipableitem.ac_unequip=UNEQUIP

items.energycrystal.name=energy crystal
items.energycrystal.desc=A collection of small magical crystals, filled with alchemical energy.\n\nThese crystals are the most common ingredient in alchemy recipes and can be produced at an alchemy pot by scrapping consumable items.

items.gold.name=gold
items.gold.desc=A pile of gold coins. Collect gold coins to spend them later in a shop.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Chest
items.heap.chest_desc=You won't know what's inside until you open it!
items.heap.locked_chest=Locked chest
items.heap.locked_chest_desc=You won't know what's inside until you open it! But to open it you need a golden key.
items.heap.crystal_chest=Crystal chest
items.heap.crystal_chest_desc=You can see _%s_ inside, but to open the chest you need a crystal key.
items.heap.artifact=an artifact
items.heap.wand=a wand
items.heap.ring=a ring
items.heap.tomb=Tomb
items.heap.tomb_desc=This ancient tomb may contain something useful, but its owner will most certainly object to checking.
items.heap.skeleton=Skeletal remains
items.heap.skeleton_desc=This is all that's left of some unfortunate adventurer. Maybe it's worth checking for any valuables.
items.heap.remains=Hero's remains
items.heap.remains_desc=This is all that's left from one of your predecessors. Maybe it's worth checking for any valuables.

items.honeypot.name=honeypot
items.honeypot.ac_shatter=SHATTER
items.honeypot.desc=This large honeypot is only really lined with honey, instead it houses a giant bee! These sorts of massive bees usually stay in their hives, perhaps the pot is some sort of specialized trapper's cage? The bee seems pretty content inside the pot with its honey, and buzzes at you warily when you look at it.

%s
items.honeypot$shatteredpot.name=shattered honeypot
items.honeypot$shatteredpot.desc=The pot has been shattered, only the sticky honey that lines its walls is holding it together, and it is slowly coming apart.\n\nDespite its broken state, the bee still seems to want to protect the pot.

items.item.infusion_info=\n\n_Infused._ When this item is used up, it returns to your pack after %d turns, unless another infused item is still lying around.
items.item.prompt=Choose direction of throw
items.item.ac_drop=DROP
items.item.ac_throw=THROW
items.item.rankings_desc=Killed by: %s
items.item.curse=curse
items.item.custom_note_type=This type of item has a custom note: "_%s_"
items.item.custom_note=This item has a custom note: "_%s_"
items.item.discover_hint=You can find this item randomly in the dungeon.

items.kindofmisc.unequip_title=Unequip one item
items.kindofmisc.unequip_message=You must unequip one of these items first. Select an item to swap with.

items.kindofweapon.swift_equip=You swiftly equip your weapon.
items.kindofweapon.equip_cursed=Your grip involuntarily tightens around the weapon.
items.kindofweapon.which_equip_msg=Which weapon slot would you like to equip this item to?\n\nThe Champion directly attacks with her primary weapon, but can use the ability of either weapon. Both weapons share the same charge count.\n\nThe Champion can also swap her primary and secondary weapon instantly.
items.kindofweapon.which_equip_primary=Primary (%s)
items.kindofweapon.which_equip_secondary=Secondary (%s)
items.kindofweapon.empty=empty

items.kingscrown.name=Dwarf King's crown
items.kingscrown.ac_wear=WEAR
items.kingscrown.naked=Unfortunately, the crown cannot transform your underwear.
items.kingscrown.upgraded=The crown glows brightly and then disintegrates as your armor transforms!
items.kingscrown.ratgraded=Rat King's paws glow brightly as your armor transforms!
items.kingscrown.desc=The crown of the last dwarven king, it glows with tremendous magical energy.\n\nWhen worn, the crown's magic will flow into the armor you're currently wearing, transforming it into a _unique epic armor with special abilities._ The new armor will keep all the properties of the original armor.
items.kingscrown.discover_hint=You can get this item as a drop from certain enemies.

items.liquidmetal.name=liquid metal
items.liquidmetal.ac_apply=APPLY
items.liquidmetal.prompt=Select a thrown weapon
items.liquidmetal.already_fixed=That thrown weapon is already in perfect condition!
items.liquidmetal.apply=You use %d liquid metal to repair your thrown weapon.
items.liquidmetal.desc=This magical liquid can fill into the cracks and tears on a thrown weapon, restoring it to perfect condition! If a set of weapons is missing a weapon but otherwise fully repaired, then liquid metal can even be used to replace a missing weapon from the set!\n\nA tier 1 weapon requires 10 liquid metal to be fully repaired, a tier 5 weapon requires 30. Each upgrade also increases the amount of metal needed by 35%.\n\nLiquid metal cannot be used to repair the tips on tipped darts.
items.liquidmetal.discover_hint=You can craft this item via alchemy.

items.lostbackpack.name=lost backpack
items.lostbackpack.desc=This is your lost inventory. Collect it to reclaim all the items you lost!

items.merchantsbeacon.name=merchant's beacon
items.merchantsbeacon.ac_use=USE
items.merchantsbeacon.desc=This odd piece of dwarven technology allows you to communicate from great distances.\n\nAfter being activated, this beacon will let you sell items to Pixel Mart from anywhere in the dungeon.\n\nHowever, the magic within the beacon will only last for one session, so use it wisely.

items.stylus.name=arcane stylus
items.stylus.ac_inscribe=INSCRIBE
items.stylus.prompt=Select an armor
items.stylus.identify=You must identify whether that armor is cursed first.
items.stylus.cursed=The stylus's magic will not work on cursed armor.
items.stylus.inscribed=You inscribed your armor with the stylus.
items.stylus.desc=This arcane stylus is made of some dark, very hard stone. Using it you can inscribe a magical glyph on your armor, but you have no power over choosing what glyph it will be, the stylus will decide it for you.

items.tengusmask.name=Tengu's mask
items.tengusmask.ac_wear=WEAR
items.tengusmask.used=The mask disintegrates as its power flows into you!
items.tengusmask.desc=This mask fell off Tengu's face as he died, you can feel great magical power emanating from it. Was the mask Tengu's source of strength?\n\nWhen worn, the tremendous power of the mask will be transferred into you, enabling you to _choose a subclass for your hero._\n\nWhich subclass will you choose?
items.tengusmask.discover_hint=You can get this item as a drop from certain enemies.

items.torch.name=torch
items.torch.ac_light=LIGHT
items.torch.desc=An adventuring staple, when a dungeon goes dark, a torch can help lead the way.

items.waterskin.name=waterskin
items.waterskin.ac_drink=DRINK
items.waterskin.collected=You collect the dewdrop into your waterskin.
items.waterskin.full=Your waterskin is full!
items.waterskin.empty=Your waterskin is empty!
items.waterskin.desc=A container for liquid, made from leather and string, sealed with a cork stopper.
items.waterskin.desc_water=Right now the waterskin just contains some plain drinking water. Surely there is something in the dungeon that the waterskin could store instead.
items.waterskin.desc_heal=The waterskin is currently being used to store healing water. The more full the waterskin is, the more you will be instantly healed when drinking from it. You will only drink as much as you need.
items.waterskin.desc_full=The full waterskin seems to radiate energy, perhaps it can be used to bless another survival item?
items.waterskin.discover_hint=One of the heroes starts with this item.

###Devoted Pixel Dungeon weapons
items.weapon.melee.warpick.name=warpick
items.weapon.melee.warpick.stats_desc=This is a very inaccurate weapon.
items.weapon.melee.warpick.ability_name=heavy blow
items.weapon.melee.warpick.typical_ability_desc=The Duelist can perform a _heavy blow_ with a war hammer. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.warpick.ability_desc=The Duelist can perform a _heavy blow_ with a warpick. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.warpick.desc=A weapon originally designed to be wielded on horseback, it is worn and chipped from wear. While it can still be used on foot, it is rather ineffective to do so.
items.weapon.missiles.woodenboomerang.name=wooden boomerang
items.weapon.missiles.woodenboomerang.desc=An old and worn boomerang, small and made of wood. After a few turns, it will fly back to the location it was thrown from.
items.weapon.missiles.woodenboomerang.discover_hint=This weapon comes from Devoted Pixel Dungeon.

###Devoted Pixel Dungeon, bosses and quests
items.artifacts.cloakofthorns.name=cloak of thorns
items.artifacts.cloakofthorns.desc=This heavy cloak rests uncomfortably on your shoulders as its many spikes dig into your skin. The cloak of thorns will leave thorns behind as you walk, bleeding you and any allies that step on them. Enemies will instead be granted some healing when stepping in thorns, and thorn lashers will occasionally sprout from the ground if you are not in combat already. \n\nThis artifact will not regain charges, and will slowly loose its charge as it spreads thorns. You must fully drain it of energy in order to stop it from causing harm.
items.potions.brews.rockblock.name=rock block
items.potions.brews.rockblock.desc=When thrown, these magical blocks will fill in any water or magma, making an area safe to walk on. Rock Blocks come in limited quantities, so make sure to use them wisely when traversing magma lakes.
items.potions.elixirs.elixirofovergrowth.name=elixir of overgrowth
items.potions.elixirs.elixirofovergrowth.desc=The magic in the gnoll emperors staff has been infused into this elixir. Instead of providing immediate healing, it will cause you to spread grass and plants around you for a longer time and heal anytime you stand on vegetation.
items.potions.elixirs.elixirofovergrowth$overgrowth.name=heart of grass
items.potions.elixirs.elixirofovergrowth$overgrowth.desc=You are completely attuned with nature.\n\nWhile standing in vegetation, you will recover a small amount of health per turn. The effect is paused when you are at full health or on a non-organic surface. You will also randomly spread plants around you.\n\nTurns left: %d.
items.quest.ruby.name=ruby
items.quest.ruby.you_now_have=You now have %d rubies.
items.quest.ruby.desc=These ruby gems formed millenia ago under imense pressures inside of volcanos. Most of the natural supply was mined by the heat-resistant granite trolls, collectors and the wealthy are quite fond of them for their rarity.
items.quest.ruby.discover_hint=You can find this item during a specific quest.
items.quest.staffsplinter.name=staff splinter
items.quest.staffsplinter.desc=A splinter filled with magical energy, it split off from the gnoll emperors staff as it died. You can feel it pulsing in your hands.\n\nIt does nothing on its own, but it might be useful when combined with certain scrolls, or a potion. At the very least it should convert into a decent amount of energy.
items.rings.endothermicring.name=endothermic ring
items.rings.endothermicring.stats=You must consume _%1$s_ tiles of water until the ring is fully cooled off.
items.rings.endothermicring.desc=This ring is hot to the touch and it seems to be getting hotter by the second. The ring must be drenched in water periodically in order to cool it down until it fully looses its heat energy, draining an area of water when cooled. If it gets too hot, you will be set on fire. Stepping on embers will instantly cause a burst of heat to emit from the ring.
items.wands.wandofmalaise.name=wand of malaise
items.wands.wandofmalaise.staff_name=staff of malaise
items.wands.wandofmalaise.desc=This strange wand seems to be made of a green crystal, possibly jade. Blue cloth is wrapped around the crystaline base, a dark purple gem at the tip of the wand emits a purple energy, coating the wand in a dim light.
items.wands.wandofmalaise.stats_desc=This wand shoots vengeful spirits from its crystal, manifesting as wraiths. Targeting an enemy, it will instead grant that enemy a large amount of shielding and invulnerability, targetting an allied creature will deal large amounts of damage to it. \n\nThis wand will not regain charges, not using it for a while will cause you to take increasing damage and all charges must be used up in order to stop it from causing harm.
items.wands.wandofmalaise.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of prismatic light, they will be crippled for a duration that scales with staff level.
items.wands.wandofmalaise.eleblast_desc=An elemental blast with a staff of prismatic light deals 67% damage, reveals all terrain in the blast, and blinds enemies for 5 turns.
items.royalseal.name=Royal seal of the court
items.royalseal.ac_wear=ATTACH
items.royalseal.naked=Unfortunately, the seal cannot transform your underwear.
items.royalseal.upgraded=The seal glows brightly and then disintegrates as your armor transforms!
items.royalseal.ratgraded=Rat King's paws glow brightly as your armor transforms!
items.royalseal.desc=A seal with an appearance not unlike the one the warrior carries,yet this one is much more fancy and unbroken. The seal is glowing with energy.\n\nWhen attached to your armor, the seal's magic will flow into the armor you're currently wearing, transforming it into a _unique epic armor with special abilities._ The new armor will keep all the properties of the original armor.
items.meal.name=5 course meal
items.meal.ac_wear=EAT
items.meal.used=Eating the meal grants you divine inspriation!
items.meal.desc=The rat beast was protecting this incredibly delicious and mystical meal.\n\nWhen eaten, you will not gain any saturation, instead the tremendous power of the meal will be transferred into you, enabling you to _choose a subclass for your hero._\n\nWhich subclass will you choose?
items.meal.discover_hint=You can get this item as a drop from certain enemies.
items.quest.emberessence.name=Emberessence
items.quest.emberessence.desc=A brightly burning orb that was left behind by the furnace golem. Suprisingly, it feels rather cold.\n\nIt does nothing on its own, but it might be useful when combined with certain scrolls, or a bomb. At the very least it should convert into a decent amount of energy.
items.wyvernfruit.name=wyvernfruit
items.wyvernfruit.desc=A strange fruit from Devoted Pixel Dungeon. It had no description there.

###Combusted Pixel Dungeon weapons
items.weapon.thrown.thrownweapon.stats_known=This _tier-%1$d_ melee weapon deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use properly.
items.weapon.thrown.thrownweapon.stats_unknown=Typically this _tier-%1$d_ melee weapon deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use properly.
items.weapon.thrown.thrownweapon.probably_too_heavy=Probably this weapon is too heavy for you.
items.weapon.thrown.thrownweapon.stats_desc=
items.weapon.thrown.thrownweapon.distance=This weapon can be used as _melee_ or _thrown weapon_.
items.weapon.thrown.thrownweapon.durability=Thrown weapons will wear out and break as they are used.
items.weapon.thrown.thrownweapon.uses_left=This stack of weapons has _%d/%d_ uses left before one breaks.
items.weapon.thrown.thrownweapon.unlimited_uses=_But these are of such high quality that they will effectively last forever._
items.weapon.thrown.thrownweapon.about_to_break=Your thrown weapon is about to break.
items.weapon.thrown.thrownweapon$placeholder.name=thrown weapon
items.weapon.thrown.throwablespear.name=spear
items.weapon.thrown.throwablespear.stats_desc=This is a rather slow weapon.\nThis weapon has extra reach.
items.weapon.thrown.throwablespear.desc=A slender wooden rod tipped with sharpened iron.
items.weapon.thrown.throwablehandaxe.name=hand axe
items.weapon.thrown.throwablehandaxe.stats_desc=This is a rather accurate weapon.
items.weapon.thrown.throwablehandaxe.desc=A light axe, most commonly used for felling trees. The wide blade works well against foes as well.
items.weapon.thrown.throwabledagger.name=dagger
items.weapon.thrown.throwabledagger.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.thrown.throwabledagger.desc=A simple iron dagger with a worn wooden handle.
items.weapon.thrown.throwabledirk.name=dirk
items.weapon.thrown.throwabledirk.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.thrown.throwabledirk.desc=A longer thrusting dagger, gives a bit more steel to plunge into foes.

###Shattered Pixel Dungeon Matt Edition weapons
items.weapon.melee.blacksmith.katanadarkness.name=Dark Katana
items.weapon.melee.blacksmith.katanadarkness.ability_name=lunge
items.weapon.melee.blacksmith.katanadarkness.typical_ability_desc=The Duelist can _lunge_ with a katana at an enemy 1 tile away. This moves toward the enemy, typically deals _%1$d-%2$d damage_, and is guaranteed to hit.
items.weapon.melee.blacksmith.katanadarkness.ability_desc=The Duelist can _lunge_ with a katana at an enemy 1 tile away. This moves toward the enemy, deals _%1$d-%2$d damage_, and is guaranteed to hit.
items.weapon.melee.blacksmith.katanadarkness.desc=A darkened katana, often wielded by shadowy figures alike. This weapon, though nearly identical to a _katana_, will grant _3-4 turns of invisibility_ when successfully defeating a enemy with it.
items.weapon.melee.blacksmith.katanadarkness.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.glovespurge.name=Purge Gloves
items.weapon.melee.blacksmith.glovespurge.ability_name=combo strike
items.weapon.melee.blacksmith.glovespurge.typical_ability_desc=The Duelist can perform a _combo strike_ with gloves. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.blacksmith.glovespurge.ability_desc=The Duelist can perform a _combo strike_ with gloves. This attack is guaranteed to hit and deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.blacksmith.glovespurge.desc=These gloves are made of an ancient fabric that contains immense hardness and durability. This weapon, though nearly identical to _studded gloves_, has a _chance to paralyze a enemy_ when hit. This weapon can not paralyze bosses or minibosses, and chance to paralyze a enemy decreases with each paralyze inflicted on them.
items.weapon.melee.blacksmith.glovespurge.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.emeraldroundshield.name=Emerald Shield
items.weapon.melee.blacksmith.emeraldroundshield.typical_stats_desc=Typically this weapon blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.blacksmith.emeraldroundshield.stats_desc=This weapon blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.blacksmith.emeraldroundshield.ability_name=guard
items.weapon.melee.blacksmith.emeraldroundshield.typical_ability_desc=The Duelist can _guard_ herself with a round shield, completely negating all physical or magical attacks made against her typically for _%d turns_. Once the Duelist has blocked an attack, attacking back or using magic will end guarding.
items.weapon.melee.blacksmith.emeraldroundshield.ability_desc=The Duelist can _guard_ herself with a round shield, completely negating all physical or magical attacks made against her for _%d turns_. Once the Duelist has blocked an attack, attacking back or using magic will end guarding.
items.weapon.melee.blacksmith.emeraldroundshield.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.blacksmith.emeraldroundshield.desc=A shiny shield, forged out of pure emerald. This weapon, though nearly identical to a _round shield_, will _reflect some of the damage you take_ back to the attacker. Reflect damage can not kill an enemy, and magic damage can't be reflected.
items.weapon.melee.blacksmith.emeraldroundshield$guardtracker.name=guarding
items.weapon.melee.blacksmith.emeraldroundshield$guardtracker.guarded=guarded
items.weapon.melee.blacksmith.emeraldroundshield$guardtracker.desc=The Duelist has readied her shield in anticipation of incoming attacks. Physical or magical attacks made against her will be completely negated.\n\nTurns remaining: %s.
items.weapon.melee.blacksmith.emeraldroundshield.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.swordmidas.name=Sword of Midas
items.weapon.melee.blacksmith.swordmidas.ability_name=cleave
items.weapon.melee.blacksmith.swordmidas.typical_ability_desc=The Duelist can _cleave_ an enemy with a sword. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.blacksmith.swordmidas.ability_desc=The Duelist can _cleave_ an enemy with a sword. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.blacksmith.swordmidas.desc=A sword forged from the gold of King Midas himself. This weapon, though nearly identical to a _sword_, will make _enemies drop gold_ when you kill them. The amount of gold dropped is based on the damage dealt by the killing blow.\n\nOnly obtainable if any greedy sins or challenges are enabled.
items.weapon.melee.blacksmith.swordmidas$cleavetracker.name=cleave
items.weapon.melee.blacksmith.swordmidas$cleavetracker.desc=The Duelist is ready to follow up on her previous cleave. The next use of cleave will not cost any weapon ability charge.\n\nTurns remaining: %s.
items.weapon.melee.blacksmith.swordmidas.discover_hint=The blacksmith can forge this weapon for you if you are feeling... greedy.
items.weapon.melee.blacksmith.whipfirecracker.name=Firecracker
items.weapon.melee.blacksmith.whipfirecracker.stats_desc=This weapon has tremendous reach.
items.weapon.melee.blacksmith.whipfirecracker.ability_name=lash
items.weapon.melee.blacksmith.whipfirecracker.typical_ability_desc=The Duelist can _lash_ all enemies around her with a whip. This ability typically deals _%1$d-%2$d damage_, attacks all enemies within attack range, and is guaranteed to hit.
items.weapon.melee.blacksmith.whipfirecracker.ability_desc=The Duelist can _lash_ all enemies around her with a whip. This ability deals _%1$d-%2$d damage_, attacks all enemies within attack range, and is guaranteed to hit.
items.weapon.melee.blacksmith.whipfirecracker.desc=This whip is made of a vulcanized material that seems to be highly explosive. This weapon, though nearly identical to a _whip_, will cause a _explosion on enemies you hit_ with it. The explosion deals damage equal to half of the damage dealt, and does not harm the wielder.
items.weapon.melee.blacksmith.whipfirecracker.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.battleaxestormbringer.name=Stormbringer
items.weapon.melee.blacksmith.battleaxestormbringer.ability_name=heavy blow
items.weapon.melee.blacksmith.battleaxestormbringer.typical_ability_desc=The Duelist can perform a _heavy blow_ with this hammer. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.blacksmith.battleaxestormbringer.ability_desc=The Duelist can perform a _heavy blow_ with this hammer. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.blacksmith.battleaxestormbringer.desc=This hammer is made of a metal that seems to forever hold onto electricity, and it has stored enough to cast actual lightning bolts. This weapon will cast lightning similar to a _wand of lightning_ when hitting an enemy, riocheting to nearby enemies. The lightning can't hit the wielder, and deals magic damage equal to one third of the damage dealt.
items.weapon.melee.blacksmith.battleaxestormbringer.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.sicklebloodletter.name=Bloodletter
items.weapon.melee.blacksmith.sicklebloodletter.stats_desc=This is a rather inaccurate weapon.
items.weapon.melee.blacksmith.sicklebloodletter.ability_name=harvest
items.weapon.melee.blacksmith.sicklebloodletter.typical_ability_desc=The Duelist can _harvest_ an enemy with a sickle. This devastating attack is guaranteed to hit and typically deals _%d damage_. This damage is applied as bleeding if the target isn't immune.
items.weapon.melee.blacksmith.sicklebloodletter.ability_desc=The Duelist can _harvest_ an enemy with a sickle. This devastating attack is guaranteed to hit and deals _%d damage_. This damage is applied as bleeding if the target isn't immune.
items.weapon.melee.blacksmith.sicklebloodletter.desc=This sickle is made of a material with a dark aura, and it seems nearly demonic with the amount of blood it has absorbed. This weapon, though nearly identical to a _sickle_, will always _inflict the target with bleeding_, as long as they aren't immune to it. Bleed inflicted is equal to half of the damage dealt and does not stack.
items.weapon.melee.blacksmith.sicklebloodletter.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.spearamethystpiercer.name=Amethyst Piercer
items.weapon.melee.blacksmith.spearamethystpiercer.stats_desc=This is a rather slow weapon.\nThis weapon has extra reach.
items.weapon.melee.blacksmith.spearamethystpiercer.ability_name=spike
items.weapon.melee.blacksmith.spearamethystpiercer.typical_ability_desc=The Duelist can use the tip of a spear to _spike_ an enemy that is in range but not adjacent. This typically deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.blacksmith.spearamethystpiercer.ability_desc=The Duelist can use the tip of a spear to _spike_ an enemy that is in range but not adjacent. This deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.blacksmith.spearamethystpiercer.desc=A spear carved out of a dense rock with a cut amethyst crystal at its tip. This weapon, though nearly identical to a _spear_, will cause the wielder to focus and _deal increasing damage_ if they keep hitting the same target. Switching targets or defeating the target will cause the focus to reset and temporarily instead decrease the damage dealt. Focus will increase at a lower rate if the target is a boss or miniboss.
items.weapon.melee.blacksmith.spearamethystpiercer.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.melee.blacksmith.arrowsign.name=Arrow Sign
items.weapon.melee.blacksmith.arrowsign.stats_desc=This weapon is very heavy.\nThis weapon benefits more from upgrades.
items.weapon.melee.blacksmith.arrowsign.ability_name=heavy blow
items.weapon.melee.blacksmith.arrowsign.typical_ability_desc=The Duelist can perform a _heavy blow_ with this sign. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.blacksmith.arrowsign.ability_desc=The Duelist can perform a _heavy blow_ with this sign. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.blacksmith.arrowsign.desc=This sign is a rather big oddity of the dungeon. It almost seems like it was transported here from a alternative dimension, though you can't be certain from which. This weapon is strangely very heavy, and as a result deals immense damage. Not even the blacksmith can explain this... rather unlogical anomaly.
items.weapon.melee.blacksmith.arrowsign.discover_hint=The blacksmith can forge this weapon for you.
items.weapon.glock.name=Glock-40
items.weapon.glock.ac_shoot=SHOOT
items.weapon.glock.ac_reload=RELOAD
items.weapon.glock.prompt=Choose a target
items.weapon.glock.stats=Bullets fired from this weapon will deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.glock.desc=How did this get in the-
items.weapon.glock.reload=You reload your weapon...
items.weapon.glock.reload_full=Your weapon is already fully loaded!
items.weapon.glock.no_ammo=Your weapon is out of ammo and needs a reload before you can fire it!
items.weapon.glock.ammo_status=Ammo: %1$d/%2$d\n\n

###Pixel Dungeon Reforged
items.weapon.curses.leech.name=Leeching %s
items.weapon.curses.leech.desc=This weapon demands blood. If you go too long without satiating its dark desires, it will take that blood from you. The long you go without striking an enemy, the more the weapon demands.
items.weapon.curses.leech.ondeath=Your weapon took too much...
items.weapon.curses.leech.elestrike_desc=An elemental strike with a leech curse causes the hero and each enemy in range to bleed for 12 HP.

###experienced
items.weapon.melee.blacksmith.firingsnapper.name=firing snapper
items.weapon.melee.blacksmith.firingsnapper.stats_desc=This weapon is not as fast as regular whip, but is able to target any enemy as long as there is a clear path to it with no solid obstacles. When used, the Firing Snapper will explode every hostile creature on its way with blazing magic, making it and its neighbors take damage.
items.weapon.melee.blacksmith.firingsnapper.ability_name=help from hell
items.weapon.melee.blacksmith.firingsnapper.ability_desc=The Duelist can cast for _help from hell_ with Firing Snapper to surround themselves with blazing circle of fire, with chance of temporary demonic minions to appear to help in a fight; the hero will be immune to fire while circle is present. This ability costs 2 charges.
items.weapon.melee.blacksmith.firingsnapper.desc=This thorny and warm weapon is imbued with a blazing wrath of orange mine crystals, ready to surround everything on its path with smokes and fire of underworld.
items.weapon.melee.blacksmith.starlightsmasher.name=starlight smasher
items.weapon.melee.blacksmith.starlightsmasher.charging=Charged!
items.weapon.melee.blacksmith.starlightsmasher.ability_name=celestial flashbang
items.weapon.melee.blacksmith.starlightsmasher.ability_desc=The Duelist can cast a _celestial flashbang_ with Starlight Smasher, which will create 7x7 energized aura to blind and cripple every hostile creature in it; if hammer is charged with starlight energy, the enemies in aura will also be damaged for 25% damage. This ability costs 2 charges and uses up starlight energy if there was any.
items.weapon.melee.blacksmith.starlightsmasher.stats_desc=This is a pretty accurate weapon.\nThis weapon deals astronomical crushing damage, but disorientates both attacker and victim.\nStriking enemies with Starlight Smasher imbues it with powerful starlight energy. While this weapon is charged with such energy, throwing it at any enemy will strike 3x3 area with concentrated magical bolts from above, that deal 85% damage and inflict brief Blindness.
items.weapon.melee.blacksmith.starlightsmasher.desc=The crushing and skull-smashing blow of this towering mass of starlight-imbued crystals and refined steel can charge up energy to allow this weapon to be thrown like a shooting star to strike down enemies with astral magic.
items.weapon.melee.blacksmith.regrowingslasher.name=regrowing slasher
items.weapon.melee.blacksmith.regrowingslasher.stats_desc=This weapon blocks 0-4 damage.\nThis weapon will heal its user and all their allies by 0.67% of their max HP each strike. Once user or any ally are at full health, user is given 3.3% of their max HP in barkskin armor, the fading speed of which depends on amount of user's allies.\nWith small chance that grows with amount of allies weapon's user has, the user will be affected with random positive plant effect and the target will be affected with random negative plant effect.
items.weapon.melee.blacksmith.regrowingslasher.ability_name=herbal sacrifice
items.weapon.melee.blacksmith.regrowingslasher.ability_desc=The Duelist can cast a _herbal sacrifice_ with Regrowing Slasher to transform all visible allies into regrowth spirits, a powerful variants of wraiths that are immune to environment and magical damage and can survive 2 physical hits before dying; each transformed ally will heal the user for 10% of their HP. This ability costs 2 charges.
items.weapon.melee.blacksmith.regrowingslasher$regrowthspirit.name=regrowth spirit
items.weapon.melee.blacksmith.regrowingslasher$regrowthspirit.desc=Regrowth spirits are spirits tied to nature, empowered by sacrifice done to summon them. Their attack stats are stronger than wraith's, and they can ignore environmental and magical damage, while being able to survive up to 2 physical hits.
items.weapon.melee.blacksmith.regrowingslasher.desc=This slender light sword made with plant-energized crystals with a large steel guard above the handle is pouring healing and regrowth magic out of its blade.
items.weapon.melee.blacksmith.gleamingstaff.name=gleaming staff
items.weapon.melee.blacksmith.gleamingstaff.stats_desc=This weapon blocks 0-%d damage. This blocking scales with upgrades.\nThe damage of this quarterstaff leaves a lot to be desired, but it can materialize treasure bags from hitting enemies %d times.
items.weapon.melee.blacksmith.gleamingstaff.ability_name=avaritia's energy
items.weapon.melee.blacksmith.gleamingstaff.ability_desc=The Duelist can trigger _avaritia's energy_ with Gleaming Staff. This effect will stun the user for the time required to do 10 attacks, make them take triple damage, but staff's defense power is doubled and each physical hit from an enemy will grant Big Lucky Bags to user with 50% chance. This ability costs 2 charges.
items.weapon.melee.blacksmith.gleamingstaff.desc=A staff of quality gold-plated hardwood, its ends are shod with refined steel. Its hardness and durability make it a decent source of protection, while its golden properties can conjure the power of gambling.
items.weapon.melee.blacksmith.gleamingstaff$guardtracker.name=avaritia's energy
items.weapon.melee.blacksmith.gleamingstaff$guardtracker.desc=The greed gods are upon you, but they don't give any mercy...\n\nAny damage taken is tripled, but taking physical damage has 50% chance to give Big Lucky Bag.
items.weapon.melee.blacksmith.fantasmalstabber.name=fantasmal stabber
items.weapon.melee.blacksmith.fantasmalstabber.ability_name=super-sneak
items.weapon.melee.blacksmith.fantasmalstabber.ability_desc=The Duelist can _super-sneak_ while wielding Fantasmal Stabber. This ability lets the Duelist instantly blink up to 10 tiles away and grants her 1 turn of invisibility, which increases the efficiency of assassin perk, but costs 2 charges.
items.weapon.melee.blacksmith.fantasmalstabber.stats_desc=This weapon is stronger against unaware enemies.\nThis weapon proves you to be Assassin.\nThis weapon can attack incredibly quickly and pierce through enemy's armor.\nThis weapon slightly charges hero's artifacts and wands on each stab.
items.weapon.melee.blacksmith.fantasmalstabber.desc=A small, extra sharpened dagger with refined steel handle and magically-attuned wooden handle, that allows its wielder to stab very quickly through any foe they desire and empower their magic weapons while doing so.
items.weapon.melee.creativegloves.name=studded gloves (Creative)
items.weapon.melee.creativegloves.stats_desc=This is a infinitely fast weapon.
items.weapon.melee.creativegloves.desc=Usually creative items are supposed to give infinite energy, items or liquid. But I am bad with UI, so there you get gloves with infinite amount of speed. I am serious, you can attack as much as you want with those gloves.
items.weapon.melee.creativegloves.ability_name=creative strike
items.weapon.melee.creativegloves.ability_desc=The Duelist can perform a _creative strike_ with studded gloves (Creative). This attack is guaranteed to hit and oneshots the selected target, but needs the full scale of charges, hurts the user massively too and doesn't trigger any enchantments or on-ability kill perks.
items.weapon.missiles.clayball.name=clay
items.weapon.missiles.clayball.desc=The most balanced thing in the reality. Does overwhelming damage to every enemy, but can be used only once.

###abyssalnite
items.weapon.curses.exhausting.name=exhausting %s
items.weapon.curses.exhausting.desc=Exhausting weapons take great effort to use, and will periodically weaken the wearer as a result.
items.weapon.curses.fragile.name=fragile %s
items.weapon.curses.fragile.desc=Fragile weapons start out just as strong as their normal counterparts, but rapidly decrease in effectiveness as they are used.
items.weapon.melee.flute.name=Outer God Flute
items.weapon.melee.flute.stats_desc=This weapon has tremendous reach.\nThis weapon's attack cannot be dodged
items.weapon.melee.flute.desc=An ancient flute of unknown origin. The strange energy wrapped around it makes you feel that it is not made by humans. \n When blown, it would make a strange and empty sound, disturbing the spirit of near living creatures.
items.weapon.missiles.darts.sleepdart.name=sleep arrow
items.weapon.missiles.darts.sleepdart.desc=These arrows are tipped with a dreamfoil-based compound which will instantly put their target into a light sleep.

###experienced
items.armor.ratkingarmor.name=Crown
items.armor.ratkingarmor.ac_special=RAT KING'S WRATH
items.armor.ratkingarmor.desc=Honestly, this could be the object of the game if I wanted it to. It's that powerful. Now that I have it, there is nothing stopping me from winning...
items.bombs.flashbang.name=flashbang
items.bombs.flashbang.desc=This customized bomb will erupt into a burst of blinding light when it explodes. Anything nearby will be disoriented based on how close it was to the bomb.
items.bombs.shockbomb.name=shock bomb
items.bombs.shockbomb.desc=This bomb has been modified to unleash bolts of electricity when it explodes. Anything nearby will be damaged and stunned based on how close it was to the bomb.
items.spells.identificationbomb.name=identification bomb
items.spells.identificationbomb.ac_cast=EXPLODE
items.spells.identificationbomb.desc=This customized bomb is not used to explode the environment, instead it will explode right in your backpack, destroying all equipment unknown to you. Using this bomb takes a toll on the user however, blinding them from all the smoke and heavily damaging them. The damage will be reduced depending on amount of destroyed items.
items.spells.identificationbomb.blast=Powerful identifying energy erupts inside your backpack!
items.food.cheese.name=Cheese
items.food.cheese.eat_msg=Praise the Rat King!
items.food.cheese.desc=The gift from true king. Gives you many positive buffs, collects items from the whole level and can be traded for some wand with Wandmaker.
items.food.cheesechunk.name=cheese chunk
items.food.cheesechunk.desc=The chunk of full Cheese, left behind by true king. Gives you positive buffs and collects items from the whole level.\n\nCan be cooked from normal Cheese and torch.
items.potions.exotic.potionofoverload.name=potion of overload
items.potions.exotic.potionofoverload.desc=The power of holy energy reduced to liquid form, this draught will tremendously increase spawn rate of monsters.
items.quest.tengushuriken.name=Tengu's shuriken
items.quest.tengushuriken.desc=Those weapons can be thrown instantly and inflict progressive damage to enemy's armor. Belonged to Tengu.
items.quest.rustyshield.name=rusty shield
items.quest.rustyshield.desc=This broken shield is not usable as weapon, but gives magical armor when hero earns experience.
items.quest.kingblade.name=king's blade
items.quest.kingblade.desc=You are not worthy, but this has some inner magic.\n\nGives ability to proc two random enchantments.
items.quest.tengubomb.name=electrical explosive
items.quest.tengubomb.desc=This bomb has been reconstructed from Tengu's remains to unleash bolts of electricity when it explodes for _%s-%s_ magic damage. Anything nearby will be damaged and affected by holy mark based on how close it was to the bomb.\n\nThe main feature of this explosive is their ability to charging. Damage of this electrical explosion depends on the stored charge. However, bomb's initial shell is not constructed for holding large amount of energy and will eventually break.
items.quest.tengubomb.counter=Current chance to break: %s%%.
items.quest.superpickaxe.name=throwing mining tool
items.quest.superpickaxe.desc=The ultimate form of pickaxe, it can be thrown like a boomerang at walls or at enemies to destroy them. Keep in mind that it cannot pierce through walls and suffers a huge accuracy penalty, but its weight is going to help to pierce through enemy skulls very well.
items.scrolls.exotic.scrollofdetermination.name=scroll of determination
items.scrolls.exotic.scrollofdetermination.desc=When read aloud, this scroll will protect his user by applying determination shield that steals life of nearby enemies.
items.scrolls.exotic.scrollofmidas.name=scroll of midas
items.scrolls.exotic.scrollofmidas.desc=This scroll contains powerful transmutation magic. When invoked, all enemies in the reader's sight will be transformed into sheer amount of gold!\n\nThe transformation is permanent, eliminating all enemies affected. Powerful enemies will resist the effect though, and any items affected enemies were carrying are lost.
items.spells.vampirism.name=vampirism
items.spells.vampirism.desc=This spell twistes restorative magic of healing potion and allows user to steal 30\u0025-50\u0025 health from any living target.
items.wands.wandofearthblast.name=wand of avalanche
items.wands.wandofearthblast.staff_name=staff of avalanche
items.wands.wandofearthblast.desc=The artifact of ancient times, when everything was possible with crushing rocks.
items.wands.wandofearthblast.stats_desc=This wand produces a blast of extremely powerful earthquake when used, extending out into a cone shape. As this wand is upgraded it will consume more charges, the effect becomes significantly more powerful the more charges are consumed. Its next attack will consume _%1$d charges_ and deal _%2$d-%3$d damage._
items.wands.wandofearthblast.eleblast_desc=An elemental blast with a staff of avalanche deals 130% damage, destroys soft terrain like doors and grass, paralyses enemies and removes fire, frost and webs.
items.wands.wandofearthblast.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of avalanche, the enemy has a chance to get stunned for a short time, making them unable to move and attack.
items.wands.wandofunstable.name=wand of 
items.wands.wandofunstable.staff_name=staff of 
items.wands.wandofunstable.desc=This wand is made of antimatter. It sparkles with unsettling sparks, that explode into different elemental projectiles.
items.wands.wandofunstable.stats_desc=This wand imitates the random wand blasts with each usage.
items.wands.wandofunstable.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of unstable, it will initiate random Battlemage effects.
items.wands.wandofunstable.eleblast_desc=An elemental blast with a staff of unstable uses blast effects from a random wand and makes it 50% stronger.
items.overloadbeacon.name=creature summoning beacon
items.overloadbeacon.ac_use=USE
items.overloadbeacon.desc=This odd piece of dwarven technology allows you to overload dungeon's ecosystem for some time, which will allows for insane amount of creatures to spawn in short time. But don't use this thing if you are not sure if you can defeat all of them, as spawn rate will be higher than anything you have ever seen.
items.overloadbeacon$temporaryoverload.name=ultimate overload
items.overloadbeacon$temporaryoverload.desc=While this effect is active, there is no limit on amount of creatures in the dungeon and their spawnrate.\n\nTurns left: %s.

###reforged
items.quest.ratclaw.name=rat claw
items.quest.ratclaw.desc=A sharp claw of a rather large rat, darker than you'd expect. As you hold it in your hand, you can feel a surprising amount of heat.
items.quest.ratclaw.discover_hint=You can get this item as a drop from certain enemies.

###abyssalnite
items.food.abyssalcure.name=Abyssal uncursing brew
items.food.abyssalcure.eat_msg=Most of the abyssal erosion in your body has been eliminated, but you feel something is wrong.
items.food.abyssalcure.desc=This flask contains a swirling dark green liquid. Who knows what it will do when drunk or thrown?
items.food.abyssalbottle.name=Abyssal bottle
items.food.abyssalbottle.eat_msg=You feel purified
items.food.abyssalbottle.desc=A strange bottle, containing pure abyssal energy. \n It is not only harmless, but known to capable of guiding the chaotic energy in your body back to the surrounding environment.
items.food.abyssalfruit.name=Abyssal fruit
items.food.abyssalfruit.eat_msg=Tasted awesome!
items.food.abyssalfruit.desc=The strange purple fruit growing in the abyss environment can slightly fill your stomach and purify your infection.
items.food.pudding.name=Pudding
items.food.pudding.eat_msg=Pudding~Pudding~
items.food.pudding.desc=Looks great!
items.potions.alchemicalcatalyst.name=Alchemical catalyst
items.potions.alchemicalcatalyst.desc=This thin vial of magical liquid is made from the deconstructed essence of a potion. The liquid is translucent, and glows with shifting colors of the rainbow.\n\nThis catalyst is primarily useful as an alchemy ingredient, but you can also use it directly to get the effect of a random potion.
items.potions.exotic.potionofadrenalinesurge.name=Potion of adrenaline surge
items.potions.exotic.potionofadrenalinesurge.desc=This powerful liquid will give you a greater boost of strength that withers after an extended period of time.
items.potions.exotic.potionofholyfuror.name=Potion of holy furor
items.potions.exotic.potionofholyfuror.desc=The power of holy energy reduced to liquid form, this draught will bless you for an extended period of time.
items.quest.mysteryheart.name=mystery heart
items.quest.mysteryheart.desc=A slightly decaying heart......you don't really want to guess its source.
items.scrolls.exotic.scrollofaffection.name=Scroll of affection
items.scrolls.exotic.scrollofaffection.desc=Reading this scroll will emit an alluring laugh which charms all who hear it.
items.scrolls.exotic.scrollofconfusion.name=Scroll of confusion
items.scrolls.exotic.scrollofconfusion.desc=When read aloud, this scroll will unleash confusing magic on all targets in sight, blinding and disorienting them.
items.scrolls.exotic.scrollofpetrification.name=Scroll of petrification
items.scrolls.exotic.scrollofpetrification.desc=A flash of red light will overwhelm all creatures in your field of view with such great terror that they will be frozen on the spot.
items.scrolls.exotic.scrollofpolymorph.name=Scroll of polymorph
items.scrolls.exotic.scrollofpolymorph.desc=This scroll contains powerful transmutation magic. When invoked, all enemies in the reader's sight will be transformed into magical sheep!\n\nThe transformation is permanent, eliminating all enemies affected. Powerful enemies will resist the effect though, and any items affected enemies were carrying are lost.
items.spells.aquablast.name=Aqua blast
items.spells.aquablast.desc=This spell will create a burst of water at the target location. It isn't forceful enough to do damage (even to fiery enemies), but it will spread water to nearby terrain and very briefly stun anything caught in the center of the burst.
items.spells.arcanecatalyst.name=Arcane catalyst
items.spells.arcanecatalyst.desc=This ball of golden dust is made from the deconstructed essence of a scroll. It glimmers in the darkness of the dungeon.\n\nThis catalyst is primarily useful as an alchemy ingredient, but you can also channel the magic directly to get the effect of a random scroll.
items.spells.featherfall.name=Feather fall
items.spells.featherfall.light=You feel light as a feather!
items.spells.featherfall.desc=This spell manipulates gravity's effect on the caster, allowing them to fall great distances without harm for a short time. Each use of the spell will only provide enough protection for one chasm.
items.stones.stoneofaffection.name=Stone of Affection
items.stones.stoneofaffection.desc=When this stone is thrown on or next to an enemy they will be temporarily charmed, and will attempt to target your allies instead of you.
items.stones.stoneofdeepenedsleep.name=Stone of deepened sleep
items.stones.stoneofdeepenedsleep.desc=When this stone is thrown near a sleeping enemy, it will magically deepen their sleep. Magically slept enemies will sleep forever until disturbed.
items.armorkit.name=Armor kit
items.armorkit.ac_apply=APPLY
items.armorkit.prompt=Select an armor
items.armorkit.upgraded=You applied the armor kit to upgrade your %s
items.armorkit.desc=Using this kit of small tools and materials anybody can transform any armor into an epic armor, which will keep all properties of the original armor, but will also provide its wearer a special ability depending on his class. No skills in tailoring, leatherworking or blacksmithing are required.
items.dewvial.name=Dream Bottle
items.dewvial.ac_drink=DRINK
items.dewvial.value=%+dHP
items.dewvial.collected=You collect the soul fragment into your dew vial.
items.dewvial.full=Your dream bottle is full!
items.dewvial.empty=Your dream bottle is empty!
items.dewvial.desc=You can store excess soul fragments  in this tiny vessel and drink it later. The more full the vial is, the more you will be instantly healed when drinking it. You will only drink as much as you need.\n\nDream bottles like this are usually prepared by scholars for quick dream. There still seems to be some residual power left, perhaps a full vial can bless another revival item.
items.tomeofmastery.name=Tome of Mastery
items.tomeofmastery.ac_read=READ
items.tomeofmastery.way=You have chosen the way of the %s!
items.tomeofmastery.desc=This worn leather book is not that thick, but you feel somehow, that you can gather a lot from it. Remember though that reading this tome may require some time.

