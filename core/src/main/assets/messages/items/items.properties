items.weapon.bathrowingset.name=Ninja Set
items.weapon.bathrowingset.ac_shoot=Throw
items.weapon.bathrowingset.ac_kunai=Throw Kunai
items.weapon.bathrowingset.prompt=Choose a target
items.weapon.bathrowingset.stats=If you use the Ninja Set right after moving, it spends charge to throw shuriken that take no turn. With no charge, or if you did not just move, it throws a kunai that deals more damage on a sneak attack. You can also throw the kunai by hand if you like.\n\nAt your current level, the thrown weapons from the Ninja Set deal _%1$d-%2$d_ damage, and you need _%3$d_ strength to use them properly.
items.weapon.bathrowingset.desc=A ninja set Izuna carries around. It lets you throw bodiless projectile weapons endlessly, and they grow stronger as Izuna levels up. Defeating enemies restores charge.
