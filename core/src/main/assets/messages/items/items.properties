items.wands.wandofcursedflame.name=wand of cursed flame
items.wands.wandofcursedflame.discover_hint=You can craft this item through alchemy.
items.wands.wandofcursedflame.staff_name=staff of cursed flame
items.wands.wandofcursedflame.desc=This wand draws power from both the Wand of Magic Missile and the Wand of Fireblast. Pure magic strengthens its flames, making them more aggressive; once they take hold, they sear the soul and are difficult to extinguish.
items.wands.wandofcursedflame.stats_desc=This wand fires a bright-green fireball that spreads cursed flame around its impact. A direct hit deals _%1$d-%2$d damage_, powerful enough to harm even fiery creatures. Flame at the impact lasts _%3$d turns_.
items.wands.wandofcursedflame.upgrade_stat_name_1=Magic Damage
items.wands.wandofcursedflame.upgrade_stat_name_2=Flame Duration
items.wands.wandofcursedflame.bmage_desc=When the _Battlemage_ strikes a cursed-burning target with this staff, they consume the remaining burning to deal substantial cursed-burning damage, then ignite the target again. This effect has a lengthy cooldown for each target.
items.wands.wandofcursedflame.eleblast_desc=This staff's Elemental Blast deals 67% damage, bursts open doors in its area, and ignites abundant cursed flame for 4 turns.
items.scrolls.exotic.scrollofuptier.name=scroll of ascension
items.scrolls.exotic.scrollofuptier.inv_title=Select an item to ascend
items.scrolls.exotic.scrollofuptier.nothing=Nothing interesting happens.
items.scrolls.exotic.scrollofuptier.morph=Your item turns into something else!
items.scrolls.exotic.scrollofuptier.desc=This scroll retains all the magic of a scroll of transmutation, while also being able to raise the tier of weapons and armor! Ascension magic preserves upgrades, enchantments, and glyphs while raising weapon and armor tiers. When used on a highest-tier weapon or on an item that is not a weapon or armor, ascension magic only behaves like transmutation magic, while highest-tier armor and some other special equipment are unaffected.
