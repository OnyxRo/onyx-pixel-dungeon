items.weapon.missiles.runestring.name=runestone strand
items.weapon.missiles.runestring.stats_desc=This weapon cannot be upgraded directly, but is of extremely high quality. Besides being thrown, it can be used on equipment like a stone of enchantment.
items.weapon.missiles.runestring.desc=Magical runestones are strung together. One of them is engraved with a cross-shaped rune and glows faintly purple, making it especially conspicuous.
items.weapon.missiles.runestring.ac_enchant=ENCHANT
items.weapon.missiles.runestring.discover_hint=A certain hero starts with this item.
