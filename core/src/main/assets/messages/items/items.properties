items.spells.rubbingstome.name=holy tome rubbing
items.spells.rubbingstome.ac_cast=CAST
items.spells.rubbingstome.no_spell=You are not able to cast that spell right now.
items.spells.rubbingstome.cursed=You can't use a cursed holy tome.
items.spells.rubbingstome.desc=This is a rubbing of a sacred codex once circulated among the people by the Holy Church. It can cast the corresponding spells like a holy tome, but because its magic is unstable, you cannot charge it in any way. Once its charge runs out, the rubbing will vanish outright.\n\nYou can also reproduce it through alchemy using your own memory and imagination. Of course, the rubbing process does not consume an arcane stylus; it is only needed to record the spell.
items.spells.rubbingstome.discover_hint=You can craft this item through alchemy.

