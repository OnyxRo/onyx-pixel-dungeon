items.expgenerator.name=Power Plant
items.expgenerator.desc=This nifty device allows to generate experience passively without slaying mobs. Just throw to set it down.\n\nYou can gather more power plants by resetting the floor with any shop.\n\nOn current level, it generates %d EXP per two turns.\n\nTo get it back, simply damage the generator.\n\n\nOnce placed, this generator requires care, because it attracts monsters. If enemies can't reach generator, it will not generate exp.

###cursed CursedSurprise
items.powers.cursedsurprise.name=surprise
items.powers.cursedsurprise.desc=When hitting a mob with this, you will do extra damage if they are unaware.

###cursed CursedHeroicLeap
items.powers.cursedheroicleap.name=heroic leap
items.powers.cursedheroicleap.desc=This power allows you to perform heroic leap towards a targeted location, slamming down to stun all neighbouring enemies.

###cursed CursedSmokeBomb
items.powers.cursedsmokebomb.name=smokebomb
items.powers.cursedsmokebomb.desc=When cast, the caster can perform a trick, that is called "smoke bomb": they blind enemies who could see them and jump aside.

###cursed CursedSpectralBlades
items.powers.cursedspectralblades.name=spectral blades
items.powers.cursedspectralblades.desc=This power creates deadly spectral blades. Each of these blades will target a single enemy near the user, inflicting damage depending on their currently equipped melee weapon.

