items.artifacts.hornofplenty.devotee=Choose one of two randomly selected abilities of different foods
items.food.food.devotee=Deal physical damage to all visible enemies, the more enemies are targeted, the less the damage will be.
items.food.mysterymeat.devotee=The 3 closest visible enemies will be applied one of the mystery meats negative effects
items.food.largeradish.name=large radish
items.food.largeradish.desc=Not a native plant to the dungeon, this radish has grown to an unusual size, possibly due to magical tampering. It has also developed a characteristic bitter taste.\n\nThe large radish will only restore a small amount of hunger, but will give you a small amount of shielding based on your current Health.
items.food.largeradish.discover_hint=You can find this item using a specific hero talent.
items.food.largeradish.devotee=Become huge for 20 turns, gaining accuracy and damage resistance, but loosing some speed.
items.food.arcaneroot.name=arcane root
items.food.arcaneroot.desc=Spice roots such as this one are a rare find, and would net a decent price outside of the dungeon. This one looks strangely purple and has developed a strange odor, which does not seem natural. \n\nThe arcane root will only restore a small amount of hunger, but will empower your next few wand zaps.
items.food.arcaneroot.discover_hint=You can find this item using a specific hero talent.
items.food.arcaneroot.devotee=Create a small area in which you deal more damage using wands, and enemies loose health every turn.
items.food.crystalapple.name=crystal apple
items.food.crystalapple.desc=What looked to be a regular fruit at first seems to have a similar color and texture to a crystal upon closer inspection. In its center, you can see a gray core. You could certainly try eating the fruit.\n\nThe crystal apple will only restore a small amount of hunger, but it's core is actually a usable rune stone ( if your health is low, you might even be able to find two runestones inside a crystal apple ).
items.food.crystalapple.discover_hint=You can find this item using a specific hero talent.
items.food.crystalapple.devotee=Gain 1 maximum Health.
items.remains.vialshard.name=vial shard
items.remains.vialshard.desc=This shard of a large bottle looks like it was once part of a Zealot's blood vial. There is still a few drops of tainted blood stuck to the glass, you can use it to become invincible for one turn. Doing this will destroy the vial shard however.

