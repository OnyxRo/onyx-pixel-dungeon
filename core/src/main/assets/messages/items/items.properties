items.armor.platecarrier.name=MMAC Plate carrier (Ranger green)
items.armor.platecarrier.desc=Multi-Mission Armor Carrier (MMAC) is a traditional profile vest offering modularity and scalability. The tactical vest is constructed of MIL-SPEC 500 denier nylon and is fully MOLLE/PALS compatible. It features padded shoulders with detachable retention loops, push-to-talk (PTT) attachment points at upper left and right chest and many other features. Equipped with Monoclete level III PE ballistic plates.
