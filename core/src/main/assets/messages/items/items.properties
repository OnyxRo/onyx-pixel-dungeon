items.weapon.melee.basupernova.name=Sword of Light, Supernova
items.weapon.melee.basupernova.desc=A huge railgun that Aris received from the Engineering Club.\n\nIts weight and output are so enormous that an ordinary student can barely carry it.\n\nWhen Aris fires the ultra high output laser, every target the beam touches takes _%1$d-%2$d_ damage.
items.weapon.melee.basupernova.ac_shoot=Balance Breaker
items.weapon.melee.basupernova$supernovacooldown.name=Charging Balance Breaker
items.weapon.melee.basupernova$supernovacooldown.desc=The skill is charging! It will be ready soon, so don't worry.\n\nTurns left _%s_.
items.weapon.melee.basupernova$supernovacharge.name=Charging Overcharge
items.weapon.melee.basupernova$supernovacharge.desc_1=You are charging the fully charged Sword of Light, Supernova even further! Power up!\n\nCurrent charge stage _%1$d_.
items.weapon.melee.basupernova$supernovacharge.charge_1=\n\nStage 1 charge complete. _Balance Breaker also sets enemies on fire._
items.weapon.melee.basupernova$supernovacharge.charge_2=\nStage 2 charge complete. _Balance Breaker also causes an explosion._
items.weapon.melee.basupernova$supernovacharge.charge_3=\nStage 3 charge complete. _Balance Breaker's range increases by 50%._
items.weapon.melee.basupernova$supernovacharge.desc_2=\n\nCharge progress _%1$s_/%2$s.
items.active.basmokegrenade.name=Smoke Grenade
items.active.basmokegrenade.desc=A smoke grenade Nonomi brought. When thrown, it instantly covers the area around where it lands in smoke.\n\nAs you level up, the most you can carry and the amount of smoke it makes both increase.
items.active.basmokegrenade.ac_lightthrow=Throw Smoke!
items.active.basmokegrenade.no_left=You have no smoke grenades left.
items.active.bahandgrenade.name=Hand Grenade
items.active.bahandgrenade.desc=A hand grenade Miyako brought. When thrown, it instantly deals explosive damage near where it lands. It can hurt you too, so be careful.\n\nAs you level up, the most you can carry increases.
items.active.bahandgrenade.ac_lightthrow=Throw Grenade!
items.active.bahandgrenade.no_left=You have no hand grenades left.
items.active.bablastgrenade.name=Concussion Grenade
items.active.bablastgrenade.desc=A grenade Hoshino brought. When thrown, it briefly stuns the target where it lands and pushes back everything around it.\n\nAs you level up, the knockback distance and the most you can carry both increase.
items.active.bablastgrenade.ac_lightthrow=Throw Concussion Grenade!
items.active.bablastgrenade.no_left=You have no concussion grenades left.
items.active.baclaymore.name=Mini Claymore
items.active.baclaymore.desc=A small claymore Miyako carries around. When triggered, it deals heavy damage over a wide area and can cripple those it hurts.\n\nAs you level up, its damage and crippling chance increase.
items.active.baclaymore.ac_lightthrow=Use
items.active.baclaymore.no_left=You have no claymores left.
items.active.baironhorus.name=Riot Shield 'Iron Horus'
items.active.baironhorus.desc=A folding shield Hoshino carries around. Set it up in battle to gain a large amount of extra defense until you move.\n\nAs you level up, the defense it gives when used increases.
items.active.baironhorus.ac_use=Use
items.active.baironhorus$tacticalshieldbuff.name=Riot Shield Deployed!
items.active.baironhorus$tacticalshieldbuff.desc=Hmm? What's this, you ask?\n\nWell, it's a shield you set up before a fight, and it makes for great cover. My precious partner. It doesn't block 100%% of enemy attacks, but it should stop up to _0-%s_ damage or so.\n\nOnce the standoff is over we have to move, so I'll need to fold it up again. It takes a little time before I can use it again, so it's best not to use it when you need to keep moving fast.
items.active.baironhorus$tacticalshieldcooldown.name=Riot Shield Cooldown
items.active.baironhorus$tacticalshieldcooldown.desc=Uwaa, give me a moment to put this away. I need to keep it tidy so I can use it quickly when it counts.\n\nI'll be ready in about _%s_ turns.
items.active.bahpgrenade.name=High Explosive Grenade
items.active.bahpgrenade.desc=A high explosive grenade Shiroko brought. When thrown, it instantly deals heavy explosive damage near where it lands. According to Shiroko, it deals exactly twice the damage of a hand grenade. Handle with care.\n\nAs you level up, the most you can carry increases.
items.active.bahpgrenade.ac_lightthrow=Throw Grenade!
items.active.bahpgrenade.no_left=You have no grenades left.
items.active.baflashgrenade.name=Flashbang
items.active.baflashgrenade.desc=A flashbang Noa brought. When thrown, it blinds everything in the 5x5 area around where it lands. You can be caught in it too, so handle with care.\n\nAs you level up, the blindness lasts longer and the most you can carry increases.
items.active.baflashgrenade.ac_lightthrow=Throw Flashbang!
items.active.baflashgrenade.no_left=You have no flashbangs left.
items.active.baregrowgrenade.name=Regrowth Bomb
items.active.baregrowgrenade.desc=A regrowth bomb Miyu brought. When thrown, it plants some grass in the 3x3 area around where it lands.\n\nAs you level up, the most grass it can plant and the most you can carry both increase.
items.active.baregrowgrenade.ac_lightthrow=Throw Regrowth Bomb!
items.active.baregrowgrenade.no_left=You have no regrowth bombs left.
items.active.barainbowgrenade.name=Rainbow Bomb
items.active.barainbowgrenade.desc=A rainbow bomb Yuzu brought. When thrown, it charms everything in the 3x3 area around where it lands for a short time.\n\nAs you level up, the charm lasts longer and the most you can carry increases.
items.active.barainbowgrenade.ac_lightthrow=Throw Rainbow Bomb!
items.active.barainbowgrenade.no_left=You have no rainbow bombs left.
items.active.babicycle.name=Bicycle
items.active.babicycle.desc=A blue bicycle Shiroko rides around. Each time you move while off it, you can ride longer next time, and riding lets you move fast. Just be careful, since attacks are harder to land while you ride.
items.active.babicycle.ac_use=Use
items.active.babicycle$bicyclebuff.name=Riding
items.active.babicycle$bicyclebuff.action_name=Professional Riding
items.active.babicycle$bicyclebuff.desc_1=Um... this? As you can see, it's a bicycle, but...
items.active.babicycle$bicyclebuff.desc_acc=Riding the bike lets you move fast, but it's tricky to attack while on it. _That means your attacks are harder to land_. Getting off for a moment is easy, so try to get off during fights.
items.active.babicycle$bicyclebuff.desc_2=Riding a bike hard and fast in a place like this wears you out quickly, so you'll need regular breaks. It's easy to cover a short distance fast, but you can hardly go more than _%1$s tiles_ at a time.\n\nFrom now on, you can ride about _%2$s more tiles_.
items.active.babicycle$professionalridemove.skid_mark.name=Skid Mark
items.active.babicycle$professionalridemove.skid_mark.desc=Shiroko uses _Skid Mark_ to cover up to 3 tiles in 1 turn, and can move over traps and hazards.\nFlames remain for 2 turns where Shiroko passed.
items.active.babicycle$professionalridemove.riding_reload.name=Riding Reload
items.active.babicycle$professionalridemove.riding_reload.desc=Shiroko uses _Riding Reload_ to instantly reload the equipped gun without spending a turn.
items.active.babicycle$professionalridemove.slam.name=Weighted Ram
items.active.babicycle$professionalridemove.slam.desc=Shiroko uses her weight and speed for a _Weighted Ram_ that pushes adjacent enemies back up to 3 tiles.
items.active.babicycle$professionalridemove.accelerate.name=Burst Acceleration
items.active.babicycle$professionalridemove.accelerate.desc=Shiroko uses _Burst Acceleration_ to move the next 1 tile without spending a turn, then gains 3 turns of haste after moving.
items.active.babicycle$professionalridemove.drift.name=Drift
items.active.babicycle$professionalridemove.drift.desc=Shiroko uses _Drift_ to get off the bicycle instantly with no cooldown, then triples the bicycle's recharge speed for 20 turns. The faster recharge ends as soon as she gets back on, and Drift becomes available again after defeating 5 enemies.
items.active.babicycle$bicyclecooldown.name=Riding Cooldown
items.active.babicycle$bicyclecooldown.desc=Wait just a moment. I need to get set up again.\n\nThe bike will be ready in _%s turns_.
items.active.babicycle$driftbuff.name=Drift
items.active.babicycle$driftbuff.desc=Um... I just used drift momentum to hop off the bike right away. I should also be able to get the bike ready faster for the next _%s turns_.\n\nThis effect goes away the moment I get on the bike, so be careful.
items.active.balaser.name=Laser Sight
items.active.balaser.desc=A small laser sight Noa brought. Aim it at a target to greatly improve the accuracy of all ranged attacks against that target until it is gone.
