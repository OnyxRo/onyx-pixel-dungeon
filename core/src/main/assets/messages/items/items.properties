items.magic.heal.name=Energized Renewal
items.magic.heal.desc=This curious spell will shoot a healing bolt into minion, healing _%s HP_ plus _%s%%_ of its max HP and consuming _%s_ mana.
items.magic.heal.tier1=Mana cost: _1_\nFlat healing: _5_\nPercentage healing: _6.6%_
items.magic.heal.tier2=Mana cost: _4_\nFlat healing: _10_\nPercentage healing: _16.6%_
items.magic.heal.tier3=Mana cost: _6_\nFlat healing: _14_\nPercentage healing: _20%_
items.magic.zap.name=Beam of Affection
items.magic.zap.desc0=When used on minion, this spell will instantly kill it.\nWhen used on enemy, this spell will engage it into battle.\n\nThe spell is absolutely free.
items.magic.zap.desc1=When used on minion, this spell will instantly kill it and give you 24 mana.\nWhen used on enemy, this spell will seriously weaken it.\n\nThe spell uses 11 mana.
items.magic.zap.desc2=When used on minion, this spell will instantly kill it and resurrect with more damage, but less HP.\nWhen used on enemy, this spell will engage it and make every minion on level target it and rush towards the monster.\n\nThe spell uses 14 mana.
items.magic.zap.tier1=Mana cost: _0_\nEffect on minion: _instant kill_\nEffect on enemy: _engagement_
items.magic.zap.tier2=Mana cost: _11_\nEffect on minion: _instant kill, regaining 24 mana_\nEffect on enemy: _engagement with Weakness, Hexed and Vulnerable_
items.magic.zap.tier3=Mana cost: _14_\nEffect on minion: _resurrection with 60% less HP and 50% more damage_\nEffect on enemy: _engagement with concentrating all minions on levels on 500% movement speed_
items.magic.barrier.name=Runic Shell
items.magic.barrier.desc=This sparkling spell will shoot a shielding blast into minion, creating _%s_ shielding plus _%s%% of its max HP_ and consuming %s mana.
items.magic.barrier.tier1=Mana cost: _3_\nFlat shielding: _5_\nPercentage shielding: _25%_
items.magic.barrier.tier2=Mana cost: _15_\nFlat shielding: _25_\nPercentage healing: _0%_
items.magic.barrier.tier3=Mana cost: _20_\nFlat shielding: _0_\nPercentage healing: _0%_\n_Sets Temporary Block buff for 12 turns_
items.magic.wave.name=Pushing Waveform
items.magic.wave.desc=This heavy spell will create dust storm, pushing enemies caught up in area up to _%d tiles_ from caster and consuming _%d_ mana. If you strike a minion, it will teleport next to you.
items.magic.wave.tier1=Mana cost: _9_\nRange of pushing storm: _5 tiles_\nThe cone's width: _60 degrees_
items.magic.wave.tier2=Mana cost: _15_\nRange of pushing storm: _8 tiles_\nThe cone's width: _90 degrees_
items.magic.wave.tier3=Mana cost: _30_\nRange of pushing storm: _11 tiles_\nThe cone's width: _120 degrees_
items.magic.shocker.name=Shocker Breaker
items.magic.shocker.desc0=This enigmatic spell will shock the minion, dealing damage equivalent to _half_ of its max HP, but greatly buffing them for _20_ turns. However, after the shock you can't heal the minion for _50_ turns. This spell costs _15_ mana.
items.magic.shocker.desc1=This enigmatic spell will shock the minion, dealing damage equivalent to _quarter_ of its max HP, but greatly buffing them for _15_ turns. However, after the shock you can't heal the minion for _30_ turns. This spell costs _25_ mana.
items.magic.shocker.desc2=This enigmatic spell will shock the _3x3_ area of minions, dealing damage equivalent to _half_ of their max HP, but greatly buffing them for _10_ turns. However, after the shock you can't heal the minions for _40_ turns. This spell costs _35_ mana.
items.magic.shocker.tier1=Mana cost: _15_\nShock damage: _50%_\nBuff length: _20 turns_\nHealing binding: _50 turns_
items.magic.shocker.tier2=Mana cost: _25_\nShock damage: _25%_\nBuff length: _15 turns_\nHealing binding: _30 turns_
items.magic.shocker.tier3=Mana cost: _35_\nShock damage: _50%_\nBuff length: _10 turns_\nHealing binding: _40 turns_\nAdded _3x3_ area of effect
items.magic.necro.name=Dreemurr's Necromancy
items.magic.necro.desc=This otherworldly spell will infuse minion with soul energy, allowing them to survive after death for _%s_ turns. However, this thing needs to recharge for _%s_ turns and costs _%s_ mana to use.
items.magic.necro.tier1=Mana cost: _9_\nDeath refusal time: _5 turns_\nCooldown: _200 turns_
items.magic.necro.tier2=Mana cost: _12_\nDeath refusal time: _11 turns_\nCooldown: _640 turns_
items.magic.necro.tier3=Mana cost: _30_\nDeath refusal time: _22 turns_\nCooldown: _800 turns_
items.magic.field.name=Sub-Null Field Igniter
items.magic.field.desc=This cataclysmic spell will spawn a big field of energy in center of 7x7 blast. The amount of field's energy will be equally distributed between each cell; in total, you have _%s_ energy in field, which is divided by size of area. This spell costs _%s_ mana.
items.magic.field.tier1=Mana cost: _40_\nTotal energy amount: _250_
items.magic.field.tier2=Mana cost: _60_\nTotal energy amount: _333_
items.magic.field.tier3=Mana cost: _80_\nTotal energy amount: _425_
items.magic.knight.punch.name=Directing Pulse
items.magic.knight.punch.desc=This concentrated spell will inflict soul gain to enemy for _%s_ turns, allowing your stand to attack it. This spell costs _%s_ mana.
items.magic.knight.punch.tier1=Mana cost: _5_\nDuration of soul gain: _9 turns_
items.magic.knight.punch.tier2=Mana cost: _3_ \nDuration of soul gain: _3 turns_
items.magic.knight.punch.tier3=Mana cost: _0_ \nDuration of soul gain: _1.1 turns_
items.magic.knight.kihealing.name=Concentration
items.magic.knight.kihealing.desc=This interesting spell allows you to channel soul magic right into your body, giving _%s HP_ after use. Note that you need to stay _%s turns_ to rest and this costs _%s_ mana to use.
items.magic.knight.kihealing.tier1=Mana cost: _25_\nAmount of healing: _20_\nTurns for rest: _3 turns_
items.magic.knight.kihealing.tier2=Mana cost: _25_\nAmount of healing: _35_\nTurns for rest: _9 turns_
items.magic.knight.kihealing.tier3=Mana cost: _25_\nAmount of healing: _60_\nTurns for rest: _20 turns_
items.magic.knight.boom.name=Explosion Magic
items.magic.knight.boom.desc=This energetic spell will instantly cause an explosion in place of your clone, dealing _%s%%_ of explosion damage in that area. This spell costs _%s_ mana and doesn't hurt you.
items.magic.knight.boom.tier1=Mana cost: _50_\nFraction of bomb damage from this chapter: _100%_
items.magic.knight.boom.tier2=Mana cost: _30_\nFraction of bomb damage from this chapter: _50%_
items.magic.knight.boom.tier3=Mana cost: _15_\nFraction of bomb damage from this chapter: _20%_
items.magic.knight.shards.name=Shards of Despair
items.magic.knight.shards.desc=This chaotic spell will shoot marking missiles into every enemy in your sight, the mark will be inflicted for _%s_ turns and can even damage and stun enemies on higher rank of spell. This spell costs _%s_ mana and can be used to draw attention to the stand.
items.magic.knight.shards.no_enemies=There are no enemies to hit with this spell.
items.magic.knight.shards.tier1=Mana cost: _15_\nSoul gain duration: _9 turns_\nDamage: _0_
items.magic.knight.shards.tier2=Mana cost: _40_\nSoul gain duration: _15 turns_\nDamage: _5-12 (+0.333/+0.75)_
