items.powers.cursedalchemy.name=alchemy
items.powers.cursedalchemy.ac_brew=BREW
items.powers.cursedalchemy.not_ready=Your toolkit has not finished warming up.
items.powers.cursedalchemy.enemy_near=You cannot do that with enemies nearby.
items.powers.cursedalchemy.full=Your toolkit is at maximum energy!
items.powers.cursedalchemy.desc=This toolkit contains a number of reagents and herbs along with a small mixing vial, allowing for alchemy on-the-go.
items.powers.cursedalchemy.desc_cursed=The cursed toolkit has bound itself to your side, and refuses to let you use alchemy.
items.powers.cursedalchemy.desc_warming=The toolkit is currently warming up, and will be ready to use after you gain experience.
items.powers.cursedalchemy.desc_hint=The equipped toolkit is slowly generating alchemical energy as you gain experience.

