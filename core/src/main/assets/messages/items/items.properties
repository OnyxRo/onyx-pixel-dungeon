items.magic.soulreaver.offense.name=Antarctic Touch
items.magic.soulreaver.offense.desc=This cool spell engulfs targeted monster in frozen fire for _%s turns_, dealing damage and lowering its speed, and makes all your minions rush to it. This spell costs _%s mana._
items.magic.soulreaver.offense.tier1=Mana cost: _15_\nFrostburn duration: _7 turns_
items.magic.soulreaver.offense.tier2=Mana cost: _25_\nFrostburn duration: _20 turns_
items.magic.soulreaver.offense.tier3=Mana cost: _25_\nFrostburn duration: _40 turns_\nNo longer attracts minions
items.magic.soulreaver.defense.name=Tommie's Armor Spell
items.magic.soulreaver.defense.desc=This sturdy spell will lock your minion in place (cast again to remove the lock), but give him _%s physical_ and _%s magical_ armor, that will decay over time. This spell costs _%s mana,_ but if you cast it on armored minion again, you will get refund.
items.magic.soulreaver.defense.tier1=Mana cost: _30_\nAmount of barkskin: _6(+0.75)_\nDecay of barkskin: _30 turns_\nAmount of arcane armor: _3(+0.33)_\nDecay of arcane armor: _40 turns_
items.magic.soulreaver.defense.tier2=Mana cost: _35_\nAmount of barkskin: _10(+1)_\nDecay of barkskin: _8 turns_\nAmount of arcane armor: _7(+0.5)_\nDecay of arcane armor: _12 turns_
items.magic.soulreaver.defense.tier3=Mana cost: _5_\nAmount of barkskin: _5_\nDecay of barkskin: _100 turns_\nAmount of arcane armor: _3_\nDecay of arcane armor: _120 turns_
items.magic.soulreaver.magical.name=Transmogrification Wand
items.magic.soulreaver.magical.desc=This unusual spell will apply runic magic to change the size of entities.\nEnemies will be shrunken for _%s turns_, getting overall stats' penalty.\nAllies will be enlarged for _%s turns_, getting physical buffs, but inability to go through halls for a while.\nThis spell costs _%s mana._
