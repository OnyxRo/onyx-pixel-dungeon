items.armor.artificerarmor.name=hero's cuirass
items.armor.artificerarmor.desc=While wearing this cuirass, the Artificer can perform a special ability.
items.artifacts.ringbox.name=Ringbox
items.artifacts.ringbox.desc=This box has a few slots to place rings into. You feel as if the box would bring the power from the rings to you.
items.artifacts.ringbox.desc_cursed=This box has a few slots to place rings into. Unfortunately, it won't open, and is preventing any non-cursed rings from slipping onto your fingers!
items.artifacts.ringbox.ac_open=Open
items.artifacts.ringbox.levelup=Your ringbox has gained power!
items.artifacts.ringbox.levelupthirdslot=Your ringbox has gained a new ring slot!
items.artifacts.ringbox.equipwindowtwo=There are two slots for rings. You can feel the ringbox will give you their power at a lower rate.\n- Slot 1 will give you %s%% of its power\n- Slot 2 will give you %s%% of its power.
items.artifacts.ringbox.equipwindowthree=There are three slots for rings. You can feel the ringbox will give you their power at a lower rate.\n- Slot 1 will give you %s%% of its power\n- Slot 2 will give you %s%% of its power\n- Slot 3 will give you %s%% of its power.
items.artifacts.ringbox.selectring=Select a Ring
items.artifacts.ringbox.mustidentify=You can only place identified rings.
items.artifacts.ringbox.ringcursed=You can only place uncursed rings.
items.potions.elixirs.elixirofarcaneclaws.name=elixir of arcane claws
items.potions.elixirs.elixirofarcaneclaws.desc=This elixir will grant the drinker the effects of a mind vision potions, as well as a long lasting arcane power around their body, damaging all enemies within range.
items.potions.elixirs.elixirofarcaneclaws$arcaneclaws.name=arcane claws
items.potions.elixirs.elixirofarcaneclaws$arcaneclaws.desc=You have temporarily gained the spirit of the rat usurper.\n\nWhile standing in next to enemies, you will deal a small amount of damage to them automatically. The effect is paused when you are not next to any enemies, or if you are invisible.\n\nDamage left: %d.
items.remains.crackedgun.name=cracked railgun
items.remains.crackedgun.desc=These metal remains are the only evidence that the Artificer was down here. There's still a little power in here, but the casing is extremely unstable. You can use it to deal damage to all creatures around you, and knock them back. Doing this will destroy the cracked railgun however.
items.scrolls.scrollteleporttostaircase.name=teleport to staircase
items.scrolls.scrollteleporttostaircase.desc=Literally teleports you to the exit. If you have this, you should not. Please let the developer know.
items.scrolls.scrollkillall.name = kill all
items.scrolls.scrollkillall.desc = Kills all enemies in the level. If you have this, you should not. Please let the developer know.
items.stones.stoneofblight.name=stone of blight
items.stones.stoneofblight.desc=This runestone will drain life and empower dead at the location it is thrown to.
items.trinkets.luckydice.name=lucky die
items.trinkets.luckydice.desc=A single die that shows its wear, but still has a hefty weight to it. A chill runs through your skin at the location you touch it.
items.trinkets.luckydice.typical_stats_desc=Typically this trinket will increase your experience gained from all sources by _%1$s%%_, but every creature that dies has a _%2$s%%_ chance to curse a random item!
items.trinkets.luckydice.stats_desc=At its current level this trinket will increase your experience gained from all sources by _%1$s%%_, but every creature that dies has a _%2$s%%_ chance to curse a random item!
items.trinkets.luckydice.item_cursed=An item has been cursed!
items.trinkets.wanderersmap.name=wanderers map
items.trinkets.wanderersmap.desc=A supernatural map that seems to affect the dungeon just as much as it maps it out. It seems to increases the dungeon size, but you may find more things inside it too!
items.trinkets.wanderersmap.typical_stats_desc=Typically this trinket will increase the map size by _%1$s%%_, and you will find _%2$s_ more items per floor!
items.trinkets.wanderersmap.stats_desc=At its current level this trinket will increase the map size by _%1$s%%_, and you will find _%2$s_ more items per floor!
items.wands.wandofdisplacement.name=wand of displacement
items.wands.wandofdisplacement.staff_name=staff of displacement
items.wands.wandofdisplacement.desc=This wand is made from a solid piece of crystal that crackles and vibrate in your grip.
items.wands.wandofdisplacement.stats_desc=This wand deals damage to a target, and switches the position of caster and target. It also has a chance to stun the target.
items.wands.wandofdisplacement.bmage_desc=When wielded by _the Battlemage_, a staff of displacement has a change to paralyze the target.
items.weapon.gun.name=homemade railgun
items.weapon.gun.ac_shoot=SHOOT
items.weapon.gun.ac_reload=RELOAD
items.weapon.gun.prompt=Choose a target
items.weapon.gun.stats=The homemade railgun cannot be directly upgraded, but will instead steadily grow stronger as you level up. At your current level, the homemade railgun will deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.gun.desc=A homemade railgun made by the Artificer. It feels satisfying and weighty to hold. The gun can create its own ammunition either manually or automatically. Manually, it takes _6 turns_ to reload. If you leave it to do it on its own, it will take _100 turns_. The homemade railgun will pierce through multiple enemies. For every enemy it hits, it will create a small explosion that deals half damage to everything around the creature hit.
items.weapon.gun.auto_reload=Your homemade railgun has automatically reloaded!

items.scrolls.scrollkillall.name=scroll kill all
items.scrolls.scrollkillall.desc=The scroll kill all, from reforged. The mod gave it no description.

###reforged
items.rings.ring.cursed_ringbox=Your cursed ringbox is preventing you from wearing this ring!

###ratking
items.weapon.missiles.darts.dreamdart.name=dream dart
items.weapon.missiles.darts.dreamdart.desc=These darts are tipped with a dreamfoil-based compound which will temporarily make allies immune to all negative effects. The dart itself is still harmful to enemies, but will not harm allies.\n\nThey can also be thrown at enemies to put them into magical sleep.

###mattedition
items.weapon.augments.icycoreweapon.name=Icy Core
items.weapon.augments.icycoreweapon.desc=It is augmented with a _icy core_. When striking a enemy, the target has a chance to be chilled.
items.armor.augments.icycorearmor.name=Icy Core
items.armor.augments.icycorearmor.desc=It is augmented with a _icy core_. When hit, attackers have a chance to be chilled.
items.stones.icycore.name=Icy Core
items.stones.icycore.desc=This core of pure ice is imbued with powerful frigid magic. It is comparable to the core that powers the _ice golems_, though this core doesn't seem to contain any dark magic.\n\nThis core can be applied to either a weapon or armor, granting it a _special augment_. 
items.stones.icycore.inv_title=Select a weapon or armor
items.stones.icycore.discover_hint=You can find this item within a branch
items.stones.icycore$wndicycore.choice=Apply the Icy Core to this item? Any augments already on this item will be replaced!
items.stones.icycore$wndicycore.apply=Apply
items.stones.icycore$wndicycore.cancel=Cancel
items.scrolls.scrollofmagicupgrade.name=scroll of magic upgrade
items.scrolls.scrollofmagicupgrade.inv_title=Upgrade an item
items.scrolls.scrollofmagicupgrade.weaken_curse=The scroll of upgrade weakens the curse on your item.
items.scrolls.scrollofmagicupgrade.remove_curse=The scroll of upgrade cleanses the curse on your item!
items.scrolls.scrollofmagicupgrade.desc=Works very similair to the _Scroll of Upgrade_, except this specific scroll seems infused with magic. Perhaps it levels items up in a different way?
items.scrolls.exotic.scrollofpuremagic.name=scroll of pure magic
items.scrolls.exotic.scrollofpuremagic.desc=This scroll seems to hold nothing but pure magical energy. This isn't just a written scroll, this is a scroll imbued with raw magic itself!\n\nWhen read, this scroll will infuse you it's magic for a short time. While you're infused, all your attacks will be considered magic attacks, gaining extra accuracy and the ability to bypass most defense. Does not make you invulnerable to magic, and already magical attacks won't gain a extra boost. 
items.scrolls.exotic.scrollofpuremagic.no_magic=A strange force around you is evaporating all magic nearby, you can't use this scroll at this moment.
items.throwingchains.name=throwing chains
items.throwingchains.desc=This bundle of chains seem awfully similar to those of a _prison guard_. Though, you can't seem to get the technique down for pulling mobs or items using these. Instead, these chains can be used to pull the hero towards a tile.\nThese chains can pull the hero _up to 5 tiles_ away and are blocked by walls.
items.throwingchains.too_far=The target is too far away.
items.throwingchains.no_path=The chains can't reach there.
items.throwingchains.hit_char=You can't grapple onto a character!
items.throwingchains.rooted=You are rooted and can't be pulled!
items.throwingchains.blocked=The chains are blocked.
items.throwingchains.cant_grab=You can't hook that.
items.throwingchains.prompt=Choose a location to throw your chains.
items.throwingchains.ac_use=Use
items.wands.wandofexplosion.name=wand of explosion
items.wands.wandofexplosion.staff_name=staff of explosion
items.wands.wandofexplosion.ondeath=You killed yourself with your own Wand of Explosion...
items.wands.wandofexplosion.desc=This wand is made of some vulcanic rock and is almost bombastic to the touch. It has a small explosion hovering above its tip which seems to be shot out when you use the wand.
items.wands.wandofexplosion.typical_stats_desc=This wand shoots a small explosion which violently explodes at a target location. The explosion typically deals _%1$d-%2$d damage_, but isn't strong enough to recoil anything.
items.wands.wandofexplosion.stats_desc=This wand shoots a small explosion which violently explodes at a target location. The explosion deals _%1$d-%2$d damage_, but isn't strong enough to recoil anything.
items.wands.wandofexplosion.upgrade_stat_name_2=Size
items.wands.wandofexplosion.bmage_desc=When _the Battlemage_ strikes a enemy with a staff of explosion, it will cast a small explosion around the target without harming _the battlemage_.
items.wands.wandofexplosion.eleblast_desc=An elemental blast with a staff of explosion will cause a giant explosion around you.
items.wands.wandoffireball.name=wand of fireball
items.wands.wandoffireball.staff_name=staff of fireball
items.wands.wandoffireball.ondeath=You killed yourself with your own Wand of Fireball...
items.wands.wandoffireball.desc=This wand is made from the fusion of a fireblast and explosion wand, combining both the explosive force and fiery damage of its parent wands. It shoots a small fireball which explodes on impact, dealing damage and causing fire.
items.wands.wandoffireball.typical_stats_desc=This wand shoots a small explosion which violently explodes at a target location and sets affected tile ablaze. The explosion typically deals _%1$d-%2$d damage_, but isn't strong enough to recoil anything.
items.wands.wandoffireball.stats_desc=This wand shoots a small explosion which violently explodes at a target location and sets affected tile ablaze. The explosion deals _%1$d-%2$d damage_, but isn't strong enough to recoil anything.
items.wands.wandoffireball.upgrade_stat_name_2=Size
items.wands.wandoffireball.bmage_desc=When _the Battlemage_ strikes a enemy with a staff of fireball, it will cast a small explosion around the target without harming _the battlemage_. Does not inflict fire.
items.wands.wandoffireball.eleblast_desc=An elemental blast with a staff of fireball will cause a giant explosion around you and set all enemies caught in the blast on fire.
items.wands.wandofelements.name=wand of elements
items.wands.wandofelements.staff_name=staff of elements
items.wands.wandofelements.ondeath=You killed yourself with the power of the elements...
items.wands.wandofelements.desc=This wand is made from 3 elemental wands that have been fused together with alchemy. It crackles with the combined power of the elements, and seems to hum with energy.
items.wands.wandofelements.stats_desc=This wand will cast out magic dealing _%1$d-%2$d damage._ The elemental magic cycles through _Fire_, _Frost_, and _Lightning_ each cast.
items.wands.wandofelements.bmage_desc=When _the Battlemage_ strikes with a staff of elements, they channel a hint of the next element in the wand's cycle:\n_Fire_ has a chance to ignite the enemy briefly.\n_Frost_ has a chance to chill the enemy for 3 turns, if they are already chilled then it freezes them instead.\n_Lightning_ has a chance to briefly charge the wielder with electricity, extending the arc of the next bolt.
items.wands.wandofelements.bmage_lightning=You feel a static charge building...
items.wands.wandofelements.desc_next_fire=The staff crackles with _heat_.
items.wands.wandofelements.desc_next_frost=The staff _chills_ the air.
items.wands.wandofelements.desc_next_lightning=The staff buzzes with _static_.
items.wands.wandofelements$lightningcharge.name=Electrically charged
items.wands.wandofelements$lightningcharge.desc=The Battlemage is currently charged with energy, granting immunity to their own staff of lightning and increasing the range that lightning can arc from it.\n\nTurns Remaining: %s.
items.wands.wandofelements.eleblast_desc=An elemental blast with a staff of elements will cause all three elements to activate.
items.weapon.weapon.got_augment=Your %1$s has been augmented with %2$s!
items.weapon.weapon.removed_augment=The augment was removed from %1$s.
items.armor.armor.got_augment=Your %1$s has been augmented with %2$s!
items.armor.armor.removed_augment=The augment was removed from %1$s.
items.armor.curses.binding.name=%s of binding
items.armor.curses.binding.desc=Armor cursed with binding has no direct negative effects. However, this curse is stronger than other curses and is much harder to remove.
items.weapon.curses.binding.name=binding %s
items.weapon.curses.binding.desc=Binding weapons are cursed with magic that binds them to their wielder and have no direct negative effects. However, the curse is stronger than many other curses and is much harder to remove.

###mattedition
items.potions.exotic.potionofvitality.name=potion of vitality
items.potions.exotic.potionofvitality.desc=Rather than granting raw strength, this potion will instead increase your vitality and make you healthier, permanently increasing your _max hp_. You'll always at least gain +5 max hp, but gain more based on hero level, up to a max of +25 per use.\n\nIt seems that drinking this potion over and over again will have _dimishing effects_. It's probably best to only use them at a late stage of your adventure.

