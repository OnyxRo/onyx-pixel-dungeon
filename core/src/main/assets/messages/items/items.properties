items.weapon.missiles.runestring$runestring1.stats_desc=This weapon has lost its enchanting power, but can be upgraded, augmented, enchanted, and repaired like other thrown weapons.
items.weapon.missiles.runestring$runestring1.desc=Runestones that have lost their magical aura are strung together. Attempts to inject magic cannot restore them; only their ability to bash heads remains.
items.rings.ringofking.name=crown prince's ring
items.rings.ringofking.stats=While wearing this ring, you can infuse it with the power of enchantments and glyphs.
items.rings.ringofking.desc=This ring, symbolizing royal status, can store the power of enchantments and glyphs and apply them directly to your equipped weapon and armor. This does not conflict with the equipment's own enchantment or glyph, and both can take effect at the same time. A cursed ring no longer provides enchantment or glyph power.
items.rings.ringofking.desc1=This ring cannot be upgraded directly, but will gradually grow stronger as you level up. At your current level, this ring's stored enchantment and glyph have _%d_ levels of effect.
items.rings.ringofking.desc2=While wearing this ring, you can feel _%s_ acting on your weapon.
items.rings.ringofking.desc3=While wearing this ring, you can feel _%s_ acting on your armor.
items.rings.ringofking.desc4=While wearing this ring, you gain no power of enchantments or glyphs from it.
items.rings.ringofking.desc5=enchantment.
items.rings.ringofking.desc6=glyph.
items.rings.ringofking.desc7=Please choose whether to infuse the crown prince's ring with an enchantment or a glyph.
items.rings.ringofking.desc8=Infuse enchantment
items.rings.ringofking.desc9=Infuse glyph
