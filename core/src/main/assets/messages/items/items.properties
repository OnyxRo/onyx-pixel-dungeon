items.weapon.melee.endingblade$turbulentflameheart.name=终焉攻心
items.weapon.melee.endingblade$turbulentflameheart.desc=每回合失去2%最大生命值，获得80%伤害减免
items.weapon.melee.endingblade$arcaneshield.desc=奥术护盾：当前拥有%d点护盾值，可叠加，每回合自然流失1点
items.weapon.melee.endingblade$deathcurse.desc=死亡诅咒区域，剩余%d回合
items.weapon.melee.endingblade$trialmodebuff.name=终末审判
items.weapon.melee.endingblade$trialmodebuff.desc=你触怒了终焉。怪物造成的伤害翻倍，你的血量上限被压制至半数。
items.weapon.melee.endingblade$trialmodebuff.mob_name=终末强化
items.weapon.melee.endingblade$trialmodebuff.mob_desc=怪物对英雄造成的伤害翻倍，自身血量翻倍，移速变为85%。
items.weapon.melee.endingblade$cooldown.name=终焉-升级冷却
items.weapon.melee.endingblade$cooldown.desc=你先前已经进行过一次升级，目前暂时无法升级。\n\n剩余效果时长：%s回合。
items.weapon.melee.endingblade.transmute_upgraded=终焉的力量增强了！
items.weapon.melee.spdtomlpd.quicksword.name=迅捷剑
items.weapon.melee.spdtomlpd.quicksword.desc=剑身轻盈，出鞘如风。\n\n“慢慢来？切，开什么玩笑，天下武功当然是唯快不破！”
items.weapon.melee.spdtomlpd.quicksword.stats_desc=你每拥有3%%的移速提升，这把武器的伤害就上升1%%，\n当前伤害倍率_%1$s_（上限_%2$s_）。
items.weapon.melee.spdtomlpd.quicksword.ability_name=唯快不破
items.weapon.melee.spdtomlpd.quicksword.typical_ability_desc=艾诺琳娜可用迅捷剑使用武技_唯快不破_：消耗_2充能_，不消耗回合地攻击一个敌人。该武技_不能连续释放_。
items.weapon.melee.spdtomlpd.quicksword.ability_desc=艾诺琳娜可用迅捷剑使用武技_唯快不破_：消耗_2充能_，不消耗回合地攻击一个敌人。该武技_不能连续释放_。
items.weapon.melee.spdtomlpd.quicksword.ability_chain_limit=唯快不破不能连续释放！
items.weapon.melee.spdtomlpd.quicksword.dev_desc=最多提升（武器等级+1）×50%。
items.weapon.melee.spdtomlpd.killking.name=弑君
items.weapon.melee.spdtomlpd.killking.desc=永远都会回到应有的人手中。
items.weapon.melee.spdtomlpd.killking.stats_desc=伏击时伤害区间变为 %1$d~%2$d。\n嬗变时不会变为其他武器，而是阶级+1。
items.weapon.melee.spdtomlpd.killking.transmute_upgraded=弑君的阶级提升了！
items.weapon.melee.spdtomlpd.killking.ability_name=硝烟处刑
items.weapon.melee.spdtomlpd.killking.typical_ability_desc=艾诺琳娜可以用弑君使出_硝烟处刑_：消耗_2充能_，进入_隐身_（至多持续3回合），并强化_下1次攻击_，使其造成的_最终伤害提升至150%_。解除隐身会提前结束强化。
items.weapon.melee.spdtomlpd.killking.ability_desc=艾诺琳娜可以用弑君使出_硝烟处刑_：消耗_2充能_，进入_隐身_（至多持续3回合），并强化_下1次攻击_，使其造成的_最终伤害提升至150%_。解除隐身会提前结束强化。
items.weapon.melee.spdtomlpd.spikedchakram.name=尖刺轮盘
items.weapon.melee.spdtomlpd.spikedchakram.desc=当车轮完美，当车舵完蛋。
items.weapon.melee.spdtomlpd.spikedchakram.stats_desc=当你拥有护盾时，额外获得 %1$d~%2$d 点伤害与护甲。
items.weapon.melee.spdtomlpd.spikedchakram.ability_name=血滴子
items.weapon.melee.spdtomlpd.spikedchakram.ability_desc=艾诺琳娜可以通过尖刺轮盘使用_血滴子_。对目标造成拥有_+50%精准_，_100%伤害_，随后对其施加_50%伤害值_的流血。近身无法使用，最大瞄准距离_8格。_
items.weapon.melee.spdtomlpd.spikedchakram.typical_ability_desc=艾诺琳娜可以通过尖刺轮盘使用_血滴子_。对目标造成拥有_+50%精准_，_100%伤害_，随后对其施加_50%伤害值_的流血。近身无法使用，最大瞄准距离_8格。_
items.weapon.melee.spdtomlpd.spikedchakram.ability_melee_forbid=血滴子无法对紧邻的敌人使用！
items.weapon.melee.spdtomlpd.spikedchakram.ability_range_exceed=目标超出血滴子最大8格射程！
items.weapon.melee.spdtomlpd.thedrip.name=滴落者
items.weapon.melee.spdtomlpd.thedrip.desc=剑身上不断渗出清澈的水滴，缓缓洗刷着剑刃上的血污。\n当你连续在同一格内停留2回合，此格会被淹没为水地块。
items.weapon.melee.spdtomlpd.thedrip.stats_desc=持有者连续在同一格停留2回合后，将该格变为水地块。
items.weapon.melee.spdtomlpd.thedrip.ability_name=天洪震荡
items.weapon.melee.spdtomlpd.thedrip.ability_desc=艾诺琳娜可以通过滴落者使用_天洪震荡_，将5距离以内的指定地点以及周围3*3地块改造为水地块，并使范围内的单位陷入3回合麻痹。施展时目标地点范围内每已有1格水地块，使联通的水地块往随机方向蔓延扩充1格。\n\n连续使用可以使释放武技的能量减少，但不会低于1。
items.weapon.melee.spdtomlpd.thedrip.typical_ability_desc=艾诺琳娜可以通过滴落者使用_天洪震荡_，将5距离以内的指定地点以及周围3*3地块改造为水地块，并使范围内的单位陷入3回合麻痹。施展时目标地点范围内每已有1格水地块，使联通的水地块往随机方向蔓延扩充1格。\n\n连续使用可以使释放武技的能量减少，但不会低于1。
items.weapon.melee.spdtomlpd.exorcistmaul.name=驱魔重锤
items.weapon.melee.spdtomlpd.exorcistmaul.desc=对近战法术攻击者的克星。
items.weapon.melee.spdtomlpd.exorcistmaul.stats_desc=在使用此武器的攻击命中后，获得一个持续3回合、能够免疫一次法术攻击的护盾，每次命中都会刷新持续时间。
items.weapon.melee.spdtomlpd.exorcistmaul$qumohudun.name=驱魔护盾
items.weapon.melee.spdtomlpd.exorcistmaul$qumohudun.desc=持续%1$s回合，抵挡一次法术伤害后消失。
items.weapon.melee.spdtomlpd.exorcistmaul.ability_name=破魔
items.weapon.melee.spdtomlpd.exorcistmaul.ability_desc=艾诺琳娜可以通过驱魔重锤使用_破魔_，立刻获得10回合魔法免疫，需要消耗_3充能_。
items.weapon.melee.spdtomlpd.exorcistmaul.typical_ability_desc=艾诺琳娜可以通过驱魔重锤使用_破魔_，立刻获得10回合魔法免疫，需要消耗_3充能_。
items.weapon.melee.spdtomlpd.staffofmyriadthings.name=万象之杖
items.weapon.melee.spdtomlpd.staffofmyriadthings.desc=需要将森罗万象填充进去，才能熠熠生辉。
items.weapon.melee.spdtomlpd.staffofmyriadthings.stats_desc=每使用这把武器击杀过一种敌人，就获得0-1的伤害成长以及仅限此武器的1命中加成。
items.weapon.melee.spdtomlpd.staffofmyriadthings.killed_none=尚未击杀过任何敌人。
items.weapon.melee.spdtomlpd.staffofmyriadthings.killed=已击杀 %1$d 种敌人：%2$s
items.weapon.melee.spdtomlpd.staffofmyriadthings.and_more=……等 %1$d 种
items.weapon.melee.spdtomlpd.staffofmyriadthings.bonus=当前增幅：伤害上限 +%1$d，命中 +%2$d
items.weapon.melee.spdtomlpd.staffofmyriadthings.ability_name=万象辉光
items.weapon.melee.spdtomlpd.staffofmyriadthings.ability_desc=艾诺琳娜可用万象之杖施展_万象辉光_：消耗_4充能_，获得持续1回合的_无敌_，并且每击杀过_13种敌人_额外获得_1回合_。
items.weapon.melee.spdtomlpd.staffofmyriadthings.typical_ability_desc=艾诺琳娜可用万象之杖施展_万象辉光_：消耗_4充能_，获得持续1回合的_无敌_，并且每击杀过_13种敌人_额外获得_1回合_。
items.weapon.melee.spdtomlpd.denorscythe.name=德诺尔镰刀
items.weapon.melee.spdtomlpd.denorscythe.desc=产于善于舞蹈的德诺尔，镰刀柄上还贴心蚀刻上了挥舞说明。
items.weapon.melee.spdtomlpd.denorscythe.stats_desc=如果在你的攻击范围内有三名或以上敌人，则这把武器可以同时攻击到它们，并且攻速上升66%。
items.weapon.melee.spdtomlpd.denorscythe.ability_name=舞刃
items.weapon.melee.spdtomlpd.denorscythe$extendedreach.name=舞刃
items.weapon.melee.spdtomlpd.denorscythe$extendedreach.desc=持续%1$s回合，使得德诺尔镰刀的攻击距离增加%2$d。
items.weapon.melee.spdtomlpd.denorscythe.ability_desc=艾诺琳娜可以使用德诺尔镰刀施展_舞刃_：增加1格攻击范围，持续10+等级*2回合。消耗1点充能。这个武技不消耗回合。
items.weapon.melee.spdtomlpd.deepseaknightanchor.name=深海骑士的锚
items.weapon.melee.spdtomlpd.deepseaknightanchor.desc=附有秘密姬的加护的大锚，足以粉碎坚物的它最后沉入了深海。
items.weapon.melee.spdtomlpd.deepseaknightanchor.stats_desc=在使用此武器攻击命中敌人后，清除自身的所有负面效果。
items.weapon.melee.spdtomlpd.deepseaknightanchor.ability_name=激愤
items.weapon.melee.spdtomlpd.deepseaknightanchor.ability_desc=艾诺琳娜可以使用深海骑士的锚施展_激愤_：获得5+等级回合激素涌动。消耗3点充能。这个武技不消耗回合。
items.weapon.melee.washcrime.name=涤罪
items.weapon.melee.washcrime.desc=铁链的末端绑缚了一把巨镰，上面的{血迹{已然生锈。\n命中有几率释放|未安息的亡魂|助战，并给敌人施加|残废|效果,武器伤害随杀敌数增加,但在一定阈值后停止增加。\n\n_这把武器拥有额外的攻击距离但攻速极慢_
items.weapon.melee.washcrime$diedghost.name=未安息的亡魂
items.weapon.melee.washcrime$diedghost.desc=肉身已然逝去，灵魂尚未得到安息，脑海遵照主人的意愿，直到真正的死亡降临。
items.weapon.melee.washcrime.ability_name=狠抽
items.weapon.melee.washcrime.ability_desc=艾诺琳娜可以用涤罪_狠抽_她周围的所有敌人。这一武技一般会对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.washcrime.typical_ability_desc=艾诺琳娜可以用涤罪_狠抽_她周围的所有敌人。这一武技对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.bloodthirstythorn.name=嗜血荆棘
items.weapon.melee.bloodthirstythorn.desc=鲜血腐蚀所残留的倒悬树之刺。舍弃了仅存的秩序，独留狂暴与混乱。\n-攻击时有概率给敌人施加{流血和恐惧{效果。\n-特性：升级机制与蓄血圣杯相同\n_这是一把十分精准的武器_
items.weapon.melee.bloodthirstythorn.stats_desc=这株植物不再抗拒你，并且发生了一些变化
items.weapon.melee.bloodthirstythorn.stats_descx=\n\n这株植物成长到了极限，或许会通过某种方式给予回馈
items.weapon.melee.bloodthirstythorn.good=你的生命精华已经完全浸染吾等，作为尔等忠诚的报答，你会获得一个{诅咒但含有1~3等级的圣杯{作为补偿。
items.weapon.melee.bloodthirstythorn.ac_prick=血祭
items.weapon.melee.bloodthirstythorn.yes=是的，我知道我在做什么
items.weapon.melee.bloodthirstythorn.no=不，我改主意了
items.weapon.melee.bloodthirstythorn.prick_warn=每次使用血祭都会消耗更多的生命能量，要是不够小心，这种行为可以轻易地杀死你。\n\n你确定要给它更多的生命能量吗？
items.weapon.melee.bloodthirstythorn.onprick=你刺破了自己的手指，你的生命精华流入了这株噩梦般的荆棘植物中。
items.weapon.melee.bloodthirstythorn.ondeath=这株噩梦般的植物将你的生命精华吸噬殆尽了…
items.weapon.melee.bloodthirstythorn.ability_name=沉重一击
items.weapon.melee.bloodthirstythorn.typical_ability_desc=艾诺琳娜可以用嗜血荆棘使出_沉重一击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。沉重一击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.bloodthirstythorn.ability_desc=艾诺琳娜可以用嗜血荆棘使出_沉重一击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。沉重一击必定命中，但若非伏击则只会造成普通的伤害。
items.jokings.hornofplentybomb.name=丰饶之角
items.jokings.hornofplentybomb.desc=一只塞满黑火药的丰饶之角，看起来可以作为炸弹使用。爆炸时，这枚炸弹会对所有邻近单位造成_%1$d~%2$d_伤害并摧毁某些地形或物品。
items.books.bookslist.hellfirebooks.name=《史莱姆公主》
items.books.bookslist.hellfirebooks.desc=敬请期待
items.books.bookslist.hellfirebooks.author=--Terraria
items.books.bookslist.hellfirebooks.ac_read=尚未完成
items.weapon.melee.icefishsword.name=寒冷的尚方宝剑
items.weapon.melee.icefishsword.desc=神秘的鱼类，来源未知。\n\n对可视敌人造成冻伤和流血效果，但是似乎有些腥。
items.weapon.melee.icefishsword.cook=%s经过寒冷的肆虐再次变回冰冷的尚方宝剑……
items.weapon.melee.icefishsword.ability_name=顺劈
items.weapon.melee.icefishsword.typical_ability_desc=艾诺琳娜可以用寒冷的尚方宝剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.icefishsword.ability_desc=艾诺琳娜可以用寒冷的尚方宝剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.firefishsword.name=煮熟的尚方宝剑
items.weapon.melee.firefishsword.desc=神秘的鱼类，来源未知。\n\n对可视敌人造成燃烧和幻惑效果，闻起来挺好吃的。\n\n这是一件相当缓慢的武器，但极其精准。
items.weapon.melee.firefishsword.resetling=%s经过烈焰的烘烤变熟了, 但是似乎有点糊了...，不过剑身看起来更加锋利了。
items.weapon.melee.firefishsword.ability_name=顺劈
items.weapon.melee.firefishsword.typical_ability_desc=艾诺琳娜可以用煮熟的尚方宝剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.firefishsword.ability_desc=艾诺琳娜可以用煮熟的尚方宝剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.books.books.your_character=你当前已经触发了一个英雄精英祝福效果，暂时不能阅读其他传说书籍。(灯火隐没和BR简单模式也算英雄精英祝福)
items.books.playbookslist.moneymorebooks.name=《财富神教教典》
items.books.playbookslist.moneymorebooks.desc=_财富戒指_是最好的功能性戒指，它拥有无限可能，你想要的，它都可以给你！快来加入吧！\n\n切记：新教徒能力不足，无法掌控_财富流派_，不可将{升级全部给{财富戒指。否则届时你将无法在探索地牢之中走下去。\n\n试试让幽灵穿上{分身诅咒{甲，让她在{鱼群中{玩耍。
items.books.playbookslist.moneymorebooks.author=--作者:_迷茫_
items.books.playbookslist.moneymorebooks.ac_read=尚未完成
items.books.playbookslist.pinkrandombooks.name=《闲天随笔》
items.books.playbookslist.pinkrandombooks.desc=九月九日菊映山，登高远望思凤钗。\n季秋凄风何且哀？茱萸插罢悲自来。
items.books.playbookslist.pinkrandombooks.author=--作者:_Goo东西_
items.books.playbookslist.pinkrandombooks.ac_read=尚未完成
items.books.playbookslist.deyizibooks.name=《我们是柏林联合》
items.books.playbookslist.deyizibooks.desc=在山的那边，海的那边，有一座小球场。\n球场里有一群纯粹到不敢相信的踢球的人，他们就是柏林联合，即使我们刚刚进去甲级联赛，但是我们有一往无前的气势。\n旅行者，愿柏林联合的钢铁意志保佑你。
items.books.playbookslist.deyizibooks.author=--作者:_Pedro_
items.books.playbookslist.deyizibooks.ac_read=尚未完成
items.books.playbookslist.bzmdrbooks.name=《“地牢速通秘籍”》
items.books.playbookslist.bzmdrbooks.desc=地牢存在就是为了速通的，打个地牢哪有这么多弯弯绕绕的，我tm直接拿起灵能弓就瞎鸡霸射，我tm直接从1层射到古神，360%托马斯回旋螺旋射，然后换成武道用酸杖tm射射射，把小怪全tm射死，地牢全小怪全杀了，把财富神射全tm炸了，然后把神器全tm卖了，我tm射射射射射射射射
items.books.playbookslist.bzmdrbooks.author=--作者:_Bzmdr_
items.books.playbookslist.bzmdrbooks.ac_read=尚未完成
items.mainbooks.desc=书本的厚重感让你不敢轻易翻开，但若是不翻开，你将无法获得它的力量。
items.mainbooks.readed=你已经阅读过这本书。所以你不需要再看这本书的内容了。
items.mainbooks.no=就当你准备阅读的时候，一道力量让你无法翻阅书籍，看来有人希望你将书籍带出地牢，而不是阅读完它们。
items.scrolls.exotic.scrollofroseshiled.null=玫瑰秘卷
items.scrolls.exotic.scrollofroseshiled.name=玫瑰秘卷
items.scrolls.exotic.scrollofroseshiled.desc=_玫瑰女神的魔力_被注入在这个秘卷之中，阅读它会为阅读者带来一个暂时_坚不可摧_的结界。 \n\n由于这个秘卷有专属标识，所以无需鉴定。
items.scrolls.scrollofflamecursed.name=烈焰噩梦秘卷
items.scrolls.scrollofflamecursed.desc=烈焰噩梦秘卷可以产生异常危险的霜火，对任何可见敌人造成致命的伤害。\n\n由于这个秘卷有专属标识，所以无需被鉴定。
items.scrolls.scrollofflamecursed.none=这个卷轴产生了一阵耀眼的幻蓝光芒。
items.scrolls.scrollofflamecursed.one=这个卷轴产生了一阵耀眼的幻蓝光芒的同时%s被点燃了！
items.scrolls.scrollofflamecursed.many=这个卷轴产生了一阵耀眼的幻蓝光芒的同时怪物们被点燃了！
items.scrolls.scrollofflamecursed.null=烈焰噩梦秘卷
items.wands.wandofscale.name=极度惧风法杖
items.wands.wandofscale.staff_name=暴风之杖
items.wands.wandofscale.desc=这根法杖的紫色主干顶端镶嵌着一颗明亮的黑色宝石。
items.wands.wandofscale.stats_desc=这根法杖能射出恐惧声波，使附近的敌人恐惧。并且可以产生暴风使周围陷阱全部失效且成为水地面。\n会造成_%1$d~%2$d点伤害_。
items.wands.wandofscale.bmage_desc=当_%s_以暴风之杖%s，能概率让目标流血。
items.wands.wandofscale.eleblast_desc=暴风之杖的元素风暴。
items.weapon.melee.skyshield.name=筝型盾
items.weapon.melee.skyshield.typical_stats_desc=这件武器通常能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.skyshield.stats_desc=这件武器能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.skyshield.desc=这是"霜落帝国"的产物，由"霜落女帝"亲自监督研发。
items.weapon.melee.junglepoison.name=丛林毒刺
items.weapon.melee.junglepoison.desc=从克璃诺斯之果身上拆下的一根强壮枝条，蕴含了极强的毒性以及那些触手的力量。挥舞起来很顺手，不过却不怎么锋利。\n这把武器在攻击时可对目标叠加中毒，当中毒积累到一定程度还会有额外效果。\n\n这是一件很快的武器。
items.weapon.melee.junglepoison.ability_name=丛林缠绕
items.weapon.melee.junglepoison.ability_desc=艾诺琳娜可用丛林毒刺使出丛林缠绕，这一武技一般可以使视野范围内的_所有敌人0回合_的虚弱与缠绕，被武技命中的敌人叠加_10层_中毒，需要消耗4点武技充能。
items.weapon.melee.junglepoison.typical_ability_desc=艾诺琳娜可用丛林毒刺使出丛林缠绕，这一武技可以使视野范围内的_所有敌人%s回合_的虚弱与缠绕，被武技命中的敌人叠加_%s层_中毒，需要消耗4点武技充能。
items.potions.potionofnowater.name=生石灰固体理想试剂
items.potions.potionofnowater.desc=与水反应，可将_水_除去。能够与_8向2x2_范围内的水完全反应而除去。\n反应为极其理想的完全反应，不能用常识理解。\n\n_缺点_ _产生大量热_，足以_点燃周围_,扔在生物脸上有_致盲效果_。\n帕秋莉提出配方，中国制造。\n}源码来自：古明地觉地牢}
items.bags.bookbag.name=牛皮书袋
items.bags.bookbag.desc=积累了不少灰尘的牛皮书袋，可以装纳不少书籍在里面。
items.bags.herbbag.name=食物袋
items.bags.herbbag.desc=一个小袋子装你的食物。
items.bags.kingbag.name=武甲背包
items.bags.kingbag.desc=专门储存近战武器/护甲的大背包，结合霜落帝国失传已久的神秘魔法制造而成。
items.bags.propbag.name = 藏品包
items.bags.propbag.desc = 用于安放饰品的小背包
items.weapon.melee.hollow.deathrongboat.name=卡戎的“船桨”
items.weapon.melee.hollow.deathrongboat.desc=如果你的脚下是水面，则对此次攻击目标的攻击伤害将传导至水面上的所有敌人，每扩大一格，伤害就丢失%s%%。\n\n这件武器比较精准\n\n小船儿荡起双桨，让我们推开波浪~\n\n<#FFA500>渊落古堡外传击败刻耳柏洛斯限定武器，再次感谢你游玩魔绫的首个外传。<RGB>
items.weapon.melee.hollow.deathrongboat.ability_name=收割
items.weapon.melee.hollow.deathrongboat.typical_ability_desc=艾诺琳娜可以用船桨来_收割_敌人，这破坏性的一击必定命中，一般会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.hollow.deathrongboat.ability_desc=艾诺琳娜可以用船桨来_收割_敌人，这破坏性的一击必定命中，并会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.missiles.crossreback.name=十字回旋镖
items.weapon.missiles.crossreback.desc=在这枚投掷武器的命中敌人处会产生电墙，持续%s回合。墙范围内的敌人每回合受到%s点伤害。\n\n异端必被裁决，在此宣告审判！！！\n\n<#FFA500>渊落古堡外传 神圣裁决 徽章后解锁的限定武器，再次感谢你游玩魔绫的首个外传。<RGB>
items.weapon.missiles.crossreback$electricity.desc=火花在这片电能力场中不断闪烁着，但不会对你造成伤害。
items.weapon.melee.boomsword.name=炸弹匕首
items.weapon.melee.boomsword.desc=这种神奇的魔法将炸弹与匕首结合...\n\n我有一把匕首，我有一颗炸弹，啊～\n_＂炸弹匕首＂_
items.weapon.melee.boomsword.stats_desc=这件武器会在击杀敌人时有概率获取一枚弹药，通过升级该武器可以提高概率，和解锁更加强大的炸弹。
items.weapon.melee.boomsword.has_ammo=当前弹药：_%d/%d_\n下一发炸弹：_%s_
items.weapon.melee.boomsword.ac_zap=投掷炸弹
items.weapon.melee.boomsword.needs_ammo=当前没有弹药。击杀敌人有机会充能。
items.weapon.melee.boomsword.ammo_ready=充能完毕！下一发是：%s。
items.weapon.melee.boomsword.no_ammo=你目前没有任何弹药，击杀敌人以获得弹药。
items.weapon.melee.boomsword$1.cant_reach=那个位置发射炸弹是无效的！
items.weapon.melee.boomsword.ammo_added=你获得了新的弹药！
items.weapon.melee.boomsword.ability_name=潜行
items.weapon.melee.boomsword.typical_ability_desc=艾诺琳娜握持炸弹匕首时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多5格远，并一般给予_%d回合隐形_。
items.weapon.melee.boomsword.ability_desc=艾诺琳娜握持炸弹匕首时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多5格远，并给予_%d回合隐形_。
items.weapon.melee.boomsword.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.dairikyan.name=蛮人战斧
items.weapon.melee.dairikyan.stats_desc=这对武器极快。
items.weapon.melee.dairikyan.desc=一对结实有力的等大小战斧，可以进行更快的劈斩。
items.weapon.melee.redbloodmoon.name=红魔炽剑
items.weapon.melee.redbloodmoon.desc=你感受到这把剑里面有一些奇怪的嘶鸣声\n根据古书记载，这很可能是红魔炽剑！\n此剑可以召唤出红魔守卫，他们以烧尽一切而出名！\n\n每层最多召唤2个红魔守卫，在培养好武器后可以解锁强大的力量\n\n只有装备在英雄的武器位才能召唤，卸下武器会立刻让所有召唤单位死亡！
items.weapon.melee.redbloodmoon$redmagicdied.name=血月火把红魔守卫
items.weapon.melee.redbloodmoon$redmagicdied.desc=这些若隐若现的傀儡是曾经的水晶之城的守卫，因为你的执着，他们现在与你并肩作战。\n现在你是他们的新主人，他们将誓死守卫你到消亡！\n\n由于幻影不稳定性质，每次成功的攻击都会造成一定的生命扣减。
items.weapon.melee.redbloodmoon.ability_name=顺劈
items.weapon.melee.redbloodmoon.typical_ability_desc=艾诺琳娜可以用红魔炽剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.redbloodmoon.ability_desc=艾诺琳娜可以用红魔炽剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.armor.lamellararmor.name=札甲
items.armor.lamellararmor.desc=用许多长方形甲片排布而成的盔甲，为能承受它重量的冒险者提供最强的防御。
items.armor.custom.ancityarmor.name=板鲎甲
items.armor.custom.ancityarmor.desc=从巨大底栖顶级掠食者的身上剥离的铠甲，看起来厚重，实际上非常轻盈\n\n_这件护甲擅长闪避_，这件护甲属于特殊护甲，无法被皇冠改造。
items.armor.custom.ancityarmor.ac_custom=毒雾释放
items.armor.glyphs.alowglyph.ancitystone.name=远古印记
items.armor.glyphs.alowglyph.ancitystone.desc=这个强大的独有印记能够让使用它的人免疫毒雾，酸蚀，中毒效果。\n\n印记是一种强大的祝福刻印，可与刻印共存。
items.armor.glyphs.alowglyph.ancitystone.alowglyph=印记
items.armor.custom.ancityarmor.no_charge=护甲没有足够的能量释放战技！
items.props.prop.rareness=这是一个%s阶<RGB>的%s藏品
items.props.prop.bad=<#DD0101>负面<RGB>
items.props.prop.good=_正面_
items.props.prop.chaos=<#EE8E1C>混沌<RGB>
items.props.starsachet.name=星陨花香囊
items.props.starsachet.desc=使用名贵的星陨花制作的香囊，仍在散发着特殊的香气。在这片香气中，你感觉意识更加清醒了。 \n\n持有时，你的精准和闪避根据所处区域增加<#E5579A>1/2/3/4/5/6点<RGB>
items.props.portablewhetstone.name=携带型砥石
items.props.portablewhetstone.desc=使用砥石能让你的武器变的更锋利，更可靠。\n而这种特殊的砥石不仅小巧便于携带，并且采用了特殊的设计，使得它的使用者能够在尽可能短的时间内以一种相当“优雅”的方式来修复武器。唯一的缺点是，这种砥石似乎不是很耐用。\n\n持有时，根据所处区域序号获得<#E5579A>物理伤害加成2/3/4/5/7/9<RGB>
items.props.luckyglove.name=幸运手套
items.props.luckyglove.desc=传说中的赌神用过的手套，传闻赌神戴着这幅手套出入各大赌场无一败绩，直到人们发现手套是多层结构。 \n\n持有时，你在购买物品时有<#E5579A>15%的概率不消耗金币<RGB>
items.props.emotionalaggregation.name = 情绪聚合体
items.props.emotionalaggregation.desc = 地牢中曾经踏入了太多的冒险者，他们中的大多数惨死在地牢某处，但是他们死前坚定的意志却最终汇聚在了一起，激发了这一集合体的形成 \n\n持有时，你每次将要受到伤害时将会有<#E5579A>10%的概率无视这次伤害<RGB>
items.props.armorscalesofbzmdr.name= bzmdr的盔甲鳞片
items.props.armorscalesofbzmdr.desc = 这片鳞片让你感到了一股熟悉的气息，它让你想起了那位偶尔在酒馆的人，只是你记得他身上从来不穿盔甲\n\n持有时，你每大区获得<#E5579A>固定减伤1/2/3/4/5<RGB>
items.props.deliciousrecipe.name = "惠民食谱"
items.props.deliciousrecipe.desc = 上面写着“将些许幻影食人鱼肉加入锅中，放入少许阳春草，适量魔皇草茎，温火慢炖30分钟”的东西叫做惠民食谱？ \n\n持有时，每次通过<#E5579A>炼金消耗炼金能量<RGB>后获得<#E5579A>+2炼金能量<RGB>
items.props.deliciousrecipe.reduce = 你照着食谱上的说明在炼金的最后关头突然撤去魔力供应……炼金依旧成功了！只是你总感觉哪里不太对劲……
items.props.emotionalaggregation.block = 在将要受到攻击时，你感到一股暖流从背包中附上你的身体……你免疫了这次伤害！
items.props.knightstabbingsword.name = 迅捷骑士刺剑
items.props.knightstabbingsword.desc = 它曾是数代人的信仰——现在或许也是，它会是你的信仰吗？\n\n持有时，<#E5579A>闪避后<RGB>立即发动<#E5579A>攻击有40%的概率<RGB>不消耗回合数
items.props.knightstabbingsword.attack = 你的信仰得到了刺剑的认可，如现在立即发动攻击则不消耗回合。
items.props.luckyglove.lucky = 你的手套自己动了起来，趁着你和店主议价的间隙，他帮你拿了一件东西……
items.props.monocular.name = "单筒望远镜"
items.props.monocular.desc = 一个很奇怪的单筒望远镜，看样子是从双筒望远镜上截下来的，这玩意真的能正常使用吗…… \n\n持有时，使用<#E5579A>投掷武器<RGB>命中敌人时，你距离敌人<#E5579A>每有1格<RGB>，伤害<#E5579A>增加1-3<RGB>，精准度<#E5579A>提升20%<RGB>。
items.props.hellbutterfly.name=炼狱赤蝶
items.props.hellbutterfly.desc=你获得<#E5579A>磷火和地狱火<RGB>免疫，在怪物被施加_磷火_时替换为<#E94134>地狱火<RGB>。携带地狱火的怪物每回合受到<#E94134>15%最大生命值<RGB>的魔法伤害，对于没有<#E94134>任何精英或突变词条的怪物，伤害类型变为真实<RGB>。\n\nBoss单位携带地狱火时，效果改为每回合受到<#E94134>20点魔法伤害<RGB>，并清空身上的任何护盾。地狱火可以像磷火一样传播。\n\n传说在忘川河畔有一种飞舞的蝶，这种蝶身上总是缠绕着燃烧不息的火焰，每一缕火苗都来自永远陨灭的思念……
items.props.brokenbone.name = 折断之骨
items.props.brokenbone.desc = 不知道是哪位倒霉的冒险家的遗物，骨头被折断的下半部分有明显的水渍。他到底经历了什么呢...... \n\n持有时，你在对战怪物时的<#52B9D8>幸运程度降低30%<RGB>
items.props.dirt_knifestand.name=土刀架
items.props.dirt_knifestand.desc=这好像是一种很出名的零食……补兑！\n\n持有时，<#52B9D8>轻度饥饿<RGB>状态下将会持续损失生命值，但损失速度仅有先前重度饥饿的一半；重度饥饿状态下每次损失的生命值<#52B9D8>变为3倍。<RGB>
items.props.rustedgoldcoin.name =生锈的金币
items.props.rustedgoldcoin.desc =尽管在地牢中被统一被称为金币，但是不会有哪个国家或组织真的使用金子来制作货币的。\n很不幸的是，虽然不知道用的是什么材料，但是它们在地牢里生锈了。 \n\n持有时，你的<#52B9D8>金币获取量减少15%<RGB>，但每次获得的量不会低于1
items.props.bottlewraith.name = 瓶装怨灵
items.props.bottlewraith.desc =一个装着怨灵的魔瓶，其散发的气息会吸引来大量同类。\n\n持有时，每次下楼时<#52B9D8>随机额外生成1～层数/2只怨灵<RGB>，至少生成1只，位置随机分布
items.props.blockingdrug.name=阻断药物
items.props.blockingdrug.desc=这瓶药片只是带在身上便已经会阻碍你的血液循环，使你的生命再生变得困难 \n\n持有时，<#52B9D8>生命自然恢复效率-20%<RGB>
items.props.heartofcrystalfractal.name = 水晶之心的噩梦
items.props.heartofcrystalfractal.desc = 天地昏暗，生灵疯狂，诡谲的低语缠绕在耳畔，来自无穷远的恶意摩挲着大地，像在把玩心仪的玩具……这是你从中感受到的意境。\n\n你的<#52B9D8>闪避降低15%<RGB>
items.props.thegriefofspeechless.name = 不语者的悲哀
items.props.thegriefofspeechless.desc = 一本泛黄的日记，里面写满了一位先天失语者的不幸与悲哀 \n\n在使用<#52B9D8>除升级卷轴以外的卷轴<RGB>时有<#52B9D8>15%概率<RGB>使用失败。
items.props.thegriefofspeechless.grief = 卷轴骤然发出一团明亮的闪光而后自焚殆尽
items.props.terrordoll.name = 恐怖娃娃
items.props.terrordoll.desc =一个长相十分骇人的娃娃，你总感觉它在盯着你 \n\n你的<#52B9D8>精准属性*75%<RGB>\n你的伤害性法杖有<#52B9D8>10%的概率<RGB>无法造成任何伤害
items.props.terrordollb.name = 恐怖娃娃
items.props.terrordollb.desc =一个长相十分骇人的娃娃，你总感觉它在盯着你 \n\n你的<#52B9D8>精准属性*75%<RGB>\n你的伤害性法杖有<#52B9D8>10%的概率<RGB>无法造成任何伤害\n它看上去有些不太一样……
items.props.terrordoll.terror = 一股没有来由的恐惧突然在你的心中爆发
items.props.cloakfragmentsofbzmdr.name = bzmdr的斗篷残片
items.props.cloakfragmentsofbzmdr.desc = 你在地牢中捡起这片黑色布料时感觉意外的熟悉，你将其携带在身上时，感觉到有人在注视着自己，因此你不得不分出一些注意力…… \n 你在每大区的每次攻击造成的伤害<#52B9D8>固定减少1/3/6/9/15<RGB>
items.props.emotionalaggregationb.name = 情绪集合体
items.props.emotionalaggregationb.desc = 地牢中曾经踏入了太多的冒险者，他们中的大多数惨死在地牢某处，而他们在死前的怨念形成了这种……产物，即使你将其封锁的严严实实，依然感到心神不宁。\n\n你在每大区受到的所有被护甲减免过的物理伤害将额外增加<#52B9D8>1/3/5/7/9点<RGB>。
items.props.noteofbzmdr.name =  Bzmdr的笔记
items.props.noteofbzmdr.desc = 里面记载的并不是已知的人类语言，这到底是……\n\n持有时，所有怪物<#52B9D8>视野范围+25%<RGB>，且任何怪物的任何攻击会尝试<#52B9D8>削弱你的光源<RGB>。如果你身上没有任何光源，则受到的<#52B9D8>攻击伤害+25%。<RGB>
items.props.stardust.name = 星尘
items.props.stardust.desc = 来自此界之外的事物，只是沐着其中散发出的光芒你便感觉到了无匹的重量。带着它时就连移动也成为了困难的事情……\n\n你的<#52B9D8>移动速度降低25%<RGB>，且最高移速不能<#52B9D8>超过1.5<RGB>，你的浮空时间<#52B9D8>降低50%<RGB>，受到的坠落伤害<#52B9D8>增加25%。<RGB>
items.props.brokenring.name = 破碎之环
items.props.brokenring.desc = 曾有传闻它完整的时候能禁锢世界万物，不过就算现在已经破碎，也依旧能够锁住你。\n\n你的<#52B9D8>神器/戒指<RGB>通用栏位将被封锁。当生命值小于等于最大生命的<#52B9D8>60%/40%/20% <RGB>时，依次封锁玩家的<#52B9D8>神器/戒指/护甲<RGB>栏位，生命值回复到相应档位以上时，解除相应阈值的封锁。
items.props.brokenring.lock =破碎之环禁锢了你的通用装备栏，装备的东西在这里无效。
items.props.brokenring.bound_desc = 此物品被破碎之环束缚，无法发挥任何功效。
items.props.brokenring.ac_release = 卸下以解除束缚
items.props.brokenring.released = 破碎之环的束缚解除了。
items.thanks.brokenringartifactbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.thanks.brokenringarmorbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.thanks.brokenringmiscbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.thanks.brokenringringbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.props.deadoralive.name=去往死的决意
items.props.deadoralive.desc=英雄固有一死，或手残误触，或残血贪药。\n\n你<#C42B1C>造成和受到<RGB>的伤害<#C42B1C>均加+10%<RGB>。
items.props.dreamseed.name=梦之种
items.props.dreamseed.desc=我向神明祈愿，给我一个美好的未来。\n\n神明说：“梦里啥都有。”\n\n首次进入新一层时，在楼梯旁生成<#F1521E>1个随机的怪物或物品。<RGB>（包括但不限于装备和消耗品，不会生成专属物品和藏品，怪物和物品的生成权重相等）
items.props.catgirlcosplay.name=猫娘cosPlay服装
items.props.catgirlcosplay.desc=_-_ 你找我玩游戏喵，我说我玩的很菜喵，你要是和我玩后嫌我菜我就捅死你喵！\n_-_ 什么是糖喵？是在说我甜甜的喵？谢谢喵，你也很糖喵！\n_-_ 你怎么有别的小猫了喵！捅死你喵！捅死你喵！\n\n每次行动有<#E5579A>3.25%概率<RGB>发出喵喵叫。<#E5579A>喵喵叫有50%概率<RGB>使7*7范围内的敌人变为<#E5579A>迷惑状态（丢失目标）<RGB>，包括那些处于沉睡中的敌人，也有<#E5579A>50%概率使敌人兴奋，让敌人获得1回合激素涌动<RGB>。
items.props.trash.name= 垃圾(藏品池已用尽)
items.props.trash.desc=Nothing is left to find.
items.props.trash.trash = 小叶：看样子这种魔力的变化已经穷尽了呢……
items.food.hollow.gelatin.name=明胶
items.food.hollow.gelatin.eat_msg=糖果吃起来香甜可口，那些见习的魔女一定会喜欢的！
items.food.hollow.gelatin.desc=制作凝胶糖果的原材料，使成品能迅速成型。如果你饿的不行了，也可以用它来应急饥饿带来的疲劳。
items.food.hollow.sugar_block.name=糖块
items.food.hollow.sugar_block.desc=制作任意糖果的原材料，使最终的糖果香甜可口。如果你饿的不行了，也可以用它来应急饥饿带来的疲劳。
items.food.hollow.whitesugar_b.name=麦芽糖醇
items.food.hollow.whitesugar_b.desc=制作任意糖果的原材料，使最终的糖果变得Q弹圆滑。如果你饿的不行了，也可以用它来应急饥饿带来的疲劳。
items.rings.ringoofretenacity.name=庇护之戒
items.rings.ringoofretenacity.desc=这枚戒指为佩戴者削弱各种外界的侵害。你受到大部分元素与魔法伤害会被削弱，而随着你的受伤程度增加，你对所有伤害的抗性都会逐步提升。被诅咒的戒指则会让你弱不禁风。
items.rings.ringoofretenacity.upgrade_stat_name_1=元素抗性
items.rings.ringoofretenacity.upgrade_stat_name_2=伤害减免
items.rings.ringoofretenacity.stats=佩戴这枚戒指时，你的元素抗性提升 _%1$s%%_，受伤时最大减免 _%2$s%%_ 的伤害。
items.rings.ringoofretenacity.combined_stats=你已装备的戒指正联结它们的力量，元素抗性提升 _%1$s%%_，受伤时至多减少 _%2$s%%_ 的伤害。
items.rings.ringoofretenacity.typical_stats=佩戴这枚戒指时，你的元素抗性通常会提升 _%1$s%%_，受伤时通常至多减少 _%2$s%%_ 的伤害。
items.weapon.enchantments.crushing.name=爆破%s
items.weapon.enchantments.crushing.desc=这个附魔会让使用者陷入癫狂，能使爆炸的能量从武器中喷薄而出，能够使敌人目标处受到一次范围伤害亦或者给造成敌人短暂的残废效果。
items.weapon.enchantments.crushing.kill=%2$s:炸死你，%1$s！今天就是你的末日，啊哈哈哈哈哈……
items.weapon.enchantments.crushing.kill1=%2$s:既然你都知道了，%1$s！这戏我就不演了，我就是大名鼎鼎的爆破之神,人称甲穿山……
items.weapon.enchantments.crushing.kill3=%2$s:老子数到3，马上滚出去，%1$s！3！，Bomb!!!……
items.weapon.enchantments.crushing.kill4=%2$s:死神就是我，我就是死神之子，%1$s！
items.weapon.enchantments.crushing.kill5=%2$s:既然你遇到我了，%1$s！那你今天一定是城防炮下寄快递，上面摆，下面寄。
items.weapon.enchantments.crushing.kill6=%2$s:我就是你的克星，%1$s！去地狱里面祈祷吧！
items.weapon.melee.withewoodsword.name=白檩剑
items.weapon.melee.withewoodsword.desc=白檩剑，外观堂皇且端庄，用白檩木制成。每次都可能让敌人陷入恐惧、眩晕和燃烧状态。随着武器等级的提升，这些效果将变得更加强大。\n\n但有一定概率让使用者受到反噬效果。当武器等级达到+3以上时，反噬效果将被消除。
items.weapon.melee.icelingsword.name=冰澪匕首
items.weapon.melee.icelingsword.stats_desc=这把武器拥有_惊人的攻击距离_，和极其精准的精准度，并且可能对_敌人造成冻伤效果_。
items.weapon.melee.icelingsword.desc=冰澪匕首常年被地牢的寒冷腐蚀，为此它已经变得与众不同，这个武器相当的精准。
items.weapon.melee.icelingsword.ability_name=狠抽
items.weapon.melee.icelingsword.ability_desc=艾诺琳娜可以用冰澪匕首_狠抽_她周围的所有敌人。这一武技一般会对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.icelingsword.typical_ability_desc=艾诺琳娜可以用冰澪匕首_狠抽_她周围的所有敌人。这一武技对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.merchantsword.name=商人佩剑
items.weapon.melee.merchantsword.desc=它通常作为商人之间用来互相证明身份的道具，但在应急情况下你也可以把它当做武器。\n\n这把武器目前可以使地摊商品_全面降价%s%%_，最高降价90%%。
items.weapon.melee.merchantsword.ability_name=劫掠
items.weapon.melee.merchantsword.typical_ability_desc=艾诺琳娜可用商人佩剑_劫掠_一个敌人。对目标造成_100%伤害_，最终加成不超过200%。如果此次攻击击杀了一个单位，那么额外掉落一份基于_层数的金币_。
items.weapon.melee.merchantsword.ability_desc=艾诺琳娜可用商人佩剑进入_劫掠_。对目标造成_%s%%伤害_，最终加成不超过_200%%_。如果此次攻击击杀了一个单位，那么额外掉落一份基于_层数的金币_。
items.weapon.melee.legend.kingaxe.ability_name=亡魂者
items.weapon.melee.legend.kingaxe.ability_desc=艾诺琳娜可以用王庭和约使出_亡魂者_。这用尽全力的一击造成 +65% 伤害并施加 5 回合的恍惚，使其精准和闪避均减半。武技必中，但若不是偷袭敌人则会消耗 2 点充能。\n\n并且产生一个 矮人角斗士 友军。
items.weapon.melee.dairikyan.ability_name=血债血偿
items.weapon.melee.dairikyan.ability_desc=艾诺琳娜在血量低于 40% 时可以使用蛮人战斧进行_血债血偿_攻击。这种毁灭性的攻击必定命中，且造成 +20% 伤害，且艾诺琳娜有10%概率获得激素涌动3回合。
items.weapon.melee.skyshield.ability_name=简易护卫
items.weapon.melee.skyshield.ability_desc=艾诺琳娜可以用筝形盾_护卫_自己，在 4 回合内完全抵挡下一次针对自己的物理或魔法攻击。
items.weapon.melee.withewoodsword.ability_name=重劈
items.weapon.melee.withewoodsword.ability_desc=艾诺琳娜可以用战锤使出_重劈_。这用尽全力的一击造成 +40% 伤害并施加 5 回合的恍惚，使其精准和闪避均减半。武技必中但若不是偷袭敌人则会消耗 2 点充能。
items.weapon.melee.withewoodsword.typical_ability_desc=艾诺琳娜可以用战锤使出_重劈_。这用尽全力的一击造成 +40%% 伤害并一般会施加 5 回合的恍惚，使其精准和闪避均减半。武技必中但若不是偷袭敌人则会消耗 2 点充能。
items.weapon.missiles.streamerknife.name=流光飞刀
items.weapon.missiles.streamerknife.desc=刀刃由翡翠雕刻而成的飞刀，锋利无比，轻巧耐用。\n\n在命中地面或生物时，会释放耀眼的光芒致盲周围的一切，同时必定消耗1次耐久。\n\n这件投掷武器无法通过升级提升耐久。
items.weapon.missiles.streamerknife.ondeath=你被自己的流光飞刀致盲致死了...
items.weapon.missiles.redblock.name=土木人之怒
items.weapon.missiles.redblock.desc=是建造这里时留下的吗？土木工程圣锤！\n\n轻轻敲醒沉睡的心灵，被敲中的敌人会被眩晕一段时间，而且不会留在敌人身上。\n\n这个投掷武器的攻速比较缓慢。
items.quest.dragonwater.name=龙之泪
items.quest.dragonwater.desc=熔岩火龙死亡前滴落的一滴水珠，来自上古龙族的力量可以让水袋直接填满，也可以直接饮用，用于紧急治疗。\n\n龙之泪异常脆弱，因此不可能放在背包中，你要么直接饮用，要么装入水袋中。
items.quest.soulcrack.name=灵魂碎片
items.quest.soulcrack.desc=地牢之上，血月悄然升起。一些敌人开始出现了诡异的突变，击杀它们可以获得灵魂碎片。\n\n收集五大灵魂碎片，将会与神秘的区域共鸣，进入血月映射下出现的古堡……
items.quest.soulcrack$redsoulcrack.name=灵魂碎片-傲慢
items.quest.soulcrack$redsoulcrack.desc=地牢之上，血月悄然升起。一些敌人开始出现了诡异的突变，击杀它们可以获得灵魂碎片。\n\n收集五大灵魂碎片，将会与神秘的区域共鸣，进入血月映射下出现的古堡……\n\n<#F00>卓越的欲望，过分自信导致的自我迷恋，觉得自己处处都高人一等为傲慢。<RGB>
items.quest.soulcrack$yellowsoulcrack.name=灵魂碎片-懒惰
items.quest.soulcrack$yellowsoulcrack.desc=地牢之上，血月悄然升起。一些敌人开始出现了诡异的突变，击杀它们可以获得灵魂碎片。\n\n收集五大灵魂碎片，将会与神秘的区域共鸣，进入血月映射下出现的古堡……\n\n<#FFFF00>贪安逸，图省事，逃避应干的事。<RGB>
items.quest.soulcrack$bluesoulcrack.name=灵魂碎片-贪婪
items.quest.soulcrack$bluesoulcrack.desc=地牢之上，血月悄然升起。一些敌人开始出现了诡异的突变，击杀它们可以获得灵魂碎片。\n\n收集五大灵魂碎片，将会与神秘的区域共鸣，进入血月映射下出现的古堡……\n\n<#0FF>失控的欲望，贪财是万恶之源，这世上几乎所有的关于钱的犯罪，都源于贪婪。<RGB>
items.quest.soulcrack$greensoulcrack.name=灵魂碎片-愤怒
items.quest.soulcrack$greensoulcrack.desc=地牢之上，血月悄然升起。一些敌人开始出现了诡异的突变，击杀它们可以获得灵魂碎片。\n\n收集五大灵魂碎片，将会与神秘的区域共鸣，进入血月映射下出现的古堡……\n\n<#0F0>复仇的欲望，源于心底的暴躁、憎恨、愤怒，导致情绪失控而产生强烈的复仇欲望的暴怒。<RGB>
items.quest.soulcrack$pinksoulcrack.name=灵魂碎片-色欲
items.quest.soulcrack$pinksoulcrack.desc=地牢之上，血月悄然升起。一些敌人开始出现了诡异的突变，击杀它们可以获得灵魂碎片。\n\n收集五大灵魂碎片，将会与神秘的区域共鸣，进入血月映射下出现的古堡……\n\n<#FF1493>肉体的欲望，一般指过度贪求性爱的快乐。尤其是生活一安逸，就会饱暖生淫欲。<RGB>
items.quest.hollow.starcrystal.name=星空水晶
items.quest.hollow.starcrystal.desc=跨越时空的鸿沟，再现那次星海决战。\n\n选择猩红剧院时间线后，携带此物品到31层，即可立即回忆那场决战景象……
items.food.fantong.rattail.name=耗子尾脂
items.food.fantong.rattail.desc=啮齿小鼠身上净是难以下咽的臭肉，就像被下水道的味道腌透了，但是这条尾巴看上去有点油水。
items.food.fantong.bonesoup.name=大骨浓汤
items.food.fantong.bonesoup.desc=骨与肉的杰作。小火慢炖，一点点喂出大骨中的营养与魔力，和汤中肉的香甜交融在一起，就仿佛它们生前那般相辅相成、不分彼此。\n\n鲜！香！甜！浓郁的高汤可以强健你的骨肉。
items.food.fantong.bonesoup.effect=热汤下肚，你感到身体倍棒！
items.food.fantong.zakosoup.name=杂鱼汤
items.food.fantong.zakosoup.desc=来自东方的美食，鱼肉完全融在了汤里，仅仅加入一点油和适量的盐，再点缀一些芜荽。最大程度保留了鱼的鲜美！\n\n在这地牢里，喝一口热气腾腾的鲜美鱼汤真的是再好不过了，还能为你恢复一些体力。
items.food.fantong.zakosoup.effect=你感到身体像泡在温泉里一样舒服。
items.food.qiecake.name=茄子炸饼
items.food.qiecake.desc=中元节来临之际，茄子炸饼是必不可少的传统美食。食用后可获得毒性抵抗效果，并提升自身的防御力。
items.food.ricecake.name=米糕
items.food.ricecake.desc=中元节时分，米糕作为节令传统食品深受喜爱。食用后能够获得一道秘法护盾的保护。
items.weapon.melee.spdtomlpd.ritualsword.name=仪式短剑
items.weapon.melee.spdtomlpd.ritualsword.desc=这把武器_不会受到诅咒_，并且使仪式更加高效。使用这把武器杀敌，_只需一个祭品便可完成献祭仪式_。\n\n曾被主教用于主持多场宗教仪式。
items.weapon.melee.spdtomlpd.ritualsword.sacrifice=当你使用 仪式短剑 对敌人进行致命一击时，神秘的力量流入了祭坛中……
items.weapon.melee.spdtomlpd.ritualsword.typical_ability_desc=艾诺琳娜可以用仪式短剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在_5回合_内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.spdtomlpd.ritualsword.ability_name=顺劈
items.weapon.melee.spdtomlpd.ritualsword.ability_desc=艾诺琳娜可以用仪式短剑_顺劈_敌人。造成_ +30% 伤害_并且必定命中。如果顺劈击杀了一名敌人，艾诺琳娜可在_ 5 回合_内额外使用一次无消耗顺劈。
items.weapon.melee.spdtomlpd.treelist.name=树痕
items.weapon.melee.spdtomlpd.treelist.desc=这把武器会吸收自然损失的 生命护盾 值（仅能吸收生命护盾，其他类型的护盾如奥术护盾等都无法吸收），累积上限为_%s_，使用这把武器攻击也会积攒_%s点护盾_。可以_花费1回合_将这些护盾释放出来。\n\n一株长期被魔力滋养着的植物，会主动去吸收那些将要逸散的奥术能量以生长。
items.weapon.melee.spdtomlpd.treelist$treebarrier.name=树之壁垒
items.weapon.melee.spdtomlpd.treelist$treebarrier.desc=当前护盾值：%d\n最大护盾值：%d\n\n原本将要流失的生命护盾已被吸收，可随时用于产生一层额外的屏障。当护盾值达到上限时，多余的护盾将被丢弃。
items.weapon.melee.spdtomlpd.treelist$treebarrst.name=生命护盾
items.weapon.melee.spdtomlpd.treelist$treebarrst.desc=植物的能量庇佑着你！\n树痕积攒的生命能量已经被完全释放，用以为你提供庇护。未被利用的能量会随着时间被树痕所回收。\n\n生命能量剩余：%s。
items.weapon.melee.spdtomlpd.treelist.ac_barrier=释放护盾
items.weapon.melee.spdtomlpd.treelist.typical_stats_desc=这件武器通常能格挡0~%d点伤害。格挡量会随着武器的升级而提升。
items.weapon.melee.spdtomlpd.treelist.stats_desc=这件武器能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.spdtomlpd.treelist.ability_name=防御架势
items.weapon.melee.spdtomlpd.treelist.ability_desc=艾诺琳娜可通过树痕进入_防御架势_。进入这一架势不消耗时间且将在 5 回合内使她的闪避能力翻三倍，但会消耗 2 点充能。
items.weapon.melee.spdtomlpd.treelist.typical_ability_desc=艾诺琳娜可通过树痕进入_防御架势_。进入这一架势不消耗时间，且一般将在_%d回合_内使她的闪避变为3倍。
items.weapon.melee.spdtomlpd.treelist$defensivestance.name=防御架势
items.weapon.melee.spdtomlpd.treelist$defensivestance.desc=艾诺琳娜正在使用她的树痕偏斜来袭的攻击和投射物。只要她还处于这个架势下，她对一切攻击的闪避能力都会变为 3 倍。\n\n剩余回合数：%s
items.weapon.melee.spdtomlpd.tragiccode.name=悲情法典
items.weapon.melee.spdtomlpd.tragiccode.desc=这本书上记载着一些称得上悲惨的内容，包括无饭可吃而被迫食用简单处理的怪物肉、被逐渐石化致死，甚至包括变形为非知性体，金属制品的过程。
items.weapon.melee.spdtomlpd.tragiccode.identify=在你击杀敌人时，法典随机鉴定了你背包中的 %s 物品。
items.weapon.melee.spdtomlpd.tragiccode.typical_stats_desc=通常这件武器击杀敌人后，有_%s%%的概率_鉴定背包内的一件随机物品。
items.weapon.melee.spdtomlpd.tragiccode.stats_desc=这件武器击杀敌人后，有_%s%%的概率_鉴定背包内的一件随机物品。
items.weapon.melee.spdtomlpd.tragiccode.ability_name=顺劈
items.weapon.melee.spdtomlpd.tragiccode.ability_desc=艾诺琳娜可以用悲情法典_顺劈_敌人。造成 +27% 伤害并且必定命中。如果顺劈击杀了一名敌人，艾诺琳娜可在 5 回合内额外使用一次无消耗顺劈。
items.weapon.melee.spdtomlpd.tragiccode$cleavetracker.name=顺劈
items.weapon.melee.spdtomlpd.tragiccode$cleavetracker.desc=艾诺琳娜已经准备好进行连续的顺劈。这一次顺劈将不会消耗武器充能。\n\n剩余回合数：%s。
items.weapon.melee.spdtomlpd.tragiccode.typical_ability_desc=艾诺琳娜可以用悲情法典_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.spdtomlpd.reedpipe.name=牧笛
items.weapon.melee.spdtomlpd.reedpipe.desc=城郊牧笛声落在那座野村，缘分落地生根是我们。
items.weapon.melee.spdtomlpd.reedpipe.stats_desc=这件武器有着超乎寻常的攻击距离，但是目标距离你每有_1距离_，对其造成的<#f00>攻击伤害减少10%<RGB>，这把武器_只能造成法术伤害_。
items.weapon.melee.spdtomlpd.reedpipe.ability_name=重击
items.weapon.melee.spdtomlpd.reedpipe.ability_desc=艾诺琳娜可以用牧笛使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.spdtomlpd.reedpipe.typical_ability_desc=艾诺琳娜可以用牧笛使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.spdtomlpd.break.name=破军
items.weapon.melee.spdtomlpd.break.desc=孩子们，等我……
items.weapon.melee.spdtomlpd.break.typical_stats_desc=通常装备这件武器时，你对生命值低于_50%%的敌人_造成的所有伤害+30%%，如果你直接使用破军进行攻击，_增伤效果将被提升至+100%%_。
items.weapon.melee.spdtomlpd.break.stats_desc=装备这件武器时，你对_生命值低于50%%的敌人_造成的所有伤害_+%s%%_，如果你直接使用破军进行攻击，增伤效果将_提升至%s%%_。
items.weapon.melee.spdtomlpd.break.ability_name=最终护卫
items.weapon.melee.spdtomlpd.break.ability_desc=艾诺琳娜可以用破军_最终护卫_自己，在 10 回合内完全抵挡下一次针对自己的物理或魔法攻击。
items.scrolls.exotic.scrollofblessgotend.name=赐福卷轴
items.scrolls.exotic.scrollofblessgotend.desc=阅读这张卷轴可以短暂为你的武器或者护甲赐福。你所装备的武器或护甲获得+1的额外等级，直到你击败此区域的核心Boss。
items.scrolls.exotic.scrollofblessgotend.weapon=祝福武器
items.scrolls.exotic.scrollofblessgotend.armor=祝福护甲
items.oldsunshadow.name=往日投影
items.oldsunshadow.desc=这块水晶数不清有多少个面，似乎每个面都在投射出不同的影像，有些是你经历过的，有些是你未曾经历过的……视之令人目眩。神秘的能量也在这块水晶中涌动，让它有点微微烫手……\n\n若有勇气直视它，水晶的庞大力量会转嫁到你体内，供你选择那种职业专精。\n\n往日种种，你当真不记得了？
items.oldsunshadow.ac_wear=直视
items.oldsunshadow.not_apply=往日投影拒绝了你的接触，并直接消失了……
items.oldsunshadow.used=你直视了水晶，然后神秘的力量与你融为一体了……
items.quest.bloodredflower.name=血百合
items.quest.bloodredflower.desc=这朵刺伤你的花将你的生命精华几乎全部吸走，现在正妖冶的绽放着。似乎它已经认你为主了，说不准可以调用它的力量。\n\n血祭：会固定消耗玩家当前生命值的一半，为花朵充能相同数量，充能上限时不可进行。\n提取：会立刻使用花朵的全部充能为玩家恢复等量于消耗掉的充能的生命值。\n\n<#94527E>血百合当前充能：%s/%s 瓣<RGB>
items.quest.bloodredflower.ac_active=提取
items.quest.bloodredflower.ac_blood=血祭
items.quest.bloodredflower.heal=血百合中的生命精华流入你的身体，你感到神清气爽。
items.quest.bloodredflower.blood=你割破了自己的手指，鲜血流入了血百合之中。
items.quest.bloodredflower.blood_no=血百合里面的生命精华已经十分充溢了，你现在无法血祭。
items.quest.bloodredflower.blood_not=你实在是太虚弱了，血百合拒绝了你本次的血祭。
items.weapon.melee.imperialexorcism.name=御前除魔
items.weapon.melee.imperialexorcism.desc=霜落女帝御赐的魔剑，封印着冰澪恶魔的部分力量。\n\n这把武器在攻击时如果目标处于冻伤或冻结状态，获得_1~3额外伤害_修正。
items.books.questbookslist.tombreachbook.name=古墓先导勘察手记
items.books.questbookslist.tombreachbook.desc=致古墓探索测试员：\n阅览本手记即可解锁古墓测试区域，抵达11层后，场景将切换为古墓秘境。\n\n本道具仅限内部测试使用，正式版前会更换全新开启方式，上线前将完成全流程核验测试。
items.books.questbookslist.tombreachbook.ac_read=测试启动
items.books.questbookslist.tombreachbook.author=MLPD-多维中测组
items.books.questbookslist.tombreachbook.action=古墓秘境环境已激活！前往11层或重置楼层即可加载对应场景。
items.food.tomb.gravemeat.name=腐肉
items.food.tomb.gravemeat.desc=一块腐烂程度还没很高的肉，应该可以通过炼金变成正常的肉，勉强能直接吃，后果自负。
items.food.tomb.gravemeat.eat_msg=腐肉的恶臭在你嘴里久久不散，一股寒气直灌腹腔……
items.food.tomb.gravemeat.poison=腐肉内的剧毒顺着喉咙侵入四肢百骸，你中毒了！
items.food.tomb.gravemeat.vertigo=腐烂浊气冲上头顶，眼前天旋地转，陷入眩晕！
items.food.tomb.gravemeat.corrosion=腐肉渗出的腐蚀黏液粘在皮肤上，持续侵蚀你的躯体！
items.food.tomb.gravemeat.weakness=腐朽气息掏空你的力气，全身陷入长久虚弱！
items.food.tomb.gravemeat.downlevel=体内生机被腐气压制，身上装备的效能暂时下降！
items.food.tomb.frozengravemeat.name=冰冻腐肉片
items.food.tomb.frozengravemeat.desc=一块被冻起来的腐肉，虽然不知道为什么有人想通过把它冻起来减轻毒性，不过确实做到了一部分，而且除去腐烂部位其实还挺好吃。
items.food.tomb.frozengravemeat.eat_msg=满口冰寒掩不住残留腐臭，刺骨冷气顺着食道蔓延全身。
items.food.tomb.frozengravemeat.poison=冰冷腐肉毒素侵蚀你的身体！
items.food.tomb.frozengravemeat.vertigo=头脑一阵天旋地转！
items.food.tomb.frozengravemeat.corrosion=腐蚀黏液附着在皮肤上！
items.food.tomb.frozengravemeat.heal=冻肉蕴含微弱生命能量，伤口愈合！
items.food.tomb.frozengravemeat.invisible=寒气包裹身形，你进入隐身状态！
items.food.tomb.frozengravemeat.barskin=厚硬树皮覆盖全身，获得树皮护甲！
items.food.tomb.cookgravemeat.name=烧烤腐肉
items.food.tomb.cookgravemeat.desc=大火烧烤后的腐肉，看起来变成了类似皮革的东西，熟了，毒性有所减弱，勉强能正常吃。
items.food.tomb.cookgravemeat.eat_msg=焦糊烟熏气遮不住底层腐腥，干硬粗糙的烤肉顺着喉咙滑下肚。
items.food.tomb.cookgravemeat.poison=烤肉残留的腐毒侵入四肢百骸，毒素缓缓侵蚀躯体！
items.food.tomb.cookgravemeat.vertigo=混杂腐臭的烟气直冲头顶，脑袋眩晕发沉！

