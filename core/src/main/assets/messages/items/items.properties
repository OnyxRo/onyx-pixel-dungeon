items.weapon.melee.gun.gl.rbaspringpunch.desc=A multi-shot grenade launcher that Shigure always carries on hand.\n\nAnyone struck directly by its grenades is left completely dazed and unable to keep their senses, true to its name.
items.weapon.melee.gun.gl.rbaspringpunch.stats_desc=This firearm deals no self-damage and knocks back targets around the impact point.\nThis firearm deals increased damage to stunned enemies.
