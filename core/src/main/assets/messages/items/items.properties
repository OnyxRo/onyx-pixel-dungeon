items.weapon.melee.relicmeleeweapons.relicmeleeweapon.charged=Your %s is fully charged!
items.weapon.melee.relicmeleeweapons.maracarsblades.name=maracar's blades
items.weapon.melee.relicmeleeweapons.maracarsblades.desc=Forged in the depths of hell, these flaming blades are not to be messed with.
