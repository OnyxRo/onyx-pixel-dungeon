items.weapon.melee.gun.smg.rbabeyondthelumination.name=Beyond the Lumination
items.weapon.melee.gun.smg.rbabeyondthelumination.desc=Natsu's submachine gun.\n\nIt is the weapon of last resort pulled out by Natsu, who prefers contemplative musings.
items.weapon.melee.gun.smg.rbabeyondthelumination.stats_desc=This firearm blocks _0-%1$d_ damage.\nThis firearm has relatively low accuracy.\nThis firearm has higher accuracy at close range.\nRestores 1 HP for every _%2$d_ damage blocked with this firearm.
items.weapon.melee.gun.smg.rbabeyondthelumination.typical_stats_desc=This firearm typically blocks _0-%1$d_ damage.\nThis firearm has relatively low accuracy.\nThis firearm has higher accuracy at close range.\nRestores 1 HP for every _%2$d_ damage blocked with this firearm.
items.weapon.melee.gun.smg.rbabeyondthelumination.discover_hint=This firearm can be obtained through alchemy using an _SMG_.
items.weapon.melee.gun.sr.rbasr_t1.name=Tier-1 SR
items.weapon.melee.gun.sr.rbasr_t1.desc=A Tier-1 SR. It possesses only basic performance.
items.weapon.melee.gun.sr.rbasr_t2.name=Tier-2 SR
items.weapon.melee.gun.sr.rbasr_t2.desc=A Tier-2 SR. Weak, but has decent performance.
items.weapon.melee.gun.sr.rbasr_t3.name=Tier-3 SR
items.weapon.melee.gun.sr.rbasr_t3.desc=A Tier-3 SR. Has reliable performance.
items.weapon.melee.gun.sr.rbasr_t4.name=Tier-4 SR
items.weapon.melee.gun.sr.rbasr_t4.desc=A Tier-4 SR. Has high performance.
items.weapon.melee.gun.sr.rbasr_t5.name=Tier-5 SR
items.weapon.melee.gun.sr.rbasr_t5.desc=A Tier-5 SR. Has incredible performance.
items.weapon.melee.gun.sr.rbasr_sp.name=Anti-Tank SR
items.weapon.melee.gun.sr.rbasr_sp.desc=A Tier-6 SR with devastating performance. It is far too heavy to be thrown.
items.weapon.melee.gun.sr.rbasr_sp.stats_desc=This firearm can pierce through 1-tile thick walls, destroying breached walls.\nIf the bullet does not destroy a wall, it knocks back hit enemies.\nUnequipping this firearm or attempting to reload ends its use and equips your original weapon.
items.weapon.melee.gun.sr.rbasr_sp.discover_hint=This firearm can be obtained through a _specific student's ability_.
items.weapon.melee.gun.sr.rbajusticeincarnate.name=Justice Incarnate
items.weapon.melee.gun.sr.rbajusticeincarnate.desc=A sniper rifle Mashiro uses during her Justice Task Force activities.\n\nWhile somewhat cumbersome to carry around, size poses no obstacle in the face of Mashiro's devotion to justice.
items.weapon.melee.gun.sr.rbajusticeincarnate.stats_desc=This firearm deals relatively low damage.\nOn hit, this firearm has a chance to inflict the same damage a second time.
items.weapon.melee.gun.sr.rbajusticeincarnate.discover_hint=This firearm can be obtained through alchemy using an _SR_.
items.weapon.melee.gun.sr.rbawineredadmire.name=Wine Red Admiration
items.weapon.melee.gun.sr.rbawineredadmire.desc=A semi-automatic sniper rifle with an antique design that Aru cherishes dearly.\n\nJust holding it gives off a genuinely hard-boiled vibe.
items.weapon.melee.gun.sr.rbawineredadmire.stats_desc=This firearm deals relatively low damage.\nWhen the bullet lands, it has a chance to trigger an explosion in the surrounding area.
items.weapon.melee.gun.sr.rbawineredadmire.discover_hint=This firearm can be obtained through alchemy using an _SR_.
items.weapon.melee.gun.mt.rbafancylight.name=Fancy Light
items.weapon.melee.gun.mt.rbafancylight.desc=A mortar favored by Hibiki.\n\nOccasionally used in experiments as well, it often launches all kinds of things besides mortar shells.
items.weapon.melee.gun.mt.rbafancylight.stats_desc=This firearm can be used without equipping it.\nThis firearm has a slower fire rate if not equipped.\nBullets from this firearm pierce through walls.\nThis firearm has great difficulty hitting enemies within line of sight.\nLoading a bomb allows you to reload more rounds, firing the loaded bomb until the next reload.
items.weapon.melee.gun.mt.rbafancylight.discover_hint=This firearm can be obtained through alchemy using a _GL_.
items.weapon.melee.gun.mt.rbafancylight.bomb=Currently loaded with _%s_; upon impact, it deals bullet damage and detonates on the spot.
items.weapon.melee.gun.mt.rbafancylight.ac_bomb=Load Bomb
items.weapon.melee.gun.mt.rbafancylight.inv_prompt=Select a bomb to load
items.active.rbagrenade.ac_lightthrow=Throw Grenade!
items.active.rbaclaymore.name=Compact Claymore
items.active.rbaclaymore.desc=A compact claymore carried by Miyako. When detonated, it deals heavy damage over a wide area and slows the movement speed of affected targets.\n\nDamage and debuff chances increase as you level up.
items.active.rbaclaymore.throw_desc=Damage: _%1$d-%2$d_\nRemaining detonations: _%3$d/%4$d_\nRecovery chance on kill: _%5$s%%_
items.active.rbaclaymore.ac_lightthrow=Detonate
items.active.rbaclaymore.no_left=No claymores remaining.
items.active.rbahandgrenade.name=Hand Grenade
items.active.rbahandgrenade.desc=A hand grenade brought by Miyako. Throwing it deals immediate explosion damage around the impact point. Be careful, as you can also get caught in the blast.\n\nMaximum capacity increases as you level up.
items.active.rbahandgrenade.throw_desc=Damage: _%1$d-%2$d_\nRemaining throws: _%3$d/%4$d_\nRecovery chance on kill: _%5$s%%_
items.active.rbahandgrenade.ac_lightthrow=Throw Grenade!
items.active.rbahandgrenade.no_left=No grenades remaining.
items.active.rbaironhorus.name=Riot Shield "Iron Horus"
items.active.rbaironhorus.desc=A foldable riot shield carried by Hoshino. Deploying it in combat grants _%1$d-%2$d_ bonus defense until you move.\n\nEquipping an HG as your primary weapon lets you move while wielding a lightweight shield with half the defensive power.\n\nGranted defense increases as you level up.
items.active.rbaironhorus.ac_use=Use
items.active.rbabicycle.name=Bicycle
items.active.rbabicycle.desc=A blue bicycle that Shiroko rides. Moving around while off the bike charges it up to ride longer next time, and riding lets you move swiftly. Keep in mind, however, that aiming attacks becomes much harder while riding.
items.active.rbabicycle.ac_use=Use
items.scrolls.rbaemptyscroll.name=Blank Scroll
items.scrolls.rbaemptyscroll.desc=A sheet of parchment with nothing written on it. By copying the contents of a scroll in your possession, it will gain the exact same power as that scroll.\n\nThis paper does not appear capable of replicating the immense power of Scrolls of Upgrade or Magical Infusion.
items.scrolls.rbaemptyscroll.inv_title=Select a scroll to copy
items.active.rbatrashbin.name=Distraction Device
items.active.rbatrashbin.desc=A trash bin that blends in so perfectly with its surroundings that no one realizes anyone is inside once entered.\n\nUpon use, breaks the pursuit of all enemies tracking Miyu, causing them to move elsewhere.\n\nIf Miyu remains within an enemy's line of sight, she can be spotted again by enemies who lost track of her.\n\nIncurs a 20-turn cooldown after use.
items.active.rbatrashbin.ac_use=Use
items.food.rbahardtack.name=Hardtack
items.food.rbahardtack.desc=Dry, crumbly hardtack made of flour. Hardtack can be eaten quickly, allowing you to reorganize your gear to instantly reload your equipped firearm and chamber 4 additional rounds while eating. On-reload effects do not trigger.
items.active.rbalaptop.name=Yuzu's Laptop
items.active.rbalaptop.desc=A laptop carried around by Yuzu. Various goods can be purchased by spending credits.
items.active.rbalaptop.ac_use=Use
items.active.console.rbacontinueconsole.name=Continue Console
items.active.console.rbacontinueconsole.desc=Upon use, opens the control interface of an active console and disappears.
items.active.console.rbacontinueconsole.ac_use=Use
items.active.console.rbafighterconsole.name=Fighter Console
items.active.console.rbafighterconsole.desc=Upon use, grants 10 Fighter Console Tokens and opens the Fighter Console control interface.
items.active.console.rbafighterconsole.ac_use=Use
items.active.console.rbafantasyconsole.name=Fantasy Console
items.active.console.rbafantasyconsole.desc=Upon use, grants 10 Fantasy Console Tokens and opens the Fantasy Console control interface.
items.active.console.rbafantasyconsole.ac_use=Use
items.active.console.rbasandboxconsole.name=Sandbox Console
items.active.console.rbasandboxconsole.desc=Upon use, grants 10 Sandbox Console Tokens and opens the Sandbox Console control interface.
items.active.console.rbasandboxconsole.ac_use=Use
items.weapon.melee.quick.rbaquickweapon.ac_attack=Attack
items.weapon.melee.quick.rbaquickweapon.cannot_reach=Cannot reach that target with your attack.
items.weapon.melee.quick.rbaquickweapon.no_enemy=No target to attack.
items.weapon.melee.quick.rbaquickweapon.prompt=Select a target to attack
items.weapon.melee.quick.rbaassassinskunai.name=Assassin's Kunai
items.weapon.melee.quick.rbaassassinskunai.desc=Izuna's kunai, capable of dealing heavy damage proportional to the enemy's max health when sneaking up to strike a vital point. It can attack enemies without being equipped. _Defeating an enemy with a sneak attack using the Assassin's Kunai restores a portion of the Ninja Cape's charge._\n\nPowerful enemies will resist bonus damage from sneak attacks.
items.artifacts.rbaninjacape.name=Ninja Cape
items.artifacts.rbaninjacape.ac_stealth=Stealth
items.artifacts.rbaninjacape.cooldown=The Ninja Cape requires %d more turns to recharge.
items.artifacts.rbaninjacape.cursed=Cannot use a cursed cape.
items.artifacts.rbaninjacape.no_charge=The Ninja Cape has not charged enough to be used.
items.artifacts.rbaninjacape.desc=A cape used by Izuna to completely disguise herself while carrying out ninja missions. Izuna can blink a short distance before cloaking; using it on her own tile cloaks her without blinking.\n\nThe Ninja Cape recharges slowly, but defeating enemies with the _Assassin's Kunai_ rapidly recovers its charge.\n\nThe cape upgrades as charge is consumed, increasing its maximum capacity and recharge rate as it levels up.
items.artifacts.rbaninjacape.prompt=Select a location to blink to
items.artifacts.rbaninjacape.discover_hint=A specific student starts with this item.
items.artifacts.rbascrunchie.name=Scrunchie
items.artifacts.rbascrunchie.desc=A precious scrunchie Nagisa gave to Mika as a gift. Looking at this scrunchie stirs an inexplicable surge of power within, allowing you to demolish walls or deliver mighty blows to knock enemies back.
items.artifacts.rbascrunchie.ac_use=Use
items.artifacts.rbascrunchie.cursed=Cannot use a cursed scrunchie.
items.artifacts.rbascrunchie.no_charge=The scrunchie has run out of energy.
items.artifacts.rbascrunchie.invalid_target=Cannot select that target.
items.artifacts.rbascrunchie.not_adjacent=Can only select adjacent tiles.
items.artifacts.rbascrunchie.cannot_break=This wall doesn't seem breakable.
items.artifacts.rbascrunchie.prompt=Select a location to use
items.artifacts.rbascrunchie.levelup=The scrunchie has grown stronger!
items.food.rbarollcake.name=Roll Cake
items.food.rbarollcake.desc=An exceptionally soft and sweet chocolate roll cake Mika brought for dessert. Can be eaten quickly to restore a bit of satiety and health. Be careful not to throw it, as it will no longer be edible.
items.artifacts.rbacrossnecklace.name=십자가 목걸이
items.artifacts.rbacrossnecklace.ac_cast=시전
items.artifacts.rbacrossnecklace.no_spell=지금은 기적을 시전할 수 없다.
items.artifacts.rbacrossnecklace.cursed=당신은 저주받은 십자가 목걸이를 사용할 수 없다.
items.artifacts.rbacrossnecklace.levelup=당신의 십자가 목걸이가 더욱 강해졌다!
items.artifacts.rbacrossnecklace.desc=마리는 십자가 목걸이를 매개로 기적을 시전할 수 있습니다. 십자가 목걸이를 사용하면 여러 가지 기적을 시전할 수 있습니다.\n\n마리가 십자가 목걸이를 사용할수록 더욱 강력해집니다. 최대 충전 수가 증가하며 충전 속도가 더 빨라집니다.
items.artifacts.rbacrossnecklace.discover_hint=특정 학생이 이 아이템을 가지고 시작합니다.
