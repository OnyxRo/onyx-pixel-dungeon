items.weapon.melee.tier6.greatgreatgreatsword.name=great great greatsword
items.weapon.melee.tier6.greatgreatgreatsword.ability_name=cleave
items.weapon.melee.tier6.greatgreatgreatsword.typical_ability_desc=The Duelist can _cleave_ an enemy with the great great greatsword. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.tier6.greatgreatgreatsword.ability_desc=The Duelist can _cleave_ an enemy with the great great greatsword. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.tier6.greatgreatgreatsword.desc=An immense blade forged from three greatswords, carrying unstoppable weight through every swing.
items.weapon.melee.tier6.greatgreatgreatsword.stats_desc=This weapon has tremendous reach.
items.weapon.melee.tier6.sakurablossomblade.name=spirit blade: sakura blossom
items.weapon.melee.tier6.sakurablossomblade.evolved_name=demon blade: blood sakura
items.weapon.melee.tier6.sakurablossomblade.ac_evolve=evolve
items.weapon.melee.tier6.sakurablossomblade.ability_name=shadow shift
items.weapon.melee.tier6.sakurablossomblade.typical_ability_desc=While wielding the spirit blade, the Duelist can _shadow shift_ up to 2 tiles away, leave a powerful mirror image behind, and typically gain _%d turns of invisibility_.
items.weapon.melee.tier6.sakurablossomblade.ability_desc=While wielding the spirit blade, the Duelist can _shadow shift_ up to 2 tiles away, leave a powerful mirror image behind, and gain _%d turns of invisibility_.
items.weapon.melee.tier6.sakurablossomblade.evolved_typical_ability_desc=While wielding the demon blade, the Duelist can _shadow shift_ up to 2 tiles away, leave a powerful mirror image behind, and typically gain _%d turns of invisibility_.
items.weapon.melee.tier6.sakurablossomblade.evolved_ability_desc=While wielding the demon blade, the Duelist can _shadow shift_ up to 2 tiles away, leave a powerful mirror image behind, and gain _%d turns of invisibility_.
items.weapon.melee.tier6.sakurablossomblade.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.tier6.sakurablossomblade.desc=A spirit blade once enshrined at Yae Shrine, with a pale sakura gleam flowing along its silver edge.
items.weapon.melee.tier6.sakurablossomblade.evolved_desc=A spirit blade stained by blood and corruption, its crimson edge brimming with ominous power.
items.weapon.melee.tier6.sakurablossomblade.stats_desc=This weapon is more effective against enemies unaware of you. Every fifth direct hit knocks its target back and makes it vulnerable for 5 turns. It can evolve after enough kills; _%d_ more are needed.
items.weapon.melee.tier6.sakurablossomblade.stats_desc_ready=This weapon is more effective against enemies unaware of you. Every fifth direct hit knocks its target back and makes it vulnerable for 5 turns. It has met the requirements to evolve.
items.weapon.melee.tier6.sakurablossomblade.evolved_stats_desc=This weapon is more effective against enemies unaware of you. On a direct hit, it steals life from its target and heals its wielder.
items.weapon.melee.tier6.sakurablossomblade.ready=The spirit blade has defeated enough enemies. Its evolution is now ready.
items.weapon.melee.tier6.sakurablossomblade.evolved=The sakura-colored light is stained crimson. The spirit blade has evolved into Demon Blade: Blood Sakura!
items.weapon.melee.tier6.twohandedgreatsword.name=two-handed greatsword
items.weapon.melee.tier6.twohandedgreatsword.ability_name=train slash
items.weapon.melee.tier6.twohandedgreatsword.typical_ability_desc=The Duelist uses _train slash_ to strike every visible enemy within 2 tiles with a clear trajectory, typically dealing _%1$d-%2$d damage_ and always triggering the weapon's enchantment. Projecting ignores blocked trajectories.
items.weapon.melee.tier6.twohandedgreatsword.ability_desc=The Duelist uses _train slash_ to strike every visible enemy within 2 tiles with a clear trajectory, dealing _%1$d-%2$d damage_ and always triggering the weapon's enchantment. Projecting ignores blocked trajectories.
items.weapon.melee.tier6.twohandedgreatsword.upgrade_ability_stat_name=Ability Damage
items.weapon.melee.tier6.twohandedgreatsword.desc=A massive, unstoppable greatsword whose weight consumes nearly all of its wielder's motion.
items.weapon.melee.tier6.twohandedgreatsword.stats_desc=This is a very fast weapon, but it slows the use of thrown weapons and wands.
items.weapon.melee.tier6.twohandedgreatsword.ability_no_target=There are no valid enemies for train slash.
items.weapon.melee.tier6.palermosword.name=Palermo sword
items.weapon.melee.tier6.palermosword.ability_name=unravel
items.weapon.melee.tier6.palermosword.prompt=Choose a visible enemy within one tile beyond your current attack reach.
items.weapon.melee.tier6.palermosword.ability_no_target=There is no valid enemy for unravel.
items.weapon.melee.tier6.palermosword.ability_target_range=There is no safe attack position to reach.
items.weapon.melee.tier6.palermosword.typical_ability_desc=The Duelist uses _unravel_ to lunge and strike up to 4 times. Each strike typically deals _%1$d-%2$d damage_ and always hits. Between strikes, the Duelist moves to a position from which the target can be attacked; if it dies, unravel seeks another valid enemy for the remaining strikes. It costs 2 charges, or only 1 while future acceleration is active.
items.weapon.melee.tier6.palermosword.ability_desc=The Duelist uses _unravel_ to lunge and strike up to 4 times. Each strike deals _%1$d-%2$d damage_ and always hits. Between strikes, the Duelist moves to a position from which the target can be attacked; if it dies, unravel seeks another valid enemy for the remaining strikes. It costs 2 charges, or only 1 while future acceleration is active.
items.weapon.melee.tier6.palermosword.desc=An unusual pairing of longsword and chained blade, whose crossing edges accelerate with every collision.
items.weapon.melee.tier6.palermosword.stats_desc=This is a very fast weapon. Repeatedly attacking the same enemy makes it more accurate; changing targets or waiting more than 3 turns resets that bonus. Every fourth hit grants future acceleration and breathing to empower the next attack.
items.weapon.melee.tier6.palermosword.future_name=future acceleration
items.weapon.melee.tier6.palermosword.future_desc=Your next normal attack or unravel will cost no time.
items.weapon.melee.tier6.palermosword.breathing_name=breathing
items.weapon.melee.tier6.palermosword.breathing_desc=The first successful hit of your next normal attack or unravel deals 120%% of Palermo sword's maximum damage.
items.weapon.melee.tier6.demontailwhip.name=demon tail whip
items.weapon.melee.tier6.demontailwhip.ability_name=lash
items.weapon.melee.tier6.demontailwhip.ability_no_target=There are no enemies in range to lash.
items.weapon.melee.tier6.demontailwhip.typical_ability_desc=The Duelist can _lash_ every enemy within this whip's attack range. Each strike is guaranteed to hit and typically deals _%1$d-%2$d damage_.
items.weapon.melee.tier6.demontailwhip.ability_desc=The Duelist can _lash_ every enemy within this whip's attack range. Each strike is guaranteed to hit and deals _%1$d-%2$d damage_.
items.weapon.melee.tier6.demontailwhip.desc=A long whip fashioned from a demon's tail, its tip still twitching with restless malice.
items.weapon.melee.tier6.demontailwhip.stats_desc=This weapon has tremendous reach and may inflict random negative effects; upgrades extend its reach.
items.weapon.melee.tier6.venomoussickle.name=venomous sickle
items.weapon.melee.tier6.venomoussickle.desc=It looks like an ordinary little sickle... doesn't it? The purple substance clinging to its blade gives off a very different feeling.
items.weapon.melee.tier6.venomoussickle.stats_desc=This weapon is not very accurate. After a normal hit on a living target, move next to that same target to make your next attack against it cost no time. Normal hits may also inflict a fierce toxic effect.
items.weapon.melee.tier6.venomoussickle.ability_name=follow-up attack
items.weapon.melee.tier6.venomoussickle.ability_desc=After the free attack triggered by moving next to a struck target, the Duelist can spend _1 charge_ to make the next Venomous Sickle attack cost no time and count as a surprise attack.
items.weapon.melee.tier6.venomoussickle.ability_unavailable=This ability is only available after a movement-triggered free attack.
items.weapon.melee.tier6.auxiliarycore.name=auxiliary core
items.weapon.melee.tier6.auxiliarycore.ac_infuse=Infuse
items.weapon.melee.tier6.auxiliarycore.prompt=Select a tier 1-5 melee or thrown weapon to infuse with magic energy
items.weapon.melee.tier6.auxiliarycore.infused=The auxiliary core dissolves into %s, granting it magic energy.
items.weapon.melee.tier6.auxiliarycore.ability_name=magic-energy boost
items.weapon.melee.tier6.auxiliarycore.typical_ability_desc=The Duelist uses _magic-energy boost_ to make the core more potent. This instant ability typically doubles its bonus magic damage for _%d turns_.
items.weapon.melee.tier6.auxiliarycore.ability_desc=The Duelist uses _magic-energy boost_ to make the core more potent. This instant ability doubles its bonus magic damage for _%d turns_.
items.weapon.melee.tier6.auxiliarycore.desc=A precise arcane mechanism built to regulate and transfer the steady magical power humming within it.
items.weapon.melee.tier6.auxiliarycore.stats_desc=Its attacks deal _%d bonus magic damage_. It can also be consumed to infuse a lower-tier weapon with magic energy.
items.weapon.melee.tier6.auxiliarycore.typical_stats_desc=Usually, its attacks deal _%d bonus magic damage_. It can also be consumed to infuse a lower-tier weapon with magic energy.
items.weapon.melee.tier6.auxiliarycore$magicpowerboost.name=magic-energy boost
items.weapon.melee.tier6.auxiliarycore$magicpowerboost.desc=The auxiliary core's energy output is elevated, doubling its additional magic damage.\n\nTurns remaining: %s.
items.weapon.missiles.gungnir.name=Gungnir
items.weapon.missiles.gungnir.not_enough_health=You need more than 1 health to throw Gungnir.
items.weapon.missiles.gungnir.desc=A divine spear covered in ancient runes, always following the scent of blood back to its wielder.
items.weapon.missiles.gungnir.stats_desc=It always hits, but throwing costs health and inflicts bleeding. Killing an already-bleeding enemy restores health.
items.weapon.missiles.portableblackhole.name=portable wormhole
items.weapon.missiles.portableblackhole.desc=A commuting tool made by the Demon Realm Travel Agency. Popular with plumbing enthusiasts, it is considered forbidden magic because it was never authorized by the Demon God.
items.weapon.melee.walkstick.name=walking stick
items.weapon.melee.walkstick.stats_desc=This weapon has a chance to grant shielding to yourself when attacking.
items.weapon.melee.walkstick.desc=A walking stick made of nanmu wood, set with a diamond to show the user's nobility. It has some self-defense value.
items.weapon.melee.walkstick.ability_name=defensive stance
items.weapon.melee.walkstick.typical_ability_desc=The duelist can enter a _defensive stance_ with a walking stick. Entering this stance takes no time, and will usually triple her evasion for _%d turns_.
items.weapon.melee.walkstick.ability_desc=The duelist can enter a _defensive stance_ with a walking stick. Entering this stance takes no time, and triples her evasion for _%d turns_.
items.weapon.melee.walkstick.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.walkstick$defensivestance.name=defensive stance
items.weapon.melee.walkstick$defensivestance.desc=The duelist is using her weapon to deflect incoming attacks and projectiles. As long as she remains in this stance, her evasion against all attacks is tripled.\n\nTurns remaining: %s
items.weapon.melee.walkstick.discover_hint=A certain hero starts with this item.
items.weapon.curses.heavy.name=heavy %s
items.weapon.curses.heavy.desc=The heavy curse is infused with strength-related magic, causing a weapon bearing this curse to become heavier.
items.weapon.curses.heavy.elestrike_desc=When a weapon has the heavy curse, elemental strike has a 50% chance to weaken each enemy in the area for 6 turns.
items.weapon.enchantments.sweeping.name=sweeping %s
items.weapon.enchantments.sweeping.desc=This powerful enchantment strikes all enemies around the user when one enemy is hit. Sweeping damage is weaker than the direct attack's damage.
items.weapon.enchantments.sweeping.elestrike_desc=When a weapon has sweeping enchantment, elemental strike deals 6-12 damage to all enemies in the area. If the normal attack killed an enemy, elemental strike is released once more at no cost.
items.weapon.enchantments.sweeping.runemark=When the _Runesage_ detonates a mark containing sweeping enchantment, each enemy affected by the blast takes extra physical damage.
items.weapon.melee.spearofconqueror.name=conqueror's spear
items.weapon.melee.spearofconqueror.stats_desc=This is a rather slow weapon.\nThis weapon has extra reach.
items.weapon.melee.spearofconqueror.ability_name=thrustback
items.weapon.melee.spearofconqueror.typical_ability_desc=The duelist uses the spear tip to _thrustback_ an enemy within reach but not adjacent to her, usually dealing _%1$d-%2$d damage_, knocking the enemy back, and always hitting.
items.weapon.melee.spearofconqueror.ability_desc=The duelist uses the spear tip to _thrustback_ an enemy within reach but not adjacent to her, dealing _%1$d-%2$d damage_, knocking the enemy back, and always hitting.
items.weapon.melee.spearofconqueror.desc=A spear that clearly has seen much use, once wielded by a brave warrior who came to the sewers to subjugate monsters. For some reason, it is now in the hands of an adorable slime girl.
items.weapon.melee.spearofconqueror.discover_hint=A certain hero starts with this item.
items.weapon.missiles.luckycoin.name=lucky silver coin
items.weapon.missiles.luckycoin.stats_desc=After hitting a target, this weapon grants the user luck for a time, making their next attack guaranteed to hit.
items.weapon.missiles.luckycoin.desc=This is a rather large silver coin, clearly unsuitable for coin-toss games, but it seems able to bring you good luck.
items.weapon.missiles.luckycoin.discover_hint=A certain hero starts with this item.
items.weapon.missiles.luckycoin$luckystriketracker.name=lucky strike
items.weapon.missiles.luckycoin$luckystriketracker.desc=You feel favored by fortune.\n\nMakes your next attack guaranteed to hit. This effect is lost immediately after attacking.\n\nTurns remaining: %s
items.weapon.missiles.slimeball.name=slime ball
items.weapon.missiles.slimeball.stats_desc=After hitting a target, this weapon interferes with their movement.
items.weapon.missiles.slimeball.desc=A sphere made from slime that constantly sheds from the slime girl. It now feels somewhat hardened to the touch.
items.weapon.missiles.slimeball$slimeooze.name=sticky
items.weapon.missiles.slimeball$slimeooze.desc=How strange, you feel sticky now!\n\nUnits affected by this effect move at half speed.\n\nTurns remaining: %s
items.weapon.missiles.slimeball.discover_hint=A certain hero starts with this item.
items.weapon.melee.wakizashi.name=wakizashi
items.weapon.melee.wakizashi.stats_desc=This is a faster weapon.
items.weapon.melee.wakizashi.ability_name=sword dance
items.weapon.melee.wakizashi.typical_ability_desc=The duelist can enter a _sword dance_ with a wakizashi. Entering this stance takes no time, and usually grants +60%% attack speed and +50%% accuracy for _%d turns_.
items.weapon.melee.wakizashi.ability_desc=The duelist can enter a _sword dance_ with a wakizashi. Entering this stance takes no time, and grants +60%% attack speed and +50%% accuracy for _%d turns_.
items.weapon.melee.wakizashi.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.wakizashi.desc=An eastern short sword carried by those outside the samurai class. Its blade is long and narrow, with a sharp point, making it better suited to quick thrusts than cutting.
items.weapon.melee.wakizashi.discover_hint=A certain hero starts with this item.
items.weapon.tatteki.name=tanegashima
items.weapon.tatteki.ac_shoot=SHOOT
items.weapon.tatteki.ac_load=LOAD BOMB
items.weapon.tatteki.prompt=Choose a target
items.weapon.tatteki.prompt1=Choose a bomb to load
items.weapon.tatteki.stats=This tanegashima cannot be upgraded directly, but as a side weapon it can share the main weapon's level and gradually grow stronger as you level up. Each shot from this tanegashima deals _%1$d-%2$d damage_ and requires _%3$d strength_ to use properly.\n\nThis tanegashima has extremely poor accuracy and cannot be used for ambushes. You must first throw a thrown weapon or tiny shuriken to calculate the trajectory before you can strike the target accurately.
items.weapon.tatteki.desc=A tanegashima made in imitation of the matchlocks used by Nanban merchants, better suited to eastern hands. You have seen it on the battlefield, seen its great power, seen it spread death and fear.
items.weapon.tatteki.bomb=This tanegashima has been loaded with _%1s_, and its next _%2$d_ shots will carry the corresponding effect.
items.weapon.tatteki.unload=The tanegashima is still loading and cannot fire.
items.weapon.tatteki$loadcooldown.name=tanegashima loading
items.weapon.tatteki$loadcooldown.desc=The firearm ninja is loading the tanegashima during action. It is not fast, but it does not interfere with normal actions.\n\nLoading time remaining: %s turns
items.weapon.tatteki$fix.name=trajectory correction
items.weapon.tatteki$fix.desc=Before firing the tanegashima, the firearm ninja threw a thrown weapon at the target to calculate the trajectory, and can now strike accurately.
items.weapon.tatteki.need_equip=The tanegashima must be equipped before it can be used.
items.weapon.tatteki.discover_hint=A certain hero obtains this item after subclassing.
items.weapon.melee.bracer.name=bracer shield
items.weapon.melee.bracer.typical_stats_desc=This weapon can usually block 0-%d damage. Upgrading it increases the amount blocked.
items.weapon.melee.bracer.stats_desc=This weapon can block 0-%d damage. Upgrading it increases the amount blocked.
items.weapon.melee.bracer.ability_name=guard
items.weapon.melee.bracer.typical_ability_desc=The duelist can _guard_ herself with a bracer shield, usually fully blocking physical or magical attacks against her for _%d turns_. Once the duelist has blocked an attack, attacking back or casting a spell will end guard.
items.weapon.melee.bracer.ability_desc=The duelist can _guard_ herself with a bracer shield, fully blocking physical or magical attacks against her for _%d turns_. Once the duelist has blocked an attack, attacking back or casting a spell will end guard.
items.weapon.melee.bracer.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.bracer.desc=A light shield covering the forearm from wrist to elbow, providing some defensive value.
items.weapon.melee.bracer.discover_hint=A certain hero starts with this item.
items.weapon.enchantments.corrosionenchanted.name=corrosive %s
items.weapon.enchantments.corrosionenchanted.desc=This enchantment makes the weapon inject corrosive magic into enemies when attacking. This vicious magic continuously eats away at an enemy's body and is extremely deadly.
items.weapon.enchantments.corrosionenchanted.elestrike_desc=When a weapon has corrosive enchantment, elemental strike inflicts 6 turns of corrosion with 2 starting damage on all enemies in the area.
items.weapon.enchantments.corrosionenchanted.runemark=When the _Runesage_ detonates a mark containing corrosive enchantment, each enemy affected by the blast gains some corrosion.
items.weapon.melee.steelwhip.name=steel whip
items.weapon.melee.steelwhip.stats_desc=This weapon has incredible reach.
items.weapon.melee.steelwhip.desc=A heavy steel whip gleaming with cold light. Its body is narrow like a snake, linked segment by segment, cutting the air with a sharp, chilling sound when swung.
items.weapon.melee.steelwhip.ability_name=lash
items.weapon.melee.steelwhip.typical_ability_desc=The duelist can _lash_ all enemies around her with a steel whip. This weapon ability usually deals _5-23 damage_ to every enemy currently within reach, and always hits.
items.weapon.melee.steelwhip.ability_desc=The duelist can _lash_ all enemies around her with a steel whip. This weapon ability deals _%1$d-%2$d damage_ to every enemy currently within reach, and always hits.
items.weapon.melee.blowpipe.name=blowpipe
items.weapon.melee.blowpipe.typical_stats_desc=Typically, when equipped, this weapon empowers darts to deal _%1$d-%2$d_ damage and can even pass its enchantment to them.
items.weapon.melee.blowpipe.stats_desc=When equipped, this weapon empowers darts to deal _%1$d-%2$d_ damage and can even pass its enchantment to them.
items.weapon.melee.blowpipe.ability_name=charged shot
items.weapon.melee.blowpipe.typical_ability_desc=The duelist can _charge_ a blowpipe. This weapon ability makes the next attack guaranteed to hit and triggers one of three effects depending on the situation: a melee attack knocks the enemy back; an untipped dart usually deals _2 extra damage_; and a tipped dart triggers its effect in a 7x7 area and usually gains _2 extra uses_.
items.weapon.melee.blowpipe.ability_desc=The duelist can _charge_ a blowpipe. This weapon ability makes the next attack guaranteed to hit and triggers one of three effects depending on the situation: a melee attack knocks the enemy back; an untipped dart deals _%s extra damage_; and a tipped dart triggers its effect in a 7x7 area and gains _%s extra uses_.
items.weapon.melee.blowpipe.desc=A blowpipe made from hardwood, with a hollow and regular body that can load small dart-like arrows and rapidly launch them by blowing into the mouthpiece. Due to its remarkable hardness, it also works surprisingly well as a striking weapon.
items.weapon.melee.blowpipe.upgrade_ability_stat_name=Ability Bonus
items.weapon.melee.blowpipe$weakchargedshot.name=charged and ready
items.weapon.melee.blowpipe$weakchargedshot.desc=The duelist is focusing energy into her blowpipe. This weapon ability makes her next attack guaranteed to hit and triggers one of three effects depending on the situation:\n-Melee attacks knock enemies back several tiles.\n-Untipped darts deal extra damage.\n-Tipped darts gain extra uses and trigger their effects in a 7x7 area. Beneficial effects only affect allies, while harmful effects only affect enemies. The duelist cannot use this weapon ability to make beneficial dart effects affect herself.
items.weapon.melee.latherwhip.name=leather whip
items.weapon.melee.latherwhip.stats_desc=This weapon has incredible reach.
items.weapon.melee.latherwhip.ability_name=lash
items.weapon.melee.latherwhip.typical_ability_desc=The duelist can _lash_ all enemies around her with a leather whip. This weapon ability usually deals _%1$d-%2$d damage_ to every enemy currently within reach, and always hits.
items.weapon.melee.latherwhip.ability_desc=The duelist can _lash_ all enemies around her with a leather whip. This weapon ability deals _%1$d-%2$d damage_ to every enemy currently within reach, and always hits.
items.weapon.melee.latherwhip.desc=A handy leather whip. It doesn't deal much damage, but its length makes up for that.
items.weapon.missiles.portableblackhole.stats_desc=Each time this weapon is thrown, it teleports every creature on this floor that has at least one of these weapons embedded in it to the targeted location.

###transformation
items.artifacts.precognitiveeye.name=Precognitive Eye
items.artifacts.precognitiveeye.ac_activate=ACTIVATE
items.artifacts.precognitiveeye.cannot_activate=The eye lacks enough charge, or its momentary foresight is already full.
items.artifacts.precognitiveeye.full_charge=Your eye is fully charged.
items.artifacts.precognitiveeye.levelup=Your eye sees farther into the future!
items.artifacts.precognitiveeye.max_level=Your eye has reached its maximum foresight!
items.artifacts.precognitiveeye.desc=An ocular prosthesis built from precise mechanisms. It analyses everything entering your sight and predicts the coming instant.
items.artifacts.precognitiveeye.desc_worn=You can spend 20%% charge to activate the eye and gain one instant Foresight, guaranteeing that you evade the next attack.\n\nThe eye can currently provide up to _%1$d stacks_ of instant Foresight.
items.artifacts.precognitiveeye.desc_cursed=This cursed eye confuses your vision in battle, leaving you unable to evade enemy attacks.
items.artifacts.precognitiveeye.desc_palermo=The more Palermo collides, the faster it becomes, until it reaches the future seen by this eye. How far ahead can your eye see?
items.artifacts.precognitiveeye$momentaryforesight.name=Momentary Foresight
items.artifacts.precognitiveeye$momentaryforesight.desc=The next %1$d enemy attacks will be foreseen and evaded.
items.bags.hikingbackpack.name=hiking backpack
items.bags.hikingbackpack.desc=This rugged, roomy backpack was made for long climbs, with layered straps and hidden pockets that can carry almost any adventuring supply.\n\nIt stores items only when your main backpack and other containers have no room. As soon as a more suitable container has space, those items are moved back automatically.
items.scrolls.scrollofextraction.name=Extraction Terminal
items.scrolls.scrollofextraction.discover_hint=You can buy this item in a tower shop.
items.scrolls.scrollofextraction.inv_title=Select equipment to scan
items.scrolls.scrollofextraction.desc=The Extraction Terminal is the Dwarven Association's latest surface-side research. It is made of unbreakable alloy (though it burns easily because it cannot withstand heat; the Association has declined to comment) and infused with magic that extracts upgrades from equipment (which the Association insists is also a form of technology). Somehow it is a new kind of "foldable screen," so it slips easily into the lining of a Scroll Holder (the Association denies this design was meant to keep it from burning), making it convenient for adventurers to carry.\n\nAccording to the instructions on its back, select an item to scan, then read the incantation shown on its interface... sorry, the command. It counts the number of upgrades ever invested in the item and prints the same number of Scrolls of Upgrade.\n\nThe process transfers upgrade magic into blank scrolls inside the terminal, lowering the item's level (but never below 0) and clearing its recorded upgrade count.
items.scrolls.scrollofextraction.extract=Scan: success. Count: success. Print: success. Extracted %d Scrolls of Upgrade from this item. This product will now be scrapped automatically. Thank you for your service!
items.weapon.melee.ritualdagger.name=ritual dagger
items.weapon.melee.ritualdagger.ac_attack=ATTACK
items.weapon.melee.ritualdagger.ac_stab=STAB
items.weapon.melee.ritualdagger.prompt_attack=Choose a target to attack
items.weapon.melee.ritualdagger.prompt_stab=Choose a target to stab
items.weapon.melee.ritualdagger.no_target=There is no enemy there.
items.weapon.melee.ritualdagger.too_far=That enemy is too far away.
items.weapon.melee.ritualdagger.bad_stab_target=You need to choose a nearby enemy or yourself.
items.weapon.melee.ritualdagger.not_ready=The ritual is not yet complete.
items.weapon.melee.ritualdagger.ready=Your dagger has drunk enough blood.
items.weapon.melee.ritualdagger.no_reason_buff=You cannot bear the ritual dagger's stab right now.
items.weapon.melee.ritualdagger.stab_enemy=You drive the dagger into your enemy's chest, restoring 50 reason.
items.weapon.melee.ritualdagger.stab_self=You prick your finger with the dagger, losing 100 reason.
items.weapon.melee.ritualdagger.ondeath=You died from massive blood loss after pricking your finger...
items.weapon.melee.ritualdagger.rankings_desc=ritual dagger
items.weapon.melee.ritualdagger.wnd_desc=The ritual dagger has drunk enough blood. How will you complete this stab?
items.weapon.melee.ritualdagger.stab_enemy_opt=stab an enemy
items.weapon.melee.ritualdagger.stab_self_opt=stab yourself
items.weapon.melee.ritualdagger.desc=A bloodstained dagger whose red edge has never faded. It radiates ill omen, and in your hand it seems to hunger for blood.
items.weapon.melee.ritualdagger.desc_ready=A bloodstained dagger whose red edge has never faded. It has drunk enough blood, and its next stab can either return mental energy to you or wear your mind away, depending on how you use it.
items.weapon.melee.ritualdagger.stats=This dagger cannot be upgraded directly, but grows stronger as you level up. At your current level it deals _%1$d-%2$d damage_ and requires _%3$d strength_ to use properly.
items.weapon.melee.ritualdagger.fast=This is a very fast weapon.
items.weapon.melee.ritualdagger.no_equip=This weapon can be used directly without being equipped.
items.weapon.melee.ritualdagger$ritualtracker.name=sacrificial ritual
items.weapon.melee.ritualdagger$ritualtracker.desc=The ritual dagger hungers for blood...\n\nAfter 13 accumulated kills, the pious can use the ritual dagger for a special stab without spending a turn.\n\nStabbing an enemy deals heavy damage and restores 50 reason.\n\nStabbing yourself deals tiny damage and removes 100 reason.\n\nThe pious must kill %1$d more enemies to complete this ritual.
items.weapon.melee.ritualdagger$bloodgift.name=blood gift
items.weapon.melee.ritualdagger$bloodgift.desc=This enemy has been marked by the pious' ritual dagger.\n\nA physical attack by the pious restores reason equal to one fifth of the target's actual HP loss, with a minimum of 1. Against bosses and minibosses, each attack restores at most 5 reason. Damage absorbed by shields does not restore reason.
items.trinkets.bronzewatch.name=bronze pocket watch
items.trinkets.bronzewatch.desc=An exquisite bronze pocket watch whose hands have stopped moving for some unknown reason. On the back, you can see an engraved line: time heals pain, and makes us forget beauty. Holding this watch seems to make time pass faster over you.
items.trinkets.bronzewatch.typical_stats_desc=This trinket will typically reduce the duration of most effects you receive by _%d turns_. Of course, this won't affect effects with no duration or permanent duration, and effects whose remaining duration is exactly or insufficiently reduced will last at least 1 turn.
items.trinkets.bronzewatch.stats_desc=At its current level, this trinket will reduce the duration of most effects you receive by _%d turns_. Of course, this won't affect effects with no duration or permanent duration, and effects whose remaining duration is exactly or insufficiently reduced will last at least 1 turn.
items.redenvelope.name=New Year's red envelope
items.redenvelope.ac_use=OPEN ENVELOPE
items.redenvelope.ac_alluse=OPEN ALL ENVELOPES
items.redenvelope.desc=This is a red envelope distributed by the Old God to the dungeon's creatures. It looks bulging, with plenty of lucky money inside, and maybe even a special surprise.
items.redenvelope.surprise=Could this be the rare item with only a ten-percent drop rate? May everything go your way in the new year!
items.redenvelope.supersurprise=Whoa, a golden legend! 10 scrolls of metamorphosis! May your new year be happy and peaceful!
items.redenvelope.supersurprise1=Whoa, a golden legend! A scroll of upgrade! May your new year be full of good luck!
items.redenvelope.discover_hint=You can obtain this item by enabling a certain challenge.
items.armor.freemanarmor.name=hero's suit
items.armor.freemanarmor.desc=While wearing this suit, which only the upper class are qualified to wear, the gentleman can use a special ability.
items.trinkets.goldingot.name=gold ingot
items.trinkets.goldingot.desc=This pure-gold ingot seems to have been accidentally dropped by a wealthy merchant during a festival. It seems to reduce your gold gains in order to strengthen your attacks.
items.trinkets.goldingot.typical_stats_desc=This trinket will typically increase your physical damage by _%1$s%%_, but also reduce your gold gains by _%2$s%%_.\n\nThis trinket costs more alchemical energy to upgrade.
items.trinkets.goldingot.stats_desc=At its current level, this trinket increases your physical damage by _%1$s%%_, but also reduces your gold gains by _%2$s%%_.\n\nThis trinket costs more alchemical energy to upgrade.
items.remains.brokenpackage.name=broken satchel
items.remains.brokenpackage.desc=This somewhat tattered satchel was once a briefcase carried by a wealthy gentleman. You can still sense that something is inside, and may try opening it to obtain some gold. But once the metal clasp is torn open, the satchel will be unable to withstand the force and will vanish into smoke.
items.armor.slimearmor.name=slime armor
items.armor.slimearmor.desc=Rather than armor, this is really the slime girl's own body.\n\nThis armor cannot be upgraded directly, but will gradually grow stronger as you level up, €gaining extra levels or even increasing its tier€.
items.armor.slimearmor.discover_hint=A certain hero starts with this item.
items.armor.slimegirlarmor.name=heroic liquid armor
items.armor.slimegirlarmor.desc=When the slime girl obtains liquid armor fused with liquid metal, she can use a special ability.\n\nThis liquid armor cannot be upgraded directly, but will gradually grow stronger as you level up, €gaining extra levels or even increasing its tier€.
items.remains.matchapudding.name=matcha pudding
items.remains.matchapudding.desc=This delicious pudding seems to be a piece peeled from a slime's body. You can even smell its faint fragrance. You can eat this jiggly, bouncy, sweet matcha pudding to deal with an empty stomach, but once it melts in your mouth it will vanish as well.
items.remains.metalfragment.name=metal fragment
items.remains.metalfragment.desc=This metal fragment was once a ninja tool used by an eastern ninja. Though it is no longer usable, you can still sense a trace of lingering ninja spirit attached to it. You can use it to restore some durability to all your thrown weapons. But as the ninja spirit fades bit by bit, this metal fragment will gradually crack apart and vanish.
items.armor.ninjaarmor.name=heroic ninja armor
items.armor.ninjaarmor.desc=When equipped with this ninja armor, which only jonin can wear, the ninja can use a special ability.
items.remains.brokentool.name=broken control unit
items.remains.brokentool.desc=This damaged metal control unit was once a tool used by some mechanical construct. Though it is rather unreasonable, you can still try connecting the exposed wires to use it briefly, creating a mirror image identical to yourself. But after use, in the instant that electrical signals pass through it, it will fail completely and shatter into nothing.
items.armor.dm400armor.name=heroic armor
items.armor.dm400armor.desc=When equipped with this high-performance armor, DM-400 can use a special ability.
items.remains.royaljewelry.name=royal jewelry
items.remains.royaljewelry.desc=This gorgeous jewel seems to be part of a ring worn by a member of the dwarven royal family. Some arcane energy still remains within it. You can use it to temporarily increase the level of all your rings. But when that last bit of arcane energy is spent, the jewel will quickly break into countless tiny crystal fragments and vanish.
items.remains.royaljewelry$jewelryenhanced.name=residual jewelry power
items.remains.royaljewelry$jewelryenhanced.desc=Your rings have gained a temporary +1 level boost.\n\nTurns remaining: %s
items.armor.princessarmor.name=heroic crown
items.armor.princessarmor.desc=Though your armor changed with it, in the end you simply put it on and felt the authority that now belongs to you. Your Majesty, please atone for the sins committed by the Last King, and let countless suffering souls rest in peace.
items.trinkets.magicfeather.name=magic feather
items.trinkets.magicfeather.desc=Originally a feather taken from a raven raised by a certain magician, it somehow gained a little magic after being boiled in an alchemy pot. The feather's magic seems to strengthen your wands, but also makes the dungeon's magical environment more dangerous.
items.trinkets.magicfeather.typical_stats_desc=This trinket will typically increase wand charge speed and damage by _%1$s%%_, but also reduce your elemental resistance by _%2$s%%_.\n\nThis trinket costs more alchemical energy to upgrade.
items.trinkets.magicfeather.stats_desc=At its current level, this trinket increases wand charge speed and damage by _%1$s%%_, but also reduces your elemental resistance by _%2$s%%_.\n\nThis trinket costs more alchemical energy to upgrade.
items.trinkets.spearshield.name=spear-shield paradox
items.trinkets.spearshield.desc=A sharp spearpoint has pierced the shield face; the hard shield face has snapped the spearpoint. The two are lodged tightly together and can no longer be separated. It seems able to grant an extreme boost to either your damage or armor, but the corresponding opposite attribute will also be cut down extremely.
items.trinkets.spearshield.typical_stats_desc=This trinket will typically stabilize either the minimum damage dealt by your physical attacks or the minimum mitigation of your physical armor at _%1$s%%_ of its maximum, while also stabilizing either the maximum mitigation of your physical armor or the maximum damage dealt by your physical attacks at _%2$s%%_ of its maximum. Before it is brewed, you cannot know which mode this trinket is currently in. This trinket can switch modes, but after each switch you must level up your hero before switching again, and it will have a greater downside until the hero levels up.\n\nThis trinket costs a huge amount of alchemical energy to upgrade.
items.trinkets.spearshield.ac_switch_mode=SWITCH
items.trinkets.spearshield.spear_stats_desc=At its current level, this trinket stabilizes the minimum damage dealt by your physical attacks at _%1$s%%_ of its maximum, while also stabilizing the maximum mitigation of your physical armor at _%2$s%%_ of its maximum. You are charging forward with the _spearpoint_ broken into the shield face. This trinket can also switch to another mode, but after each switch you must level up your hero before switching again, and it will have a greater downside until the hero levels up.\n\nThis trinket costs a huge amount of alchemical energy to upgrade.
items.trinkets.spearshield.shield_stats_desc=At its current level, this trinket stabilizes the minimum mitigation of your physical armor at _%1$s%%_ of its maximum, while also stabilizing the maximum damage dealt by your physical attacks at _%2$s%%_ of its maximum. You are bracing forward with the _shield face_ pierced by the spearpoint. This trinket can also switch to another mode, but after each switch you must level up your hero before switching again, and it will have a greater downside until the hero levels up.\n\nThis trinket costs a huge amount of alchemical energy to upgrade.
items.trinkets.spearshield.switch_spear=You turn the spearpoint of the spear-shield paradox forward, and the trinket loses some energy because of your action.
items.trinkets.spearshield.switch_shield=You turn the shield face of the spear-shield paradox forward, and the trinket loses some energy because of your action.
items.trinkets.spearshield.switch_fail=You need to level up your hero to restore this trinket's energy before switching modes again.
items.trinkets.spearshield$spearshieldcooldown.name=spear-shield paradox recovery
items.trinkets.spearshield$spearshieldcooldown.desc=You just switched the mode of the spear-shield paradox, consuming some of the trinket's energy, so it must fully recover before it can switch again.\n\nThis trinket recovers energy when the hero levels up. Before the energy recovers, its correction to attack and defense minimum values is stabilized at 0%% of the maximum.\n\nLevels required for recovery: %.2f\nIf the trinket is not in your backpack, it cannot recover.
items.treasures.treasures.name=treasure
items.treasures.treasures.desc=A sealed treasure chest whose value is reflected by its rarity. It cannot be upgraded, stacked, or transmuted.
items.treasures.treasures.discover_hint=You can find this item through a surface shopkeeper's request.
