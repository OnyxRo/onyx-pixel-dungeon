items.weapon.enchantments.shielding.name=shielding %s
items.weapon.enchantments.shielding.desc=This powerful enchantment leeches life force from enemies with each blow, funneling it back into the wearer. The healing is temporary, however.
items.weapon.melee.inscribedknife.name=inscribed knife
items.weapon.melee.inscribedknife.desc=A knife, adorned with runes along the blade. The runes seem dull; perhaps collecting experience will allow them to show their power.
