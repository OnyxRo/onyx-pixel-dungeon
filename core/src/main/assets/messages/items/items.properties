items.baexskilldisc.ac_use=Use
items.baexskilldisc.used=The Tactical Training BD has taught you all of its EX skills and is now worn out.
items.baexskilldisc.desc=This disc holds data that can teach its user stronger abilities.\n\nUsing this disc passes immense power to the student, letting you _choose an EX skill_.\n\nWhich EX skill will you choose?
items.baammobox.name=Ammo Box
items.baammobox.desc=An ammo box Yuzu set on the ground. If you pick it up, you instantly reload 1 round into your equipped gun.
items.baammobox.desc_ammo=This ammo box currently holds _%d rounds_, and it will vanish as soon as they are all used.
