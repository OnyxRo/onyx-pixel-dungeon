items.weapon.melee.dagger2.name=stabber
items.weapon.melee.dagger2.desc=A simple iron knife with a worn wooden handle.
items.weapon.melee.cleaver.name=cleaver
items.weapon.melee.cleaver.stats_desc=This is a very inaccurate weapon.\nYou can't perform surprise attacks with this weapon.\nThis weapon has a small chance to defeat the enemy instantly.
items.weapon.melee.cleaver.desc=A massive iron blade with a small handle. It's quite hard to land a hit with it, but if you succeed, this weapon can behead your target.
items.weapon.melee.cleaver.warrior_spec=assassinates target with higher probability than usual.
items.weapon.melee.conjurerknife.name=toy knife
items.weapon.melee.conjurerknife.name2=silver dagger
items.weapon.melee.conjurerknife.name3=dymalloy cutter
items.weapon.melee.conjurerknife.name4=lunar saber
items.weapon.melee.conjurerknife.stats_desc=This weapon can gain soul on killing enemies.
items.weapon.melee.conjurerknife.desc=A light wooden knife. While can't be considered as a real weapon, this knife is valuable for Conjurer.
items.weapon.melee.conjurerknife.desc2=A simple silver-plated dagger, believed to be counter against evil. With its moderate spiritual powers, it can be used as soul catcher.
items.weapon.melee.conjurerknife.desc3=A blade made from mysterious alloy, allowing it to stand against both close-ranged and magical foes. The reward is near.
items.weapon.melee.conjurerknife.desc4=The reliquary weapon made from fusing earthen steel and moon steel, it's suitable for any range of attack, and not even suffering in damage compared to other options. Truly a majestic tool.
items.weapon.melee.conjurerknife.warrior_spec=regular attack.
items.weapon.melee.shop.stabber.name=thief's stabber
items.weapon.melee.shop.stabber.stats_desc=This weapon instantly kills enemies that are asleep.
items.weapon.melee.shop.stabber.desc=A small steel knife designed to cut through the flesh of their targets. Due to its small size, this weapon is unable to do substantial damage in a direct battle, but is ideal for assassinating sleeping targets.
items.weapon.melee.shop.stabber.warrior_spec=steals small amount of satiety from enemy.
items.weapon.melee.shop.jjango.name=jjango
items.weapon.melee.shop.jjango.stats_desc=This weapon inflicts Bleed on hit, with the severity increasing the more damage is dealt.
items.weapon.melee.shop.jjango.desc=A western weapon, built from two sharp hooks. Not very damaging, but the enemy's arteries aren't going to like those hooks.
items.weapon.melee.shop.jjango.warrior_spec=sucks up the blood from bleeding enemies and converts it to health.
items.weapon.melee.broadsword.name=The Broadsword
items.weapon.melee.broadsword.stats_desc=This is a rather fast and accurate weapon.\nThis weapon can deal critical damage after certain amount of swings.\nThis weapon can proc random enchantments with each strike.\nThis weapon provides 3 extra defense.
items.weapon.melee.broadsword.desc=The weapon of fallen king, recreated with magic. Only brave fighters can use it at full power.
items.weapon.melee.staffs.staff.stats_known=This _tier-%1$d_ summon weapon requires _%2$d strength_ to use properly.\n\nDamage: _%3$d-%4$d_\nHP: _%5$d_\nAttunement: _%6$s_
items.weapon.melee.staffs.staff.stats_unknown=Typically, this _tier-%1$d_ summon weapon requires _%4$d strength_ to use properly. The minions summoned by this kind of weapon deal _%5$d-%6$d damage_ and have max HP of _%7$d._
items.weapon.melee.staffs.staff.faster=It is augmented to enhance _speed_ of the minion; it will move and attack faster, but deal less damage and have less defense.
items.weapon.melee.staffs.staff.stronger=It is augmented to enhance _damage_ of the minion; it will move and attack slower, but deal much more damage and have bigger defense.
