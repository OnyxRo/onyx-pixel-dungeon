items.treasures.muiscagoldenraft.name=Muisca golden ritual raft
items.treasures.muiscagoldenraft.desc=A gold votive raft made by Muisca goldsmiths in the Colombian Andes between the 13th and 16th centuries. Its central chief and surrounding attendants evoke the investiture rite behind the legend of El Dorado.
items.treasures.imperialcrown.name=Holy Roman Imperial Crown
items.treasures.imperialcrown.desc=An octagonal jeweled crown assembled for the medieval rulers of the Holy Roman Empire around the 10th or 11th century. Its gold plates, enamel, gems, arch, and cross embody imperial and Christian authority.
items.treasures.pakaljademask.name=Pakal jade mask
items.treasures.pakaljademask.desc=A jade mosaic funerary mask associated with the 7th-century Maya ruler K'inich Janaab' Pakal of Palenque. Shell-and-obsidian eyes enliven the carefully fitted greenstone face.
items.treasures.suttonhoohelmet.name=Sutton Hoo helmet
items.treasures.suttonhoohelmet.desc=An early 7th-century Anglo-Saxon ceremonial helmet from the Sutton Hoo ship burial in East Anglia. Its iron cap, tinned panels, garnets, and dragon-like brow combine protection with royal display.
items.treasures.bookofkells.name=Book of Kells
items.treasures.bookofkells.desc=An illuminated Gospel manuscript produced by Insular monks around the year 800 in the Irish-Scottish cultural world. Dense interlace, brilliant pigments, and sacred figures turn each page into devotional art.
items.treasures.cholanataraja.name=Chola Nataraja
items.treasures.cholanataraja.desc=A bronze image of Shiva as Lord of the Dance, perfected under the Tamil Chola dynasty around the 11th century. The raised leg and ring of flames express creation, destruction, and cosmic rhythm.
items.treasures.dojigiriyasutsuna.name=Dojigiri Yasutsuna
items.treasures.dojigiriyasutsuna.desc=A celebrated Japanese tachi traditionally attributed to the smith Yasutsuna of the Heian period, around the 10th or 11th century. Its graceful curvature and legendary demon-slaying name made it one of Japan's famed blades.
items.treasures.turquoiseserpent.name=Aztec turquoise double-headed serpent
items.treasures.turquoiseserpent.desc=A Mexica ceremonial ornament from the 15th or early 16th century, formed as a double-headed serpent. Turquoise mosaic, shell teeth, and red mouths give the sacred creature a vivid, coiling presence.
items.treasures.ruwarebowl.name=Ru ware sky-blue bowl
items.treasures.ruwarebowl.desc=A Northern Song court vessel of the 11th or 12th century, made in China's celebrated Ru kilns. Its restrained lotus form and softly crackled sky-blue glaze exemplify elite Song taste.
items.treasures.incagoldenllama.name=Inca golden llama
items.treasures.incagoldenllama.desc=A small precious-metal llama made in the Inca realm during the 15th or early 16th century. Such herd animals were offered in state and mountain rites as symbols of wealth, fertility, and pastoral life.
items.treasures.lewischessqueen.name=Lewis chess queen
items.treasures.lewischessqueen.desc=A late 12th-century Norse chess piece found in the Scottish Hebrides, carved from walrus ivory. The crowned queen rests her cheek on one hand, giving the compact figure its famous pensive expression.
items.treasures.harbavilletriptych.name=Harbaville ivory triptych
items.treasures.harbavilletriptych.desc=A mid-10th-century Byzantine devotional triptych associated with Constantinople. Finely carved ivory panels place Christ and saints within an intimate folding shrine.
items.treasures.almughirapyxis.name=Pyxis of al-Mughira
items.treasures.almughirapyxis.desc=A carved ivory box made in 968 for Prince al-Mughira at the Umayyad court of Córdoba. Courtly figures, animals, and vegetal bands wrap around its cylindrical body and domed lid.
items.treasures.blacasewer.name=Blacas ewer
items.treasures.blacasewer.desc=A brass ewer signed in Mosul in 1232, during the flourishing of medieval Islamic metalwork. Silver and copper inlay animate its inscriptions, figures, and geometric ornament.
items.treasures.greatkhanpaiza.name=Great Khan's paiza
items.treasures.greatkhanpaiza.desc=A 13th- or 14th-century Mongol iron authority tablet bearing vertical Phags-pa script. Carried as an official pass, it commanded transport, provisions, and obedience across the empire.
items.treasures.goryeomaebyeong.name=Goryeo celadon maebyeong
items.treasures.goryeomaebyeong.desc=A 12th- or 13th-century Korean stoneware vase from the Goryeo dynasty. Its swelling body, jade-green celadon glaze, and pale inlaid cranes display the refinement of Korean ceramic art.
items.treasures.javanesegoldcup.name=Javanese gold foliate cup
items.treasures.javanesegoldcup.desc=A precious cup from medieval Java, shaped during the Hindu-Buddhist courts of roughly the 10th to 14th centuries. Hammered gold leaves and floral relief cover its low, rounded body.
items.treasures.ethiopianprocessionalcross.name=Ethiopian processional cross
items.treasures.ethiopianprocessionalcross.desc=A medieval Ethiopian copper-alloy cross associated with the Christian highlands and the churches of Lasta. Its openwork, interlaced arms were designed to catch the light during processions.
items.treasures.greatzimbabwebird.name=Great Zimbabwe soapstone bird
items.treasures.greatzimbabwebird.desc=A soapstone bird associated with Great Zimbabwe between the 13th and 15th centuries. The long-necked creature atop a column became an emblem of the Shona state and its sacred kingship.
items.treasures.djenneterracottafigure.name=Djenne terracotta thinker
items.treasures.djenneterracottafigure.desc=A seated terracotta figure from the Inland Niger Delta civilization of medieval Mali, dating roughly from the 13th to 15th centuries. Its head-on-knee pose compresses quiet thought into a powerful silhouette.
items.elfwine.name=Elf Wine
items.elfwine.desc=A cup of elf wine shimmering with green light.
items.armor.curses.leaden.name=Leaden%s
items.armor.curses.leaden.desc=The Leaden curse is infused with strength magic, making armor unbearably heavy and difficult to wear.
items.food.tincture.name=Tincture of Solace
items.food.tincture.eat_msg=Before you know it, you have gulped it down!
items.food.tincture.desc=This tincture, made by steeping agarwood in alcohol, soothes the mind and helps it resist the darkness's horrors. As a liquid food, it can be consumed quickly.\nIt provides only a little satiety, but immediately removes terror and restores a cleric's sanity.
items.food.tincture.discover_hint=You can discover this item through a hero talent.
items.remains.bottledenergy.name=Bottled Energy
items.remains.bottledenergy.desc=This potion was left behind by a cleric skilled in alchemy. It contains liquid crystals of alchemical energy that you can use by pulling the stopper. The bottle shatters into countless glass shards as soon as you pull it open.
items.weapon.melee.ritualdagger.ability_desc=The Duelist cannot perform a martial technique with the Ritual Dagger.
items.weapon.melee.ritualdagger.discover_hint=You obtain this item after a hero chooses a class specialization.
items.armor.friararmor.name=Friar's Robe
items.armor.friararmor.desc=While wearing this strange robe, the Friar can use a special ability.

items.scrolls.upgradeextraction.name=upgrade extraction
items.scrolls.upgradeextraction.desc=The upgrade extraction, from transformation. The mod gave it no description.

###transformation
items.weapon.missiles.missileweapon.stats=This _tier-%1$d_ thrown weapon deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use properly.
items.weapon.weapon.magical=It is augmented with _magic energy_. Its hits deal an additional _%1$d-10 magic damage_. If its original reach is below 2 it gains +1 reach; otherwise its attack delay is reduced to two-thirds.
items.weapon.missiles.missileweapon.duplicate_dust=An incomplete duplicate set of thrown weapons loses its magic and crumbles to dust.
items.item.ac_inspect=Inspect
items.item.eye_prompt=Are you sure you want to inspect this item? It will come at a cost.
items.item.eye_yes=Yes
items.item.eye_no=Never mind
items.item.uncursed=You inspect the item carefully and find that it is not cursed.
items.item.cursed=You sense a malicious magic lurking within this item.
items.item.no_reason=You lack the sanity needed to do that.

###shattered-pixel-dungeon-master
items.potions.potionofmight.name=potion of might
items.potions.potionofmight.msg_1=+1 str, +5 hp
items.potions.potionofmight.msg_2=Newfound strength surges through your body.
items.potions.potionofmight.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point and health by five points.
items.rings.ringoflife.name=ring of life
items.rings.ringoflife.desc=This ring tries to satiate the inner beast of the wearer, granting the user a chance of stealing the enemy's life and making it their own.
###lovecraft
items.potions.potionofsteam.herbdesc=Lets you sweat steam.
items.potions.potionofsteam.desc=This potion will boil your innards and make your sweat steam. 
items.potions.potionofsteam.name=potion of steam

###lovecraft
items.potions.potionofmight.name=potion of might
items.potions.potionofmight.msg_1=+1 str, +5 hp
items.potions.potionofmight.msg_2=Newfound strength surges through your body.
items.potions.potionofmight.desc=This powerful liquid will course through your muscles, permanently increasing your strength and mental health by one point and health by five points.
items.scrolls.scrollofmagicalinfusion.name=scroll of magical infusion
items.scrolls.scrollofmagicalinfusion.inv_title=Infuse an item
items.scrolls.scrollofmagicalinfusion.infuse=Your %s is infused with arcane energy!
items.scrolls.scrollofmagicalinfusion.desc=This scroll will infuse a weapon or armor with powerful magical energy.\n\nIn addition to being upgraded, A weapon will gain a magical enchantment, or armor will be imbued with a magical glyph.\n\nIf the item already has an enchantment or glyph, it will never be erased by this scroll.
items.wands.wandofvenom.name=wand of venom
items.wands.wandofvenom.staff_name=staff of venom
items.wands.wandofvenom.desc=This wand has a purple body which opens to a brilliant green gem.
items.wands.wandofvenom.stats_desc=This wand shoots a bolt which explodes into a cloud of vile venomous gas at a targeted location. Anything caught inside this cloud will take continual damage, increasing with time.
items.weapon.enchantments.stunning.name=stunning %s
items.weapon.enchantments.stunning.desc=This powerful enchantment immobilizes enemies when they are struck, rendering them helpless against further attacks.
items.weapon.melee.dragondagger.name=dragon dagger
items.weapon.melee.dragondagger.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.dragondagger.desc=A dagger forged from the scales of the mightiest of dragons.
items.weapon.melee.knuckles.name=knuckleduster
items.weapon.melee.knuckles.stats_desc=This is a very fast weapon.
items.weapon.melee.knuckles.desc=A piece of iron shaped to fit around the knuckles. Keeps the hands free, yet allows for better attacks than an empty fist.
items.weapon.melee.vikingmace.name=viking mace
items.weapon.melee.vikingmace.stats_desc=This is a rather slow weapon.\nThis weapon deals extra damage.
items.weapon.melee.vikingmace.desc=The large diamond head of thie weapon imbued with the power of good inflicts substantial damage.
items.weapon.missiles.curaredart.name=curare dart
items.weapon.missiles.curaredart.desc=These little evil darts don't do much damage but they can paralyze the target leaving it helpless and motionless for some time.

items.armor.vikingarmor.name=viking fleece armor
items.armor.vikingarmor.ac_special=HAMMERFALL
items.armor.vikingarmor.desc=With armor crafted from the fleece of sheep, the Viking is able to channel his inner strength to fortify his defenses and attack faster.
items.armor.dragonknightarmor.name=dragon scale armor
items.armor.dragonknightarmor.ac_special=DEAFENING ROAR
items.armor.dragonknightarmor.desc=Wearing these scales allows the Dragon Knight to channel her inner dragon and unleash a deafening roar. The roar makes every enemy in sight bleed and limp.
###pixel-towers-master
items.armor.curses.unreliable.name=%s of unreliance
items.armor.curses.unreliable.desc=Unreliable armor is alive and sometimes attempts to evade the attacks itself, leading to hero being critically damaged. It has some conscience however, and does not dodge when the damage is deadly to the wearer.
items.armor.glyphs.holy.name=%s of purity
items.armor.glyphs.holy.desc=This glyph aids you in handling demonic beings, weakening them on their attack, and wounds left by dark entities heal faster.
items.potions.exotic.potionofimmortality.name=potion of immortality
items.potions.exotic.potionofimmortality.desc=The power of holy energy reduced to liquid form, this draught will imbue the user with energy of life, granting them _complete invincibility_ for _10 turns_.\n\nThis potion can used on yourself, or any character by throwing.
items.rings.ringoflethality.name=ring of lethality
items.rings.ringoflethality.stats=When worn, this ring will increase your critical hit chance by _%1$s%%._ Not only that, but your critical strikes will deal _%2$s%%_ more damage.
items.rings.ringoflethality.typical_stats= When worn, this ring will typically increase your critical hit chance by _%1$d%%._ Not only that, but your critical strikes will deal _%2$d%%_ more damage.
items.rings.ringoflethality.desc=This ring adjusts the position of weapons, held by the hero, so strikes land in enemy's weak spots. A cursed ring will make wearer's hands tremble, taking your ability to crit away.
items.scrolls.scrollofanimation.name=scroll of animation
items.scrolls.scrollofanimation.prompt=Choose a shooting tower
items.scrolls.scrollofanimation.notatower=The scroll only works on shooting towers!
items.scrolls.scrollofanimation.yesatower=Your tower is alive!
items.scrolls.scrollofanimation.desc=This scroll is usually used to animate non-living constructs, turning them into sentient beings or slaves. If used on your shooting tower, it will grant it an ability _to move_, and will make it _follow your hero_ as a normal ally. As the tower's magi-molecular structure is morphed, it will also fix any cracks, _fully healing_ the tower.\n\nThis scroll is though common, is of ancient magic school and is capable of altering the tower forever. Even though you can still upgrade such towers, selling them is no longer possible.
items.scrolls.scrollofdrowsiness.name=scroll of drowsiness
items.scrolls.scrollofdrowsiness.sooth=The scroll utters a soothing melody. You feel very sleepy.
items.scrolls.scrollofdrowsiness.desc=Reading this scroll emits a soothing melody which will lull and calm down all foes who hear it. Though every enemy in sight will be slowed down and weakened, the reader also becomes drowsy.\n\nInteresting fact: sleeping, especially doing so under magical lullabies, is great for your health! The reader, if is not attacked, may even fully restore his hp.
items.scrolls.exotic.scrollofgolems.name=scroll of golems
items.scrolls.exotic.scrollofgolems.inv_title=Choose a melee weapon or an armor piece
items.scrolls.exotic.scrollofgolems.golem=Your weapon forms a golem around itself!
items.scrolls.exotic.scrollofgolems.desc=Those scrolls are a type of ancient magic usually used by dark generals who lack living manpower. Using one on a weapon or an armor will create a living statue bearing it. The statue will follow it's creator and drop the weapon back upon death.\n\nIn cases where the scroll is used with a cursed weapon, the statue will syphon the dark magic, becoming significantly weaker.
items.scrolls.exotic.scrollofdiscoveries.name=scroll of discoveries
items.scrolls.exotic.scrollofdiscoveries.desc=Reading this scroll fills the reader's mind with knowledge, showing every single item's location on the level. This allows the hero to look for more useful loot, find secrets and would save you quite some time.
items.scrolls.exotic.scrollofdiscoveries.used=Your mind is suddenly filled with knowledge!
items.scrolls.exotic.scrollofratlegion.name=_scroll of rat legion_
items.scrolls.exotic.scrollofratlegion.desc=This scroll calls out to Rat king and his forces, creating a small portal, with many rats coming out of it.\n\nRats' _amount and power depend on depth and the current wave_: the deeper you are and the more waves you have successfully repelled, the more rats will appear, sometimes normal rats are even replaced with Chief ones.
items.wands.wandofsnakes.name=wand of snakes
items.wands.wandofsnakes.staff_name=staff of snakes
items.wands.wandofsnakes.desc=A strange-looking wand with a living snake head instead of a crystal. This head does not attack you though, aggressively hissing on enemies instead.
items.wands.wandofsnakes.stats_desc=Each bolt from this wand deals _%1$d-%2$d damage,_ and may poison the foe attacked. Also if a shot lands on an empty space, a friendly snake will be summoned. Snakes have high evasion, which increases with upgrades, allowing you to easily distract foes.
items.wands.wandofsnakes.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of snakes, the foe has a chance to get poisoned.
items.wands.wandofsnakes.eleblast_desc=An elemental blast with a staff of snakes will crash the game.
items.weapon.curses.degrading.name=degrading %s
items.weapon.curses.degrading.desc=A degrading weapon breaks much quicker than usual, with their damage decreasing after each hit. Once the damage reaches a critical point, the weapon's level gets lower.
items.weapon.curses.degrading.elestrike_desc=An elemental strike with a degrading weapon has a 50% chance to weaken every enemy in sight.
items.weapon.enchantments.empowering.name=empowering %s
items.weapon.enchantments.empowering.desc=This enchantment does not affect the weapon in any way, but makes your hero more powerful and accurate while he is fighting with it. It can also _bless_ the hero on successful hits.
items.weapon.enchantments.empowering.elestrike_desc=An elemental strike with a empowering enchantment blesses you for 3 turns for each enemy in sight and making you invulnerable for a couple of turns.
items.weapon.enchantments.pure.name=pure %s
items.weapon.enchantments.pure.desc=This powerful enchantment changes the time structure of the weapon, making it strike the enemy in several dimensions. That results in ignoring all target's physical defense on hit.
items.weapon.enchantments.pure.elestrike_desc=An elemental strike with a pure enchantment makes all the enemies in sight vulnerable for a short period of time.
items.weapon.melee.plaguescourge.name=Plague scourge
items.weapon.melee.plaguescourge.stats_desc=This weapon deals much more damage to _unaware_ enemies.\n\nIf _upgraded_, stealth attacks also affect enemies with deadly venom.
items.weapon.melee.plaguescourge.ability_name=sneak
items.weapon.melee.plaguescourge.ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability grants the Duelist 10 turns of invisibility, but costs 3 charges.
items.weapon.melee.plaguescourge.desc=A small knife made from an onyx shard, infused with specialized decay magic. Those are used only by professional assassins, as this weapon's effects, though tremendously powerful, manifest only on direct, deeply-cutting hits.
items.weapon.melee.banhammer.name=Banhammer
items.weapon.melee.banhammer.stats_desc=This is a very accurate and very slow weapon, inflicts vertigo and cripples enemy on hit.
items.weapon.melee.banhammer.ability_name=heavy blow
items.weapon.melee.banhammer.ability_desc=The Duelist can perform a _heavy blow_ with a Banhammer. This strong but predictable attack has -75% accuracy, but deals +55% damage and applies vulnerable and weaken for 5 turns if it hits. Heavy blow can surprise attack.
items.weapon.melee.banhammer.desc=Banhammer is a weapon every player in the entire world is afraid of. It almost never misses, deals insane damage and disorients enemies on hit. Practically, bans the defenders.
items.weapon.melee.berserkeraxe.name=Berserker's axe
items.weapon.melee.berserkeraxe.stats_desc=This weapon's attacks damages _all characters around_ its user on attack (both allies and enemies).
items.weapon.melee.berserkeraxe.ability_name=heavy blow
items.weapon.melee.berserkeraxe.ability_desc=The Duelist can perform a _heavy blow_ with this weapon. This strong but predictable attack has -75% accuracy, but deals +55% damage and applies vulnerable and weaken for 5 turns if it hits. Heavy blow can surprise attack.
items.weapon.melee.berserkeraxe.desc=The enormous steel head of this axe puts considerable heft behind each wide stroke. With enough strength this axe could be spun, striking every single foe with its weight. This exact attacking technique is the reason berserkers usually attack enemy hordes alone.
items.weapon.melee.blueknife.name=blue-handle knife
items.weapon.melee.blueknife.stats_desc=This weapon is stronger against unaware enemies.\nThis is a rather accurate weapon.\nThis weapon may chill enemies on hit.
items.weapon.melee.blueknife.ability_name=sneak
items.weapon.melee.blueknife.ability_desc=The Duelist can _sneak_ while wielding this weapon. This ability grants the Duelist 8 turns of invisibility, but costs 2 charges.
items.weapon.melee.blueknife.desc=A simple iron dagger with a blue handle, signed "Romeo" on it. Cold on touch.
items.weapon.melee.bonemachete.name=bone machete
items.weapon.melee.bonemachete.stats_desc=This weapon has a higher chance of a critical attack.\nThis weapon deals more damage on crits.\nIf _upgraded_, makes enemies bleed on each hit.
items.weapon.melee.bonemachete.ability_name=cleave
items.weapon.melee.bonemachete.ability_desc=The Duelist can _cleave_ an enemy with this weapon. This deals +27% damage and is guaranteed to hit. If cleave kills an enemy the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.bonemachete.desc=A strange weapon made from bones, that looks like a giant dagger. For its size the blade is rather light, because of being hollow inside.
items.weapon.melee.dualhatchet.name=Double-edged hatchet
items.weapon.melee.dualhatchet.stats_desc=This weapon can't surprise attack \nThis is a quite inaccurate weapon\nThis weapon benefits a bit more from upgrades.
items.weapon.melee.dualhatchet.ability_name=heavy blow
items.weapon.melee.dualhatchet.ability_desc=The Duelist can perform a _heavy blow_ with this weapon. This strong but predictable attack has -75% accuracy, but deals +50% damage and applies vulnerable and weaken for 5 turns if it hits.
items.weapon.melee.dualhatchet.desc=A heavy hatchet with two edges. Made poorly, but with some improvement its damage can easily behead your foe. 
items.weapon.melee.stonehammer.name=stone hammer
items.weapon.melee.stonehammer.stats_desc=This is a rather inaccurate and slow weapon.\nThis weapon deals more damage on critical hits.
items.weapon.melee.stonehammer.ability_name=heavy blow
items.weapon.melee.stonehammer.ability_desc=The Duelist can perform a _heavy blow_ with this weapon. This strong but predictable attack has -75% accuracy, but deals +50% damage and applies vulnerable and weaken for 5 turns if it hits. Heavy blow can surprise attack.
items.weapon.melee.stonehammer.desc=A gigantic hammer, which was not made for neither fighting or nailing. Though really uncomfortable to use, this thing can deal devastating damage on hit.
items.weapon.melee.goldensword.name=Midas sword
items.weapon.melee.goldensword.stats_desc=This weapon is very weak.\nThis weapon drops gold on successful hit.
items.weapon.melee.goldensword.ability_name=cleave
items.weapon.melee.goldensword.ability_desc=The Duelist can _cleave_ an enemy with a sword. This deals +27% damage and is guaranteed to hit. If cleave kills an enemy the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.goldensword.desc=A magical sword made of pure gold and decorated with sapphires. Is not that good for stabbing enemies, but each swing with it partially turns enemy bodies into gold.
items.weapon.melee.infipike.name=Infipike
items.weapon.melee.infipike.stats_desc=This weapon has infinite reach. Its attack speed depends on the previous attack's distance. It is advised to fight in melee. \n\n This weapon does not deal straight damage, making enemies bleed instead.
items.weapon.melee.infipike.ability_name=phase incineration
items.weapon.melee.infipike.ability_desc=The Duelist can _bend_ the pike to make it _penetrate the enemy several times_.This attack allows you to make the enemy bleed heavily, but requires readjustment of the pike's form, which will make it weaker for a short time.
items.weapon.melee.infipike.desc=Those pikes can cut blood vessels of an enemy without even causing pain: Infipike can adjust its length so the enemy can be hit even if he is far away, negating the risks of being attacked in melee. The further the enemy is, the longer it takes the pike to stretch, the slower the attack.
items.weapon.melee.moltendagger.name=Molten dagger
items.weapon.melee.moltendagger.ability_name=cleave
items.weapon.melee.moltendagger.stats_desc=This weapon randomly creates fires around its user on attacks. If _upgraded_, creates additional fire on targets position.
items.weapon.melee.moltendagger.ability_desc=The Duelist can _cleave_ an enemy with a dagger. This deals +30% damage and is guaranteed to hit. If cleave kills an enemy the Duelist can use cleave again within 5 turns for free.
items.weapon.melee.moltendagger.desc=An obsidian dagger, the blade of which is made from boiling magma. Due to this weapons entropy distortion aura, anything burnable around ignites seemingly by itself.
items.weapon.melee.redknife.name=red-handle knife
items.weapon.melee.redknife.stats_desc=This weapon is stronger against unaware enemies.\nThis is a rather accurate weapon.\nIf _upgraded_, may burn enemies on hit.
items.weapon.melee.redknife.ability_name=sneak
items.weapon.melee.redknife.ability_desc=The Duelist can _sneak_ while wielding this weapon. This ability grants the Duelist 8 turns of invisibility, but costs 2 charges.
items.weapon.melee.redknife.desc=A simple iron dagger with a red handle, signed "Juliette" on it. Warm on touch.
items.weapon.melee.darksteelsaber.name=Bone Claymore
items.weapon.melee.darksteelsaber.stats_desc=If _upgraded_, has a chance to summon wraiths on successful hits. Upgrading further increases that chance.
items.weapon.melee.darksteelsaber.ability_name=sword dance
items.weapon.melee.darksteelsaber.ability_desc=The Duelist can perform a _sword dance_ with this claymore. This stance grants the Duelist +60% attack speed and -20% accuracy for 6 turns, takes no time to activate, and costs 2 charges.
items.weapon.melee.darksteelsaber.desc=A thick curved blade of darksteel. Being connected to the demonic realm, calls out to it with every swing.
items.weapon.melee.darksteelsaber$sworddance.name=sword dance
