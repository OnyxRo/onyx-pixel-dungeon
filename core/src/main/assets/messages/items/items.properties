items.weapon.melee.gun.rbagun.ability_desc=A Duelist equipped with a firearm can use _Quick Reload_. This ability instantly reloads the equipped firearm without consuming a turn or ammo; if used when the gun is already fully loaded, it loads up to double its maximum magazine capacity instead. This ability costs 2 charges.
