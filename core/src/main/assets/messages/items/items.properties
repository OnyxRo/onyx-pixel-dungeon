items.artifacts.necronomicon.no_charge=The Necronomicon lacks enough charge.
items.artifacts.necronomicon.no_charge_summon=Chanting at empty ground requires 2 charge.
items.artifacts.necronomicon.invalid_target=That target's soul cannot be bound.
items.artifacts.necronomicon.no_space=There is nowhere for a wraith to emerge.
items.artifacts.necronomicon.cursed=You cannot chant from a cursed Necronomicon.
items.artifacts.necronomicon.discover_hint=You can craft this item through alchemy.
items.artifacts.necronomicon.desc=A forbidden tome bound in black leather, its white skull emblem seeming to watch every living thing. Its pages preserve rites that command the dead and bind souls.
items.artifacts.necronomicon.desc_equipped=While equipped, the book learns from your experience and slowly gathers charge. Chanting at empty ground calls corrupted wraiths; chanting at an ordinary enemy binds its soul.
items.artifacts.necronomicon.desc_cursed=The cursed pages turn by themselves, drawing wandering wraiths toward you like corpse dust.
