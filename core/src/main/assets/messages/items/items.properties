items.weapon.melee.gun.smg.rbatwindragon.name=Twin Dragon
items.weapon.melee.gun.smg.rbatwindragon.desc=A pair of submachine guns wielded by Neru.\n\nBoth are elaborately engraved with golden dragon emblems.
items.weapon.melee.gun.smg.rbatwindragon.stats_desc=This firearm has very low accuracy, but fires twice as many bullets.
