items.weapon.melee.gun.sg.rbashootingstar.name=Shooting☆Star
items.weapon.melee.gun.sg.rbashootingstar.desc=Reisa's cherished shotgun.\n\nIts painstakingly customized barrel makes it unmistakably Reisa's. Contrary to its cute appearance, it carries the hardened experience of surviving countless battlefields.
items.weapon.melee.gun.sg.rbashootingstar.stats_desc=This firearm deals relatively low damage.\nFiring this firearm alerts all enemies across the entire floor.\nOn hit, this firearm inflicts Amok on enemies.
items.weapon.melee.gun.sg.rbashootingstar.discover_hint=This firearm can be obtained through alchemy using an _SG_.
