items.weapon.enchantments.buggy.desc=This enhancement radiates chaotic energy, acting as a different enhancement with each hit.
items.weapon.melee.spanner.name=Spanner
items.weapon.melee.spanner.desc=A simple spanner, used by maintenance droids. It is weak but will make a handy improvised weapon.
items.weapon.melee.wrench.name=Wrench
items.weapon.melee.wrench.desc=A few inches longer than a dagger, slightly more useful than a spanner.
items.weapon.melee.mcpickaxe.name=thermal rockbreaker
items.weapon.melee.mcpickaxe.stats_desc=This focused mining tool is unusually accurate.
items.weapon.melee.mcpickaxe.desc=A compact industrial rockbreaker with a narrow thermal bit for splitting ore, hull slag, and stubborn bulkhead seams. It was built for mining work, but it handles well enough in a fight.
items.weapon.melee.drill.name=Drill
items.weapon.melee.drill.stats_desc=This tool will block some damage.
items.weapon.melee.drill.desc=A typical drill used by maintenance techs to seal the outer panels of Pixel Spacabase.
items.weapon.melee.lazersword.name=Lazer Sword
items.weapon.melee.lazersword.desc=A bland lazer sword. Nothing special, No special effects other than a tint. More for show than for battle.
items.weapon.melee.spade.name=Spade
items.weapon.melee.spade.stats_desc=This is a rather accurate tool.
items.weapon.melee.spade.desc=Quite what a spade is doing on a space base is a mystery. The large platinum head of this tool inflicts substantial damage.
items.weapon.melee.holoscimitar.name=Holo-Scimitar
items.weapon.melee.holoscimitar.stats_desc=This is a rather fast and light weapon.
items.weapon.melee.holoscimitar.desc=A thick curved blade made of hard light. Its shape allows for faster, yet less powerful attacks.
items.weapon.melee.ultonshield.name=Ulton Shield
items.weapon.melee.ultonshield.stats_desc=This shield blocks a significant amount of damage, which scales with upgrades.
items.weapon.melee.ultonshield.desc=This large Ulton Shield effectively blocks attacks and makes a decent weapon with the sharp end in a pinch.
items.weapon.melee.lazerwhip.name=Lazer Whip
items.weapon.melee.lazerwhip.stats_desc=This weapon has tremendous reach.
items.weapon.melee.lazerwhip.desc=Another weapon made from showy lazer technology, its reach cannot be matched, however the damage dealt is negligable.
items.weapon.melee.holoaxe.name=Holo-Axe
items.weapon.melee.holoaxe.stats_desc=This is a rather accurate weapon.
items.weapon.melee.holoaxe.desc=The enormous hard light head of this holo axe puts considerable heft behind each wide stroke.
items.weapon.melee.brightsaber.name=Brightsaber
items.weapon.melee.brightsaber.stats_desc=This hard light weapon can be upgraded. Reforge it with a Darksaber to create an Eclipse Saber.
items.weapon.melee.eclipsesaber.name=Eclipse Saber
items.weapon.melee.eclipsesaber.stats_desc=This tier-5 blade scales strongly with upgrades and strikes harder against unaware enemies.
items.weapon.melee.eclipsesaber.desc=Bright and dark emitters share a single hilt, forming a violet blade around a black core. Reforging a Brightsaber and a Darksaber creates this weapon, retaining the stronger input's enhancement and weight conversion and adding one upgrade level.
items.weapon.melee.brightsaber.desc=This is the weapon of a Space Knight. Not as clumsy or random as a blaster. An elegant weapon... for a more civilized age.
items.weapon.melee.darksaber.name=Darksaber
items.weapon.melee.darksaber.stats_desc=This weapon is stronger against unaware enemies. Reforge it with a Brightsaber to create an Eclipse Saber.
items.weapon.melee.darksaber.desc=This is the weapon of a Space Wizard. It belonged to your fath... ah, uncle.
items.weapon.melee.brighthammer.name=Brighthammer
items.weapon.melee.brighthammer.stats_desc=Heavy for a hard light weapon.
items.weapon.melee.brighthammer.desc=Someone saw brightsabers and thought, you know what would be a good idea...
items.weapon.melee.orbmelder.name=Orb Melder
items.weapon.melee.orbmelder.stats_desc=Large, heavy and slow.\nThis weapon has extra reach.
items.weapon.melee.orbmelder.desc=A massive polearm consisting of a sizable energy orb on the end of a pole to smash heads with.
items.weapon.melee.ultonaxe.name=Ulton Axe
items.weapon.melee.ultonaxe.stats_desc=This weapon is incredibly heavy.
items.weapon.melee.ultonaxe.desc=Meant to be wielded over the shoulder, this titanic axe is a powerful as it is heavy.
items.weapon.melee.imperialshield.name=Imperial Shield
items.weapon.melee.imperialshield.stats_desc=This weapon blocks a tremendous amount of damage, which scales with upgrades.
items.weapon.melee.imperialshield.desc=More like a forcefield than a shield, the large holographic disk aids defense, but doesn't leave much room for attacking.
items.weapon.missiles.hunterdisc.name=Hunter Disc
items.weapon.missiles.hunterdisc.desc=This flat weaponized disc returns to its thrower after every launch, whether it hits a target or not.
items.weapon.missiles.hunterjavelin.name=Hunter Javelin
items.weapon.missiles.hunterjavelin.desc=This length of metal is weighted to keep the spike at its tip foremost as it sails through the air.
items.weapon.missiles.nanobots.name=Nanobots
items.weapon.missiles.nanobots.desc=Nanobots will bury inside enemy armor and inflict heavy damage, but they are difficult to aim.
items.dronecontroller.name=Drone Controller
items.dronecontroller.ac_activate=ACTIVATE
items.dronecontroller.desc=This controller houses a powered drone.
items.dronecontroller$activateddrone.name=activated drone controller
items.dronecontroller$activateddrone.desc=The drone for this controller has been activated. It will attack hostile targets and clear mines while it patrols. Rendering this controller for parts severs the link, leaving the drone active and hostile.

items.weapon.melee.dualblade.name=dual blade
items.weapon.melee.dualblade.desc=The dual blade, from spacebase. The mod gave it no description.
items.weapon.melee.raiderblade.name=raider blade
items.weapon.melee.raiderblade.desc=The raider blade, from spacebase. The mod gave it no description.

###spacebase
items.armor.uniform.name=uniform
items.armor.uniform.desc=This lightweight uniform offers basic protection. Unprovoked hostile machines mistake its wearer for station personnel and will not attack, but each machine remembers if you attack it, even after you change clothes. It is not a spacesuit and does not protect against vacuum or harmful gases.
items.food.synthesizedfood.name=synthesized ration
items.food.synthesizedfood.eat_msg=It tasted... ok.
items.food.synthesizedfood.desc=Technically it's a ration, though it's tasteless, made from some kind of green substance, and looks like plastic.
items.food.alienpod.name=dead alien bug
items.food.alienpod.suntech=Regen Xeno Booster
items.food.alienpod.rottech=Myo-Fiber Xeno Booster
items.food.alienpod.earthtech=Nerve Lock Xeno Booster
items.food.alienpod.blindtech=Chameleon Xeno Booster
items.food.alienpod.firetech=Pyroclast Xeno Booster
items.food.alienpod.icetech=Cryo-Splice Xeno Booster
items.food.alienpod.fadetech=Synapse Map Xeno Booster
items.food.alienpod.sorrowtech=Toxic Bloom Xeno Booster
items.food.alienpod.stormtech=Grav-Lift Xeno Booster
items.food.alienpod.dreamtech=Filter Lung Xeno Booster
items.food.alienpod.startech=Neural Growth Xeno Booster
items.food.alienpod.raw=A dead alien bug, still warm from the crushed egg. It looks useless by itself, but the fabricator may be able to combine it with a plasmid.
items.food.alienpod.ice_msg=Interesting...
items.food.alienpod.fire_msg=Your weaponry gets a fiery enhancement!
items.food.alienpod.toxic_msg=Your weaponry gets a toxic enhancement!
items.food.alienpod.para_msg=Your defences get a boost!
items.food.alienpod.desc=It does nothing by itself. Try combining it with plasmids in a fabricator.
items.food.alienpod.desc_made=The dead alien bug has absorbed the plasmid and become a xeno booster.\n\nIt's ready to use!
items.escapepodoverride.name=escape pod override
items.escapepodoverride.ac_end=LAUNCH ESCAPE POD
items.escapepodoverride.rankings_desc=Obtained the escape pod override
items.escapepodoverride$catrescue.rankings_desc=Escaped Pixel Spacebase with the station cat
items.escapepodoverride$corestabilization.rankings_desc=Stabilized Pixel Spacebase and rescued the survivors
items.escapepodoverride.desc=This command override releases the last working escape pod from Pixel Spacebase's sealed evacuation systems. It can launch immediately, though its deeper authority can also reopen sealed rescue cradles from life-sign terminals on floors 1, 6, 11, 16, and 21. Leaving now means abandoning that chance.
items.clone.name=clone
items.clone.ac_upgrade=UPGRADE
items.clone.upgrade=You upgrade the clone.
items.clone.desc=Keep this clone trigger close and when you die the ship computer will create a clone with your memories up to this point. If you upgrade this clone with a full medigel container, the ship will recreate your items and strengthen the clone.
items.clone.desc_upgraded=Keep this clone trigger close and when you die the ship computer will create a clone with your memories up to this point. The clone has been upgraded and the ship will recreate your items along with a perfect, strenghtened copy of you.
items.trainingmanual.name=mastery scripts
items.trainingmanual.ac_read=READ
items.trainingmanual.way=You study the scripts and choose the path of the %s.
items.trainingmanual.desc=A compact training codex filled with advanced combat doctrines, field procedures, and specialist drills.\n\nReading it will let you choose one of two mastery paths for your current class.
items.medigeldroplet.name=medigel droplet
items.medigeldroplet.value=%+dHP
items.medigeldroplet.already_full=You already have full health.
items.medigeldroplet.desc=A bead of clear medigel from the station's emergency systems.\n\nThe nanites inside provide minor restorative properties.
items.enhancementchip.name=enhancement chip
items.enhancementchip.ac_enhance=ENHANCE
items.enhancementchip.prompt=Select an armor to enhance
items.enhancementchip.identify=You must identify that %s first.
items.enhancementchip.malfunctioning=That %s is malfunctioning, the chip can't be applied.
items.enhancementchip.enhanced=You enhanced your %s
items.enhancementchip.desc=This enhancement chip has been developed by an ancient alien race. Using it you can enhance your armor.\n\nWARNING: you have no choice as to what enhancement it will be.
items.torchbattery.name=utility battery
items.torchbattery.ac_recharge=RECHARGE
items.torchbattery.ac_eat=EAT
items.torchbattery.no_torch=You don't have a depleted torch to recharge.
items.torchbattery.recharged=You slot a fresh battery into the %s.
items.torchbattery.desc=A compact power cell for portable equipment. It restores a utility torch to full charge or powers one activation of a wormhole generator.
###Tower
items.artifacts.brokenhourglass.name=Broken hourglass
items.artifacts.brokenhourglass.desc=What seems to be something you would find in an abandoned mansion is actually a magical relic of the past: though broken, the hourglass has a strange aura, with sand in it seemingly glowing.\n\nIn its current state, this artifact is not powerful enough to do anything, perhaps, fixing it would bring it to its former glory?\n\nFixing the clock requires _%d_ gold.
items.artifacts.brokenhourglass.no_gold=You don't have enough gold to fix the hourglass!
items.artifacts.brokenhourglass.ac_fix=FIX
items.artifacts.brokenhourglass.upgraded=The hourglass seems to be working again!
items.artifacts.roseseed.name=Rose bush seed
items.artifacts.roseseed.desc=A seed with a small rosebud growing out of it. Being just a dormant seed, this one seems to be much more...alive? So much alive you can even hear whispers when put it to your ear. What would happen if you plant it?
items.herospells.herospell.cooldown=You are on cooldown and cannot use abilities yet!
items.herospells.herospell.cost=Using this ability gives an ability cooldown of _%1$d_ turns
items.herospells.herospell.ac_cast=CAST
items.herospells.herospelltargeted.cell_choose=Choose a cell to cast a spell on:
items.herospells.herospelltargeted.cell_in_view=You can cast only on passable cells in your view!
items.herospells.abimmortality.name=Immortality
items.herospells.abimmortality.desc=The hero breaks an ankh, _becoming resistant to all damage_ for a short time. Due to the holy aura most enemies will ignore you while the spell is active.
items.herospells.abtrarrowvolley.name=Arrow volley
items.herospells.abtrarrowvolley.desc=All your crossbows shoot above enemy waves and strike the point specified, hitting the enemy, if it is present on that position, several times. Damage and the number of arrows scale with the number and type of crossbows you have.
items.herospells.abtrarrowvolley.cost=Using this ability gives an ability cooldown of _%1$d_ (the number increases by _%2$d per crossbow present_) turns
items.herospells.abtrarrowvolley.no_crossbow=You have no crossbows to shoot a volley from.
items.herospells.abtrbombvolley.name=Bomb volley
items.herospells.abtrbombvolley.desc=All of your cannons strike the place specified. They are not really precise, which may help in covering large areas, especially if you have a lot of cannons.
items.herospells.abtrbombvolley.cost=Using this ability gives an ability cooldown of _%1$d_ (the number increases by _%2$d per cannon present_, immensely increases per arcane nuke present) turns.
items.herospells.abtrbombvolley.no_cannons=You have no cannons to shoot a volley from.
items.herospells.abtrgreatwall.name=Great wall
items.herospells.abtrgreatwall.desc=This spell fills the gaps between adjacent walls with magic energy, giving each wall a shield based on HP of other walls nearby. This HP can far excess the HP of the affected wall, being much more effective when several strong walls are connected.
items.herospells.abtrgreatwall.cost=an ability cooldown of _%1$d_ (the number increases by _%2$d per wall present_) turns.
items.herospells.abtrovercharge.name=Overcharge
items.herospells.abtrovercharge.desc=Fills all of your stationary magic missile wands with mana overflow, making them attack _10_ times faster than usual. The effect is both expensive and short-lasting, so it is advised to overcharge only in dire situations.
items.herospells.abtrovercharge.cost=Using this ability gives an ability cooldown of _%1$d_ (the number increases by _%2$d per wand present_) turns.
items.herospells.abtrlightningstrike.name=Lightning strike
items.herospells.abtrlightningstrike.desc=Creates a lightning bolt at the current spot, hitting a single target present on it and stunning it for a bit. The cost becomes lower with the amount and level of lightning towers you have, while the damage is based only on depth.
items.herospells.abtrlightningstrike.cost=Using this ability gives an ability cooldown of _%1$d_ (the number decreases with the total power of lightning towers, down to _%2$d_) turns.
items.herospells.abtrlightningstrike.damage=At your current hero level, the lightning strike deals _%1$d-%2$d_ shock damage.
items.herospells.abtrnullify.name=Nullify
items.herospells.abtrnullify.desc=Nullifying is a powerful magic which syphons magical abilities of the target affected. Anybody touched by such effect will be immune to most effects, both positive and negative, and some of its innate abilities, such as duplication on hit or blocking abilities. Moreover it will create "molecular breaches" in the targeted characters armor, rendering their physical protection useless for most, if not all, physical interactions.\n\nThis spell makes your disintegration wands apply the same effect for a long duration.
items.herospells.abtrangerthedead.name=Anger the dead
items.herospells.abtrangerthedead.desc=Why focus on reviving spirits of warriors and reforming their bodies, when you can charge these souls into battle directly! This spell summons an explosive skull from each grave you have.
items.herospells.abtrorder.name=Target order
items.herospells.abtrorder.desc=All guards at once are ordered to defend/go to a specified point, whereever they are.
items.herospells.abtrdartgunally.name=Dartgun ally
items.herospells.abtrdartgunally.desc=This fella is trying his best...\n\nSummons a living level 1 dartgun to assist in battle. This spell becomes cheaper with depth increase.
items.herospells.abtrdartgunally.no_space=There was no place around to summon a dartgun! The ritual has fail'eth, you snoooze you looose. Now sit with no mana whatsoever.
items.herospells.abtrplanb.name=Plan B
items.herospells.abtrplanb.desc=All of your roguelogs instantly explode with double the power.
items.herospells.abtrhyperats.name=Hyperats
items.herospells.abtrhyperats.desc=Sometimes, increasing the quality of soldiers is a necessity, especially when it comes to the weakest mobs in the sewers. Next summoned wave of rats from your tents will consist of only champion rats.
items.herospells.abtrhyperats.cost=Using this ability gives an ability cooldown of _%1$d_ (the number increases by _%2$d + 5th wave cooldown per rat camp present_, with a base of 100 without any camp counts) turns.
items.quest.ceremonialcandle.lit=The candles placed created a circle and are now magically lit! Perhaps, something needs to be put inside that circle...
items.quest.corruptedooze.name=Corrupted ooze
items.quest.corruptedooze.ac_drink=DRINK
items.quest.corruptedooze.desc=This potion is made from purest forms of corrupted mana, condensed into a liquid form. Drinking it will infuse you with evil magic, making your attacks stronger at a cost of a portion of your soul. 
items.quest.vilebloom.name=Vilebloom
items.quest.vilebloom.ac_eat=EAT
items.quest.vilebloom.desc=A pile of flowers, given by the witch. Vilebloom is a rare plant which feeds of dark magic from the soil it grows on. It is usually used by assassins to poison victims, or necromancers to control undead spawns.\n\nPlant's effects differ on different creatures: _dark and undead entities_ are infused with cursed power, becoming stronger, _living beings_ weaken and die soon after applying it, magical creatures become corrupted and most of the time die instantly.
items.scrolls.scrollofskulls.name=scroll of skulls
items.scrolls.scrollofskulls.desc=Reading the scroll summons several hero-following skull projectiles which will target any enemy that comes close, exploding on contact. Those don't damage allies and disorient the target they hit, while also throwing every enemy affected by the explosion back.
items.scrolls.scrollofskulls$explosiveskull.name=Explosive skull
items.scrolls.scrollofskulls$explosiveskull.desc=This floating skull is filled with energy and is ready to burst with it on impact
items.scrolls.exotic.scrollofholynova.name=scroll of holy nova
items.scrolls.exotic.scrollofholynova.desc=_Holy nova_ is a powerful spell of the divine school of magic, which banishes all evil near its user. Upon reading, every single undead or demonic entity in reader's view is _severely harmed_, all cursed equipment inside reader's inventory is _uncursed_ and all living allies are _blessed_ (except undead allies that still get yeeted).
items.scrolls.exotic.scrollofholynova.procced=You are engulfed in holy light!
items.scrolls.exotic.scrollofholynova.procced_noteffective=Something hinders your ability to cast the scroll. Nevertheless, some light rays shine on your surroundings.
items.scrolls.exotic.scrollofdemonicskull.name=#9scroll of demonic skulls#9
items.scrolls.exotic.scrollofdemonicskull.desc=This scroll contains incredible destructive energy that focuses into a skull shape. Reading it will create a demonic skull which will follow the hero. When any foe comes very close, the skull will rush to it and nuke it into oblivion.\n\n The catch is the skull's explosion also affects your towers and the hero, with the same insane damage it does to enemy units. Killing the skull will also result in an explosion.
items.scrolls.exotic.scrollofdemonicskull$explosivedemonicskull.name=Demonic skull
items.scrolls.exotic.scrollofdemonicskull$explosivedemonicskull.desc=Also known as the "Nuclear warHeads", those skulls fill everyone who sees them with primal fear. Such a skull deals overwhelming damage
items.stuff.bloodcrystal.name=#1Blood crystal#1
items.stuff.bloodcrystal.desc=A crystal dropped from the portal's eye upon its destruction. It reeks of demonic energy, but is seemingly dormant at the same time.\n\nIt would definitely sell well, but with all the power it has, might it have another purpose?
items.towerspawners.spawnercamp.name=Rat camp kit
items.towerspawners.spawnercrossbow.name=crossbow setup kit
items.towerspawners.spawnercrossbow.desc=Light automatic crossbow turret with low damage and good range. Usual stats: \n\nMax tower HP: _50_\nDamage: _2-5_\nAccuracy: _120%_\nAttack speed: _111%_ \nRange: _9_\n\nThrow to a cell to place a LVL 1 Crossbow
items.towerspawners.spawnerwand.name=stationary wand toolkit
items.towerspawners.spawnerwand.desc=A tower with decent damage that ignores foes' damage reduction. Usual stats: \n\nMax tower HP: _40_\nDamage: _4-5_\nAccuracy: _250%_\nAttack speed: _50%_ \nRange: _7_\n\nThrow to a cell to place a LVL 1 Stationary wand
items.towerspawners.spawnerwall.name=wall setup kit
items.towerspawners.spawnerwall.desc=Summons a tower with higher defense, but no offensive capabilities. Is cheaper and can distract enemies if on their path. Usual stats: \n\nMax tower HP: _50_\nDefense: _1-2_\n\nThrow to a cell to place a LVL 1 wall.
items.towerspawners.spawnergrave.name=grave ritual kit
items.towerspawners.spawnergrave.desc=Summons a magical gravestone that can summon friendly skeletons. Usual stats: \n\nMax tower HP: _30_\nMinion HP: _20_\nMinion Damage: _2-4_\n\nThrow to a cell to place a LVL 1 Grave
items.towerspawners.spawnercannon.name=cannon setup kit
items.towerspawners.spawnercannon.desc=A tower with area damage, that lacks in range. Its bomb's explosions also push enemies around sometimes.\n\nMax tower HP: _30_\nDamage: _2-7_ (half damage in a _3x3_ area around the shot point)\nAccuracy: _1000%_\nAttack speed: _66%_ \nRange: _6_\n\nThrow to a cell to place a LVL 1 Cannon
items.towerspawners.spawnertotemnecrotic.name=Necrotic totem
items.towerspawners.spawnertotemnecrotic.desc=Those totems are quite rare and are used to preserve the souls of dying people. If their magic is twisted, it can enslave those souls instead.\n\nAll foes near to the totem (9x9 range)get turned into wraith minions when low on hp.
items.towerspawners.spawnertotemhealing.name=Healing totem
items.towerspawners.spawnertotemhealing.desc=Healing totems are actually not about healing, but entropy recovery. Every thing that is affected by their aura gets back to the condition it was in before: wounded are healed, broken is fixed and old are becoming younger.\n\nAll allies near the totem (3x3 range) get rapidly healed.
items.towerspawners.spawnertotemattack.name=Berserk totem
items.towerspawners.spawnertotemattack.desc=Small versions of those totems are used by real berserkers to make their muscles stronger and reflexes faster. This bigger version affects all units around.\n\nAll nearby (5x5 range) units get empowered for a short duration every few turns.
items.towerspawners.spawnertotemshield.name=Shield totem
items.towerspawners.spawnertotemshield.desc=Some dungeons have a protection totem right next to the entrance to give beginning dungeoneers a starter boost. Such power is also very good in battle conditions, protecting your allies from any harm.\n\nAll allies in a 5x5 range get shielded every few turns.
items.towerspawners.spawnerlightning.name=lightning rod kit
items.towerspawners.spawnerdisintegration.name=Chaos obsidian kit
items.towerspawners.spawnerguard.name=magic guard bubble
items.towerspawners.spawnertntlog.name=deployable TNT log
items.towerspawners.spawnerdartgun.name=deployable dart turret
items.towerspawners.towerspawner.towersnear=You can't place towers near other towers (5x5 area)
###spsw
items.food.vegetable.nutvegetable.name=nut vine
items.food.vegetable.nutvegetable.desc=A common vegetable, usually used in cooking. Even with out cooking it tastes delicious.
items.misc.miscequippable.2miscs=you can only wear 3 misc items at a time
items.misc.miscequippable.desc=This is a misc item.
items.potions.potionofmending.name=potion of mending
items.potions.potionofmending.effect=your wound heal fast.
items.potions.potionofmending.desc=Drink it will make you heal fast.
items.wands.wandoffirebolt.name=Wand of Firebolt
items.wands.wandoffirebolt.desc=This _fire type_ wand is made from red-lacquered wood with golden leaf used liberally to make it look quite regal. It crackles and hisses at the tip, eager to unleash its powerful magic.
items.wands.wandoffirebolt.stats_desc=This wand shoots a bolt of fire that sets the target and anything flammable in its path alight. The bolt deals _%1$d-%2$d damage_.
items.wands.wandoffreeze.name=Wand of Freeze
items.wands.wandoffreeze.desc=This _water type_ wand seems to be made out of some kind of magical ice. It grows brighter towards its rounded tip. It feels very cold when held, but somehow your hand stays warm.
items.wands.wandoffreeze.stats_desc=This wand shoots blasts of icy energy toward your foes, dealing _%1$d-%2$d damage_ and chilling, which reduces speed. The effect seems stronger in water. Chilled and frozen enemies take less damage from this wand, as they are already cold.
items.wands.wandofflow.name=Wand of Flow
items.wands.wandofflow.desc=The _water type_ wand is shorter than the ordinary wand, but there is a small fountain at the top of this wand.
items.wands.wandofflow.stats_desc=The stick can spray a powerful flow of water into the target site, knocking off the target, deals _%1$d-%2$d damage_ and wetting it.
items.weapon.enchantments.enchantmentice.name=coldwave %s
items.weapon.enchantments.enchantmentice.desc=This enchantment slowing enemy's' movement and attacks. It also will dear many ice damage.
items.weapon.enchantments.enchantmentice2.name=ice %s
items.weapon.enchantments.enchantmentice2.desc=This enchantment causes frost to enemies. It also will dear less ice damage.
items.weapon.guns.gund.name=Type D - Fusil
items.weapon.guns.gund.desc=A smoothbore weapon straight from the royal manufactories. Its high accuracy makes up for the fair amount of time it takes to recharge as well as for its rarity. Pride of the soldiers! --Juh9870\nIn fact, this weapon is made base on this introduce. Tower test it on city.
items.weapon.missiles.throwing.shitball.name=Dirt ball
items.weapon.missiles.throwing.shitball.desc=This thing is full of strange garbge. When it is thrown on the ground, it will make a great noise and attract the surrounding monsters. The guy who gets hit will be affected by old buff.
items.weapon.missiles.arrows.glassfruit.name=Glass fruit
items.weapon.missiles.arrows.glassfruit.desc=cause bleeding.\nArrow
items.unblessankh.name=unbless ankh
items.unblessankh.ac_bless=BLESS
items.unblessankh.bless=You bless this ankh with dew water.
items.unblessankh.desc=This item can't save your life.
items.stoneore.name=stone ore
items.stoneore.desc=Simple stone can be used on cooking or sell for money.
items.misc.fourclover.name=Four-leaf Mint Necklace
items.misc.fourclover.desc=This four-leaf clover necklace can give wearer something when he level up, and  increasing enchanted equipment's chances to be activated.
items.sellitem.sheepfur.name=sheep fur
items.sellitem.sheepfur.desc=A sheep fur.

###spsw
items.heap.mimic=This is a mimic!
items.heap.e_dust=mound
items.heap.e_dust_desc=A simple mound.
###Magic Ling PD
items.armor.armor.stats_desc=
items.quest.sakafishsketon.name=Sakaban Turtle Skeleton
items.quest.sakafishsketon.desc=This poor creature has been here for many years, and its body is already broken. It seems that it just wants to return to the ground to take a look..., this item seems to be very attractive to merchants. \n\nAfter returning from the ancient ruins, you feel that this bone seems to have life, but it seems to be missing something. This little life seems to need water. After all, water is the source of life.
items.quest.sakafishsketon.saka=Reborn?
items.quest.sakafishsketon.wnd_body=This little life is trying to break out of its bones. You just need to give it a healing potion to help it.
items.quest.sakafishsketon.wnd_set=Give Help
items.quest.sakafishsketon.wnd_return=Not given yet
items.quest.sakafishsketon.you_must_potion=You must carry at least one healing potion in your inventory to proceed.
items.quest.sakafishsketon.saka2=Silence again?
items.quest.sakafishsketon.wnd2_body=Are you sure you want to put the Sakaban turtle baby to sleep again? You will gain some supplies, but will be on a long cooldown.
items.quest.sakafishsketon.wnd2_set=Execute immediately
items.quest.sakafishsketon.wnd2_return=My hand slipped
items.quest.sakafishsketon.ac_summonfish=Awaken
items.quest.sakafishsketon.ac_summonfishdied=Sleep
items.quest.sakafishsketon.you_active=You inject the essence of the healing potion into the bones, and you feel the fish bones are emitting a dark yellow glow...
items.quest.sakafishsketon.pets_died=The baby Sakafishsketon is becoming more and more transparent..., but you find it holding a stone in its mouth before it disappears.
items.quest.sakafishsketon$cooldownstonerecharge.name=Regenerative Cooldown
items.quest.sakafishsketon$cooldownstonerecharge.desc=Since you have just put the Sakaban Turtle Baby to sleep, it will take some time for the Sakaban Turtle Baby to gather strength again.\n\nRemaining charging time: %s turns.
items.quest.sakafishsketon.charged=Your Sacabambaspis baby is ready!
items.quest.dogstick.name=Dog Whistle
items.quest.dogstick.desc=An exquisite dog whistle. This item seems highly appealing to merchants.\nYou sense a connection between this dog whistle and some being. If you blow it, it will hear.
items.quest.dogstick.dog=Blow the whistle?
items.quest.dogstick.wnd_body=This puppy has found you. You only need to give it a bottle of Liquid Flame Potion, and it will gladly follow by your side and witness your adventures.
items.quest.dogstick.wnd_set=Give Potion
items.quest.dogstick.wnd_return=Not given yet
items.quest.dogstick.you_must_potion=You must carry at least one Liquid Flame Potion in your backpack to continue.
items.quest.dogstick.dog2=Part ways?
items.quest.dogstick.wnd2_body=Are you sure you want to part ways with Little Cerberus for now? This puppy doesn't seem to want to leave you...
items.quest.dogstick.wnd2_set=Cruel parting
items.quest.dogstick.wnd2_return=Can't bear to part
items.quest.dogstick.ac_summondog=SUMMON
items.quest.dogstick.ac_summondogdied=Return
items.quest.dogstick.you_active=You hold the Liquid Flame Potion and blow the whistle. Crimson flames suddenly surge up, and a Little Cerberus flickers in and out of sight within the flame shadows...
items.quest.dogstick.pets_died=With a faint whimper, Little Cerberus's form gradually fades away within the flames...
items.quest.dogstick$cooldownstonerecharge.name=Spark cooling
items.quest.dogstick$cooldownstonerecharge.desc=Since you just sent Little Cerberus away, it needs some time to perk up again.\nRemaining energy recharge time: %s rounds.
items.quest.dogstick.charged=Your Little Cerberus is full of vitality!
items.wands.wand.summon=Select the location to summon
items.bags.kingbag.name=Weapon & Armor Backpack
items.bags.kingbag.desc=A large backpack specially designed for storing melee weapons and armor, crafted using a long-lost mystical magic from the Frostfall Empire.
items.wands.wand.no_holo=The damage to your inner demons has affected your spirit, and your magic power has dissipated before it can gather...
items.gold.ling=converted to %d gold coupons
items.food.tomb.gravemeat.name=Rotten Meat
items.food.tomb.gravemeat.desc=A piece of meat that hasn't rotted too badly yet. It should be possible to turn it into normal meat through alchemy. You can eat it directly if you must, but at your own risk.
items.food.tomb.gravemeat.eat_msg=The stench of the rotten meat lingers in your mouth for a long time, and a chill pours straight into your stomach...
items.food.tomb.gravemeat.poison=The virulent poison in the rotten meat seeps through your throat into your limbs and bones—you are Poisoned!
items.food.tomb.gravemeat.vertigo=The putrid fumes rush to your head, the world spins before your eyes—you are struck with Vertigo!
items.food.tomb.gravemeat.corrosion=The corrosive slime seeping from the rotten meat sticks to your skin, continuously eating away at your body!
items.food.tomb.gravemeat.weakness=The decaying aura drains your strength, leaving you in prolonged Weakness!
items.food.tomb.gravemeat.downlevel=Your vital energy is suppressed by the putrid aura, temporarily reducing the effectiveness of your equipped gear!
###magicling
items.scrolls.extra.scrollofsoul.name=灵魂卷轴
items.scrolls.extra.scrollofsoul.desc=这张卷轴拥有着恐怖的灵魂力量，足以使阅读者获得强大而持久的力量，获得_%s回合升灵_\n\n但由于失去了制作者的魔力蕴养，会快速失去效力_每携带20回合，给予的升灵回合数额外减少1回合_\n由于这张卷轴有专属标识，所以无需被鉴定。
items.scrolls.extra.scrollofsoul$upgradesoul.name=升灵
items.scrolls.extra.scrollofsoul$upgradesoul.desc=免疫所有负面效果_饥饿、遗物带来的效果除外_，攻速和移速x2\n\n效果持续期间每击杀一只怪物，永久提升 2%% 攻击力与 2%% 免伤，免伤提升上限 90%%\n\n剩余效果时间：%s回合\n攻击增幅：%s%%\n免伤增幅：%s%%
items.quest.devitem.magicbook.name=未尽的故事集
items.quest.devitem.magicbook.desc=上面记有不少未完成的故事，有些刚刚开始，有些接近尾声。\n根据书页上写的时间戳，似乎每天都有人为这些故事再添上几笔。\n在这本书的尾页，有明显是刚写的几个字:_“都看到这里了，快祝我生日快乐喵！！！”_\n\n携带这件物品会在夜间行动时获得特殊效果，有效时间是每年的5.14-5.21（公历）
items.quest.lingjing.name=棱镜
items.quest.lingjing.desc=物品在背包时，满血状态下，每75回合产生20点护盾。\n\n仅在最大深度为10层前生效。
items.quest.smalllightheader.name=微光向导
items.quest.smalllightheader.desc=好的实验就有好的结果，这从炼金釜中诞生的小家伙可以为它的主人找到下一层的入口。
items.quest.smalllightheader.ac_summonfish=召唤微光
items.quest.smalllightheader.thanks=_-_ 设计：水银灯\n\n_-_ 赛道：炼金乐园\n\n_-_ 奖项：_飞燕奖_--赛道第二名\n\n_-_ [赛年：第一届惊鸿杯DIY大赛[
items.quest.clearcrystal.name=暗淡的纯晶碎片
items.quest.clearcrystal.desc=在剑冢中寻找到的碎片，你不清楚有何作用……
items.quest.clearhstal.name=幽蓝的纯晶元素
items.quest.clearhstal.desc=在与火龙交战结束后，原先暗淡的碎片变得明亮了起来。这是否代表了什么？
items.quest.dragonheart.name=火龙之心
items.quest.dragonheart.desc=火龙的心脏，摸起来还有些烫手。\n\n上面也能看到些许侵蚀的痕迹......
items.weapon.melee.dragonshiled.name=龙血鳞片
items.weapon.melee.dragonshiled.typical_stats_desc=这件武器通常能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.dragonshiled.stats_desc=这件武器能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.dragonshiled.desc=火龙鳞片的一部分，鳞片的温度始终不散。万幸的是鳞片的背面并不算烫手，也许可以用作盾牌。在手持它时，你感到有一种神秘的魔法在保护着你。
items.weapon.melee.dragonshiled.ability_name=最终护卫
items.weapon.melee.dragonshiled.ability_desc=艾诺琳娜可以用龙血鳞片_最终护卫_自己，在 10 回合内完全抵挡下一次针对自己的物理或魔法攻击。
items.weapon.melee.thanks.grilledherring.name=烤鲱鱼
items.weapon.melee.thanks.grilledherring.desc=焦香四溢，滋滋冒油，热气腾腾。你很确定这把武器不能当成普通的烤鲱鱼看待，但它看起来很香。
items.weapon.melee.thanks.grilledherring.typical_stats_desc=你可以食用这条烤鲱鱼_%d次_，每次恢复50饱食度，食用次数耗尽后变为鱼骨。\n\n你只能食用_鉴定过的、无诅咒_的烤鲱鱼。 }\n烤鲱鱼的每一次升级都会为其增加1次食用次数。}
items.weapon.melee.thanks.grilledherring.ac_eatfish=小啃一口
items.weapon.melee.thanks.grilledherring.eat_msg=这把武器太香了，你忍不住啃了一口，虽说不能填饱肚子，但至少能缓解一下饥饿……
items.weapon.melee.thanks.grilledherring.stats_desc=你最终没能经受住饥饿的考验。好在它真的很香。现在它变成了鱼骨，虽然它没有以前锐利，但攻击可以对敌人造成{每次伤害值50%的流血{效果。\n}如果你现在升级它，烤鲱鱼的每一次升级都会为其增加1次食用次数。}
items.weapon.melee.thanks.grilledherring.thanks=_-_ 设计：W\n\n_-_ 赛道：百炼成钢\n\n_-_ 奖项：_惊鸿奖_--赛道第一名\n\n_-_ [赛年：第一届惊鸿杯DIY大赛[
items.weapon.melee.thanks.grilledherring.ability_name=顺劈
items.weapon.melee.thanks.grilledherring.typical_ability_desc=艾诺琳娜可以用烤鲱鱼_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.thanks.grilledherring.ability_desc=艾诺琳娜可以用烤鲱鱼_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.seekingspear.name=寻觅长枪
items.weapon.melee.seekingspear.stats_desc=这件武器的攻击异常致命，对付未察觉的敌人时尤然。\n这把武器有额外的攻击距离，这把武器拥有暴击效果。
items.weapon.melee.seekingspear.desc=赤红色的枪刃仿佛在渴求鲜血，而当枪身躁动不安的时候，你更确定了这一点。
items.weapon.melee.seekingspear.crit=暴击
items.weapon.melee.seekingspear.ability_name=刺退
items.weapon.melee.seekingspear.ability_desc=艾诺琳娜可以用寻觅长枪_刺退_在射程内但不与艾诺琳娜相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.seekingspear.typical_ability_desc=艾诺琳娜可以用寻觅长枪_刺退_在射程内但不与艾诺琳娜相邻的敌人，一般造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.seekingspear.prompt=选择射程内的目标
items.weapon.melee.legend.moondao.name=月刃
items.weapon.melee.legend.moondao.desc=这把刃型如月牙般的双刀挥舞速度奇快，一旦命中要害，必死无疑。
items.weapon.melee.legend.moondao.stats_info=这件武器在偷袭时更为有效，并在偷袭成功时百分百给目标施加寒冷效果。这是一对攻速很快的武器，这件武器攻击时附带招架附魔。
items.weapon.melee.legend.moondao.ability_name=奥盾双刃
items.weapon.melee.legend.moondao.ability_desc=艾诺琳娜在血量低于 80% 时可以使用月刃进行_奥盾双刃_攻击。这种攻击必定命中，且造成 +40% 伤害，且艾诺琳娜获得_10点奥术护盾_。
items.weapon.melee.legend.ricesword.name=糯米大剑
items.weapon.melee.legend.ricesword.desc=你能感觉到这把大剑有糯米的香味，这把剑的属性成长根据你的饥饿度发生变化。这个武器有额外的攻击距离。
items.weapon.melee.legend.ricesword.ability_name=重击
items.weapon.melee.legend.ricesword.ability_desc=艾诺琳娜可以用糯米大剑使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.legend.ricesword.typical_ability_desc=艾诺琳娜可以用糯米大剑使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.whiteblastsword.name=白浪刺剑
items.weapon.melee.whiteblastsword.desc=一位审判官曾使用的武器，有着_强大的力量_，仅仅是握着它你就使你充满了坚定的决心。
items.weapon.melee.whiteblastsword.action_name=判决
items.weapon.melee.whiteblastsword.quest_start_prompt=使得以自身为中心周围8格的敌人获得2回合漂浮并对其进行3次必中的攻击。
items.weapon.melee.whiteblastsword.open_attack=释放技能
items.weapon.melee.whiteblastsword.not=暂不释放
items.weapon.melee.whiteblastsword.roll1=我的灯将净化邪恶！
items.weapon.melee.whiteblastsword.roll2=我的剑将劈开海潮！
items.weapon.melee.whiteblastsword.roll3=我的心会作出判决。
items.weapon.melee.whiteblastsword.ability_name=风袭
items.weapon.melee.whiteblastsword.typical_ability_desc=艾诺琳娜可用白浪刺剑对1格内的敌人使出_风袭_。使得目标浮空一回合并对其进行两次必定命中的攻击。\n\n该技能会消耗 2 点充能。
items.weapon.melee.whiteblastsword.ability_desc=艾诺琳娜可用白浪刺剑对1格内的敌人使出_风袭_。使得目标浮空一回合并对其进行两次必定命中的攻击。\n\n该技能会消耗 2 点充能。
items.weapon.melee.whiteblastsword.prompt=选择攻击范围内的目标
items.weapon.melee.whiteblastsword.ability_no_target=没有有效的目标！
items.weapon.melee.whiteblastsword.dev_desc=空灵：被动技能，装备白浪刺剑时，所有敌人在漂浮时会被持续施加麻痹（麻痹消失时立刻再次施加，永控），攻击命中时使敌人漂浮1回合，冷却7回合。\n当前冷却：_%s_\n\n弑羽：被动技能，对处于空中的敌人造成物理伤害时无视其50%%防御力。攻击未命中或被格挡后立刻追加一次额外的攻击（不消耗回合），无法连续触发。\n\n判决：主动技能，使以自身为中心八格范围内所有不处于空中的敌人漂浮2回合，随后对这一范围内的敌人各进行3次必中攻击。\n这个技能需要30点充能来开启，每次攻击（无需命中）获得1点，处于空中的敌人死亡时获得4点。\n当前充能：_%d_。
items.weapon.melee.legend.saiplus.name=肃杀
items.weapon.melee.legend.saiplus.desc=你能隐隐察觉到这把匕首散发出的杀戮气息，如死神般恐怖。
items.weapon.melee.legend.saiplus.success=%s的肃杀偷袭一击，回血成功！
items.weapon.melee.legend.saiplus.stats_info=这把武器在偷袭时造成更高伤害，且偷袭成功概率恢复生命，对于低血量的敌人概率触发死神附魔的秒杀。
items.weapon.melee.legend.saiplus.ability_name=潜行
items.weapon.melee.legend.saiplus.typical_ability_desc=艾诺琳娜握持肃杀时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多4格远，并一般给予_%d回合隐形_。
items.weapon.melee.legend.saiplus.ability_desc=艾诺琳娜握持肃杀时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多4格远，并给予_%d回合隐形_。
items.weapon.melee.legend.saiplus.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.legend.goldlonggun.name=黄金长枪
items.weapon.melee.legend.goldlonggun.desc=堤喀眷顾之人才能找到的武器，给予使用者无与伦比的祝福。\n\n这个武器有额外的攻击距离。\n这个武器有50%-100%的伤害修正\n这个武器对恶魔与亡灵会额外造成33%的伤害
items.weapon.melee.legend.goldlonggun.bless_desc=这个武器在命中非相邻的敌人时，获得_%d回合_的赐福
items.weapon.melee.legend.goldlonggun.typical_bless_desc=这个武器在命中非相邻的敌人时，获得_%d回合_的赐福
items.weapon.melee.legend.goldlonggun.ability_name=黄金穿刺
items.weapon.melee.legend.goldlonggun.ability_desc=艾诺琳娜可使用黄金长枪_黄金穿刺_一个敌人。黄金穿刺必定命中，同时施加 2 回合的易伤，且会对有硬质表皮的敌人造成双倍伤害。如果本次击杀敌人，则获得一定的金币奖励！
items.weapon.melee.legend.goldlonggun.gold=黄金穿刺让你击杀了敌人，你获得了%d金币。
items.weapon.melee.legend.goldlonggun.ability_target_range=所要攻击的目标距离太远……
items.books.questbookslist.hollowcitybook.name=”未署名“的邀请
items.books.questbookslist.hollowcitybook.desc=诸位，诚邀各位前往我的古堡进行一场狂欢盛宴。
items.books.questbookslist.hollowcitybook.ac_read=阅读
items.books.questbookslist.hollowcitybook.quest_start_no=只能在26层进行阅读！
items.quest.unsignedinvitationletter.name=未署名的邀请函
items.quest.unsignedinvitationletter.desc=邀请函上并没有任何人的签名，只有一些奇怪的符号。你也无法拆封这个邀请函，还是先携带上再说吧。
items.quest.unsignedinvitationletter.rankings_desc=古堡结局：冥河惊魂
items.quest.unsignedinvitationletter.hollow_city_1=冥河战斗后，%s开始对古堡越发的感兴趣。而地表的血月依然高悬，这一切尚未结束，不过现在，还是先离开这里再说吧……
items.quest.blessingnecklace.name=祝福项链
items.quest.blessingnecklace.desc=来不及制作了，就是送一个祝福的十字架。
items.quest.devitem.crystalling.name=水晶项链
items.quest.devitem.crystalling.desc=这个紫色项链下挂着一块蓝紫色的琉璃，当光线透过水晶，水晶的中间仿佛也亮堂了起来。\n\n根据历史记载，翼绫使用圣洁之心创造了世界，将其一半力量分给了三使者后，又让他们将另一半铸造为水晶之心。\n\n圣洁之心并没有常规意义上的实体，尽管没有人真正见过水晶之心，但人们还是按照传说中的模样复制出了这个项链。\n\n他们在翼绫的生日这天制造这种水晶项链，以此寻求着创世神的祝福。至少他们也在用自己的方式寻求着自己的未来。\n\n你知道这块水晶并不能给你带来什么，但是，当你握住这块水晶时，你仍然感觉心里踏实了许多。\n\n_你能感受到上面有澪的气息，携带这个项链能让你的伤口愈合的更快。_
items.quest.devitem.crystalling.active=\n\n此为MLPD制作团队主要开发者-Ling生日物品\n\n有效加成时间:8.22-8.25(阴历)
items.quest.devitem.crystalling.end=\n\n开发者Ling的生日活动已经结束,该物品的所有额外加成全部失效。
items.quest.devitem.crystalling.last=\n\n今天是水晶项链的有效期最后一天，切勿错失使用良机。
items.quest.redwhiterose.name="一种载体"
items.quest.redwhiterose.desc=他们从未离开，这两束玫瑰配不上他们。\n\n情感无需载体，意志无需证明。\n\n而你也不曾放弃。
items.weapon.melee.legend.legendweapon.typical_stats_desc=这是一件_%1$s阶_传奇武器，这件传奇武器的技能通常造成为：%2$s\n这个技能通常可以造成_%3$s~%4$s点伤害_。
items.weapon.melee.legend.legendweapon.stats_desc=这是一件_%1$s阶_传奇武器，这件传奇武器的技能为：%2$s\n这个技能当前可以造成_%3$s~%4$s点伤害_。
items.weapon.melee.legend.diedcrossbow.name=重型弩炮
items.weapon.melee.legend.diedcrossbow.desc=这是一件非常精密复杂的装置，能将数个飞镖一样的小型箭矢以极高的速度射出。这把重型弩炮十分的沉重，如果使用者的力量不足可能会因为装置失灵波及到自己。其本身也相当致命，在肉搏战中可以起到很好的作用。
items.weapon.melee.legend.diedcrossbow.xdesc=_特技：战术扇形爆炸弩炮_\n\n充能完毕时，可以发射爆炸弩炮。发射后需要重新装填，通过升级可以减少装填的时间。\n\n在发射的尽头或遭遇敌对目标时立刻产生_5x5_的爆炸并造成范围伤害。每次爆炸完毕后弩炮需要_重新装填_。弩炮伤害会根据自身等级成长。 \n\n 这件武器在装备后会大幅提升飞镖的伤害。它甚至还能把自身的附魔赋予射出去的飞镖。
items.weapon.melee.legend.diedcrossbow.ac_king=战术扇形爆炸弩炮
items.weapon.melee.legend.diedcrossbow.no_cooldown=弩炮装置正在重新装填，请稍后……
items.weapon.melee.legend.diedcrossbow.no_equip=必须装备重型弩炮才能使用它，如果你是乾坤宗师，则需要切换为主武器才能使用。
items.weapon.melee.legend.diedcrossbow.ondeath=你被爆炸弩炮炸的渣的不剩了……
items.weapon.melee.legend.diedcrossbow.ability_name=充能射击
items.weapon.melee.legend.diedcrossbow.ability_desc=艾诺琳娜可以使用重型弩炮准备好_充能射击_。这个武技会立即生效，使下一发飞镖必定命中，其击中效果将会在 5*5 的范围内触发，并且涂药飞镖会更加耐用。
items.weapon.melee.legend.diedcrossbow.charge_ready=弩炮蓄力完成！下一发飞镖将触发强化效果。
items.weapon.melee.legend.diedcrossbow$chargedshot.name=充能射击
items.weapon.melee.legend.diedcrossbow$chargedshot.desc=弩炮处于蓄力状态。\n下一发飞镖必定命中，命中后在5×5范围扩散涂药效果。\n负面效果仅针对敌人，增益效果仅作用友军，不会对你自身生效。\n涂药飞镖额外获得4点使用耐久。
items.quest.sakafishsketon.name=萨卡班甲鱼骨
items.quest.sakafishsketon.desc=这个可怜的生物因为常年在此，身躯已经残破不堪。它似乎只是想回到地面看一眼而已……，这件物品对于商人似乎有很高的吸引力。\n\n从远古遗迹回来后，你感受到这个骨头似乎有生命的跃动，但貌似缺了点什么，这个小生命似乎需要水分，毕竟，水可是生命之源。
items.quest.sakafishsketon.saka=重获新生？
items.quest.sakafishsketon.wnd_body=这个小生命正在尝试破骨而出，你只需要给予一瓶治疗药水帮助它。
items.quest.sakafishsketon.wnd_set=给予帮助
items.quest.sakafishsketon.wnd_return=暂不给予
items.quest.sakafishsketon.you_must_potion=你的背包中至少携带一瓶治疗药水才能继续操作。
items.quest.sakafishsketon.saka2=再次沉寂？
items.quest.sakafishsketon.wnd2_body=你确定要让萨卡班甲鱼宝宝再次沉睡吗？你将会获得一定补给，但会陷入长时间冷却时间。
items.quest.sakafishsketon.wnd2_set=立刻执行
items.quest.sakafishsketon.wnd2_return=我手滑了
items.quest.sakafishsketon.ac_summonfish=唤醒
items.quest.sakafishsketon.ac_summonfishdied=沉睡
items.quest.sakafishsketon.you_active=你将治疗药水的精华注入骨中，你感觉鱼骨头正在发出暗黄的光芒……
items.quest.sakafishsketon.pets_died=萨卡班甲鱼宝宝正在变得越来越透明……,但你发现它在消失前嘴里衔着一颗石头。
items.quest.sakafishsketon$cooldownstonerecharge.name=再生冷却
items.quest.sakafishsketon$cooldownstonerecharge.desc=由于你刚刚已经让萨卡班甲鱼宝宝沉睡，现在需要一段时间来让萨卡班甲鱼宝宝重新凝聚力量。\n\n剩余充能时长:%s回合.
items.quest.sakafishsketon.charged=你的萨卡班甲鱼宝宝已经准备好了！
items.quest.dogstick.name=狗哨
items.quest.dogstick.desc=一个精致的狗哨。这件物品对于商人似乎有很高的吸引力。\n\n你感受到了这个狗哨与某个存在之间的联系，只要你吹响，它就会听见。
items.quest.dogstick.dog=吹响狗哨？
items.quest.dogstick.wnd_body=这头小犬找到了你，你只需要给予一瓶烈焰药水，它会很乐意跟在你的身边，见证你的冒险。
items.quest.dogstick.wnd_set=给予药水
items.quest.dogstick.wnd_return=暂不给予
items.quest.dogstick.you_must_potion=你的背包中至少携带一瓶烈焰药水才能继续操作。
items.quest.dogstick.dog2=暂时分开？
items.quest.dogstick.wnd2_body=你确定要与小刻耳柏洛斯暂时分开吗？这头小犬似乎并不想离开你……
items.quest.dogstick.wnd2_set=残忍分开
items.quest.dogstick.wnd2_return=我舍不得
items.quest.dogstick.ac_summondog=召唤
items.quest.dogstick.ac_summondogdied=遣返
items.quest.dogstick.you_active=你手捧着烈焰药水并吹响狗哨，赤焰骤然腾起，一头小刻耳柏洛斯在焰影中若隐若现……
items.quest.dogstick.pets_died=伴随着轻微的呜咽声，小刻耳柏洛斯的身形在烈焰中渐渐淡去……
items.quest.dogstick$cooldownstonerecharge.name=火种冷却
items.quest.dogstick$cooldownstonerecharge.desc=由于你刚刚已经让小刻耳柏洛斯离开，现在需要一段时间来让它重新打起精神。\n\n剩余充能时长:%s回合.
items.quest.dogstick.charged=你的小刻耳柏洛斯充满了活力！
items.food.redcrab.name=熟螃蟹
items.food.redcrab.desc=已经熟透了的螃蟹，从成色看起来应该非常美味，这是少女送给你的礼物，食用后可回复大量饥饿。
items.food.sakameat.name=萨卡班甲鱼里脊
items.food.sakameat.desc=哦……好吧，看了这个远古生物还是能吃的。
items.food.sakameat.oks=你吃了萨卡班甲鱼里脊，你感觉到了一股祝福的清流涌入了你的身体！
items.wands.wandofanmy.name=共生法杖
items.wands.wandofanmy.desc=这把法杖是由神秘的能量驱使的，它们会在能量充足的时候，使地牢的怪物臣服于你（Boss除外)。\n\n该法杖无法自动升级，无法丢弃，且在神秘能量消散时一同消散……
items.wands.wandofanmy.stats_desc=这根法杖能射出心灵控制波，\n没有任何伤害，但可以立刻控制一个怪物成为盟友。
items.wands.wandofanmy.error=不能影响Boss。
items.wands.wandofanmy$allytorestart.name=共生思维
items.wands.wandofanmy$allytorestart.desc=合作或许是一种更好的解脱方式，也许我们本不应该与人类为敌……
items.wands.wandofanmy$allytorestartok.name=共生思维
items.books.questbookslist.hollowcitybook.author=
items.weapon.melee.lifetreesword.name=倒悬的生命树
items.weapon.melee.lifetreesword.desc=克里弗斯之果破碎时，四周的藤蔓缠结在暴露出的种子上形成剑的形状。剑身触碰到生物时会汲取他们的生命力提供给种子，期待着它再次结出猩红的果实\n\n这是一个比较精准的武器。\n\n特别说明：每次攻击可汲取生命能量，攒满能量即可释放特殊技能。\n\n当前能量：%s/%s
items.weapon.melee.lifetreesword.ac_summon=召唤食人花
items.weapon.melee.lifetreesword.prompt=选择召唤位置
items.weapon.melee.lifetreesword.no_charge=没有足够的能量以释放武器的特殊战技。
items.weapon.melee.lifetreesword.bad_pos=不能将它放在墙壁、裂缝或无效地块上！
items.weapon.melee.lifetreesword.nolongrange=无法召唤，召唤位置太远。
items.weapon.melee.lifetreesword$placeholder.error=注意：倒悬的生命树必须是未装备的才能参与炼金
items.weapon.melee.lifetreesword$lifetreant.name=食人花
items.weapon.melee.lifetreesword$lifetreant.desc=丛林中的活化植物，因为丛林的异变变得异常暴躁。常常对入侵者进行毒液喷射，它们的毒液有着极强的腐蚀性，所以非常危险。且自身较为灵活，必须趁其不备将其杀掉。
items.weapon.melee.lifetreesword.ability_name=顺劈
items.weapon.melee.lifetreesword.typical_ability_desc=艾诺琳娜可以用倒悬的生命树_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.lifetreesword.ability_desc=艾诺琳娜可以用倒悬的生命树_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.food.crivusfruitsfood.name=克里弗斯幼果
items.food.crivusfruitsfood.desc=从“倒悬的生命树”中掉落的果实，吃上去有丝丝血腥味。
items.food.crivusfruitsfood.eat_msg2=你感觉味道十分不错，香甜可口，回味无穷……
items.quest.crivusfruitsflake.name=赤果碎片
items.quest.crivusfruitsflake.desc=克里弗斯之果破碎时，炸的四分五裂，但看起来大概无法食用。\n\n物品自身并没有什么实际用途，但长期的魔力汲取让它拥有一股神秘的力量，或许它能商人眼前一亮。它本身还可以用作炼金制作一些不错的东西。再不济，它也能提供相当的炼金能量。
items.weapon.melee.legend.kingaxe.name=王庭和约
items.weapon.melee.legend.kingaxe.stats_desc=这是一把十分精准的武器。
items.weapon.melee.legend.kingaxe.desc=索林生前所使用的武器，斧刃上浸满了深红色的血痕。他是军人、战士、英雄、但也有走投无路过的时候。你似乎与这柄武器建立了联系，说不定你们在某种意义上也是同路之人。\n\n每次攻击积累点数，在点数为5后下一次攻击改为常规+法术伤害并且使用者获得5回合 虚无 状态效果（法术伤害是总伤害的25%）\n\n当前攻击点数：
items.weapon.melee.legend.kingaxe$armornofear.name=虚无
items.weapon.melee.legend.kingaxe$armornofear.desc=虚无的力量包裹着你，在虚无状态下，你获得30%%的伤害减免。\n\n剩余效果时长：%s回合
items.wands.wandofsun.name = 烈阳法杖
items.wands.wandofsun.ac_dismiss = 驱散迷你太阳
items.wands.wandofsun.dissun = 未选中迷你太阳!
items.wands.wandofsun.solid = 你不能在那个地方召唤迷你太阳
items.wands.wandofsun.staff_name = 烈阳魔杖
items.wands.wandofsun.stats_desc=这根法杖会在目标地点召唤出一个迷你太阳。迷你太阳为你揭示以其为中心的7*7范围内的视野，并会对其周围敌人并造成_%1$d~%2$d点伤害_。\n\n位于一个迷你太阳之中的敌人会受到来自其他迷你太阳的额外伤害。 \n\n 迷你太阳造成的伤害会随着其与敌人的距离递减
items.wands.wandofsun.bmage_desc=当_%s_以烈阳法杖%s，能够为所有尚且存在的迷你太阳增加一回合的持续时间。
items.wands.wandofsun.hassun = 你驱散了那个迷你太阳
items.wands.wandofsun.no_more_suns = 这个法杖无法维持更多的迷你太阳。
items.wands.wandofsun$minisun.desc = \n\n这个地方矗立着一个迷你太阳，它还会持续%d回合\n\n{因地牢底层技术问题，太阳无法被保存，离开地牢后，它会消失}
items.wands.wandofsun.desc = 第一个尝试把太阳带入地下的人没有想到，死灵与恶魔其实也没有那么害怕虚假的太阳
items.wands.wandofsun.thanks=_-_ 设计：才羽绿\n\n_-_ 赛道：魔法时刻\n\n_-_ 奖项：_惊鸿奖_--赛道第一名\n\n_-_ [赛年：第一届惊鸿杯DIY大赛[
items.artifacts.goldiron.name=镀金铁锤(未完成)
items.artifacts.goldiron.ac_stonegold=stonegold
items.artifacts.goldiron.ac_onedingyi=onedingyi
items.artifacts.goldiron.ac_condontxa=condontxa
items.artifacts.goldiron.desc=这曾是巨魔铁匠的锤子，其中蕴含了神奇的力量。\n\n因为你一不小心把巨魔镐子给搞丢了,巨魔委托你去杀死他的阴暗面。\n\n如今，你已完成巨魔的委托，这镀金铁锤便是巨魔给予你的礼物……
items.bombs.laserpython.name=激光十字晶柱召唤器
items.bombs.laserpython.desc=这枚召唤器会在爆炸后立刻生成一个十字晶柱。
items.bombs.laserpython.didnot_pick=你无法拾取该物品……
items.food.cake.name=草莓奶油蛋糕
items.food.cake.eat_good=这个食物的能量激发了你的潜能，你的力量+1!
items.food.cake.eat_good2=这个食物的能量已经激发了你足够多的潜能，不过你仍可运用这股力量，你将它转换为了奥术护盾。
items.food.cake.desc=蛋糕是地牢中最稀有的食物，吃掉它可以立刻清除所有负面效果,并且会让你充满活力，蛋糕还能有极小的概率激发你的潜能……
items.potions.exotic.potionoflightstromcloud.name=雷霆万钧合剂
items.potions.exotic.potionoflightstromcloud.desc=瓶子内奇特的不稳定能量来自雷电的能量，可以让使用者一段时间获得操控雷电的力量，成为_雷电法王_。
items.weapon.melee.endingblade.name=终焉
items.weapon.melee.endingblade.desc=一把被浊焰缠绕的禁忌之刃。它的每一次挥动都在吞噬使用者的灵魂。一旦装备，便再也无法取下。
