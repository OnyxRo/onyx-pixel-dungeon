items.potions.brews.ragingbrew.name=elixir of rage
items.potions.brews.ragingbrew.desc=When shattered, this elixir will release an accelerating liquid which spreads like a gas.\n\nThis liquid is highly concentrated, spreading and dissipating at a high speed.
items.potions.brews.perfumebrew.name=vial of perfume
items.potions.brews.perfumebrew.desc=When shattered, this brew will release a charming perfume which spreads like a gas. Anything that breathes it in will be attracted to the perfume cloud.
items.potions.elixirs.elixirofattunement.name=elixir of attunement
items.potions.elixirs.elixirofattunement.msg_1=+1 atu
items.potions.elixirs.elixirofattunement.msg_2=Newfound attunement surges through your soul.
items.potions.elixirs.elixirofattunement.desc=This powerful liquid will enhance your soul, permanently increasing your attunement by one point.
items.quest.cleanwater.name=mineral water
items.quest.cleanwater.desc=This tasty liquid heals you to max HP and cures some debuff. It's unknown, why shopkeeper sells it for such high price.
items.quest.cleanwater.ac_drink=DRINK
items.quest.scrap.name=scrap pile
items.quest.scrap.desc=A small amount of metal and plastic. You can sell that things for a bit of gold or throw it into enemy to stun it.
items.quest.chaosstone.name=chaosstone
items.quest.chaosstone.desc=The common gem in abyss, this chaosstone is incredible valuable in overworld. There is a rumor than chaosstone wield even more power than Amulet of Yendor. Regardless, your goal right now is getting more of those unstable things.
items.scrolls.scrollofattunement.name=scroll of attunement
items.scrolls.scrollofattunement.none=The scroll plays an inspiring tune.
items.scrolls.scrollofattunement.one=The scroll plays an inspiring tune, empowering the %s!
items.scrolls.scrollofattunement.many=The scroll plays an inspiring tune, empowering your minions!
items.scrolls.scrollofattunement.desc=This manuscript conjures an inspiring tune that will inspire the spirit of your minions, making them faster and more durable for a short time, and reduce the melee damage dealt by nearby enemies.
items.scrolls.exotic.scrollofsoulenergy.name=scroll of soul energy
items.scrolls.exotic.scrollofsoulenergy.desc=This manuscript will direct the energy of your soul to create a strong minion whose power scales with your level and amount of attunement. Allocating so much energy will destroy all other minions you control, though.\n\nWith your current level and attunement, the soul flame will deal _%1$d-%2$d damage_ and fade away after _%3$d_ turns.
items.spells.enrage.name=enrage
items.spells.enrage.desc=This spell will imbue the targeted enemy with aggressive energy, forcing them to attack any nearby creatures and increasing their dexterity for a short time.
items.spells.contain.name=containing
items.spells.contain.desc_mob=A %s is trapped inside.
items.spells.contain.desc=This spell traps a living creature inside itself. Cast the spell again to release the previously captured enemy.
items.spells.enchantparchment.name=enchant transfer
items.spells.enchantparchment.desc=This seemingly ethereal spell is able to contain one enchantment or glyph.\nTo inscribe the spell, use it on already enchanted item; use spell again to enchant any other desired item, with destruction of spell.
items.spells.enchantparchment.inv_title=Enchant or steal enchantment
items.spells.enchantparchment.ench_obtained=You inscribe a spell with %s.
items.spells.enchantparchment.ench_used=You enchant another item with %s.
items.spells.enchantparchment.glyph_obtained=You inscribe a spell with %s.
items.spells.enchantparchment.glyph_used=You inscribe another item with %s.
items.stones.stoneoftargeting.name=stone of targeting
items.stones.stoneoftargeting.desc=When this stone is thrown at an ally, they will be empowered for 20 turns.\n\nWhen used on empty cell, your intelligent allies will target that cell and defend it for a short time. This time will be adjusted for each ally, so they will defend the cell for a fixed amount of time.
items.stones.stoneoftargeting$defending.name=Focused
items.stones.stoneoftargeting$defending.desc=This character is focused on some place in that depth.\n\nWhen this buff is active, the creature moves to a determined cell and stays there, defending it from enemies.\n\nTurns left: %s.
items.wands.wand.melee=This wand deals _%1$d-%2$d damage_ when used as melee weapon.
items.wands.wand.recharge=This wand will recover its next charge in _%s turns_.
