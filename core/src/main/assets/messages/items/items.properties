items.inscriptions.good.antimagic.desc=Magical damage you take is reduced by a quarter.
items.inscriptions.good.healthy.name=%s of health
items.inscriptions.good.healthy.inscription=health
items.inscriptions.good.healthy.desc=Raises your maximum health by 5 percent.
items.helmets.strawhat.name=straw hat
items.helmets.strawhat.desc=A worn straw hat. It does nothing for you but it looks wonderful on a dreamer.
items.helmets.strawhat.effect_desc=It is only a hat, but wearing it feels like the start of a great adventure.
items.artifacts.driedrose$ghosthero.dialogue_polluted_sewers_1=These sewers used to be safe, people even lived here in the winter.
items.artifacts.driedrose$ghosthero.dialogue_polluted_sewers_2=I wonder what happened to the guard patrols, did they give up?
items.artifacts.driedrose$ghosthero.dialogue_polluted_sewers_3=I had family on the surface, I hope they're safe.
items.artifacts.driedrose$ghosthero.dialogue_polluted_sewers_4=The guards couldn't defeat these monsters, but maybe we can.
items.artifacts.driedrose$ghosthero.dialogue_polluted_sewers_5=If even the sewers are this dangerous, I wonder what's below...
items.artifacts.driedrose$ghosthero.dialogue_polluted_sewers_6=What could have caused these rats and crabs to grow so large?
items.artifacts.driedrose$wndghosthero.helmet_prompt=Select a helmet
items.artifacts.driedrose$wndghosthero.ring_prompt=Select a ring
items.artifacts.driedrose$wndghosthero.cant_ring=You can't give the ghost this kind of ring.

