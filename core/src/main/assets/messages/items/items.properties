items.weapon.melee.tier6.oracleterminal.slash_ability_desc=The Duelist enters _sword dance_ with the Oracle Terminal. This instant stance increases attack speed by 60%% and accuracy by 50%% for _%d turns_.
items.weapon.melee.tier6.oracleterminal.typical_slash_ability_desc=The Duelist enters _sword dance_ with the Oracle Terminal. This instant stance typically increases attack speed by 60%% and accuracy by 50%% for _%d turns_.
items.weapon.melee.tier6.oracleterminal.thrust_ability_desc=The Duelist _pierces_ an enemy with the Oracle Terminal, striking a target _%d tiles_ beyond normal reach and ignoring its armor.
items.weapon.melee.tier6.oracleterminal.typical_thrust_ability_desc=The Duelist _pierces_ an enemy with the Oracle Terminal, typically striking a target _%d tiles_ beyond normal reach and ignoring its armor.
items.weapon.melee.tier6.oracleterminal.desc=This staff, found drifting out of the sewers, can transform into all manner of weapons for you to wield.
items.weapon.melee.tier6.oracleterminal.stats_desc=While equipped, the weapon changes form every 10 turns: blunt improves accuracy, slash improves attack speed, thrust improves movement speed, and scythe increases damage. Below 10%% HP, it changes to spoon form.
items.weapon.melee.tier6.oracleterminal.blunt_name=blunt weapon
items.weapon.melee.tier6.oracleterminal.blunt_desc=Blunt form: +20%% accuracy; each hit has a one-third chance to paralyze the target for 1 turn.\n\nTurns until transformation: %s.
items.weapon.melee.tier6.oracleterminal.slash_name=slashing weapon
items.weapon.melee.tier6.oracleterminal.slash_desc=Slash form: +20%% attack speed; hits have a one-third chance to disarm the target for 1 turn.\n\nTurns until transformation: %s.
items.weapon.melee.tier6.oracleterminal.thrust_name=piercing weapon
items.weapon.melee.tier6.oracleterminal.thrust_desc=Thrust form: +20%% movement speed; hits have a one-third chance to cause bleeding.\n\nTurns until transformation: %s.
items.weapon.melee.tier6.oracleterminal.scythe_name=scythe
items.weapon.melee.tier6.oracleterminal.scythe_desc=Scythe form: +50%% damage. The first hit against each enemy knocks it back and makes it vulnerable for 5 turns.\n\nTurns until transformation: %s.
items.weapon.melee.tier6.oracleterminal.spoon_name=spoon
items.weapon.melee.tier6.oracleterminal.spoon_ability_name=full spoon
items.weapon.melee.tier6.oracleterminal.spoon_desc=Spoon form: -50%% damage.\n\nTurns until transformation: %s.
items.weapon.melee.tier6.oracleterminal.spoon_ability_desc=Without selecting a target, the Duelist instantly recites _Roland's Poem_, consuming all remaining charges and restoring 10%% of maximum HP. This ability takes no time.
items.weapon.melee.tier6.oracleterminal.typical_spoon_ability_desc=Without selecting a target, the Duelist instantly recites _Roland's Poem_, consuming all remaining charges and restoring 10%% of maximum HP. This ability takes no time.
items.weapon.melee.tier6.oracleterminal.scythe_ability_name=harvest
items.weapon.melee.tier6.oracleterminal.scythe_ability_desc=The Duelist _harvests_ one enemy with the Oracle Terminal, dealing _%d damage_. If the target is not immune to bleeding, this damage becomes an equal amount of bleeding.
items.weapon.melee.tier6.oracleterminal.typical_scythe_ability_desc=The Duelist _harvests_ one enemy with the Oracle Terminal, typically dealing _%d damage_. If the target is not immune to bleeding, this damage becomes an equal amount of bleeding.
items.weapon.melee.tier6.oracleterminal.catalog_desc=Its five forms focus on control, area attacks, mobility, heavy strikes, and healing.
items.weapon.melee.tier6.mercuryblade.name=mercury blade
items.weapon.melee.tier6.mercuryblade.ac_shoot=SHOOT
items.weapon.melee.tier6.mercuryblade.prompt=Choose a target
items.weapon.melee.tier6.mercuryblade.ability_name=mercury solidification
items.weapon.melee.tier6.mercuryblade.ability_desc=The Duelist uses _mercury solidification_ to stabilize the blade for _%d turns_. While stabilized, projecting the blade consumes no liquid metal and inflicts ooze for 3 turns instead of 2. This ability is instantaneous.
items.weapon.melee.tier6.mercuryblade.desc=A curved blade formed from restless liquid metal. Its mirror-bright edge flows back together after every swing, ready to cast a temporary copy at distant foes.
items.weapon.melee.tier6.mercuryblade.stats_desc=This is a rather fast weapon.\nWhile equipped, it can consume liquid metal to cast a blade shadow, dealing _%1$d-%2$d damage_ and applying 2 turns of Ooze, halving the target's movement speed.
items.weapon.melee.tier6.mercuryblade.typical_stats_desc=This is a rather fast weapon.\nUsually, while equipped, it can consume liquid metal to cast a blade shadow, dealing _%1$d-%2$d damage_ and applying 2 turns of Ooze, halving the target's movement speed.
items.weapon.melee.tier6.mercuryblade.no_liquid_metal=You need at least one liquid metal to project the mercury blade.
items.weapon.melee.tier6.mercuryblade.self_target=You cannot project the mercury blade at yourself.
items.weapon.melee.tier6.mercuryblade$mercurysolidification.name=mercury solidification
items.weapon.melee.tier6.mercuryblade$mercurysolidification.desc=The mercury blade is stabilized. Projecting it consumes no liquid metal and inflicts ooze for 3 turns.\n\nTurns remaining: %s.
items.weapon.melee.tier6.radiantgoldhalberd.name=radiant gold halberd
items.weapon.melee.tier6.radiantgoldhalberd.prompt=Choose the direction of transfix
items.weapon.melee.tier6.radiantgoldhalberd.ability_name=transfix
items.weapon.melee.tier6.radiantgoldhalberd.ability_no_path=An adjacent obstacle blocks transfix in that direction.
items.weapon.melee.tier6.radiantgoldhalberd.typical_ability_desc=The Duelist hurls a projection of the Radiant Gold Halberd to _transfix_ enemies along its path. It typically pierces and knocks back every enemy in its path, dealing _%1$d-%2$d damage_ and always hitting. Enemies pinned against a wall take 20%% extra damage.
items.weapon.melee.tier6.radiantgoldhalberd.ability_desc=The Duelist hurls a projection of the Radiant Gold Halberd to _transfix_ enemies along its path, piercing and knocking them back for _%1$d-%2$d damage_ and always hitting. Enemies pinned against a wall take 20%% extra damage.
items.weapon.melee.tier6.radiantgoldhalberd.desc=A ponderous halberd forged from radiant gold. Its broad blade leaves a dazzling golden trail through every swing.
items.weapon.melee.tier6.radiantgoldhalberd.stats_desc=This is a very slow weapon.\nThis weapon has tremendous reach.\nThis weapon is very heavy.\nThis weapon gains more damage from upgrades.\nWhen it attacks, it can hit up to three adjacent enemies in a cross pattern; the fewer enemies hit, the more damage the attack deals.
items.weapon.melee.tier6.soulblade.name=soul blade
items.weapon.melee.tier6.soulblade.ability_name=duskfall
items.weapon.melee.tier6.soulblade.typical_ability_desc=The Duelist spends _1 charge_ to invoke _Duskfall_, making the next three Soul Blade attacks 50%% faster and extending their reach by 1. This ability consumes no time.
items.weapon.melee.tier6.soulblade.ability_desc=The Duelist can use the Soul Blade to invoke _Duskfall_, making the next _3 Soul Blade attacks_ 50%% faster and extending their reach by 1. This ability consumes no time.
items.weapon.melee.tier6.soulblade.desc=A strange gem is set into the sword's pommel. The broad blade stays hidden in its scabbard until drawn, when it gleams with a light that seems able to sever souls.
items.weapon.melee.tier6.soulblade.typical_stats_desc=This weapon blocks 0-%1$d damage. Its attacks may rend a foe's soul, dealing bonus magic damage based on the target's maximum HP.\nUsually, the weapon grants the wielder %2$d shield on a hit when its shield cooldown is ready. %3$s
items.weapon.melee.tier6.soulblade.stats_desc=This weapon blocks 0-%1$d damage. Its attacks may rend a foe's soul, dealing bonus magic damage based on the target's maximum HP.\nThe weapon grants the wielder %2$d shield on a hit when its shield cooldown is ready. %3$s
items.weapon.melee.tier6.soulblade.shield_ready=The shield is ready.
items.weapon.melee.tier6.soulblade.shield_cooldown=The next shield is available in _%d turns_.
items.weapon.melee.tier6.soulblade.dusk_name=duskfall
items.weapon.melee.tier6.soulblade.dusk_desc=The next %d Soul Blade attacks gain 50%% attack speed and 1 tile of extra reach.
items.weapon.melee.tier6.lakesword.name=lake sword
items.weapon.melee.tier6.lakesword.draw_name=draw
items.weapon.melee.tier6.lakesword.draw_prompt=Choose a direction
items.weapon.melee.tier6.lakesword.ability_name=wind protection
items.weapon.melee.tier6.lakesword.ability_desc=The Duelist spends _1 charge_ to gain _%d turns_ of invisibility and 5 turns of haste. This ability consumes no time.
items.weapon.melee.tier6.lakesword.typical_ability_desc=The Duelist spends _1 charge_ to typically gain _%d turns_ of invisibility and 5 turns of haste. This ability consumes no time.
items.weapon.melee.tier6.lakesword.desc=A magical sword gifted by a lake faerie. Its runes are unlike any magic you have seen.
items.weapon.melee.tier6.lakesword.charged_desc=The scabbard is gone, but powerful magic swirls around the blade. You can strike farther targets until the magic fades.
items.weapon.melee.tier6.lakesword.spent_desc=The magic has faded. This sword is little more than a copy of unknown origin. Finding its scabbard will restore it.
items.weapon.melee.tier6.lakesword.stats_desc=While equipped and sheathed, this sword improves natural health regeneration. Drawing it attacks in a line; damage grows with level, and its 5-tile range increases with level.
items.weapon.melee.tier6.lakesword$scabbard.name=lake sword scabbard
items.weapon.melee.tier6.lakesword$scabbard.desc=The scabbard of the Lake Sword. It restores the sword's sheath when picked up.
items.weapon.melee.tier6.lakesword$scabbard.no_sword=You have no unsheathed Lake Sword to restore.
items.weapon.melee.tier6.mountainguard.name=mountain guard
items.weapon.melee.tier6.mountainguard.desc=This shield seems to bear the dreadful weight of whole mountains, though magic lets you lift it with deceptive ease. Mass brings weight, and weight brings slowness.
items.weapon.melee.tier6.mountainguard.typical_stats_desc=Mountain Guard usually blocks 0-%1$d damage. Upgrading increases its block.\nUsually, when equipped and charged by taking hits, its ability blinds and slows every enemy in sight for _%2$d turns_.
items.weapon.melee.tier6.mountainguard.stats_desc=Mountain Guard blocks 0-%1$d damage. Upgrading increases its block.\nWhen equipped and charged by taking hits, its ability blinds and slows every enemy in sight for _%2$d turns_.
items.weapon.melee.tier6.mountainguard.ac_release=release
items.weapon.melee.tier6.mountainguard.release_ready=The mountain's power is fully charged.
items.weapon.melee.tier6.mountainguard.release_name=mountain power
items.weapon.melee.tier6.mountainguard.release_desc=Blind and slow visible nearby enemies with a flash for _%d turns_.
items.weapon.melee.tier6.mountainguard.ability_name=wall counter
items.weapon.melee.tier6.mountainguard.typical_ability_desc=The Duelist uses Mountain Guard for a _wall counter_, typically blocking all direct physical attacks for _%1$s turns_ and making a guaranteed armor-piercing counterattack for _%2$d-%3$d damage_. Moving ends the stance.
items.weapon.melee.tier6.mountainguard.ability_desc=The Duelist uses Mountain Guard for a _wall counter_, blocking all direct physical attacks for _%1$s turns_ and making a guaranteed armor-piercing counterattack for _%2$d-%3$d damage_. Moving ends the stance.
items.weapon.melee.tier6.mountainguard$mountainenergytracker.name=mountain energy
items.weapon.melee.tier6.mountainguard$mountainenergytracker.desc=Mountain Guard currently holds _%d%%_ mountain energy. Effective damage dealt directly by enemies builds more energy.
items.weapon.melee.tier6.mountainguard$mountainenergytracker.desc_ready=Mountain energy has reached _%d%%_; mountain power is ready to release.
items.weapon.melee.tier6.mountainguard$mountainwallcounter.name=wall counter
items.weapon.melee.tier6.mountainguard$mountainwallcounter.desc=You are immune to direct physical damage dealt by enemy characters and counterattack with physical damage that ignores armor.\n\nTurns remaining: %s.
items.weapon.melee.tier6.mercuryblade.typical_ability_desc=A Duelist can _stabilize_ the Mercury Blade, making its form steadier. This takes no time and generally lets her cast it as a blade shadow without spending liquid metal for _2 turns_, while increasing the duration of its debuffs to 3 turns.

