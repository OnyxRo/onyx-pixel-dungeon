items.armor.scoutarmor.no_bow=You don't have spirit bow to shoot any arrows.
items.armor.scoutarmor.not_equipped=You need to have cloak equipped to use super-shots.
items.armor.scoutarmor$scoutcooldown.name=Super-shot Cooldown
items.armor.scoutarmor$scoutcooldown.desc=Just trying to patient...\n\nWhile on cooldown, huntress cannot fire super-shots with help of her cloak. Turns left: %s
items.armor.scoutarmor.desc=In this scout armor set, huntress is able to charge up her bow to perform super-shot that have increased damage depending on distance (up to 500%). Each super-shot needs some time to recharge and takes 2 turns to use.
items.armor.scoutarmor.tier1=Defense value: _%d_\nBow's damage: _100%%_\nSuper-shot's damage: _100%%_\nSuper-shot cooldown: _20_
items.armor.scoutarmor.tier2=Defense value: _%d_\nBow's damage: _50%%_\nSuper-shot's damage: _200%%_\nSuper-shot cooldown: _13.3_
items.armor.scoutarmor.tier3=Defense value: _%d_\nBow's damage: _100%%_\nSuper-shot's damage: _100%%_\nSuper-shot cooldown: _20_\nMovement speed increased by _2x_\nTaken damage is increased by _75%%_ (modifier is applied after all effects that reduce damage)
items.armor.conjurerarmor.name=Deltarune robe
items.armor.conjurerarmor.ac_special=ENERGY STORM
items.armor.conjurerarmor.desc=The grand robe of the Dreemurr family. It provides enough astral energy to continue summoning minions as he progresses. The power becomes even higher with lowering HP.\n\nThe conjurer is bound to his robe, so this armor can't be unequipped.
items.armor.conjurerarmor.tier1=Defense value: _%d_\nPower of Soul Sparking: _100%%_\nNo special properties
items.armor.conjurerarmor.tier2=Defense value: _%d_\nPower of Soul Sparking: _0%%_\nMinions take _40%%_ less damage
items.armor.conjurerarmor.tier3=Defense value: _%d_\nPower of Soul Sparking: _300%%_\nConjurer takes _50%%_ more damage
items.armor.syntheticarmor.name=synthetic armor
items.armor.syntheticarmor.desc=Thanks to the newest technologies, this garb is as comfortable as old cloth armor, but gives you much more protection.
items.armor.syntheticarmor.tier1=Defense value: _%d_\nMovement speed: _100%%_\nNo special properties
items.armor.syntheticarmor.tier2=Defense value: _%d_\nMovement speed: _50%%_\nMelee weapons have _1_ additional reach
items.armor.syntheticarmor.tier3=Defense value: _%d_\nEvasion factor: _115%%_\nAccuracy factor: _115%%_\nMovement speed: _115%%_\nAdditional vision: _+2 tiles_
items.artifacts.artifact$artifactclass.offense_desc=This accessory belongs to offensive kind and usually directly helps you in combat.
items.artifacts.artifact$artifactclass.defense_desc=This accessory belongs to defensive kind and usually protects you from harm.
items.artifacts.artifact$artifactclass.utility_desc=This accessory belongs to utility kind and is used in misc activities like movement.
