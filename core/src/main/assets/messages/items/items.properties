items.powers.luckybadge.desc=An odd badge, owned by your father before you. It is said to hold the power to unlimited riches, but danger lies within it.
items.powers.luckybadge.stats=This badge has a  _%1$s%%_ chance to drop a Scroll of Upgrade when killing a Guardian on the special depth. This chance increases when one doesn't drop, and decreases when one does.
