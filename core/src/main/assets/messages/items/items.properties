items.rings.ringofforce.special_effect=The wearer of the Ring of Force occasionally inflicts one of the following effects upon landing unarmed attacks: stun, stagger, ignite, dizzy, weaken.
###rearranged, its rework of Shattered's heroes
items.rings.ringofaccuracy.special_effect=The wearer of the Ring of Accuracy can deliver stronger unarmed attacks to enemies, with a chance and damage proportional to their current accuracy. A powerful strike can deal up to double damage and occasionally stun or stagger the opponent.
items.rings.ringofarcana.special_effect=The wearer of the Ring of Arcana triggers random magical effects with unarmed attacks. The potency of the magic depends on the ring's power and the hero's level.
items.rings.ringofelements.special_effect=The wearer of the Ring of Elements occasionally removes all harmful effects upon landing unarmed attacks. Hunger is not alleviated.
items.rings.ringofenergy.special_effect=The wearer of the Ring of Energy occasionally gains a 0.5-turn artifact charge effect upon landing unarmed attacks.
items.rings.ringofevasion.special_effect=The wearer of the Ring of Evasion gains a chance for a short dodge maneuver upon landing unarmed attacks, proportionate to their current evasion rate.
items.rings.ringoffuror.special_effect=The wearer of the Ring of Furor occasionally does not consume turns upon landing unarmed attacks.
items.rings.ringofhaste.special_effect=The wearer of the Ring of Haste occasionally gains a short burst of speed upon landing unarmed attacks.
items.rings.ringofmight.special_effect=The wearer of the Ring of Might increases unarmed attack damage based on their strength.
items.rings.ringofsharpshooting.special_effect=The wearer of the Ring of Sharpshooting occasionally retrieves a thrown weapon stuck in an enemy and repairs its durability by 1 upon landing unarmed attacks.
items.rings.ringoftenacity.special_effect=The wearer of the Ring of Tenacity cannot die on turns where unarmed attacks land successfully.
items.rings.ringofwealth.special_effect=The wearer of the Ring of Wealth occasionally drops additional common-grade loot upon landing unarmed attacks. This chance is influenced by loot drop rate increase effects.

###pixel-towers-master
items.armor.glyphs.evasion.name=%s of evasion
items.armor.glyphs.evasion.desc=This powerful glyph attempts to save the hero from harm, pushing him away from foe's attacks trajectory. This can even help you evade attacks, which are normally guaranteed to hit.
items.herospells.aboakskin.name=Oak skin spell
items.herospells.aboakskin.desc=Covers the target in a magical barrier of reflective bark, which partially _increases the target's physical armor_, with the armor decaying over time. The higher is your hero _level_, the stronger this effect becomes and the longer it lasts. 
items.herospells.abprojectiles.name=Entangling darts
items.herospells.abprojectiles.desc=The hero throws 3 magic darts at three random enemies' positions, those make roots grow under the foes and _prevent them from moving_ for a short time.
items.herospells.abvision.name=Astral focus
items.herospells.abvision.desc=The hero focuses on the enemies, sounds and surroundings around him, giving him a _glimpse of all living beings around_ and _allowing for striking weak spots of your foes_ for a short period of time. Even though the effect is short-lasting, the damage output may be immense if you have upgraded weaponry on you. Time of the effect increases with hero _level_.
items.herospells.abregeneration.name=Regeneration blessing
items.herospells.abregeneration.desc=The hero casts a minor heal spell on the target. That will slowly _replenish target's HP_, up to _50 HP_ per spell. The healing does not stack.
items.herospells.abblessing.name=Holy blessing
items.herospells.abblessing.desc=The hero blesses the target, _increasing its accuracy_ (and if the target is a mobile unit its _evasion_) for a very long period of time.\n\nThe blessing given is unstable and fades away if the blessed unit is upgraded, so use this spell wisely. Also using it on yourself is much less effective, though may provide enough turns of blessing for a couple of waves.
items.herospells.abgibberish.name=Magical gibberish
items.herospells.abgibberish.desc=The hero mumbles some spell from his memory, _striking the targeted cell with a random wand's bolt_. The bolt may be from any wand which uses bolts as a projectile. Increasing your hero's _level_ slightly decreases the cooldown of this spell.
items.herospells.abnecromancy.name=Necromancy
items.herospells.abnecromancy.desc=The hero calls to the beyond, _summoning several skeletons_ around himself. The skeletons will aid you in battle, yet may damage you if they explode into bone shards. Also if you would try to rise a skeleton where somebody is standing, the skeleton's skull will simply bump into that units bottom and your possible undead servant will simply die from skull trauma.\n\nThe higher is your hero's _level_, the faster you can summon skeletons.
items.herospells.abdisengage.name=Disengage
items.herospells.abdisengage.desc=The hero covers the target in shadows, pretty much _excluding it from the battle_ for a few turns. While the target is under the spell, it will be paralysed and invisible. That does not work on the portal or bosses, and is less efficient against foes.
items.herospells.abnoamulet.name=Where is it?
items.herospells.abnoamulet.desc=The hero blurs the amulet's view, making it invisible for a short time. Know, that all foes near the amulet will notice that and will still see it partially, drastically decreasing the spell's time for each enemy nearby.
items.herospells.abshadowclone.name=Shadow clone
items.herospells.abshadowclone.desc=The hero casts an animation spell on his shadow, _rising a clone_ out of it. The clone has hero's HP and melee damage, so his effectiveness directly depends on your stats, level and equipped weapon. Also that clone follows you, and will teleport to your real shadow's position if very far, allowing for easier disengagement from fights.
items.herospells.abswift.name=Dash
items.herospells.abswift.desc=The hero conjures some stamina, _increasing his speed 5 times it was before_ for a very short time. This affects only the hero's running speed, other actions are performed the same. Can be used to evade attacks, run away from foes or to your towers.
items.herospells.abcharge.name=Charge
items.herospells.abcharge.desc=The hero conjures up his strength and charges at a chosen position. That deals damage to the creature on that cell and pushes mobs around away.
items.herospells.abglowup.name=Glow up
items.herospells.abglowup.desc=The hero shouts out a battlecry, which temporarily _increases the attacking power_ of all allies near him (_5x5_ area) by _20%_. If the said ally is a tower, the duration depends on the tower's cost and power: the weakest towers will be empowered for up to _70 turns_ duration, while the strongest ones will be affected for much less. All non-tower units get their damage increased for _ ~20 turns_
items.herospells.abgoldarmor.name=Armor of gold
items.herospells.abgoldarmor.desc=The hero prays to unknown forces, and _becomes immortal_... at a cost. For a certain duration each time the warrior is damaged _all of the damage will be taken from your gold pocket_ instead. The buff will automatically detach if your pockets are empty.
items.herospells.abshield.name=Protection
items.herospells.abshield.desc=The hero casts a defensive spell on all allied units in a 3x3 area, including himself, _giving each a temporarily shield_. The shield will slowly decay and redirect any damage on itself while active. The higher the hero's _level_ is, the stronger is the casted barrier.
items.herospells.abarcanesword.name=Arcane weaponry
items.herospells.abarcanesword.desc=The hero casts a spell on the equipped weapon to instantly _enchant_ it. The enchantment is one of the basic ones.\n\nIf the hero does not have a weapon when casts this spell, a random enchanted one will appear.
items.herospells.abberserk.name=Berserk
items.herospells.abberserk.desc=The hero temporarily fuels with rage, _increasing running and attack speed by _50%_ each_. This effect usually lasts _15 turns_, but may last longer if you are low on HP. Warriors of higher _level_ can cast Rage more frequently.
items.herospells.abegoist.name=Ego disruption
items.herospells.abegoist.desc=Duelist casts a void spell to syphon the power of her allies. Each tower on the field capable of attacking will be hexed for a very long duration, while the duelist will be healed and receive a random buff for each tower affected.
items.herospells.abtreatwounds.name=Treat wounds
items.herospells.abtreatwounds.desc=Treat wounds to replenish some of your Health points. HP regained increases with hero's _level_, this spell is much more effective if your HP is low.
items.herospells.abwallstance.name=Wall stance
items.herospells.abwallstance.desc=Stand in a defensive position to significantly increase your physical defense at a cost of mobility for a very short time. While the hero is in the stance, all non-magical damage will be halved, this applies after all other damage reductions and buffs.
items.herospells.abteleport.name=Warp
items.herospells.abteleport.desc=Teleport to a nearby empty tile you can see. You cannot teleport to cells with characters on them or chasms. The ability cooldown depends on distance to the destination tile.
items.herospells.abteleport.cost=Using this ability gives an ability cooldown of _%1$d_ + _%2$d*distance_ turns
items.herospells.abobelisk.name=Obelisk formation
items.herospells.abobelisk.desc=This spell channels the energy from the Beyond and forms mineral clusters from it. Each of them is infused with a random crystal, which determines their properties:\n\n_-_ _Bloodstone obelisks_ are aggressive elementals which will attempt to seek any soul matter nearby and devour it. A controlled elemental will attempt to feast upon enemy's life energy, dealing soul damage and replenishing it's matter.\n\n_-_ _Necrotic obelisks_ are stationary, and will cause the very flesh of nearby enemies to decay.\n\n_-_ _Permafrost obelisks_ are not capable of moving too, with their main purpose being freezing nearby enemies. Moreover, they generate an ice barrier to defend themselves.\n\nThe power of said obelisks directly depends on hero's _level_.
items.herospells.abobelisk.energy_blood=The Beyond is bleeding with power...
items.herospells.abobelisk.energy_cold=The Beyond emits a chilling cold...
items.herospells.abobelisk.energy_decay=Everything that the Beyond touches decays...
items.herospells.abicewall.name=Ice barricade
items.herospells.abicewall.desc=Create several ice walls to stall enemies. Ice walls are not that durable and may melt over time, but still prove to be a somewhat decent defense, considering they freeze anything touching them.\n\nHP of the ice wall depends on hero's _level_.
items.herospells.abtarget.name=Target
items.herospells.abtarget.desc=Order your units to attack an enemy mob: all your allies and towers will focus on the enemy you chose for a short duration (note: some weak-willed creatures may be confused or scared if they are targeted)
items.herospells.abtaunt.name=Taunt
items.herospells.abtaunt.desc=You suddenly become the main target for all the enemy mobs around. This works for a short duration, but is still enough to redirect enemy forces towards your location.
items.herospells.ablasher.name=Vine seeds
items.herospells.ablasher.desc=Summon a friendly lasher on an empty tile you can see. The lasher will defend its position and flail enemies around, while also being capable of surviving several hits. Its damage depends on hero's _level_.\n\nNote: be cautios with fire, as any fire damage will immediately burn the lasher to ashes.
items.herospells.abundying.name=Second chance
items.herospells.abundying.desc=Partially synchronizes your soul with the beyond to redirect fatal damage to another version of yourself and syphon their soul in a moment of deadly peril. The effect will last for some time and you will be protected for that duration. The higher is your _level_, the longer that effect will last. Such soul consuming, however, will leave you exhausted, resulting in you being incapable of using other abilities if it procs.\n\nNote: the Necromancers in other universes tend to age faster if you use this spell frequently, so don't be an egoist.
items.herospells.abbanner.name=Royal banner
items.herospells.abbanner.desc=Places a royal banner for all nearby living allies to get inspiration from. The banner periodically _heals surrounding allies for small amounts of HP_ and also i_ncreases the living allies' attack speed by 15\%_ of their initial (the attack speed increase does not affect non-living towers). This effect can _stack_ with several banners nearby and it becomes stronger with your hero _level_ increasing.
items.herospells.abpray.name=Pray
items.herospells.abpray.desc=Prayers are not guaranteed to work: many pray, but the divine answers only a few, and even these few can't notice the response.\n\nBut you are a priest. Your chances are far greater.\n\nPraying _directs some of your power_ towards the holy, which _may_, or _may not_, result in something. The effect is positive, but you might never know what it is. You can only feel whether the prayer has been heard or not.
items.herospells.abpray.yes=The prayer was answered.
items.herospells.abpray.no=You don't feel anything... perhaps, the prayer wasn't heard.
items.herospells.abwisp.name=Divine assistance
items.herospells.abwisp.desc=Summons a wisp to aid in battle. Wisps are fragile, but extremely good in offense and become stronger as your _level_ increases. As wisps are creatures of origins both divine and magical, only a bit of magic energy is enough to summon one.
items.herospells.abholywater.name=Holy water
items.herospells.abholywater.desc=What most people call "a flask of holy water" is a bottle with a God tear inside. That is an artifact, which generates holy water with any magical stimulus.\n\nUsing it releases _a cone of water which heals your allies and slightly damages your foes_. It also _blinds any undead or demonic entities_ on touch. Power of dealt damage and healing scales with hero _level_
items.scrolls.exotic.scrollofunspeakablehorrors.name=#1scroll of unspeakable horrors#1
items.scrolls.exotic.scrollofunspeakablehorrors.desc=In dire situations even the most vile of curses are options.\n\n#1On read temporarily merges the nightmare realm and our reality, feeding the souls of your unfortunate foes to the Blood God#1.
items.scrolls.exotic.scrollofunspeakablehorrors$unspeakablehorror.name=#1???#1
items.scrolls.exotic.scrollofunspeakablehorrors$unspeakablehorror.desc=#1!!!ERROR: description() is null due to RealityException.NotFound!!!#1
items.weapon.missiles.bloodreaper.name=#1Bloody reaper#1
items.weapon.missiles.bloodreaper.desc=A shadow scythe forged in the demonic flames to wound both most armored of foes and etherial spirits. Additionally deals #1soul damage#1 to target equal to twice of the scythe's max physical damage even if it is blocked or evaded.\n\n"If spirits are not real why can we see them?"

items.bags.herospellbook.name=hero spellbook
items.bags.herospellbook.desc=A small book that holds hero spells. Spells kept in it stay with you when everything else is lost.

###pixel-towers-master
items.wands.wand.scales_upg=This wand's power increases based on _depth_ you are on.

###ratking
items.remains.crownshard.name=crown shard
items.remains.crownshard.desc=This looks to be a piece of a certain crown. How this even happened, or if it is even real are unclear. You can still feel some fragment of great power left in it, but using it will likely destroy it. 
items.wands.wandoffirebolt.staff_name=staff of firebolt
items.wands.wandoffirebolt.bmage_desc=When _the %s_ strikes an enemy with a staff of firebolt, flames spit forth from the staff, burning enemies and terrain alike.
items.wands.wandoffirebolt.eleblast_desc=An elemental blast with a staff of firebolt deals 100% damage, bursts open doors, and sets enemies and terrain on fire.

###rerearranged
items.weapon.melee.alchemy.ruinbow.name=Luin Bow
items.weapon.melee.alchemy.ruinbow.stats_desc=This weapon has a slightly faster attack speed than other bows, and its damage increases the more enemies it pierces.
items.weapon.melee.alchemy.ruinbow.desc=This is a bow that brings ruin to the world. Wielding it properly requires tremendous strength, but if mastered, its destructive power is guaranteed.
items.weapon.melee.alchemy.ruinbow.ability_name=penetrating shot
items.weapon.melee.alchemy.ruinbow.typical_ability_desc=A Duelist wielding the Bow of Ruin can use _penetrating shot_. Penetrating shot guarantees that the next arrow will hit, deals _%1$d-%2$d_ damage, and ignores the enemy's defense.
items.weapon.melee.alchemy.ruinbow.ability_desc=A Duelist wielding the Bow of Ruin can use _penetrating shot_. Penetrating shot guarantees that the next arrow will hit, deals _%1$d-%2$d_ damage, and ignores the enemy's defense.
items.weapon.melee.alchemy.lunarblade.name=Moonlight Katana
items.weapon.melee.alchemy.lunarblade.stats_desc=This weapon has very low minimum damage but slightly higher maximum damage. On the 6th successful hit, it applies full Freeze. Bosses are also affected by Freeze.
items.weapon.melee.alchemy.lunarblade.ability_name=Flash Slash
items.weapon.melee.alchemy.lunarblade.ability_desc=A Duelist wielding the Moonlight Katana can use _Flash Slash_. This ability activates instantly, consumes no turn, and strikes a single enemy. If this ability kills an enemy, the weapon gains _%s_ charge.
items.weapon.melee.alchemy.lunarblade.typical_ability_desc=A Duelist wielding the Moonlight Katana can use _Flash Slash_. This ability activates instantly, consumes no turn, and strikes a single enemy. If this ability kills an enemy, the weapon gains _%s_ charge.
items.weapon.melee.alchemy.lunarblade.desc=A blade so sharp that anything merely brushing against its edge is cleanly cut.
items.weapon.melee.alchemy.obsidianknife.name=Obsidian Knife
items.weapon.melee.alchemy.obsidianknife.stats_desc=This weapon causes severe bleeding.
items.weapon.melee.alchemy.obsidianknife.ability_name=Deep Cut
items.weapon.melee.alchemy.obsidianknife.ability_desc=Duelists wielding an Obsidian Knife can use _Deep Cut_. This attack always hits, dealing a portion of the weapon's damage and causing bleeding equal to _%1$d–%2$d_ of the target's remaining health. This ability consumes 2 charges. Powerful enemies resist this effect.
items.weapon.melee.alchemy.obsidianknife.typical_ability_desc=Duelists wielding an Obsidian Knife can use _Deep Cut_. This attack always hits, typically dealing a portion of the weapon's damage and causing bleeding equal to _%1$d–%2$d_ of the target's remaining health. This ability consumes 2 charges. Powerful enemies resist this effect.
items.weapon.melee.alchemy.obsidianknife.prompt=Select a target
items.weapon.melee.alchemy.obsidianknife.ability_no_target=There is no target to attack.
items.weapon.melee.alchemy.obsidianknife.ability_bad_position=You cannot attack from that position.
items.weapon.melee.alchemy.obsidianknife.desc=A finely sharpened knife forged from obsidian. While its direct damage is modest, the wounds it inflicts are deep and refuse to close. Each strike leaves behind a vicious bleeding cut.
items.weapon.melee.alchemy.obsidianbow.name=Obsidian Bow
items.weapon.melee.alchemy.obsidianbow.stats_desc=Arrows fired from this bow inflict enhanced bleeding on enemies.
items.weapon.melee.alchemy.obsidianbow.desc=A greatbow imbued with the power of an Obsidian Knife. Arrows transform into obsidian-tipped shafts upon release, carving deep wounds that leave enemies bleeding over time. Its threat grows more dangerous as the battle continues.
items.weapon.melee.alchemy.obsidianbow.ability_name=Penetration Shot
items.weapon.melee.alchemy.obsidianbow.typical_ability_desc=Duelists wielding an Obsidian Bow can use _Penetration Shot_. This ability guarantees that the next arrow will hit, typically dealing _%1$d-%2$d_ damage and ignoring the enemy's armor.
items.weapon.melee.alchemy.obsidianbow.ability_desc=Duelists wielding an Obsidian Bow can use _Penetration Shot_. This ability guarantees that the next arrow will hit, dealing _%1$d-%2$d_ damage and ignoring the enemy's armor.
items.weapon.melee.alchemy.obsidianbow.prompt=Select a target to fire at.

# Polished PD
items.food.honeyedmeat.name=honeyed meat
items.food.honeyedmeat.desc=A fine layer of honey covers the top of this meal. It fills you as much as a ration and heals a little when eaten.
###elektro
items.artifacts.bloodorb.name=orb of sacrifice
items.artifacts.bloodorb.ac_cast=CAST
items.artifacts.bloodorb.cursed=You can't use a cursed orb.
items.artifacts.bloodorb.does_nothing=That won't do anything.
items.artifacts.bloodorb.cant_reach=Your orb can't reach there.
items.artifacts.bloodorb.prompt=Choose a location to target.
items.artifacts.bloodorb.desc=This sinister looking glass orb has a big crack in its surface. Around its sharp edges an unsettling amount of blood is dripping out.
items.artifacts.bloodorb.desc_cursed=The cursed orb has forced itself onto your skin, constantly trying to wound you.
items.artifacts.bloodorb.desc_equipped=Targeting a location will emit an explosion of blood, hemorrhaging all who stand close by. At a cost of your own blood, of course. The burst is strongest in the center. The orb grows stronger with each drop of blood you sacrifice to it.\n\nAtrifact levelup is most efficient at low health.
items.artifacts.bloodorb.levelup=Your orb has drained enough of your blood to get stronger!
items.artifacts.crackedgeode.name=cracked geode
items.artifacts.crackedgeode.ac_cast=CAST
items.artifacts.crackedgeode.ac_add=ADD
items.artifacts.crackedgeode.ac_destroy=DESTROY
items.artifacts.crackedgeode.no_charge=Your geode is out of energy for now.
items.artifacts.crackedgeode.cursed=You cannot cast spells from a cursed geode.
items.artifacts.crackedgeode.prompt=Select a Spell
items.artifacts.crackedgeode.infuse_spell=You gently insert the spell crystal into the geode.
items.artifacts.crackedgeode.unable_spell=You are unable to add this spell to the geode.
items.artifacts.crackedgeode.unknown_spell=You're not sure what type of spell this is yet.
items.artifacts.crackedgeode.desc=Despite the condition of this geode, the crystals inside are still intact. Staring at them for a while, it seems as if they were very similar to the spell crystals described in your alchemy lexicon, and almost as if they were visibly growing.\nBreaking off one of these crystals allows you to cast it as a spell, or you can destroy it and try to gain some alchemical energy.
items.artifacts.crackedgeode.desc_cursed=The cursed geode has bound itself to you, it is inhibiting your ability to use most spells.
items.artifacts.crackedgeode.desc_index=The geode can be upgraded by attaching spell crystals to it. Following spell crystals would fit perfectly into the space between the crystals:
items.artifacts.crackedgeode.curr_spell=The next crystal that will break off is the spell _%s_.
items.artifacts.crackedgeode.used_spell=You used the geode to cast the spell %s.
items.artifacts.crackedgeode.destr_spell=You destroyed the %s crystal.
items.artifacts.crackedgeode.cursed_spells=Your geode prevents you from casting the spell.
items.scrolls.scrolloftrauma.name=scroll of trauma
items.scrolls.scrolloftrauma.light=The scroll emits a brilliant flash of violet light.
items.scrolls.scrolloftrauma.desc=When read, this scroll will emit a flash of violet light that will curse the minds of creatures that witness it, causing them to be less effective in combat.
items.scrolls.exotic.scrollofdamnation.name=scroll of damnation
items.scrolls.exotic.scrollofdamnation.desc=When read, this scroll will inflict doom on those unfortunate enough to witness. Doomed enemies take more damage from all sources, and its effects only end in death.\n\nParticularly strong enemies are inflicted with hex instead.
items.spells.prismaticimagespell.name=prismatic image
items.spells.prismaticimagespell.desc=Conjure a prismatic image to aid you in combat.
items.spells.transfiguration.name=shifting lands
items.spells.transfiguration.desc=This chaotic spell will transform the dungeon floor around you when cast.\n\nWater turns into grass, grass into high grass, high grass into embers and embers into water. Can also be used to destroy bookshelves and barriers.
items.spells.magicbridge.name=magical bridge
items.spells.magicbridge.desc=This spell is able to create walkable floor where there is none.
items.spells.greatertransmutation.name=greater transmutation
items.spells.greatertransmutation.desc=A more powerful transmutation spell that is capable of transforming even ancient runes.
items.spells.greatertransmutation.morph=Your item morphs into something different!
items.spells.greatertransmutation.inv_title=Transmute an item
items.spells.greatertransmutation.nothing=Nothing interesting happens.
items.spells.flameshot.name=flame burst
items.spells.flameshot.desc=A projectile that ignites a fire at its destination. Does not work in water.
items.spells.iceshot.name=ice wave
items.spells.iceshot.desc=A projectile that chills the air around the target to sub-zero temperatures. More effective against enemies standing in water.
items.spells.venomshot.name=venomous shot
items.spells.venomshot.desc=A projectile that poisons the enemy.
items.spells.vampiricshot.name=vampiric bolt
items.spells.vampiricshot.desc=A projectile that deals damage and heals the user. Healing can only be gained from enemies that bleed.
items.wands.wandofchaos.name=wand of chaos
items.wands.wandofchaos.staff_name=staff of chaos
items.wands.wandofchaos.desc=This wand is made from two interconnected crystals, pulsating in an unsettling, unpredictable way. It glows with chaotic energy, waiting to shoot forward.
items.wands.wandofchaos.stats_desc=This wand shoots a beam that pierces terrain, will go farther the more it is upgraded, and will apply random debuffs to enemies hit, dealing _%1$d-%2$d damage._
items.wands.wandofchaos.bmage_desc=_the Battlemage_ conjures powerful buffs upon killing enemies with a staff of chaos.
items.wands.wandofchaos.eleblast_desc=an elemental blast with a staff of chaos deals 67% damage, and inflicts enemies hit with the Hex debuff.
items.wands.wandofcosmictravel.name=wand of cosmic travel
items.wands.wandofcosmictravel.staff_name=staff of cosmic travel
items.wands.wandofcosmictravel.desc=This wand feels like a cold rod of solid glass, but seems to hold a reflection of the cosmos itself. As you turn it in your hand, Visions of distant places rush through your head.
items.wands.wandofcosmictravel.stats_desc=This wand shoots a beam that collides with the first enemy hit, and swaps it's place with the caster's, dealing _%1$d-%2$d damage._ Immobile units hit will suffer bonus damage instead of being teleported.
items.wands.wandofcosmictravel.bmage_desc=When _the Battlemage_ strikes an enemy with a Staff of cosmic travel, he has a chance to swap places with the attacked enemy, and deals bonus damage to immobile targets.
items.wands.wandofcosmictravel.eleblast_desc=an elemental blast with a staff of cosmic travel deals 50% damage, and teleports all enemies hit across the dungeon floor.
items.weapon.enchantments.corroding.name=corroding %s
items.weapon.enchantments.corroding.desc=This powerful enchantment injects corrosive chemicals into the enemy, inflicting corrosion.
items.weapon.enchantments.corroding.elestrike_desc=An elemental strike with a corroding enchantment spreads corrosive gas to the affected area.
items.weapon.missiles.darts.voiddart.name=void dart
items.weapon.missiles.darts.voiddart.desc=These darts are tipped with a voidpearl-based compound which will damage their target.
items.weapon.missiles.darts.ghostdart.name=ghost dart
items.weapon.missiles.darts.ghostdart.desc=These darts are tipped with a ghostbulb-based compound which spawn copies of both the user and the target.
items.ancientrunes.ancientrune.no_magic=Not even the ancient rune seems to overcome the effects of anti-magic.
items.ancientrunes.ancientrune.ac_cast=USE
items.ancientrunes.ancientruneinventory.no_magic=Not even the ancient rune seems to overcome the effects of anti-magic.
items.ancientrunes.ancientruneinventory.ac_cast=USE
items.ancientrunes.ancientrunetargeted.prompt=select target
items.ancientrunes.nablaancientrune.name=Ancient rune of nabla
items.ancientrunes.nablaancientrune.desc=The _Ancient Rune of Nabla_ transmutes a piece of equipment. The targeted equipment will be enchanted with a glyph or enchantment, which will be _hardened_ and has a high chance to be a powerful enchantment.
items.ancientrunes.nablaancientrune.morph=Your item morphs into something different!
items.ancientrunes.covariantancientrune.name=Covariant ancient rune
items.ancientrunes.covariantancientrune.desc=Without consuming: Transmute another ancient rune into _Contravariant Ancient Rune_.\n\nCombine with _Contravariant Ancient Rune_ to create _Invariant Ancient Rune_.
items.ancientrunes.contravariantancientrune.name=Contravariant ancient rune
items.ancientrunes.contravariantancientrune.desc=Without consuming: Transmute another ancient rune into _Covariant Ancient Rune_.\n\nCombine with _Covariant Ancient Rune_ to create _Invariant Ancient Rune_.
items.spells.invariantancientrune.name=Invariant ancient rune
items.spells.invariantancientrune.desc=Upgrade target item by _+3_ levels. All other properties of the item are preserved.
items.ancientrunes.fieldoperatorancientrune.name=Ancient rune of the field
items.ancientrunes.fieldoperatorancientrune.desc=The _Ancient Rune of the Field_ cures the hero fully, healing them and removing all negative effects as well as satisfying hunger. In addition _1_ point of strength will be gained permanently.
items.ancientrunes.partialancientrune.name=Partial ancient rune
items.ancientrunes.partialancientrune.desc=The _Partial Ancient Rune_ destroys a targeted exotic consumable and creates three instances of its non-exotic counterpart.\n\nPowerful items will only yield two consumables.
items.ancientrunes.laplaceancientrune.name=ancient rune of laplace
items.ancientrunes.laplaceancientrune.desc=The _Ancient Rune of Laplace_ destroys a targeted regular consumable and creates three instances of its exotic counterpart.\n\nPowerful items will only yield two consumables.
items.ancientrunes.propagationancientrune.name=ancient rune of propagation
items.ancientrunes.propagationancientrune.desc=The _Ancient rune of Propagation_ mentally advances the user, granting them bonus talent points. _1_ Talent point will be gained for _tier-1_ Talents, _2_ for _tier-2_ and so on.\n\nPotions of divine inspiration will _no longer take effect_ on talents above _tier-1_. 
items.ancientrunes.existenceancientrune.name=ancient rune of existence
items.ancientrunes.existenceancientrune.desc=The _Ancient rune of Existence_ conjures a piece of equipment, which is guaranteed to be upgraded.\n\nThe Quality of the equipment depends on the region where the rune is used, having a higher chance of additional upgrades or a higher tier when used deep in the dungeon.\n\nAdditional upgrade chances:\nsewers: _20%_\nprison: _40%_\ncaves: _60%_\nmetropolis: _80%_\nhalls: _100%_

###Sandbox PD (AlphaDraxonis), its items outside the level editor
items.scrolls.scrollofwipeout.name=scroll of wipe out
items.scrolls.scrollofwipeout.desc=Read this scroll to unleash the wrath of the dungeon spirits, killing everything on the current floor. Well, almost everything. Bosses are not affected, and any shop goods on the floor become free.

items.potions.brews.potioncocktail.name=potion cocktail
items.potions.brews.potioncocktail.desc=This flask holds several potions at once and produces all of their effects together. Pour any known potion into it at an alchemy pot to add that potion to the mix.\n\nThis item comes from Sandbox Pixel Dungeon, an idea by Zaragoza.
items.potions.brews.potioncocktail.contains=It holds these potions.

items.rings.ringoftime.name=ring of time
items.rings.ringoftime.stats=When worn, this ring will increase your movement speed by _%s%%_ and your attack speed by _%s%%._
items.rings.ringoftime.typical_stats=When worn, this ring will typically increase your movement speed by _%s%%_ and your attack speed by _%s%%._
items.rings.ringoftime.combined_stats=Your equipped rings are combining their power, increasing your movement speed by _%s%%_ and your attack speed by _%s%%_ in total.
items.rings.ringoftime.desc=This ring reduces the stress of movement on the wearer and grants them an inner fury, letting them run faster and attack more rapidly. It holds the power of a ring of haste and a ring of furor at a little under half strength each. A cursed ring will instead weigh the wearer down and slow their attacks.\n\nThis item comes from Sandbox Pixel Dungeon, an idea by Arachnentoma.

items.wands.wandofinstability.name=wand of instability
items.wands.wandofinstability.staff_name=staff of instability
items.wands.wandofinstability.desc=This wand seems like a normal wand, but its magic never settles into one shape.\n\nThis item comes from Sandbox Pixel Dungeon, an idea by Arachnentoma.
items.wands.wandofinstability.stats_desc=This wand will blast your opponent with chaotic energy, shooting a random wand effect each time it is zapped.
items.wands.wandofinstability.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of instability, a random staff effect is used.
items.wands.wandofinstability.eleblast_desc=An elemental blast with a staff of instability is the same as one from a random wand.

items.wands.wandofsummoning.name=wand of summoning
items.wands.wandofsummoning.staff_name=staff of summoning
items.wands.wandofsummoning.desc=A wand of dark wood with a cold breath about it. Each zap calls a spirit up from the floor to fight beside you.\n\nThis item comes from Sandbox Pixel Dungeon, an idea by Arachnentoma.
items.wands.wandofsummoning.stats_desc_wraith=This wand summons a corrupted %s that follows you and attacks nearby enemies.
items.wands.wandofsummoning.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of summoning, a corrupted wraith sometimes rises beside it.
items.wands.wandofsummoning.eleblast_desc=An elemental blast with a staff of summoning sends out a wave of shadow.
items.wands.wandofsummoning.bad_location=You can't summon an ally there.

items.wands.wandofyendor.name=wand of yendor
items.wands.wandofyendor.staff_name=staff of yendor
items.wands.wandofyendor.desc=This legendary wand is made from the Amulet of Yendor, Tengu's mask and the Dwarf King's crown, which gives it unimaginable power. It still holds the Amulet's way home.\n\nThis item comes from Sandbox Pixel Dungeon, an idea by Arachnentoma.
items.wands.wandofyendor.stats_desc=This wand is so powerful that it strikes your opponent with every possible wand effect at once, giving it no chance of survival.
items.wands.wandofyendor.bmage_desc=When _the Battlemage_ imbues this wand, he will be able to rule the whole universe, hopefully.
items.wands.wandofyendor.eleblast_desc=An elemental blast with a staff of yendor hits ten times as hard as a normal one.
###community
items.artifacts.necklaceofice.name=necklace of ice
items.artifacts.necklaceofice.ac_activate=ACTIVATE
items.artifacts.necklaceofice.no_charge=Your necklace is not fully charged yet.
items.artifacts.necklaceofice.cursed=You cannot use cursed necklace.
items.artifacts.necklaceofice.charged=Your necklace is fully charged!
items.artifacts.necklaceofice.using=You prepare to unleash the deadly blizzard!
items.artifacts.necklaceofice.levelup=Your necklace grows stronger!
items.artifacts.necklaceofice.desc=A tear shaped ice crystal hung on a silver chain. Despite surrounding temperature, the crystal shows no sign of melting.
items.artifacts.necklaceofice.desc_worn=As you wear the necklace, you no longer feel the cold and instead get protected by it. It seems like crystal is slowly gaining energy.\n\nWhen fully charged, it will create a deadly blizzard around you, chilling the surroundings and damaging the enemies for _%d-%d damage._
items.artifacts.necklaceofice.desc_cursed=The cursed necklace lightly strangles your neck, with its crystal trying to protect you by infrequently encasing you in an ice block.
items.bombs.crossbomb.name=cross bomb
items.bombs.crossbomb.desc=This bright stuffed bomb does 33% more damage than normal bomb, but explodes in cross shape, with each line of the cross being two tiles long. Better get precise with a placement!
items.potions.brews.frostfirebrew.name=frostfire brew
items.potions.brews.frostfirebrew.desc=When shattered, this brew will unleash a volatile blue flame that burns like fire and chills like ice at the same time.
items.potions.elixirs.leanyelixir.name=leany elixir
items.potions.elixirs.leanyelixir.desc=This whimsical elixir will grant the drinker the big elemental resistance and huge boost to their speed and damage, but make their head be clouded in confusing dreams.
items.potions.elixirs.leanyelixir$lean.name=lean
items.potions.elixirs.leanyelixir$lean.desc=The world is clouded in majestic and magenta relaxing fog, allowing you to ignore all unnecessary pain and reach new heights in battles... or not.\n\nWhile under effects of lean, the characters will take 3x less elemental damage, and they will move 2x faster, evade 1.5x more frequently and deal 2x physical damage, but behave as frantically as if they were affected by vertigo.\n\nTurns remaining: %s.
items.spells.rngmanipulator.name=luck manipulator
items.spells.rngmanipulator.desc=This small white crystal has shifting black runic symbols on each of its surfaces, making it look like a die. This nifty little spell can turn the odds on your favor, for a price... \n\nWhen activated, it will ask for either 50% of gold or 75% of hero's maximum HP to create luck boost for the next floor.
items.spells.rngmanipulator.window_desc=The shining and shifting runes of luck's die are activated, and you get presented with a choice...\n\nYou can sacrifice either 50% of your current gold saved up, or get damaged for 75% of your maximum health to conjure the special "luck boost" buff for the next floor only, which will boost the drop rates of on-floor items and items dropped from the enemies.\n\nThe spell will be used after successful sacrifice, but each usage overrides the previous boost.
items.spells.rngmanipulator.window_gold=Use %d gold
items.spells.rngmanipulator.window_hp=Use %d health
items.spells.rngmanipulator.window_cancel=Cancel
items.spells.rngmanipulator.gold_luck=You spent your precious money to get %d luck boost for next floor!
items.spells.rngmanipulator.health_luck=You nobly harmed yourself to get %d luck boost for next floor!
items.spells.rngmanipulator$luckboost.name=luck boost
items.spells.rngmanipulator$luckboost.desc_nowork=The delightful boost to fortune has been bestowed upon you.\n\nIt currently doesn't work, so don't get excited for any burst of luck.
items.spells.rngmanipulator$luckboost.desc=The delightful boost to fortune has been bestowed upon you.\n\nIt currently provides _%d luck boost,_ which affects the amounts of enemy drops and loot from the dungeon's rooms.
items.trinkets.brokentreasurebox.name=broken treasure box
items.trinkets.brokentreasurebox.desc=This blue-ish storage crate once hold a great amount of treasure, but now is deeply beat down from age. Still, it seems to lead to finding more treasure chests in this dungeon.
items.trinkets.brokentreasurebox.typical_stats_desc=Typically, this trinket will spawn extra _%s%%_ special rooms on next floor, which may have some extra items to obtain.
items.trinkets.brokentreasurebox.stats_desc=At its current level, this trinket will spawn extra _%s%%_ special rooms on next floor, which may have some extra items to obtain.
items.weapon.melee.alchemicalakrafena.name=alchemical akrafena
items.weapon.melee.alchemicalakrafena.stats_desc=This weapon can be imbued with regular potions to make it trigger effects of darts, that are made from seeds, which correspond to potion imbued. Currently it has no effect.
items.weapon.melee.alchemicalakrafena.ac_infuse=IMBUE
items.weapon.melee.alchemicalakrafena.prompt=Select a regular potion
items.weapon.melee.alchemicalakrafena.identify=You must identify that potion to be able to use it as imbue.
items.weapon.melee.alchemicalakrafena.absorb_potion=You imbued %s into alchemical akrafena, making it glow with new powers.
items.weapon.melee.alchemicalakrafena.current_effect=This weapon is currently empowered to trigger effects of _%s._ %s
items.weapon.melee.alchemicalakrafena.duration_left=The amount of hits left for this imbue: _%d/%d._
items.weapon.melee.alchemicalakrafena.duration_out=The imbue of this alchemical akrafena has run out.
items.weapon.melee.alchemicalakrafena.ability_name=imbue spin
items.weapon.melee.alchemicalakrafena.typical_ability_desc=The Duelist can do _imbue spin_ while wielding an alchemical akrafena. This ability allows the Duelist to charge a powerful spinning attack with her akrafena, typically dealing _%1$d-%2$d damage_ in 5x5 area around the user and triggering imbue's effect on every struck enemy. This ability also needs 2 charges (4, if potion of strength is imbued) and will use up the alchemical akrafena's imbue.
items.weapon.melee.alchemicalakrafena.ability_desc=The Duelist can do _imbue spin_ while wielding an alchemical akrafena. This ability allows the Duelist to charge a powerful spinning attack with her akrafena, dealing _%1$d-%2$d damage_ in 5x5 area around the user and triggering imbue's effect on every struck enemy. This ability also needs 2 charges (4, if potion of strength is imbued) and will use up the alchemical akrafena's imbue.
items.weapon.melee.alchemicalakrafena.ability_no_imbue=You need imbue effect to present to do imbue spin.
items.weapon.melee.alchemicalakrafena.desc=A mysterious wavy blade from far lands, seemingly attuned to synergize with alchemical items.
items.gemstonedust.name=gemstone dust
items.gemstonedust.prompt=Select a ring or wand
items.gemstonedust.ac_apply=APPLY
items.gemstonedust.level_too_high_ring=That ring is too powerful for dust to improve.
items.gemstonedust.not_enough=You don't have enough dust for that!
items.gemstonedust.apply_ring=You cover your ring with dust, increasing its power!
items.gemstonedust.level_too_high_wand=That wand is too powerful for dust to improve.
items.gemstonedust.apply_wand=You coat your wand with dust, increasing its power!
items.gemstonedust.desc=This bright powder shines like the finest gem. It can act as an amplifier to magical energies, increasing the level of rings and wands when it is applied to them!\n\nUpgrading a ring costs 1 or 2 dust depending on the ring's initial level, and upgrading a wand costs 1 more dust. Dust can upgrade rings to a maximum of +2 and wands to maximum of +3.\n\nDust upgrades are overridden by scrolls of upgrade and similar items.
items.repairedrapier.name=repaired rapier
items.repairedrapier.desc=With a hefty amount of alchemical energy, the weapon of a defeated duelist has been repaired. While it's still too rigid to use in combat, the martial prowess of its past own allows you to _master melee weapons, allowing you to use their abilities_.

###community
items.rings.ring.is_not=This is not %s.
items.rings.ring.dust_one=This ring has gained _1 level_ from boosting items.
items.rings.ring.dust_many=This ring has gained _%d levels_ from boosting items.
items.rings.ring$placeholder.name=ring
items.spells.silencing.name=silencing
items.spells.silencing.no_target=There is nothing to silence there.
items.spells.silencing.desc=This spell disrupts the flow of magical energy of a creature that's been casted on.\n\nWhen cast on an enemy, it will be temporarily stripped off its magical abilities. Powerful foes will be able to resist this effect.
items.spells.silencing$effect.name=silenced
items.spells.silencing$effect.desc=The flow of creature's magical powers has been disrupted.\n\nWhile being silenced, the target will be unable to use its magical abilities, if it has any.\n\nTurns remaining: %s.
items.arcaneresin.level_too_high_wand=That wand is too powerful for resin to improve.
items.arcaneresin.apply_wand=You coat your wand with resin, increasing its power!
items.arcaneresin.level_too_high_ring=That ring is too powerful for resin to improve.
items.arcaneresin.apply_ring=You coat your ring with resin, increasing its power!
items.arcaneresin.desc_gemstone=This fine powder shimmers between shades of purple and white. It can act as an amplifier to magical energies, increasing the level of wands and rings when it is applied to them!\n\nUpgrading a wand costs 1, 2, or 3 resin depending on the wand's initial level, and upgrading a ring costs 1 more resin. Resin can upgrade wands to a maximum of +3 and rings to maximum of +2.\n\nResin upgrades are _overridden by other upgrade sources_ however (such as scrolls of upgrade), and do not apply when imbuing a wand into the Mage's staff.

###community CommunityFury
items.spells.communityfury.name=fury
items.spells.communityfury.no_target=There is nothing to make furious there.
items.spells.communityfury.desc=This aggressive spell will imbue the targeted enemy with enraging energy, forcing them to attack any nearby creatures and increasing their movement speed and attack speed.

###community CommunityWakizashi
items.weapon.melee.communitywakizashi.name=wakizashi
items.weapon.melee.communitywakizashi.stats_desc=This is rather accurate weapon.\nThis is an incredibly fast weapon.\nThis weapon ignores a third of enemy's armor.
items.weapon.melee.communitywakizashi.ability_name=lethal combo
items.weapon.melee.communitywakizashi.typical_ability_desc=The Duelist can perform a _lethal combo_ with a wakizashi. This stance takes no time to activate and allows Duelist to accumulate damage from successful strikes typically for _%d turns._
items.weapon.melee.communitywakizashi.ability_desc=The Duelist can perform a _lethal combo_ with a wakizashi. This stance takes no time to activate and allows Duelist to accumulate damage from successful strikes for _%s turns._
items.weapon.melee.communitywakizashi.desc=A small, yet surprisingly sharp knife. Its size and shape allows for rapid and piercing attacks.
items.weapon.melee.communitywakizashi$lethalcombo.name=lethal combo
items.weapon.melee.communitywakizashi$lethalcombo.desc=The Duelist is building up a devastating combo with her weapon hitting harder with each hit. While this stance is active, her wakizashi will deal 1 more damage with each successful hit. Reapplying lethal combo, while it is active, will remove the half of damage boost.\n\nTurns remaining: %s.\nDamage boost: %d.
