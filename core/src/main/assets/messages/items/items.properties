items.rbagunsmithingtool.name=Gunsmithing Tool
items.rbagunsmithingtool.desc=A collection of tools to modify firearms in various ways. It is consumed after a single use, but you can use multiple gunsmithing tools to apply various modifications.
items.rbagunsmithingtool.inv_title=Select a firearm to modify
items.rbagunsmithingtool.ac_use=Use
items.rbagunsmithingtool.mod_select=Select a modification for the firearm
items.rbagunsmithingtool.cancel=Cancel
items.rbagunsmithingtool.barrel=Barrel Modification
items.rbagunsmithingtool.barrel_desc=_Barrel Modification_ adjusts _bullet accuracy_ by altering the barrel length.\n\n_Short Barrel:_\n- Long-range accuracy _x0.5_\n- Short-range accuracy _x1.5_\n\n_Long Barrel:_\n- Long-range accuracy _x1.25_\n- Short-range accuracy _x0.75_
items.rbagunsmithingtool.magazine=Magazine Modification
items.rbagunsmithingtool.magazine_desc=_Magazine Modification_ adjusts _maximum ammo_ and _reload time_ by altering magazine size.\n\n_Extended Magazine:_\n- Maximum ammo _x1.5_\n- Reload time _+1 turn_\n\n_Quick-draw Magazine:_\n- Maximum ammo _x0.5_\n- Reload time _-1 turn_
items.rbagunsmithingtool.bullet=Ammo Modification
items.rbagunsmithingtool.bullet_desc=_Ammo Modification_ adjusts bullet _damage_ and _armor penetration_ by changing the loaded ammunition type.\n\n_Armor-Piercing Ammo:_\n- Bullet damage _x0.85_\n- Armor applied _x0_\n\n_Hollow-Point Ammo:_\n- Bullet damage _x1.3_\n- Armor applied _x2_
items.rbagunsmithingtool.weight=Weight Modification
items.rbagunsmithingtool.weight_desc=_Weight Modification_ adjusts the _firearm's tier_ by fundamentally altering its base build.\n\n_Lightweight: -1 tier_\n\n_Heavyweight: +1 tier_
items.rbagunsmithingtool.attach=Attachment Modification
items.rbagunsmithingtool.attach_desc=_Attachment Modification_ grants _special effects_ by mounting tactical optical devices onto firearms.\n\n_Laser Sight:_\n- Bullet accuracy _x1.25_\n- Enemy detection chance _+1 tier_\n\n_Flashlight:_\n- On hit, _50%-10%*(distance to target)_ chance to inflict _brief blindness_ on enemies\n- Enemy detection chance _+2 tiers_
items.rbagunsmithingtool.enchant=Magic Modification
items.rbagunsmithingtool.enchant_desc=_Magic Modification_ alters the firearm's mana conduction mechanism to balance _bullet damage_ and _enchantment potency_.\n\n_Magic Amplification:_\n- Bullet damage _x0.85_\n- Enchantment potency _x2_\n\n_Magic Suppression:_\n- Bullet damage _x1.1_\n- Enchantment potency _x0.5_
