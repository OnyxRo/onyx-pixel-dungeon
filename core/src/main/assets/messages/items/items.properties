items.active.balaser$lasertargeted.desc=This target is currently marked by the laser sight, which leaves it exposed to ranged attacks.
items.active.batrashbin.name=Camouflage Device
items.active.batrashbin.desc=A portable camouflage device Miyu brought. It looks like a trash bin for gathering leaves to anyone, but she insists it is a camouflage device. When used, every enemy on the current floor stops chasing you and wanders elsewhere.
