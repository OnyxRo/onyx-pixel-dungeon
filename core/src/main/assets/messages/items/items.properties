items.armor.summonerarmor.name=summoner regalia
items.armor.summonerarmor.ac_special=PHASE SHIFT
items.armor.summonerarmor.fov=You can only materialize to an ally you can see
items.armor.summonerarmor.prompt=Choose an ally to materialize to
items.armor.summonerarmor.desc=While wearing this regalia, the summoner can materialize beside an ally she can see.\n\n\
  Using this ability will consume 35% of the armor's charge. \
  The armor steadily builds charge as the summoner gains experience.
items.artifacts.driedrose.desc_summoner=A rose that your lover left you to remember him before he left vanquish the evil of the dungeon. The moisture has left the rose from the years of waiting for him.
items.artifacts.driedrose.desc_no_quest_summoner=The rose that your lover left you that is somehow still holding together despite its age.\n\n\
  It seems to have some spiritual power, but you have no idea how to use it right now.
items.artifacts.driedrose$wndghosthero.title_summoner=Ryuse's Equipment
items.artifacts.driedrose$wndghosthero.desc_summoner=\
  Ryuse's ghost is weak on their own, but their form is solid enough to be equipped with a weapon and armor. \
  They will be able to use these items just like you do.\n\n\
  He can currently equip items requiring up to _%d strength_ and Ryuse's level is _%d._
items.artifacts.driedrose$ghosthero.name_summoner=ryuse
items.artifacts.driedrose$ghosthero.hello_summoner=Hello again, Elaina.
items.artifacts.driedrose$ghosthero.introduce_summoner=My spirit is bound to this rose now.\n\n\
  I cannot return to this world, but thanks to you I have a second chance to complete my journey and also protect you. When I am able I will respond to your call and fight with you.\n\n\
  As long as you have the rose I can hear your voice, so you can use it to direct me from afar.\n\n\
  Hopefully both of us may succeed where I failed... That evil must be stopped.
items.artifacts.eyeofwisdom.name=eye of wisdom
items.artifacts.eyeofwisdom.desc_worn=When you hold the eye, the world seems more vibrant. \
  You can see more things and in more detail, you feel like you can know the exact status of creatures around you and yourself.
items.helmets.helmet.cannot-wear-two=You cannot wear multiple helmets!
items.helmets.helmet.equip_cursed=This helmet tied itself to your head.
items.helmets.helmet.cursed=The helmet painfully binds itself to you.
items.helmets.helmet.cursed_desc=You feel ill with a cursed helmet.
items.helmets.helmet.inscribed=It is inscribed with a _%s_.
items.helmets.helmet.identify=You are now familiar with your helmet.
items.helmets.circletemerald.name=emerald circlet
items.helmets.circletemerald.desc=We don't know how long it has existed, but after wiping off the dust on it, it acquires a completely new outlook and is still a delicate head ornament.
items.helmets.circletemerald.effect_desc=It seems that you feel calm when wearing ememald circlet. reducing the speed of pressure accumlation.
items.helmets.circletemerald.cursed_desc=A cursed circlet will have opposite effect.
items.helmets.crownofdwarf.name=crown of dwarf
items.helmets.crownofdwarf.desc=It's a rare artifact after Dwarf King demised. The delicate golden crown is studded with gems. Everyone facing this masterpiece wiil feel cautious, for the crown had been the symbol of sumpreme power, and the witness of flourishing age of the past dwarf kingdom.\n\nFlashy luxuries have always been the pursuit of business people.
items.helmets.guardhelmet.name=guard helmet
items.helmets.guardhelmet.desc=Ordinary steel helmet of prison guards with plain looking.
items.helmets.guardhelmet.effect_desc=This helmet is hard and protective that it improves resistances slightly.
items.helmets.guardhelmet.cursed_desc=A cursed helmet will in turn reduce resistances.
items.helmets.helmetbarbarian.name=barbarian helmet
items.helmets.helmetbarbarian.desc=This is a barbarian helmet, if its two corners are not enough to explain.
items.helmets.helmetbarbarian.effect_desc=When you are in serious injury, your blows will be notably powerful.
items.helmets.helmetcrusader.name=crusader helmet
items.helmets.helmetcrusader.desc=An ordinary helmet looks a bit worn out but is barely usable.
items.helmets.helmetcrusader.effect_desc=Crusader helmet decrease the ranged damage you taken, even block it completely under a certain probability, at the cost of decreasing 1 view distance. 
items.helmets.headdressregeneration.name=regeneration headdress
items.helmets.headdressregeneration.desc=This headaddress has an odd modeling which looks like the hijab.
items.helmets.headdressregeneration.effect_desc=Regeneration headdress boosts your life regeneration.
items.helmets.headdressregeneration.cursed_desc=A cursed headdress will in turn slow down your regenation.
items.helmets.hoodapprentice.name=apprentice hood
items.helmets.hoodapprentice.desc=The basic equipment of the apprentices admitted to the wizard academy is light and strict, which is in line with the style of these madmen.
items.helmets.hoodapprentice.effect_desc=You feel yourself more like a professional mage and your wand is more comfortable with the hood. Also your wand can deal more damage.
items.helmets.littlepail.name=Small Pail
items.helmets.littlepail.desc=The size of pail can just fit on the head. Though it may goes against the original intention, it does works on defense.
items.helmets.littlepail.effect_desc=The cute pail provides you _0~3_ defense for normal damage.
items.helmets.maskofclown.name=mask of clown
items.helmets.maskofclown.desc=A musk of clown, this excessively exaggerated funny expression looks very strange, indeed.
items.helmets.maskofclown.effect_desc=When wearing this mask, there is a chance to upgrade the damage you dealt to _PURE_ damage.
items.helmets.maskofhorror.name=mask of horror
items.helmets.maskofhorror.desc=The mask of horror, the momentum in the war, the symbol of bravery and fearlessness, especially for some barbarian tribes.
items.helmets.maskofhorror.effect_desc=This mask has a chance to  guarantee a hit regardless of the circumstances.
items.helmets.maskofhorror.cursed_desc=A cursed mask will in turn make your attack inaccurate.
items.helmets.maskoflider.name=Mask of Rider
items.helmets.maskoflider.desc=This mask doesn't seem to belong to this world. Its shape is easy to associate with some insects. It has been recorded that people should shout "Henxing!" when wearing this mask.
items.helmets.maskoflider.effect_desc=Mask of Rider increase your view distance by one.
items.helmets.maskoflider.cursed_desc=Cursed mask will make your attack inaccurate. 
items.helmets.maskofmadness.name=mask of madness
items.helmets.maskofmadness.desc="Once you wear this mask, you will become an uncontrollable militant.", a warning from a frozen frog.\n\nA powerful but risky equipment. The wearer can enjoy a huge boost in force, but at the cost of being vunlerable both physically and mentally. _This effect scales with the level of mask. You CANNOT undo once you equip it!_
items.helmets.maskofmadness.cannot_unequip=This mask has already been one with you and you are powerless to uneuquip it!
items.helmets.maskofmadness.levelup=Killing makes your mask of madness grow stronger!
items.helmets.rangerhat.name=Ranger's headband
items.helmets.rangerhat.desc=This headband seems useless at first look, but infact it can prevent sweat from disturbing the wearer without blocking sight and is very suitable for the agile.
items.helmets.rangerhat.effect_desc=This headband can increase damage of your ranged attack.
items.helmets.rangerhat.cursed_desc=A cursed headband will give the opposite effect.
items.helmets.turtlescarf.name=Turtle Scarf
items.helmets.turtlescarf.desc=It's said that there are four colors of these headscarves, but who knows what this has to do with turtle?
items.helmets.turtlescarf.effect_desc=Scarf can also provide extra magic resistance.
items.helmets.turtlescarf.cursed_desc=A cursed one will do the opposite however.
items.helmets.wizardhat.name=wizard hat
items.helmets.wizardhat.desc=A rarely seen separate magician hat - the magicians always prefer cloaks.
items.helmets.wizardhat.effect_desc=This hat seems to contain aome kind of magic that slowly boost recharging of your wands.
items.helmets.wizardhat.cursed_desc=A cursed wizard hat has opposite effects.
items.weapon.melee.trainingwhip.name=training whip
items.weapon.melee.trainingwhip.stats_desc=This weapon has tremendous reach.
items.weapon.melee.trainingwhip.desc=A makeshift weapon that's a combination of a stick and a rope. This weapon deals little damage but has very long reach.
items.weapon.melee.summonerwhip.name=summoner's whip
items.weapon.melee.summonerwhip.stats_desc=This weapon has tremendous reach.
items.weapon.melee.summonerwhip.desc=A whip used by legendary summoners that had long transcended this world. \n\n\
  It had lost its divinity but it's still one of the strongest weapons of this realm. \
  It has a strange eerie power in it as if it still holds energy from communing with the Old Ones.
items.armor.summonerarmor.fov=You can only materialize to an ally you can see
