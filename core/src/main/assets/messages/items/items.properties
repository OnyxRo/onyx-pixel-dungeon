items.quest.xenoskull.name=xenomorph skull
items.quest.xenoskull.desc=A xenomorph skull. It would make a great hunting trophy, if you had a wall to mount it on.
items.weapon.curses.lowenergy.name=low energy %s
items.weapon.curses.lowenergy.desc=Low energy weapons take great effort to use, and will periodically weaken the user as a result.
items.weapon.curses.backfiring.name=backfiring %s
items.weapon.curses.backfiring.desc=Backfiring weapons can be just as dangerous to the user as to their target.
items.weapon.curses.misfiring.name=misfiring %s
items.weapon.curses.misfiring.desc=A misfiring weapon has a very hard time finding its mark, making it extremely inaccurate unless the attack is guaranteed to succeed.
