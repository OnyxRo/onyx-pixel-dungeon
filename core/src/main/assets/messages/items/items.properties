items.armor.glyphs.fleeing.name=%s of Fleeing
items.armor.glyphs.fleeing.desc=This glyph gives an oppurtunity of its user to flee uphill battles by giving them a chance to become invisbible when hit.
items.armor.glyphs.bloodrage.name=%s of Bloorage
items.armor.glyphs.bloodrage.desc=eme
items.food.spiritschalice.name=Spirit's Chalice
items.food.spiritschalice.desc=A chalice full of water blessed by spirits. Drinking from it could give positive or negative effects.
items.weapon.enchantments.turning.name=turning %s
items.weapon.enchantments.turning.desc=This enchantment allows its weapon to inflict amok upon its targets, causing them to turn and attack their allies if any are nearby.
items.weapon.melee.pinsol.name=Pin Sol
items.weapon.melee.pinsol.stats_desc=This weapon has a chance to stun enemies. (Currently Unavailable)
items.weapon.melee.pinsol.desc=Bestowed upon by the gods, this sword contains incredible power drawn from the sun.
items.weapon.melee.pinluna.name=Pin Luna
items.weapon.melee.pinluna.stats_desc=This weapon hits faster and does better damage when surprising enemies.
items.weapon.melee.pinluna.desc=Bestowed upon by the gods, this sword was forged from the shadows and draws its power from the moon.
items.weapon.melee.thedebugger.name=The Debugger
items.weapon.melee.thedebugger.stats_desc=This weapon does too much damage and hits too far.
items.weapon.melee.thedebugger.desc=Kill everything in one hit, from anywhere. If it is seen, it can be killed.
items.weapon.melee.sacrificialknife.name=Sacrificial Knife
