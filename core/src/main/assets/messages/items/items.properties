items.artifacts.abilities.spectralblades.name=spectral blades
items.artifacts.abilities.spectralblades.prompt=Choose a mob to attack
items.artifacts.abilities.spectralblades.desc=The hero throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All the normal effects of a melee weapon will activate, including enchantments. In addition, the blades are slightly magical and can pierce through 1 solid object to hit their target. Some additional blades can be thrown if there is more enemies in target area.
items.artifacts.abilities.spectralblades.tier1=Charge cost: _35_\n_Attacks every enemy in 30 degree cone_
items.artifacts.abilities.spectralblades.tier2=Charge cost: _45_\n_Attacks everything in field of view for 25% damage_
items.artifacts.abilities.spectralblades.tier3=Charge cost: _60_\n_Attacks every enemy in 90 degree cone, heals 4 HP for each enemy_
items.artifacts.abilities.revengewaves.name=earthquake
items.artifacts.abilities.revengewaves.desc=The hero shakes floor so hard, than every enemy in hero's sight will get rooted and pushed backwards by immense force.
items.artifacts.abilities.revengewaves.tier1=Charge cost: _50_\nPush force: _3_
items.artifacts.abilities.revengewaves.tier2=Charge cost: _70_\nPush force: _3_\n_Gives 2.5 turns of Empowered for each mob affected_
items.artifacts.abilities.revengewaves.tier3=Charge cost: _100_\n_Pushes as far as possible but mobs are only skipping their turn and do not get rooted or damaged_
items.artifacts.abilities.targetedsupport.name=targeted support
items.artifacts.abilities.targetedsupport.prompt=Choose a minion to empower
items.artifacts.abilities.targetedsupport.desc=The hero casts the empowering bolt that will imbue the chosen minion with certain effect, depending on its class.
items.artifacts.abilities.targetedsupport.tier1=Charge cost: _25_\n_Buffs minion according to its class_\nDEFENSE: full heal\nRANGE: attacks inflict Rooting\nMELEE: melee attacks deal more damage\nMAGIC: additional magic power\nSUPPORT: additional magic power
items.artifacts.abilities.targetedsupport.tier2=Charge cost: _35_\n_Buffs minion according to its class_\nDEFENSE: full heal\nRANGE: attacks inflict Rooting\nMELEE: melee attacks deal more damage\nMAGIC: additional magic power\nSUPPORT: additional magic power\n\n_Gives shielding in amount of 33% minion's max HP_
items.artifacts.abilities.targetedsupport.tier3=Charge cost: _60_\n_Splits minion into two identical pieces_
items.artifacts.abilities.arcaneelement.name=arcane element
items.artifacts.abilities.arcaneelement.prompt=Choose a mob to attack
items.artifacts.abilities.arcaneelement.desc=The hero's next attack will proc their weapon's enchantment with 100% chance. Some powerful enchantments require more energy for this ability to work.
items.artifacts.abilities.arcaneelement.tier1=Charge cost: _25_ (_100_ with Grim)\n_Makes next attack proc enchantment's effect with 100% chance_
items.artifacts.abilities.arcaneelement.tier2=Charge cost: _60_ (_60_ with Grim)\n_Makes 2 next attacks proc enchantment's effect with 100% chance_ (doesn't work on Grim)
items.artifacts.abilities.arcaneelement.tier3=Charge cost: _10_ (_100_ with Grim)\n_Makes next attack proc enchantment's effect with double chance_
items.artifacts.abilities.graveyard.name=graveyard
items.artifacts.abilities.graveyard.desc=The hero casts a cloud of cursed ash over huge area that will slowly make decay any creature, including hero and his allies, entering it. Undead monsters will be corrupted, while living entities will be killed and turned into corrupted wraiths.
items.artifacts.abilities.graveyard.tier1=Charge cost: _100_\nGraveyard area: _5x5_\nDuration: _50 turns_
items.artifacts.abilities.graveyard.tier2=Charge cost: _50_\nGraveyard area: _5x5_\nDuration: _20 turns_
items.artifacts.abilities.graveyard.tier3=Charge cost: _50_\nGraveyard area: _9x9_\nDuration: _1 turn_
items.artifacts.abilities.perfumeblast.name=perfume blast
items.artifacts.abilities.perfumeblast.desc=When used, this ability will release a charming perfume onto desired cell which will spread like a gas. Anything that breathes it in will be attracted to the perfume cloud.
items.artifacts.abilities.perfumeblast.tier1=Charge cost: _60_\nAmount of perfume: _500_
items.artifacts.abilities.perfumeblast.tier2=Charge cost: _20_\nAmount of perfume: _125_
items.artifacts.abilities.perfumeblast.tier3=Charge cost: _100_\nAmount of perfume: _850_
items.artifacts.abilities.druidbag.name=druid's bag
items.artifacts.abilities.druidbag.desc=The hero grows a bunch of grass around themselves and rooting any creatures in process.
items.artifacts.abilities.druidbag.tier1=Charge cost: _25_\nGrass area: _3x3_\nRooting duration: _4 turns_
items.artifacts.abilities.druidbag.tier2=Charge cost: _50_\nGrass area: _5x5_\nRooting duration: _2 turns_
items.artifacts.abilities.druidbag.tier3=Charge cost: _80_\nGrass area: _7x7_\nRooting duration: _0 turns_
items.artifacts.ringartifacts.subtilitassigil.name=subtilitas sigil
items.artifacts.ringartifacts.subtilitassigil.ac_use=CAST
items.artifacts.ringartifacts.subtilitassigil.desc=This curious relic glows with faint red light. It seems to portray endless rage.
items.artifacts.ringartifacts.subtilitassigil.desc_equipped=After you started to hold it, the sigil is glowing much brighter. This glow can be used to cast deadly rays of rage. Targeted entities will be _enraged_, causing them to be more precise with their attacks, making them both take and deal double damage and be briefly angered at their former allies.
items.artifacts.ringartifacts.subtilitassigil.desc_hint=It seems to absorb some magic from wands.
items.artifacts.ringartifacts.subtilitassigil.desc_cursed=You cannot hold the power of red glow; it will make you take 50% more damage due to unfueled rage and ignorance.
items.artifacts.ringartifacts.subtilitassigil.no_charge=Your sigil is out of charge now.
items.artifacts.ringartifacts.subtilitassigil.cursed=You cannot use cursed sigil.
items.artifacts.ringartifacts.subtilitassigil.level_up=Your sigil has been empowered!
items.artifacts.ringartifacts.subtilitassigil.prompt=Select a cell to target
items.artifacts.ringartifacts.subtilitassigil$enragebuff.name=Enraged
items.artifacts.ringartifacts.subtilitassigil$enragebuff.desc=You feel like you are going to tear apart those walls.\n\nBeing enraged makes creature take and deal 2x damage and also have 33%% more accuracy.\n\nTurns left: %s
items.artifacts.ringartifacts.mirroroffates.name=mirror of fates
items.artifacts.ringartifacts.mirroroffates.ac_use=CAST
items.artifacts.ringartifacts.mirroroffates.desc=This dusty silver mirror not only shows your face quite clearly, but also believed to redirect any harm from wielder.
items.artifacts.ringartifacts.mirroroffates.desc_equipped=This mirror allows you to put mirror shielding on yourself that will protect you from any enemy and also reflect their attacks. Unfortunately, this shield is not the most durable thing in the world and will eventually shatter, especially when you will try to move. After shield is destroyed, you will be unable to use this shield for some time.
items.artifacts.ringartifacts.mirroroffates.desc_cursed=Malevolent magic put quite a twist at understanding how redirecting works: instead of reflecting damage, cursed mirror will "redirect" you into different place.
items.artifacts.ringartifacts.mirroroffates.no_charge=Your mirror isn't recharged fully yet.
items.artifacts.ringartifacts.mirroroffates.already_used=Your mirror is already activated.
items.artifacts.ringartifacts.mirroroffates.cursed=You cannot use cursed mirror.
items.artifacts.ringartifacts.mirroroffates.level_up=Your mirror has been upgraded to shield you for more damage!
items.artifacts.ringartifacts.mirroroffates$mirrorshield.name=Mirror Shield
items.artifacts.ringartifacts.mirroroffates$mirrorshield.desc=This ethereal shield will redirect any damage from you to attacker, but it will eventually break.\n\nMoving will reduce shielding by 25%%.\n\nShield left: %s.
items.artifacts.ringartifacts.mirroroffates$mirrorcooldown.name=Mirror of Fates cooldown
items.artifacts.ringartifacts.mirroroffates$mirrorcooldown.desc=You can't use your mirror while effect is active.\n\nTurns left: %s
items.artifacts.ringartifacts.parchmentofelbereth.name=parchment of Elbereth
items.artifacts.ringartifacts.parchmentofelbereth.desc=This big sheet of scroll paper is written with ominous writing on it. It is known that certain works are able to repel monsters away.
items.artifacts.ringartifacts.parchmentofelbereth.desc_worn=This parchment has power to shout its runes into heads of most monsters around you, making them flee in respect and terror. However, the rune's magic has to recharge before it can be used again. Maybe reading it thoughtfully will make the scroll's powers stronger?
items.artifacts.ringartifacts.parchmentofelbereth.desc_cursed=The curse on this parchment emits negative psychic energy, making every enemy attack you on sight.
items.artifacts.ringartifacts.parchmentofelbereth.ac_use=SHOUT
items.artifacts.ringartifacts.parchmentofelbereth.ac_pray=PRAY
items.artifacts.ringartifacts.parchmentofelbereth.no_charge=There is no energy left in parchment.
items.artifacts.ringartifacts.parchmentofelbereth.cursed=You cannot use cursed parchment's magic.
items.artifacts.ringartifacts.parchmentofelbereth.usage=The power of Elbereth rune makes monsters flee!
items.artifacts.ringartifacts.parchmentofelbereth.level_up=Your parchment has been upgraded!
items.artifacts.ringartifacts.parchmentofelbereth.full_charge=Your parchment is fully charged and ready to use!
items.artifacts.ringartifacts.parchmentofelbereth.no_way=You cannot pray in full isolated location.
items.artifacts.ringartifacts.badgeofbravery.name=badge of bravery
items.artifacts.ringartifacts.badgeofbravery.desc=The small steel plate with bloody red icon of sword. Holding it imbues you with courage and strength.
items.artifacts.ringartifacts.badgeofbravery.desc_worn=This badge will sometimes assist you in battle, doing _%d-%d_ armor-piercing damage to enemies and applying randomized enchantments. This effect can be improved by augmenting the badge with melee weapons; 2 weapons of _tier-%d_ is enough to upgrade the badge, but each upgrade requires more advanced weapons.
items.artifacts.ringartifacts.badgeofbravery.desc_full=This badge will frequently assist you in battle, doing _%d-%d_ armor-piercing damage to enemies and applying randomized enchantments. It is at its maximum power right now.
items.artifacts.ringartifacts.badgeofbravery.desc_cursed=The malevolent magic in this badge converts on-hit effects of your weapon into dark curses, sometimes backfiring at you.
items.artifacts.ringartifacts.badgeofbravery.ac_repair=AUGMENT
items.artifacts.ringartifacts.badgeofbravery.level_up=Your badge is upgraded!
items.artifacts.ringartifacts.badgeofbravery.feed=Your badge is augmented with materials from the weapon.
items.artifacts.ringartifacts.badgeofbravery.prompt=Select tier-%d weapon
items.artifacts.ringartifacts.heavyflail.name=guardian's stone
items.artifacts.ringartifacts.heavyflail.desc=Very heavy rock on a chain, encrusted with topaz gemstones. They shine on the light like they are beating to some rhythm.
items.artifacts.ringartifacts.heavyflail.desc_worn=When hold on your back, this stone will provide hero up to _%d_ defensive shielding which is set on top of normal HP at rate of 1 HP per _%d turns_.
items.artifacts.ringartifacts.heavyflail.desc_action=If shielding exists, the stone can be _launched_ like a flail to deal up to impact armor-shattering _%d-%d_ damage in _%3$dx%3$d_ area, using up all said shielding; the damage will be lower if enemy is further away from the center.
items.artifacts.ringartifacts.heavyflail.desc_upgrade=The power of shielding seems to quite weak, but it can be improved by reforging some armor pieces. Each armor tier is worth more than the last.
items.artifacts.ringartifacts.heavyflail.desc_cursed=The malevolent magic in this stone prevents you from using its power of defense.
items.artifacts.ringartifacts.heavyflail.no_charge=You need to have shielding to use launching.
items.artifacts.ringartifacts.heavyflail.ac_launch=LAUNCH
items.artifacts.ringartifacts.heavyflail.ac_reforge=REFORGE
items.artifacts.ringartifacts.heavyflail.prompt=Select any armor
items.artifacts.ringartifacts.heavyflail.level_up=Your stone is enough hardened by reforges to upgrade!
items.artifacts.ringartifacts.heavyflail.feed=The armor's materials are used to reforge the stone.
items.artifacts.ringartifacts.heavyflail.cursed=You cannot launch cursed guardian's stone.
items.artifacts.ringartifacts.bootsmomentum.momentum=Building Momentum
items.artifacts.ringartifacts.bootsmomentum.running=Freerunning
items.artifacts.ringartifacts.bootsmomentum.resting=Recovering
items.artifacts.ringartifacts.bootsmomentum.action_name=freerun
items.artifacts.ringartifacts.bootsmomentum.momentum_desc=As they move in the momentum boots, the %1$s builds momentum, which they can spend to start freerunning.\n\nEach charge of momentum grants 1.5 turns of freerunning, and the %1$s can build up to %3$d charges. Momentum is quickly lost when the %1$s stops moving.\n\nThe current momentum is %2$d.
items.artifacts.ringartifacts.bootsmomentum.running_desc=While freerunning, the %1$s moves and attacks at 1.5x speed and gains bonus evasion based on their level and the level of the momentum boots.\n\nFreerunning lasts %2$d more turns.
items.artifacts.ringartifacts.bootsmomentum.resting_desc=The %1$s needs time to regain their stamina before building momentum again.\n\nThis lasts %2$d more turns.
items.artifacts.ringartifacts.fuelcontainer.name=fuel container
items.artifacts.ringartifacts.fuelcontainer.desc=This heavy crystal shines with a mysterious energy that seems to match the power stored in wands. Maybe it can store their extra charge?
items.artifacts.ringartifacts.fuelcontainer.ac_use=STORE CHARGE
items.artifacts.ringartifacts.fuelcontainer.desc_equipped=The fuel container stores wand charges in a portable form. _Drain_ a wand that has charge into it.\n\nThe stored energy is _used by itself_ later when a wand is out of charges.
items.artifacts.ringartifacts.fuelcontainer.desc_cursed=This artifact is bound to your wands and stops them from recharging.
items.artifacts.ringartifacts.fuelcontainer.cursed=You cannot charge a cursed container.
items.artifacts.ringartifacts.fuelcontainer.full_charge=Your fuel container is already charged.
items.artifacts.ringartifacts.fuelcontainer.level_up=Your container has been upgraded!
items.artifacts.ringartifacts.fuelcontainer.prompt=Select a wand
items.artifacts.ringartifacts.momentumboots.name=momentum boots
items.artifacts.ringartifacts.momentumboots.desc=Comfortable orange boots, shaped after the idea of speed. Whoever wears them gains the power of momentum.
items.artifacts.ringartifacts.momentumboots.desc_worn=While you wear the momentum boots you build momentum as you walk, and you can spend it to boost your movement and attack speed for a while. The momentum they hold starts low, but it grows as speed boosting effects charge and upgrade the boots.
items.artifacts.ringartifacts.momentumboots.desc_cursed=The curse on the boots stops you from gaining any momentum and caps your movement and attack speed at normal.
items.artifacts.ringartifacts.momentumboots.level_up=Your boots have been upgraded!
items.artifacts.ringartifacts.silkyquiver.name=silky quiver
items.artifacts.ringartifacts.silkyquiver.ac_use=CHOOSE ABILITY
items.artifacts.ringartifacts.silkyquiver.level_up=Your quiver has been upgraded!
items.artifacts.ringartifacts.silkyquiver.charged=Your quiver is full of arrows!
items.artifacts.ringartifacts.silkyquiver.no_charge=Your quiver has no arrows to shoot.
items.artifacts.ringartifacts.silkyquiver.cursed=You can't shoot from a cursed quiver.
items.artifacts.ringartifacts.silkyquiver.desc=This medium sized container is made to hold arrows and other projectiles. It seems to be enchanted with a never ending supply of arrows for many purposes.
items.artifacts.ringartifacts.silkyquiver.desc_equipped=This quiver lets you use special abilities that cost some of its charge, and the strongest one upgrades the quiver when it works. It charges up as you use thrown weapons (spirit arrows charge it less, since they are endless).
items.artifacts.ringartifacts.silkyquiver.desc_cursed=This quiver is bound to your back and spoils your aim with thrown weapons, greatly lowering their accuracy and stopping them from surprising enemies.
items.artifacts.ringartifacts.silkyquiver$combomove.shoot_desc=_Simple Arrow, 1 charge._ Shoots a simple arrow that carries the enchantment of your weapon. Its damage grows with the hero's level.
items.artifacts.ringartifacts.silkyquiver$combomove.knockback_desc=_Pushing Shot, 2 charges._ Shoots an arrow that deals no damage but knocks the target far back. Takes no time.
items.artifacts.ringartifacts.silkyquiver$combomove.mark_desc=_Deadly Mark, 3 charges._ Shoots a marking dart. For a while your thrown weapons never miss the target, pierce its armor and deal more damage. Takes 2 turns.
items.artifacts.ringartifacts.silkyquiver$combomove.burst_desc=_Rain of Arrows, 4 charges._ Fires a burst of arrows at nearby enemies, each a little stronger than a simple arrow. Takes 1.5 turns.
items.artifacts.ringartifacts.silkyquiver$combomove.grim_desc=_Void Shot, 5 charges._ Shoots an arrow that never misses, deals double damage and may kill the target outright, more likely the more hurt it is. A kill upgrades the quiver and restores charges. Takes 2 turns.
items.artifacts.ringartifacts.silkyquiver$arrow.name=quiver arrow
items.artifacts.ringartifacts.silkyquiver$arrow.desc=An arrow drawn from the silky quiver.
items.artifacts.soulofyendor.name=Soul of Yendor
items.artifacts.soulofyendor.desc=The ultimate accessory. Made by chaos magic, this crystal heart combines the powers of eight different artifacts that were used to create it.\n\nThe Soul of Yendor can give you food and alchemy energy, throw chains, form natural armor, bend the flow of time, heal your wounds faster, help you gather from tall grass, steal from enemies and conjure random scrolls from thin air.
items.artifacts.soulofyendor.desc_cursed=Somehow this artifact is cursed. You can't use any of its powers, and the forces of time slow you down now and then.
items.artifacts.soulofyendor.desc_worn=You feel the power of the legendary Rodney surge as you hold this amalgamation.
items.artifacts.soulofyendor.ac_use=USE ABILITY
items.artifacts.soulofyendor.ac_useagain=USE LAST ABILITY
items.artifacts.soulofyendor.usage_title=Choose ability
items.artifacts.soulofyendor.usage_message=You can spend the charge of the Soul of Yendor on the powers of the artifacts that made it.
items.artifacts.soulofyendor.horn_of_plenty=Eat from horn
items.artifacts.soulofyendor.alchemist_toolkit=Brew potions
items.artifacts.soulofyendor.ethereal_chains=Swing chains
items.artifacts.soulofyendor.sandals_of_nature=Form natural armor
items.artifacts.soulofyendor.timekeeper_hourglass=Manipulate time
items.artifacts.soulofyendor.unstable_spellbook=Read random scroll
items.artifacts.soulofyendor.master_armband=Steal from enemies
items.artifacts.soulofyendor.need_to_equip=You need to equip the Soul of Yendor to do that.
items.artifacts.soulofyendor.no_charge=The Soul of Yendor does not have enough charge.
items.artifacts.soulofyendor.cursed=You can't use a cursed Soul of Yendor.
