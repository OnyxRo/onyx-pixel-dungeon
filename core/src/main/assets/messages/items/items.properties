items.weapon.melee.gun.rbagun.gun_typical_desc=This firearm fires _%1$s_ rounds per shot, with each bullet typically dealing _%2$s_-_%3$s_ damage.\nCurrently loaded with _%4$s_/_%5$s_ rounds. If ammo is spent, it can be reloaded by spending _%6$s_ turns.
