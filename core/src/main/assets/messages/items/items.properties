items.weapon.melee.gun.mg.rbamulligan.name=Mulli<Gun>
items.weapon.melee.gun.mg.rbamulligan.desc=A machine gun that endured every humiliation alongside Koyuki.\n\nHaving once fallen into seawater, its color shifted during repairs. Performance aside, it is sturdy and resilient—much like Koyuki, who never sweats the small stuff.
items.weapon.melee.gun.mg.rbamulligan.stats_desc=This firearm triggers a random effect on hit. Upgrading it increases the chance of triggering neutral or beneficial effects.
items.weapon.melee.gun.mg.rbamulligan.discover_hint=This firearm can be obtained through alchemy using an _MG_.
