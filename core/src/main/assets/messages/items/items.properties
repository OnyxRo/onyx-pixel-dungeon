items.weapon.melee.gun.sg.rbamtet.desc=A shotgun with a rugged design favored by Eimi.\n\nTrue to its name, it is used for a variety of tasks, from door breaching to responding to paranormal events.
items.weapon.melee.gun.sg.rbamtet.stats_desc=This firearm deals relatively low damage.\nOn hit, this firearm ignites enemies and deals bonus damage to burning targets.
items.weapon.melee.gun.sg.rbamtet.discover_hint=This firearm can be obtained through alchemy using an _SG_.
