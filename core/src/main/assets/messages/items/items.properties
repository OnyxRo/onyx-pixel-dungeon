items.weapon.melee.gun.mg.rbatrickortrick.desc=A multipurpose machine gun carried by Mutsuki.\n\nMutsuki insists that superior firepower is essential for good pranks.
items.weapon.melee.gun.mg.rbatrickortrick.stats_desc=This firearm is extremely heavy.
items.weapon.melee.gun.mg.rbatrickortrick.discover_hint=This firearm can be obtained through alchemy using an _MG_.
