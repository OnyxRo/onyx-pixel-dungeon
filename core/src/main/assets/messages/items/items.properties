items.rings.ringofluck.desc=It's not clear what this ring does exactly, good luck may influence the life of an adventurer in many subtle ways. Naturally a cursed ring would give bad luck.
items.spells.resetter.name=resetter
items.spells.resetter.desc=This spell will reset the current floor, allowing the hero to replay floors and even refight bosses.
items.allies.firedragon.name=Fire Dragon Crystal
items.allies.firedragon.already_spawned=The Crystal isn't charged
