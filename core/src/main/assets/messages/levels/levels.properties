levels.level$feeling.icy_title=cold floor
levels.level$feeling.icy_desc=This floor feels especially cold and large.
levels.thievesguildlevel.water_name=Dark cold water
levels.thievesguildlevel.empty_deco_desc=There are strange stains on the floor. No telling what exactly they are.
levels.thievesguildlevel.bookshelf_desc=This is probably a vestige of a prison library. Might it burn?
levels.thievesguildlevel.region_deco_name=Golden thief statue
levels.thievesguildlevel.region_deco_desc=A statue of a thief made of solid gold. Clearly this represents the wealth of the thieves' guild. It's too heavy to take, though.
