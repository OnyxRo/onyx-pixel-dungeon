levels.matticecaveslevel.entrance_desc=The ladder leads up to the upper depth.
levels.matticecaveslevel.exit_desc=The ladder leads down to the lower depth.
levels.matticecaveslevel.high_grass_desc=Huge fungi block the view.
levels.matticecaveslevel.wall_deco_desc=A vein of some ore is visible on the wall. Quartz? Solid snow? Who knows really?
levels.matticecaveslevel.bookshelf_desc=Who would need a bookshelf in these ice caves?
levels.matticecaveslevel.region_deco_name=Metal structure
levels.matticecaveslevel.region_deco_desc=A large all-metal structure, probably built by the dwarves when they used to mine this place. You think you can see long-unused minecart tracks running along the top.

