###Devoted Pixel Dungeon, bosses and quests
levels.coldhousebosslevel.barrier_name=Wooden barrier
levels.coldhousebosslevel.barrier_desc=A wooden barrier closing off the entrance to the Caves below. It seems the temperature here is too cold to burn it with fire, but killing the beast which resides here might cause it to collapse..
levels.coldhousebosslevel.barrier_desc_broken=The shockwave of the Rat beast falling to the ground has collapsed this barrier, the only thing left to do is to venture further down.
levels.forgebosslevel.barrier_name=Cracked Wall
levels.forgebosslevel.barrier_desc=A thin, cracked wall is preventing anyone from getting further.
levels.forgebosslevel.barrier_desc_broken=The wall collapsed after the furnace golem fell, perhaps all the explosions caused it to give in.
levels.rooms.gardensboss.crystalroom$magiccrystal.name=crystaline essence
levels.rooms.gardensboss.crystalroom$magiccrystal.desc=This inanimate piece of crystal waits idly to be powered by an eldritch energy. In its inactive state, it is hard as rock, but as soon as the crystal is activated, it will become fragile as is usual of the material.\n\Once activated, the crystal essence will focus the energy of the life within the gardens and direct it at the create that empowered it, serving as healing.
levels.rooms.gardensboss.crystalroom$magiccrystal.discover_hint=This enemy is part of a bossfight.

###abyssalnite
levels.newcavesbosslevel.wires_name=Exposed wiring
levels.newcavesbosslevel.wires_desc=The ground is partially dug up here, showing some large exposed wires. They must be connecting the various electrical machines together.\n\nThe wires must have some current running through them. If DM-300 steps here it may be able to draw power from them.
levels.newcavesbosslevel.energy_desc=The ground here is sparking with electricity, and is harmful to step on. The sparks seem to be gravitating in a certain direction... perhaps they lead to the power source?
levels.newcavesbosslevel.gate_name=Metal gate
levels.newcavesbosslevel.gate_desc=A large metal gate that blocks the path into the dwarven metropolis. The metal box in the center is producing a loud humming noise, it must be connected to the circuitry and machines nearby. Perhaps destroying DM-300 will open the gate?
levels.newcavesbosslevel.gate_desc_broken=The gate must have been connected to DM-300 in some way, as it exploded when DM-300 was defeated. Now only broken pieces remain.
levels.newcavesbosslevel.water_desc=With all the electricity around here water might not always be safe...

###experienced
levels.blackmimiclevel.wires_name=Exposed wiring
levels.blackmimiclevel.wires_desc=The ground is partially dug up here, showing some large exposed wires. They must be connecting the various electrical machines together.\n\nThe wires must have some current running through them. If Black Mimic steps here it may be able to draw power from them.
levels.blackmimiclevel.energy_desc=The ground here is sparking with electricity, and is harmful to step on. The sparks seem to be gravitating in a certain direction... perhaps they lead to the power source?
levels.blackmimiclevel.gate_name=Metal gate
levels.blackmimiclevel.gate_desc=A large metal gate that blocks the path into the dwarven metropolis. The metal box in the center is producing a loud humming noise, it must be connected to the circuitry and machines nearby. Perhaps destroying Black Mimic will open the gate?
levels.blackmimiclevel.gate_desc_broken=The gate must have been connected to Black Mimic in some way, as it exploded when Black Mimic was defeated. Now only broken pieces remain.
