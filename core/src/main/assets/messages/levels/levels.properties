levels.traps.malicetrap.name=malice trap
levels.traps.malicetrap.curse=The malice curses all of your worn equipment!
levels.traps.malicetrap.item_curse=The malice curses the equipment on the trap!
levels.traps.malicetrap.already_cursed=The malice finds no new equipment to curse.
levels.traps.malicetrap.desc=This high-tower trap is filled with malicious energy. Triggering it curses every item currently equipped by the hero, or curseable equipment on the trap.
levels.traps.infernaltrap.name=infernal trap
levels.traps.infernaltrap.desc=When triggered, this trap releases an inferno across the immediate 3x3 area. The flames spread like the infernal brew, with a total volume of 1080.
levels.traps.rimetrap.name=rime trap
levels.traps.rimetrap.desc=On the next turn, this trap releases levitating mist and a blizzard across a 5x5 area. The two effects each spread with the same strength as their potions.
levels.traps.redcrosstrap.name=red cross trap
levels.traps.redcrosstrap.desc=When triggered, this trap heals every hostile monster on the floor. Each monster receives healing equal to twice the tower floor, up to 200 health.
levels.traps.digestiontrap.name=digestion trap
levels.traps.digestiontrap.digested=The dungeon digested your loot!
levels.traps.digestiontrap.empty=The dungeon found no loose loot to digest.
levels.traps.digestiontrap.unsupported=The digestion trap only works inside the high tower.
levels.traps.digestiontrap.desc=When triggered, this trap sends all items from loose heaps to a random adjacent tower floor. Potions and seeds are transported safely.
levels.traps.transformationtrap.name=transformation trap
levels.traps.transformationtrap.changed=Your talent %1$s twists into %2$s!
levels.traps.transformationtrap.unchanged=Transforming energy passes through you, but no talent changes.
levels.traps.transformationtrap.desc=This high-tower trap drives enemies and allies in its 3x3 area amok for 50 turns. If the hero is caught in the area, one of their common talents is transformed into a random legal talent of the same tier.
levels.traps.roastsheeptrap.name=roast sheep trap
levels.traps.roastsheeptrap.desc=When triggered, this high-tower trap summons a flock of magical sheep and sets the area around it ablaze like a blazing trap. The sheep are unharmed by the flames, but temporarily block the way.
levels.towers.towerlevel.water_name=Tower pool
levels.towers.towerlevel.grass_name=Tower weeds
levels.towers.towerlevel.decoration_name=Tower decoration
levels.towers.towerlevel.decoration_desc=Objects used to decorate the tower's rooms.
levels.towers.towerlevel.bookshelf_desc=The shelves are filled with books, but every book you open contains only blank pages.
levels.towers.towerlevel.entrance_desc=Stairs leading to the tower floor below.
levels.towers.towerlevel.exit_desc=Stairs leading to the tower floor above.
levels.towers.towerlevel.surface_blocked=There is no way back to floor 0 from within the high tower.

###transformation
levels.prisonnewbosslevel$diedtengu.name=Tengu's corpse
levels.prisonnewbosslevel$diedtengu.desc=A famous and mysterious assassin. You know his story, and had prepared thoroughly for him, but now all you find is his corpse.\n\nStrangely, the mask that should have been on his face is gone. It may be very dangerous to inspect him carelessly, but you have no way back now.
levels.huntressbosslevel.gate_desc=A tall metal gate blocks the road to the dwarven city. Earth has sealed its base in place, making it impossible to push open. Perhaps defeating Huntress? will open it?
levels.huntressbosslevel.gate_desc_broken=After the battle with Huntress?, the earth beneath the gate loosened and the battle shattered it. Only scattered fragments remain.
###Tower
levels.arena$amulettower.name=`Hometown portal`
levels.arena$amulettower.desc=A portal to the village you came from. It was used to bring you to this floor, and it will remain opened until you clear this level of monsters.\nEven though it is a passage for you to go back, monsters can go through it too, possibly causing damage to your base and, what is far worse, sealing the portal from there, dooming you to death in a dungeon.\nThe portal has some reinforcements backing it up from your base's side, so it can handle some enemies coming in. The stronger is the enemy, the more it damages the portal system.
levels.arena.goldaddendwave=Gained %d gold for completing the wave!
levels.arena.lootdrop=New loot has appeared around the map!
levels.arena.golddepleteendwave=`You've lost %d gold for completing the wave!`
levels.arena.wavestart=Wave _%1$d_. Enemies: _%2$s_.
levels.arena4$towershopkeepermagic.name=Old wandmaker?
levels.arena4$towershopkeepermagic.desc=An old magician who was ready to help you while the gnoll-towermaker rests. As he is a magician, it is much easier for him to calibrate wand sentries, so he sells more wand towers  .
levels.arena6$towershopkeeperkeytrader.name=Greedy guard
levels.arena6$towershopkeeperkeytrader.desc=A prison warden who hasn't lost his sanity somehow. Instead of helping you to fight the powers of Dark, he chose to sell you prison cell keys. He says, that every locked cell has some stuff inside: from food and coins to artifacts and wands. In your opinion, he was the one who looted the other half of cells here...
levels.arena9$towershopkeepernecro.name=Gravemancer
levels.arena9$towershopkeepernecro.desc=A necromancer that liked the art of creating towers and was taught to mass-produce magical gravestones by your gnoll companion. Though he wears a scary robe and is literally undead, he has a kind heart (if he has one).
levels.arena13$goblinguard.name = Goblin guard
levels.arena13$goblinguard.desc = Goblins are aware of dungeoneers and usually leave some guards to protect their golden mines. Usually those are the weakest ones, but they are at least capable enough to shout if they see an intruder.
levels.arena13$goblinguard.suslvl0 = This goblin guard is not aware of you. 
levels.arena13$goblinguard.suslvl1 = This goblin guard seems to have noticed something.
levels.arena13$goblinguard.suslvl2 = This goblin guard is aware of you and is running to report! Kill him before it is too late!
levels.arena13$goblinguard.s0i0 = "Wait what was that?"
levels.arena13$goblinguard.s0i1 = "Huh?"
levels.arena13$goblinguard.s0i2 = "Oh, a bat?"
levels.arena13$goblinguard.s1i0 = "Me saw this!"
levels.arena13$goblinguard.s1i1 = "Come ire' scoundrel"
levels.arena13$goblinguard.s1i2 = "Wait a hooman?!"
levels.arena13$goblinguard.s2i0 = "INTRUDER ALERT!!!"
levels.arena13$goblinguard.s2i1 = "HELP!!! HEEEEELP!!!!"
levels.arena13$goblinguard.s2i2 = "ME RUN, ME CALL GOBLINS!!!"
levels.arena13$goblinguard.escaped =A goblin guard reported you stealing gold! The reinforcements will arrive 200 turns sooner!
levels.arena13$goblinguard.escapednotseenhero =A goblin guard reported something dangerous in the caves! The reinforcements will arrive 100 turns sooner!
levels.arena24.grass_name=Grass?
levels.arena24.grass_desc=You can't see what is in there. Not because it is far or it is too dark, but because your vision blurs each time you attempt to look there.\n\nWhatever you are looking at, is not grass.

###transformation
levels.traps.abyssexplosivetrap.discover_hint=You can randomly find this trap in the tower.
levels.traps.cursedflametrap.name=cursed flame trap
levels.traps.cursedflametrap.desc=This trap works much like the burning trap, but is infused with vicious soul energy. Activating it sets a nearby area ablaze with cursed fire.
levels.traps.soulscorchtrap.name=soul scorch trap
levels.traps.soulscorchtrap.desc=This trap works much like the blazing trap, but is infused with especially vicious soul energy. Activating it sets a large area ablaze with cursed fire that corrodes the soul.
levels.traps.abyssexplosivetrap.name=abyss explosive trap
levels.traps.abyssexplosivetrap.desc=This tower trap floats over a chasm and detonates when anything enters its cell. Levitation offers no protection from its trigger, and creatures without flight may fall after the blast.
levels.traps.plaguebrazier.name=plague purifier
levels.traps.plaguebrazier.desc=Step onto this plague purifier: it clears plague miasma and sewage from a 13-by-13 area and removes infection. It can only be activated while no plague guard is active. After the battle begins it also deals 100 damage to the Pestilence Knight, then restores any recovering plague guards. It relocates after every use and recharges over twelve boss actions.
levels.towers.pestilencearenacontroller.prelude=The arena seals. A safe path cuts through an impossible sea of pale miasma toward the purifier on the left.
levels.towers.pestilencearenacontroller.purifier_start=The purifier erases the pale miasma. The Pestilence Knight answers the challenge!
levels.towers.pestilencearenacontroller.purifier_strike=The purifier clears the arena and tears %d health from the Pestilence Knight before relocating.
levels.towers.pestilencearenacontroller.recharging=The purifier is still recharging: %d boss actions remain.
levels.towers.pestilencearenacontroller.guard_blocked=Defeat or disable every active plague guard before using the purifier.
