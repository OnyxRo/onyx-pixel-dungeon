levels.level.sign_name=Sign
levels.level.sign_desc=You can't read the text from here.

###abyssalnite
levels.rooms.standard.ritualsiteroom$ritualmarker.name=Ritual marker
levels.rooms.standard.ritualsiteroom$ritualmarker.desc=A painted marker for some dark ritual. Candles are usually placed on the four corners.
levels.newcitybosslevel.throne_name=Throne
levels.newcitybosslevel.throne_desc=This impressively large throne is the seat of the dwarven empire, now taken over by a power-mad necromancer.\n\nThere seems to be some magical or mechanical parts to the throne, Dwarf King may have additional power when sitting on it.
levels.newcitybosslevel.summoning_name=Summoning pedestal
levels.newcitybosslevel.summoning_desc=This pedestal has a large opening in the center, which is practically radiating with dark energy.\n\nDwarf King uses these pedestals as focal points for his necromantic magic, and can summon minions to them. The pedestal must charge for a few turns before the minion appears, and the type of minion being summoned is telegraphed by the building magical power.

###cursed
levels.grindinglevel$guardian.desc=This guardian appears to have one target on it's mind: you. Perhaps you angered it by entering it's realm? Anyway, it seems to be made from a precious gem. Different guardians have different abilities.
levels.grindinglevel$redguardian.name=ruby guardian
levels.grindinglevel$redguardian.desc=Ruby Guardians are fast at movement and attack but weak. They are also quite expert at dodging, and do some magical damage.
levels.grindinglevel$yellowguardian.name=agate guardian
levels.grindinglevel$yellowguardian.desc=Agate Guardians have low health but can blink to enemies and have high yet slow attack.
levels.grindinglevel$blueguardian.name=sapphire guardian
levels.grindinglevel$blueguardian.desc=Sapphire Guardians are slow but can take and deal a lot of damage from melee. They are very tough to take down with a low level weapon and no wands.
levels.grindinglevel$purpleguardian.name=amethyst guardian
levels.grindinglevel$purpleguardian.desc=Amethyst Guardians are a  variant of Sapphire Guardians that have a special power - they can temporarily shield themselves by attacking at melee.
levels.grindinglevel$greenguardian.name=emerald guardian
levels.grindinglevel$greenguardian.desc=Emerald Guardians don't dodge very well, but are also hard to dodge. They are able to paralyze their enemies, but are too weak to be of much harm on their own...
levels.grindinglevel$orangeguardian.name=amber guardian
levels.grindinglevel$orangeguardian.desc=Amber Guardians are a slower version of Ruby Guardians that can use ranged fire attacks to take down enemies.
levels.grindinglevel$orangeguardian.bolt_kill=Amber Guardian's fire bolt killed you...

###reforged
levels.traps.koboldfiretrap.name=Kobold Fire Trap
levels.traps.koboldfiretrap.desc=This fire trap is very well hidden. When triggered, the ceiling falls in around you, and a potion of liquid flame is flown from the ceiling! This may also call some kobolds down too...
levels.traps.koboldfiretrap.ondeath=You were crushed by the ceiling falling in...

