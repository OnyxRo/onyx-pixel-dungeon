scenes.towerlevelselectscene.prize=#9Complete the stage to unlock:#9
scenes.towerlevelselectscene.arena0name=_Tutorial and playground_
scenes.towerlevelselectscene.arena0desc=A short tutorial for new players. 
scenes.towerlevelselectscene.arena0knowledge=_Number of waves_: _many_\n_Enemies_: rats, count matching the wave number.\n\nHere you can learn what towers are, how to buy them and set them up, how the amulet works and play around with controls for a bit if you wish to.
scenes.towerlevelselectscene.arena0advise=SUFFERRRRRRRRRR SUFFFFFERRRRR SUUUUUFFFFFEEEEERRRRRR
scenes.towerlevelselectscene.arena1name=_Sewers entrance_
scenes.towerlevelselectscene.arena1desc=An entrance of the sewers, the place where every dungeoneer's journey begins. To enter, you'll need to get rid of all the rodents first, shouldn't be an issue.
scenes.towerlevelselectscene.arena1knowledge=_Number of waves_: _10_\n_Enemies_: rats (many), snakes (few), gnolls (some), crabs (few)\n_Boss_: Chief rat
scenes.towerlevelselectscene.arena1advise=\nSome battles can't be won alone even by the strongest hero...For such cases, you have towers!
scenes.towerlevelselectscene.arena1prize=
scenes.towerlevelselectscene.arena2name=_Deeper sewers_
scenes.towerlevelselectscene.arena2desc=Venturing deeper into the sewers, you find out that you are not quite welcome here. You entered the domain of the Rat king, a rodent powerful enough to enslave all rats around. And the rats aren't enjoying your presence.
scenes.towerlevelselectscene.arena2knowledge=_Number of waves_: _15_\n_Enemies_: rats (a ton), snakes (some), gnolls (some), crabs (many), slimes (some), bandits (few)\n_Minibosses_: Fetid rat, Chief rat\n#1Boss#1: Rat king
scenes.towerlevelselectscene.arena2advise=\nSometimes it's good to venture further from your base to scavenge for loot. What you find may surprise you.
scenes.towerlevelselectscene.arena2prize=Tower upgrades!
scenes.towerlevelselectscene.arena3name=_Gnoll village_
scenes.towerlevelselectscene.arena3desc=Seems that humans aren't the only sentient creatures around: on your adventure you stumbled onto a gnoll village. Looking at your surroundings, you realize two things: first - those gnolls are really well-equipped for these depths, second - they absolutely hate sudden guests.
scenes.towerlevelselectscene.arena3knowledge=_Number of waves_: _15_\n_Enemies_: rats (few), snakes (few), gnolls (a ton), crabs (some)\n_Guards_: Crossbow turrets (some)\n_Minibosses_: Gnoll trickster, Gnoll shaman, Gnoll brute\n`Special`: Long wave cooldown.
scenes.towerlevelselectscene.arena3advise=\nIf your base lacks resources, why not borrow some from the enemy's?
scenes.towerlevelselectscene.arena3prize=
scenes.towerlevelselectscene.arena4name=_Crab lake_
scenes.towerlevelselectscene.arena4desc=You have already grown tired of moving forward, the labyrinthine sewers feeling unfathomably large. What a surprise it was to find a little cave with a lot of foliage and a small lake in its center. You naively believed you discovered a great spot to camp at, but once you spotted a giant claw in the grass, it was time to prepare the defenses.
scenes.towerlevelselectscene.arena4knowledge=_Number of waves_: _15_\n_Enemies_:  snakes (few), slimes (few), crabs (many)\n_Guards_: lashers (many), piranhas (some)\n_Minibosses_: Hermit Crab, Great crab, MagiCrabs \n#1Boss#1: The Goo
scenes.towerlevelselectscene.arena4advise=Magic completely ignores physical defense.
scenes.towerlevelselectscene.arena4prize=#4Huntress#4 class, Cannon tower, Rat camp tower 
scenes.towerlevelselectscene.arena5name=_Caustic depths_
scenes.towerlevelselectscene.arena5desc=Now you know where that black slime came from: a dark, decrepit, vile hallway extends in front of you. Strange sounds reach you from its end, and you know for sure that you'll have to kill what's in there to proceed...
scenes.towerlevelselectscene.arena5knowledge=_Number of waves_: _25_\n_Enemies_:  snakes (few), crabs (few), slimes (many), caustic slimes (many)\n_Minibosses_: Goo\n#1Boss#1: The Ooze.
scenes.towerlevelselectscene.arena5advise=\nCannons can deal area damage and are much more effective than other towers when targeting a group.
scenes.towerlevelselectscene.arena5prize=
scenes.towerlevelselectscene.arena6name=_The Prison_
scenes.towerlevelselectscene.arena6desc=This prison once had a lot of both guards and outlaws inside it, but since the darkness approached from below, most of them left, and those who stayed have either died or gone insane. This place is very dangerous to be in, and the distant noises confirm that.
scenes.towerlevelselectscene.arena6knowledge=_Number of waves_: _20_\n_Enemies_:  snakes (few), slimes (few), bandits (many), guards (many), gnolls (many), necromancers (some)\n_Minibosses_: thieves, gnoll trickster\n`Special`: Longer wave cooldowns, prison warden sells loot keys.
scenes.towerlevelselectscene.arena6advise=\nSpend all the money you have, that is how you keep up!
scenes.towerlevelselectscene.arena6prize=Artificial guard tower
scenes.towerlevelselectscene.arena7name=_Mage meeting_
scenes.towerlevelselectscene.arena7desc=Since magic is forbidden in most cities on the surface, wizards, necromancers, witches and druids usually practice their spells underground. Once the darkness consumed this prison, most mages' minds got corrupted as well, driving them to stop you from descending further.
scenes.towerlevelselectscene.arena7knowledge=_Number of waves_: _15_\n_Enemies_:  rats (few), snakes (few), caustic slimes (few), gnoll shamans (many), guards (some), necromancers (some), magicrabs (some), ghouls (few)\n_Minibosses_: ghoul, elementals\n`Special`: Rot lashers periodically invade your base.
scenes.towerlevelselectscene.arena7advise=\nSometimes a level cannot be completed on the first attempt. Learn its map, threats and loot, then try again.
scenes.towerlevelselectscene.arena7prize=
scenes.towerlevelselectscene.arena8name=_Prison Graveyard_
scenes.towerlevelselectscene.arena8desc=A once quiet place is now quaking with the growls and screams of those buried here. From some guards on the surface you know that a necromancer of tremendous power has found a hideaway here, and left an army of resurrected warriors to protect himself. And it's quite obvious that those undead soldiers won't simply let you pass...
scenes.towerlevelselectscene.arena8knowledge=_Number of waves_: _20_\n_Enemies_: rats (some), hex shamans (some), skeletons (a ton), wraiths (many), necromancers (some), flies (few), gravestones (few)\n#1Boss#1: Remac, the undead lord.
scenes.towerlevelselectscene.arena8advise=\nArea effect potions like toxic and paralytic gases and flame can be extremely useful. Also, shattering a levitation potion creates a disorienting cloud.
scenes.towerlevelselectscene.arena8prize=#9Necromancer#9 class, gravestone tower
scenes.towerlevelselectscene.arena9name=#8Guard post#8
scenes.towerlevelselectscene.arena9desc=As the most dangerous of all prisoners needed to be separated from the others, prison warden has set up a check point with many traps and defenses. Lucky for you, the security systems are still intact.
scenes.towerlevelselectscene.arena9knowledge=#8Number of waves#8: 10\n#8Enemies#8: gnolls (some), bandits (some), thieves (some), guards (some), snake (armada)\n#8Minibosses#8:  gnoll tricksters\n#8Puzzle level#8\nA tiny stage, where You will have to use everything at hand. There are multiple solutions.
scenes.towerlevelselectscene.arena9advise=Gravestones can be used to defeat single enemies and slow down enemy forces for your turrets to shoot them.
scenes.towerlevelselectscene.arena9prize=Lightning rod tower
scenes.towerlevelselectscene.arena10name=_Protected cell block_
scenes.towerlevelselectscene.arena10desc=This prison once had a lot of both guards and outlaws inside it, but since the darkness approached from below, most of them left, and those who stayed have either died or gone insane. This place is very dangerous to be in, and the distant noises confirm that.
scenes.towerlevelselectscene.arena10knowledge=_Number of waves_: _20_\n_Enemies_:  bandits (some), guards (some), DM100 (some), bats (some), Brutes (some)\n_Minibosses_: thieves, armored guards, gnoll tricksters\n#1Boss#1: Tengu
scenes.towerlevelselectscene.arena10advise=\nSometimes a tower should be salvaged, especially when it is almost broken or poorly placed.
scenes.towerlevelselectscene.arena10prize=#7Duelist#7 class, TNT rogue log tower
scenes.towerlevelselectscene.arena11name=_Upper caves_
scenes.towerlevelselectscene.arena11desc= The safest and broadest part of the general cave system, where dwarves used to mine for gold and gems. As of now, there aren't any living beings left apart from rats, bats and goblins, and those are substantially more aggressive than usual.
scenes.towerlevelselectscene.arena11knowledge=_Number of waves_: _15_\n_Enemies_:  Rats (some), gnolls (some), bats (some), spiders (some), goblins (some), sometimes other wildlife\n#5Special#5: The afterwave gold is dropped from automatic miners, which you must defend and manually collect gold from.
scenes.towerlevelselectscene.arena11prize=
scenes.towerlevelselectscene.arena12name=_Abandoned mines_
scenes.towerlevelselectscene.arena12desc=These mines were built on a specific depth with the most dark gold deposits, and after all the precious metals had been taken, the dwarves went deeper, leaving these mined corridors. There are no dwarves now t all, but these caves are overfilled with aggressive underground fauna.
scenes.towerlevelselectscene.arena12knowledge=_Number of waves_: _10_\n_Enemies_:  piranhas (some), bats (many), crabs (a TON), fly swarms (some)
scenes.towerlevelselectscene.arena12prize=
scenes.towerlevelselectscene.arena13name=_The temple_
scenes.towerlevelselectscene.arena13desc=It is not surprising that a monster-filled dungeon would lead you to some kind of ancient ruins. Owing to the amount of traps scattered around, there are unusually few monsters here. At a glance you spot several groups of cavern wildlife and gnoll scouts and decide to hide in one of the temples. Hopefully its defenses are still intact.
scenes.towerlevelselectscene.arena13knowledge=_Number of waves_: _15_\n_Enemies_:  gnolls (many), swarms (some), bats (some), goblins (few), spiders (some), ancient spirits (none)
scenes.towerlevelselectscene.arena13prize=#1Tank#1 class, Poison dart gun tower
scenes.towerlevelselectscene.arena14name=_Goblin cave camp_
scenes.towerlevelselectscene.arena14desc="There is no place in the entire universe where a goblin hasn't been" - says the dungeoneering encyclopedia, and it's probably right, looking at this goblin outpost in caves this deep. A guard has already noticed your presence, and a horde of these green creatures is coming your way...
scenes.towerlevelselectscene.arena14knowledge=_Number of waves_: _15_\n_Enemies_:  different goblins (a ton), goblin giants (some), goblin shamans (some)\n#1Boss:#1 Troll horde
scenes.towerlevelselectscene.arena14prize=
scenes.towerlevelselectscene.arena15name=_Warehouses_
scenes.towerlevelselectscene.arena15desc=After the great civilization of dwarves fell, all their equipment, shafts and technology were pretty much abandoned down in the dungeon. And it all aged worse than you'd expect: all the machinery is broken, toxic waste has leaked into the underground waters and all the mining bots went rogue, killing any living creature in their path. Perhaps the leftover stuff can help you fend off the incoming attacks.
scenes.towerlevelselectscene.arena15knowledge=_Number of waves_: _20_\n_Enemies_:  bats (some), spiders (some), explosion bots (many), DM100 (many), DM200 (many), golems (some), mutants (many), DWM assemble kit parts \n_Minibosses_: DM300, DWM (Dwarven WarMachine)\n`Special`: Acidic water, no shops, a lot of useful equipment present nearby.
scenes.towerlevelselectscene.arena15prize=
scenes.towerlevelselectscene.arena16name=_The City_
scenes.towerlevelselectscene.arena16desc=What was a blooming metropolis in the past stands before you. Pillaged houses, few of them with their walls intact, destroyed robots with nobody to maintain them and undead monks and warlocks, with their minds possessed...
scenes.towerlevelselectscene.arena16knowledge=\n\n_Number of waves_: _15_\n\n_Enemies_:  snakes (few), slimes (few), bandits (some), guards (some)\n_Minibosses_: thieves, armored guards
scenes.towerlevelselectscene.arena16prize=
scenes.towerlevelselectscene.arena17name=#1A Horrible Dream#1
scenes.towerlevelselectscene.arena17desc=You wake up, and realize you are not in the dwarven house anymore... but on an island made of corpses and bone dust permeated by echoing screams, with a phantasmagoria of monster images around. All you hear is a menacing whisper...
scenes.towerlevelselectscene.arena17knowledge=\n\n_Number of waves_: #1YOU. WILL. DIE.#1\n\n_Enemies_: #1YOU. WILL. SUFFER.#1
scenes.towerlevelselectscene.arena17prize=Disintegration rod tower
scenes.towerlevelselectscene.arena18name=_Storm the gates!_
scenes.towerlevelselectscene.arena18desc=After that dream you wake up completely restless, somehow aware of the location of the Dwarf King's castle where the corruption source supposedly lies. You decide to cut directly to it, and the giant dwarven drill you found will be very useful for such a task.
scenes.towerlevelselectscene.arena18knowledge=\n\n_Number of waves_: _until you get to the gates_\n\n_Enemies_: wraiths (some), dwarven warlocks (some), dwarven monks (some), golems (some), guard towers (some)\n\n`Special`: You are riding a giant drill. All towers on it will move as the drill moves.
scenes.towerlevelselectscene.arena18prize=
scenes.towerlevelselectscene.arena19name=_The treasury_
scenes.towerlevelselectscene.arena19desc=Any monarch of a power befitting the king of all dwarves must have their own treasury, where they keep all the magical valuables they found. Before you fight the DK himself, preparing and stocking up some gold and battle artifacts would be a great idea. But obviously, no king leaves his treasures unguarded.
scenes.towerlevelselectscene.arena19knowledge=\n\n_Number of waves_: _15_\n\n_Enemies_:  dwarven warlocks (some), dwarven monks (some), Golems (few), ghouls (many)\n\nNote: find special artifacts in chests, the keys are located around the map.
scenes.towerlevelselectscene.arena19prize=
scenes.towerlevelselectscene.arena20name=_The False King's fall_
scenes.towerlevelselectscene.arena20desc=You approach the giant throne room, and at its center, The King is sitting. Once the protector of the amulet, then a mass murderer, and now simply a puppet with a crown. The only way through - is through him. Him, and his undead legion.
scenes.towerlevelselectscene.arena20knowledge=\n\n_Number of waves_: _25_\n_Enemies_:  dwarven warlocks (a lot), dwarven monks (a lot), Golems (many), ghouls (many), Skeletons (a LEGION), armored skeletons(a lot)\n#1Boss#1: "Dwarf King".\n\n_Note_: this battle is very hard and may require many attempts. The King _adapts_ to your strategy on the go.
scenes.towerlevelselectscene.arena20prize=
scenes.towerlevelselectscene.arena21name=#2Collapsed halls#2
scenes.towerlevelselectscene.arena21desc=An entrance to the Halls, partially collapsed by order of the Dwarf King to prevent the demonic forces from attacking Metropolis. Little he knew, that the darkness would still find a way out.
scenes.towerlevelselectscene.arena21knowledge=\n\n#2Number of waves#2: #214#2\n\n#2Enemies#2:  Ripper demons (many), Succubi (some), Demonic eyes (few), ghouls (some), senior monks (some), skeletons (some), armored skeletons (some)
scenes.towerlevelselectscene.arena21prize=
scenes.towerlevelselectscene.arena22name=#2The Forge#2
scenes.towerlevelselectscene.arena22desc=Dwarves were known for not only their machinery, but the divine-quality weapons forged in the hottest flames. Now the Great Forge is dormant, infested with demons and filled to the brim with exquisite equipment.
scenes.towerlevelselectscene.arena22knowledge=\n\n#2Number of waves#2: #215#2\n\n#2Enemies#2:  Ripper demons (many), Demonic eyes (some), Golems (some), Armored skeletons (some)
scenes.towerlevelselectscene.arena22prize=
scenes.towerlevelselectscene.arena23name=#2The desert of Thousand souls#2
scenes.towerlevelselectscene.arena23desc=This desert only appeared recently. From the ashes of bodies emerged sands, souls of fallen dwarves and heroes filled the air, creating a giant graveyard outside of time, and vile creatures feed on said souls, claiming the Desert as a darkness domain.
scenes.towerlevelselectscene.arena23knowledge=\n\n#2Number of waves#2: #220#2\n\n#2Enemies#2:  wraiths (many), Spectral necromancers (some), skeletons (many), demonic eyes (some), scorpios (some), timeless spirits (some), succubi (some), necromancers (some)
scenes.towerlevelselectscene.arena23prize=
scenes.towerlevelselectscene.arena24name=#2Phantasmagoria#2
scenes.towerlevelselectscene.arena24desc=A glimpse of the Nightmare dimension, distorting, collapsing and inverting on itself - place affected by outer forces the most. Will you lose your sanity, or is there enough resolve in you to overcome such an anomaly?
scenes.towerlevelselectscene.arena24knowledge=\n\n#2Number of waves#2: #225#2\n\n#2Enemies#2:  all of them
scenes.towerlevelselectscene.arena24prize=
scenes.towerlevelselectscene.arena25name=#2The End.#2
scenes.towerlevelselectscene.arena25desc=After all the battles you have won, you stand in the altar room. The exact room you have taken the Amulet from.\nIt is oddly quiet, but you notice a very familiar presence in the distance.
scenes.towerlevelselectscene.arena25knowledge=\n\n#2Number of waves#2: #230#2\n\n#2Enemies#2: Ripper demons (many), Skeletons (many), Demonic eyes (many), Succubi (many), Scorpios (some), Warlocks (some), Wraiths (some), God Larvae (some), Avatar Fists (several)\n\n#1Bosses: the Old God#1
scenes.towerlevelselectscene.arena25prize=
scenes.towerlevelselectscene.endlessarena1name=_Sewer catacombs_
scenes.towerlevelselectscene.endlessarena1desc=Endless labyrinthine catacombs right under the city. So endless in fact, an infinite amount of monsters reside here: snakes, rats and even several species of crabs...thousands of them! 
scenes.towerlevelselectscene.endlessarena1knowledge=_Enemies_: rats, snakes, crabs, slimes, gnolls (INFINITE) \n\n_Minibosses_: Chief rats, Fetid rats, trickster gnolls, ancient crabs (a lot) \n\n#9Advice#9: On endless stages loot spawns not only initially, but also each wave! Try scavenging for loot once in a while.
scenes.towerlevelselectscene.endlessarena2name=_Rat kingdom_
scenes.towerlevelselectscene.endlessarena2desc=A secret gate in one of the sewer's pipe rooms led you to a giant throne room, larger than any dungeon you have seen. Many rats look at you at once, you are surrounded by squeaking rodents, all of which run towards you now.
scenes.towerlevelselectscene.endlessarena2knowledge=_Enemies_: rats, rats, rodents, rats (INFINITE) \n\n_Minibosses_: Chief rats, Fetid rats, Rat King.\n\n#5Special#5: you can't use rat camp here. It will be replaced with a wall.
scenes.towerlevelselectscene.endlessarena3name=_Prison Sector 95_
scenes.towerlevelselectscene.endlessarena3desc=In the underground prison nobody cares about inmates, especially after an ancient god infestingthe dungeon. Sector 95 was the largest prison sector of all, keeping hundreds, if not thousands of rogues, dark magicians and bandits locked with the same number of guards patrolling it.
scenes.towerlevelselectscene.endlessarena3knowledge=_Enemies_: bandits, guards, necromancers, thieves, DM-100's, (INFINITE) \n\n_Minibosses_: Shinobi, tricksters, heavily armored skeletons (a lot)
scenes.towerlevelselectscene.endlessarena4name=_Gnolls and goblins_
scenes.towerlevelselectscene.endlessarena4desc=A group of friendly gnolls is attempting to get rid of goblins in the upper caves and asked you to help them. You agreed, but didn't you know... now you are engaged in a gnoll-goblin war.
scenes.towerlevelselectscene.endlessarena4knowledge=_Enemies_: goblins, goblin shamans, trolls, sand goblins, goblin ninja attacks. \n\n#9Allies#9: gnolls, brutes, tricksters
scenes.towerlevelselectscene.endlessarena5name=_Bot factory_
scenes.towerlevelselectscene.endlessarena5desc=Dwarven defense systems were very effective. So effective in fact, they obliterated everything once the demon invasion started: including their creators and the factory machinery. However the remaining defense bots are still intact, and are still malfunctioning enough to recognize you as a demon.
scenes.towerlevelselectscene.endlessarena5knowledge=_Enemies_: DM-100, DM-200, DM-201, Slugger (INFINITE) \n\n_Minibosses_: Dwarven WarMachines and their components
scenes.towerlevelselectscene.arena1challenge=CHALLENGE:\n`A SECRET TECHNIQUE`\nAll foes have the projecting champion title, which means they can attack anything in a 4-tile radius.
scenes.towerlevelselectscene.arena2challenge=CHALLENGE:\n`A STEALTHY ARMADA`\nAlmost all rats are invisible. The invisibility dispels after they hit something. You can't directly hit invisible mobs.
scenes.towerlevelselectscene.arena3challenge=CHALLENGE:\n`DON'T LET THEM NEAR`\nEvery gnoll explodes on death, dealing massive damage to all your units nearby.
scenes.towerlevelselectscene.arena4challenge=CHALLENGE:\n`I GUESS NO MAGIC`\nEvery crab is a magicrab. Magicrabs are immune to all magic damage.
scenes.towerlevelselectscene.arena5challenge=CHALLENGE:\n`OIL MONSTERS`\nAll black slimes, Goos and the Ooze are imbued with fire, meaning they are immune to fire and ignite their target on hit. Also, there is no water around.
scenes.towerlevelselectscene.arena6challenge=CHALLENGE:\n`CELL GAMBLING`\nThe amount of loot found in cells is doubled, but you lose gold after each wave instead of gaining it.
scenes.towerlevelselectscene.arena7challenge=CHALLENGE:\n`OVERWHELMING KNOWLEDGE`\nMost loot, tower and item sell offers are replaced with random scrolls.
scenes.towerlevelselectscene.arena8challenge=CHALLENGE:\n`IMMORTALITY`\nAny damage number dealt to your allied units or the hero will be taken from your coin pouch instead, unless you have no money.
scenes.towerlevelselectscene.arena9challenge=CHALLENGE:\n`WALLED OFF`\nAll defense systems are replaced with walls
scenes.towerlevelselectscene.arena10challenge=CHALLENGE:\n`ONE THOUSAND GUARDS, AND ONE PRISONER`\n There is a TON of guards at your base in the beginning. Buying any tower costs 2 times more coins.
scenes.towerlevelselectscene.arena11challenge=CHALLENGE:\n`INEFFICIENT`\nInstead of two miners near your base, you have 8 of them, each of which drops less coins.
scenes.towerlevelselectscene.arena12challenge=CHALLENGE:\n`SOCIAL DISTANCING`\nTowers can't be placed in a 5x5 area around each other.
scenes.towerlevelselectscene.arena13challenge=CHALLENGE:\n`...but there was no temple`\nThe temple walls are no more.
scenes.towerlevelselectscene.arena14challenge=CHALLENGE:\n`IT'S A SPY! + SOCIAL DISTANCING`\nEach wave, a spy spawns. A spy is a sneaky bandit who only targets the amulet, is invisible to allies and cannot be hit directly. Also towers cannot be placed in a + shape near each other.
scenes.towerlevelselectscene.arena15challenge=CHALLENGE:\n`CONCENTRATED ACID`\nThe toxic water and sluggers deal triple damage. The water also doesn't harm foes.
scenes.towerlevelselectscene.arena16challenge=CHALLENGE:\n`MICE & ROACHES`\nAll foes are small and agile but are easily killed.
scenes.towerlevelselectscene.arena17challenge=CHALLENGE:\n`FEVER DREAM`\nThe appearing towers are a bit... random.
scenes.towerlevelselectscene.arena18challenge=CHALLENGE:\n`Pirate ship...of idiots`\nEquipped towers switch to Guard, Wall, Cannon and TNT log. You get thrice the money per wave.\n`NOTE:` Pirates who fall from the ship are not pirates anymore.
scenes.towerlevelselectscene.arena19challenge=CHALLENGE:\n`Devolution`\nEach enemy becomes a weaker mob of the same type upon death.
scenes.towerlevelselectscene.arena20challenge=CHALLENGE:\n`Attack on Dwarf King`\nAll enemies are giant, slow, and take 50% less physical damage.
scenes.towerlevelselectscene.arena21challenge=CHALLENGE:\n`Pacifist battle, but you won't notice it`\nAnyone attempting to attack gets weakened and slowed down for a bit.
scenes.towerlevelselectscene.arena22challenge=CHALLENGE:\n`Crusaders`\nYou can use only guards and crossbows, all of them are blessed.
scenes.towerlevelselectscene.arena23challenge=CHALLENGE:\n`I am bleeding souls`\nYour towers, allies and you yourself take 2x damage, but all of it is converted into soul bleeding.
scenes.towerlevelselectscene.arena24challenge=CHALLENGE:\n`A team of healers`\nAll enemies are Rejuvenating champions and heal surrounding mobs upon death. To slightly compensate, they are low on health.
scenes.towerlevelselectscene.arena25challenge=CHALLENGE:\n`WE. ARE. LEGION.`\nEach foe which is spawned from a wave creates 1 HP copies of itself upon receiving damage.
scenes.towerselectscene.select=select
scenes.towerselectscene.no_select=
scenes.towerselectscene.none_selected=CHOOSE A TOWER
scenes.towerselectscene.uppertext=Tower Selection Screen
scenes.towerselectscene.welcometitle=Tower selection
scenes.towerselectscene.welcometext=Welcome to the tower selection and info window! Here you can read about all the towers you have unlocked and select/equip them to use on levels.\n\n_Unlocked_ towers can be selected/equipped, simply choose a tower and press the select button. It will be added to one of your four slots, replacing the last one! Simple and easy!\n\n#1Locked#1 towers cannot be selected and will remain locked until you complete some levels. There is no info when will the towers unlock exactly, and each "grey" slot is one of the towers you have yet to unlock.\n\n`Dungeon` towers cannot be unlocked, but you can find them in some of the levels. They are very important, because they might be the key to completing the level.
scenes.towerlevelselectscene.title_button=Tower defense
