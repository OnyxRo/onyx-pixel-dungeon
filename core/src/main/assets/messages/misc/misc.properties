randomizer.rat.nerf1.desc=Default rats drop meat 0% -> 50%.
randomizer.rat.nerf2.name=Nibbling Nuisances
randomizer.rat.nerf2.desc=Damage 2-4 -> 0-1.
randomizer.rat.nerf3.name=Frail Vermin
randomizer.rat.nerf3.desc=HP 8 -> 4 (Albino 15 -> 6)
