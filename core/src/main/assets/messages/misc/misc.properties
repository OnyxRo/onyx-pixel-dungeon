randomizer.snake.buff1.desc=Attacks gain 33% chance to deal poison damage.
randomizer.snake.buff2.name=Phantom Scales
randomizer.snake.buff2.desc=50% chance to negate surprise attacks.
randomizer.snake.buff3.name=Hardened Hide
randomizer.snake.buff3.desc=Damage reduction 0 -> 2.
randomizer.snake.nerf1.name=Paper Thin
randomizer.snake.nerf1.desc=HP 4 -> 1
randomizer.snake.nerf2.name=Seed Hoarders
randomizer.snake.nerf2.desc=Seed drop rate 25% -> 100%.
randomizer.snake.nerf3.name=Rat Hunters
randomizer.snake.nerf3.desc=Snakes will also attack rats.
randomizer.gnoll.buff1.name=Pack Hunters
randomizer.gnoll.buff1.desc=Always spawn in pairs.
randomizer.gnoll.buff2.name=Sling Masters
randomizer.gnoll.buff2.desc=Gains ranged attack.
randomizer.gnoll.buff3.name=Alarm Network
randomizer.gnoll.buff3.desc=Upon spotting you, they will alert all monsters on the level.
randomizer.gnoll.nerf1.name=Battle Scarred
randomizer.gnoll.nerf1.desc=Already wounded from previous encounters. 50%-100% HP.
randomizer.gnoll.nerf2.name=Brittle Armor
randomizer.gnoll.nerf2.desc=Damage reduction 0-2 -> -1.
randomizer.gnoll.nerf3.name=Pacifist Patrol
randomizer.gnoll.nerf3.desc=Will always flee.
randomizer.crab.buff1.name=Hermit Invasion
randomizer.crab.buff1.desc=Hermit crab speed 1->2. Hermit crab spawn rate 2% -> 50%.
randomizer.crab.buff2.name=Flurry Claws
randomizer.crab.buff2.desc=When no movement, attack twice in a turn.
randomizer.crab.buff3.name=Lightning Legs
randomizer.crab.buff3.desc=Speed 2 -> 3.5.
randomizer.crab.nerf1.name=Hermit Treasures
randomizer.crab.nerf1.desc=Crabs drop hermit crab loot 0% -> 50%.
randomizer.crab.nerf2.name=Clumsy Claws
randomizer.crab.nerf2.desc=Attack skill 12 -> 8.
randomizer.crab.nerf3.name=Molting Season
randomizer.crab.nerf3.desc=Damage reduction 0-4 -> 0.
randomizer.slime.buff1.name=Enhanced Resilience
randomizer.slime.buff1.desc=Damage reduction kicks in at 6 -> 4. (Harder to deal damage above 4.)
randomizer.slime.buff2.name=Sticky Coating
randomizer.slime.buff2.desc=Attacks gain 50% chance to add slowness.
randomizer.slime.buff3.name=Chameleon Ooze
randomizer.slime.buff3.desc=Slimes start nearly transparent until they attack.
