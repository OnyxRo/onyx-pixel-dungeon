# Polished PD
challenges.polished_changes=Polished PD changes
challenges.polished_changes_desc=This is an option, not a challenge.\n\nTurns on Polished PD's changes to Shattered's own things. Electricity stuns with _Electrified_, which breaks on the first direct hit. The Wand of Corruption can make enemies _Brittle_. Trap rooms use Polished's trap lists with the new _blast trap_. Magic well rooms can hold the _Well of Change_, which metamorphs two talents or transmutes an item.\n\nWith it off these play exactly as in Shattered.
###deranged, DERanged PD
challenges.forget_path=Shadow Curse
challenges.forget_path_desc=Something lurks in there...\n\n_-_ You quickly forget explored parts of the level\n\n_-_ Mobs can spawn from any distance and move slightly faster\n\n_-_ Your visibility is slightly reduced
challenges.no_hp=Degrading Health
challenges.no_hp_desc=No rest for careless!\n\n_-_ Half of incoming damage is converted into temporary max HP loss for 10 turns\n\n_-_ This stacks for additional 5 turns with more damage
