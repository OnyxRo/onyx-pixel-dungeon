challenges.endless_cycles=Endless cycles
challenges.endless_cycles_desc=The dungeon does not end at the Amulet.

- After taking the Amulet you can walk the dungeon again from floor 1, up to five times
- Each cycle makes every enemy much tougher, and gives a bigger reward in experience
- Your own damage grows with each cycle, but not as fast as the enemies
- The Rat King trades your thrown items for random ones
- Quests and one time drops come back

###Re-ARranged PD
