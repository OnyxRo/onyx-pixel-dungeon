#from Pixel Dungeon Reforged, the seven extra challenges
challenges.horde=Horde
challenges.horde_desc=There have not been enough adventurers down here clearing the infestation!\n\n- Double the mobs on every level.\n- Wandering monsters arrive twice as often.
challenges.monster_unknown=Monster Unknown
challenges.monster_unknown_desc=That's... well, it's got four legs... wait that's three legs?\n\n- You are unable to figure out the type of mob.\n- Hostile monsters all look the same and have no names.
challenges.trinket_madness=Trinket Madness
challenges.trinket_madness_desc=How'd all of these get in my bag? Why are they covered in glue?\n\n- Start with three fully upgraded trinkets that are impossible to drop or remove.\n- No magical catalyst found.
challenges.randomizer=Randomizer
challenges.randomizer_desc=Every region, a random group of creatures will gain an extra ability that makes them tougher, while another group of creatures will gain an extra ability that makes them weaker or more beneficial to fight.
challenges.adaptive=Adaptive
challenges.adaptive_desc=Where'd my stuff go?\n\n- When an enemy dies, all your equipment is replaced.
challenges.cube=Cube
challenges.cube_desc=We need nothing but the cube.\n\n_-_ The cube provides all.\n_-_ We require nothing but the cube.
challenges.cube.weapon_desc=_This is not a cube. It is filth. Sell it._
challenges.cube.wand_zap=The wand doesn't fire a cube, so it's not worth it.
challenges.cube.holytome_desc=_The cube is my god._ The cube provides all. _The cube sustains me._ The cube is generous. _I am not worthy of the cube._ To think of anything else is heresy. _I love the cube._
challenges.barrier_breaker=Barrier Breaker
challenges.barrier_breaker_desc=You hate when there is a barrier on your way, and you express your hate in the most direct way.\n\n- You spend 1 turn destroying doors by walking into them.

#from Pixel Dungeon Reforged, the Randomizer challenge, what each creature can gain or lose
randomizer.unknown.creaturename=Unknown
randomizer.unknown.buff.name=Tougher
randomizer.unknown.buff.desc=A creature is tougher.
randomizer.unknown.nerf.name=Weaker
randomizer.unknown.nerf.desc=A creature is weaker.
