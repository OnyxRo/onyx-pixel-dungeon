challenges.cursed_talents=Cursed talents
challenges.cursed_talents_desc=On floors 2, 6, 11 and 21 the hero must take one of three negative talents. Talent points spent on a negative talent weaken it, and two points cancel it.
challenges.superman=Superman
challenges.superman_desc=With great power comes great responsibility.\n\nAll physical damage the hero deals is _tripled_. Evasion is _tripled_ and accuracy is _doubled_.\n\nThe hero starts with _10_ maximum health, and it does not grow with level.
challenges.pyro=Pyromaniac
challenges.pyro_desc=Fire is one of the greatest gifts given to people, but sometimes it is a disaster.\n\nEvery physical attack the hero makes _sets the enemy on fire_.\n\nFire Imbue and the Elixir of Dragon's Blood last _half as long_.
challenges.cursed_dungeon=Cursed dungeon
challenges.cursed_dungeon_desc=The spirits of the enemies you defeat come back for you.\n\nWhen you defeat an enemy, _a wraith often appears in its place_.
challenges.fatigue=Fatigue
challenges.fatigue_desc=Long fights wear the hero out.\n\nFatigue builds every time the hero lands a physical attack or takes one. When it builds too high the hero suffers a short random _negative effect_ and the fatigue eases a little.\n\nFatigue fades over time, and eating or curing negative effects clears it at once.\n\nThe effects are blindness, weakness, daze, cripple, vulnerability, a short paralysis or slowness.
challenges.mutation=Mutation
challenges.mutation_desc=The wounds you inflict mutate your enemies.\n\nNow and then a physical attack _turns the enemy into a different monster_, picked from the region you are in.
challenges.rearranged_heroes=Re-ARranged heroes
challenges.rearranged_heroes_desc=This is an option, not a challenge.\n\nShattered's six heroes use Re-ARranged PD's versions of them. Their talent trees, starting kits and subclass choices change, and each gets a third subclass.\n\nWith it off they play exactly as in Shattered.
#tower
