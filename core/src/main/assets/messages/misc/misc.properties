###xun, Xun's PD hero unlocks
badges$badge.unlock_explorer.title=Explorer Unlocked!
badges$badge.unlock_explorer.desc=Unlock the Explorer by putting out fire or washing off ooze in water.
badges$badge.unlock_wraith.title=Wraith Unlocked!
badges$badge.unlock_wraith.desc=Unlock the Wraith by dropping to a fifth of your health or lower.
badges$badge.unlock_engineer.title=Engineer Unlocked!
badges$badge.unlock_engineer.desc=Unlock the Engineer by setting off five traps in one run.

gamemodes.half=Half Dungeon
gamemodes.half_desc=From Half PD. The dungeon is cut to 15 floors. Each region keeps its first floor, its quest floor and its boss, so the Ghost, Wandmaker, Blacksmith and Imp still appear. The strength potions, upgrade scrolls and styli of the skipped floors are found on the floors that are left, floor 1 holds a free weapon or armor, and you level up faster.
gamemodes.even_shorter=Even Shorter Dungeon
gamemodes.even_shorter_desc=From Even Shorter PD. Only the sewers and the prison, then the Amulet floor straight after Tengu. Your level stops at 12, weapons and armor only go up to tier 3, armor works as in Faith is my Armor, food fills you half as much and potions of healing heal half as much.
gamemodes.radar_glass_cannon=Glass Cannon
gamemodes.radar_glass_cannon_desc=Powerful ranged and magic attacks, weak and feeble body.\n\nEach level adds to ranged and magic damage and takes from health and armor.
gamemodes.radar_walking_tank=Walking Tank
gamemodes.radar_walking_tank_desc=A tower of steel and muscle. One that doesn't move very fast.\n\nEach level adds to health and armor and takes from movement speed and evasion.
gamemodes.radar_flailing_maniac=Flailing Maniac
gamemodes.radar_flailing_maniac_desc=Unleash a storm of poorly aimed attacks. You're bound to hit eventually.\n\nEach level adds to melee damage and attack speed and takes from accuracy and evasion.
gamemodes.radar_fencer=Fencer
gamemodes.radar_fencer_desc=Highly effective with a sword. Not so much with anything else.\n\nEach level adds to attack speed and accuracy and takes from ranged damage, magic damage and armor.
gamemodes.radar_heavy_hitter=Heavy Hitter
gamemodes.radar_heavy_hitter_desc=You hit things with things. Not very quickly, but very hard.\n\nEach level adds to melee and ranged damage and takes from attack speed and evasion.
gamemodes.radar_adventurer=Adventurer
gamemodes.radar_adventurer_desc=More a survivor than a fighter, you can sense enemies intuitively.\n\nEach level adds to evasion, luck and sensing enemies through walls and takes from melee and magic damage.
gamemodes.radar_faerie_blood=Faerie Blood
gamemodes.radar_faerie_blood_desc=Born with magical power and luck, but not with muscle.\n\nEach level adds to magic damage and luck and takes from melee damage and health.
gamemodes.radar_sniper=Sniper
gamemodes.radar_sniper_desc=Deadly from afar. Not deadly up close.\n\nEach level adds to ranged damage and sight and takes from melee damage and attack speed.
gamemodes.radar_physically_fit=Physically Fit
gamemodes.radar_physically_fit_desc=So much muscle, armor hardly even fits you.\n\nEach level adds to melee damage and health and takes from evasion and armor.
gamemodes.radar_fast_feet=Fast Feet
gamemodes.radar_fast_feet_desc=You can move fast, but you can't shoot while you're doing it.\n\nEach level adds to movement speed and takes from ranged damage, magic damage and health.
gamemodes.radar_steelskin=Steelskin
gamemodes.radar_steelskin_desc=Plates and blades all over you. Noisy, heavy plates and blades.\n\nEach level adds to melee damage and armor and takes from movement speed.
gamemodes.radar_sage=Sage
gamemodes.radar_sage_desc=Meditation has granted you mystical insights of many kinds, but not the fighting kind.\n\nEach level adds to evasion, luck, sight and sensing enemies through walls and takes from all damage.
gamemodes.kit_cape=Cape of Thorns
gamemodes.kit_cape_desc=From the Cape of Thorns mod. Start the game wearing this forgotten artifact.
gamemodes.kit_cursed=Cursed Beginning
gamemodes.kit_cursed_desc=From the Cursed Beginning mod. Start the game wearing a cursed artifact chosen for your class.
gamemodes.kit_facts=Just the Facts
gamemodes.kit_facts_desc=From the JustThe'Facts mod. Start with every artifact in your pack, unidentified.
gamemodes.kit_modern=Modern Starter Pack
gamemodes.kit_modern_desc=From the Modern Starter Pack mod. Start with three small rations, a potion of healing, a potion of mastery, a scroll of upgrade, a scroll of identify, and a ring, a potion and bombs picked for your class. Potions of healing and strength start identified.
gamemodes.kit_morstor=MorStor
gamemodes.kit_morstor_desc=From the MorStor mod. Start with a magical holster, a potion bandolier and a scroll holder.
gamemodes.kit_rocc=Rocc
gamemodes.kit_rocc_desc=From the Rocc mod. Start with one throwing stone at +16.
gamemodes.kit_roxx=Roxx
gamemodes.kit_roxx_desc=From the Roxx mod. Start with twenty throwing stones at +20.
gamemodes.kit_starter=Starter Pack
gamemodes.kit_starter_desc=From the Starter Pack mod. Start with a torch, a potion of healing, a potion of mastery, four alchemize spells, a stone of intuition, two tipped darts, a bomb, a honeypot and a scroll of identify. Potions of healing and strength start identified.
gamemodes.soft_not_so_hard=Not So Hard
gamemodes.soft_not_so_hard_desc=From Soft PD. Tall grass sometimes hides something useful when you walk through it. Food, potions of healing, darts, scrolls of identify, rings, scrolls and the odd scroll holder or seed pouch. Searching also reaches one tile further.
gamemodes.wuwuwu_gold=A Million Gold
gamemodes.wuwuwu_gold_desc=From WuWuWu. You always have a million gold. It tops back up every time you reach a floor.
gamemodes.wuwuwu_skip_bosses=Boss Roulette
gamemodes.wuwuwu_skip_bosses_desc=From WuWuWu. The boss floors from 5 to 20 each have a one in four chance to be a plain floor of their region with no boss. Tengu's mask and the King's crown lie on those plain floors instead.
gamemodes.buttered_arena=Arena
gamemodes.buttered_arena_desc=From Buttered PD. Fend off monsters in an arena while you improve your gear and gather survival items. Each level you gain heals you and sends the next wave, and every monster gives experience. Every fifth wave is a boss wave, beat it for a level and a Pixel Mart Key that takes you to a shop and back. Survive wave 25 and the arena's stairs open to the Amulet.
butteredarena.no_experience=You drop the bottle and it smashes at your feet. Maybe you should just focus on the boss?
gamemodes.kit_knowledge=Superior Knowledge
gamemodes.kit_knowledge_desc=From the Superior Knowledge mod. Every potion, scroll and ring is identified from the start.

###Too Cruel PD Trials, its challenge modifiers as game modes
gamemodes.tc_cardinal_disability=Cardinal Disability
gamemodes.tc_cardinal_disability_desc=From Too Cruel PD. Enemies only take damage while they stand in a straight line up, down, left or right of you.
gamemodes.tc_racing_the_death=Racing The Death
gamemodes.tc_racing_the_death_desc=From Too Cruel PD. Breaking that cursed mirror was a very bad idea.\n\nA trail of dark energy follows you and hurts you if you stay in one place for more than 3 actions. A deadly double of you follows 4 steps behind.
gamemodes.tc_horde=Horde
gamemodes.tc_horde_desc=From Too Cruel PD. Special offer, two enemies for the price of one!\n\nFloors hold twice as many monsters. Cannot be on with Abandoned Ship.
gamemodes.tc_invasion=Invasion
gamemodes.tc_invasion_desc=From Too Cruel PD. Monsters from deeper floors are invading.\n\nMonsters come from 2 floors deeper than usual, so prison monsters appear on floor 4 and so on.
gamemodes.tc_great_migration=Great Migration
gamemodes.tc_great_migration_desc=From Too Cruel PD. Time to update your bestiary!\n\nMonsters come from a whole region deeper, so prison monsters appear on floor 1. The first floor of the sewers is not changed. Turns on Invasion.
gamemodes.tc_mutagen=Mutagen
gamemodes.tc_mutagen_desc=From Too Cruel PD. There are more of them than you think.\n\nRare monster variants, like albino rats, are far more common.
gamemodes.tc_evolution=Evolution
gamemodes.tc_evolution_desc=From Too Cruel PD. Damn you, Darwin!\n\nEvery monster that has a rare variant spawns as that variant. The Rat Skull trinket is turned off. Turns on Mutagen.
gamemodes.tc_rotten_luck=Rotten Luck
gamemodes.tc_rotten_luck_desc=From Too Cruel PD. You should not have burned all those clovers!\n\nYour damage rolls lean toward the lowest result. The Thirteen Leaf Clover is turned off.
gamemodes.tc_arrowhead=Arrowhead
gamemodes.tc_arrowhead_desc=From Too Cruel PD. Are you sure this is a good idea?\n\nEach kill gives you an arrowhead stack. Each stack makes you take 30% more damage and monsters take 10% more. Stacks fall away one every 20 turns without a kill.
gamemodes.tc_thunderstruck=Thunderstruck
gamemodes.tc_thunderstruck_desc=From Too Cruel PD. You have been thunderstruck!\n\nYou start with 9001 arrowhead stacks, and they fall away one every 420 turns. A potion of shielding makes you immune to damage for 3 turns. Every trap is shown. Turns on Arrowhead.
gamemodes.tc_second_try=Second Try
gamemodes.tc_second_try_desc=From Too Cruel PD. You are not the first to brave this dungeon, and only the bare minimum was put back.\n\nAlmost no random loot. Special rooms are unlocked and mostly empty, and wells are dry.
gamemodes.tc_crystalline_shelter=Crystalline Shelter
gamemodes.tc_crystalline_shelter_desc=From Too Cruel PD. Every enemy has a crystal barrier that blocks weak hits. A strong hit breaks it, and it grows back 10 turns later. Enemies cannot dodge while the barrier holds.
gamemodes.tc_crystalline_blood=Crystalline Blood
gamemodes.tc_crystalline_blood_desc=From Too Cruel PD. Enemies other than bosses survive their first killing blow and gain five layers of crystal barrier. They die when the last layer breaks.
gamemodes.tc_deeper_danger=Deeper Danger
gamemodes.tc_deeper_danger_desc=From Too Cruel PD. Every effect that grows stronger with depth acts as if you were 10 floors deeper.
gamemodes.tc_head_start=Head Start
gamemodes.tc_head_start_desc=From Too Cruel PD. Two scrolls of upgrade and a potion of strength are found on the first floor. They are taken from later floors, so the total stays the same.
gamemodes.tc_blindness=Blindness
gamemodes.tc_blindness_desc=From Too Cruel PD. When sight is gone, you have to rely on touch.\n\nAway from walls you are blinded, and after a few turns in the open you get dizzy too.
gamemodes.tc_bloodbag=Bloodbag
gamemodes.tc_bloodbag_desc=From Too Cruel PD. Half human, half blood slime.\n\nInstead of taking damage, you start bleeding for half of it.
gamemodes.tc_revenge_rage=Revenge Rage
gamemodes.tc_revenge_rage_desc=From Too Cruel PD. Now you have done it, everyone hates you!\n\nWhen you overkill a monster, the extra damage is added to the attacks of every monster that saw it die.
gamemodes.tc_revenge_fury=Revenge Fury
gamemodes.tc_revenge_fury_desc=From Too Cruel PD. Rip and tear!\n\nFor 10 turns after seeing another enemy die, an enemy deals double damage and takes 20% more. This stacks.
gamemodes.tc_prepared_enemies=Prepared Enemies
gamemodes.tc_prepared_enemies_desc=From Too Cruel PD. Worthy heirs of the bat.\n\nSurprise attacks are impossible. Sewer snakes each ate two rats and have four times the health, but cannot dodge.
gamemodes.tc_repeater=Repeater
gamemodes.tc_repeater_desc=From Too Cruel PD. I will do it again!\n\nTraps stay armed after they go off.
gamemodes.tc_duplicator=Duplicator
gamemodes.tc_duplicator_desc=From Too Cruel PD. Constant production!\n\nWhenever a trap is used up, two copies of it appear somewhere on the floor.
gamemodes.tc_a_farewell_gift=A Farewell Gift
gamemodes.tc_a_farewell_gift_desc=From Too Cruel PD. From monsters, with love.\n\nMonsters leave a trap behind when they die.
gamemodes.tc_extreme_caution=Extreme Caution
gamemodes.tc_extreme_caution_desc=From Too Cruel PD. Have you ever been to a minefield?\n\nFour times as many traps.
gamemodes.tc_colosseum=Colosseum
gamemodes.tc_colosseum_desc=From Too Cruel PD. The largest amphitheatre ever built, and still standing.\n\nEvery enemy is a champion.
gamemodes.tc_patron_saints=Patron Saints
gamemodes.tc_patron_saints_desc=From Too Cruel PD. The canonization process is surprisingly swift.\n\nDead enemies leave behind an aura that makes other enemies hit harder and take less damage. Auras stack up to 8 times on the same tile.
gamemodes.tc_persistent_saints=Persistent Saints
gamemodes.tc_persistent_saints_desc=From Too Cruel PD. Intercontinental ballistic saints.\n\nEach dead enemy also leaves a saint aura where you stand. Turns on Patron Saints.
gamemodes.tc_holy_water=Holy Water
gamemodes.tc_holy_water_desc=From Too Cruel PD. Who knew the Dwarf King was a high priest?\n\nAll water in the dungeon carries a saint aura.
gamemodes.tc_intoxication=Intoxication
gamemodes.tc_intoxication_desc=From Too Cruel PD. They are drugs, after all.\n\nDrinking potions intoxicates you. High intoxication brings random harmful effects.
gamemodes.tc_plague=Plague
gamemodes.tc_plague_desc=From Too Cruel PD. This dungeon is infected!\n\nTaking damage intoxicates you.
gamemodes.tc_bad_plumbing=Bad Plumbing
gamemodes.tc_bad_plumbing_desc=From Too Cruel PD. All the plumbers were eaten by rats.\n\nStanding in water intoxicates you.
gamemodes.tc_certainty_of_steel=Certainty of Steel
gamemodes.tc_certainty_of_steel_desc=From Too Cruel PD. You craved the strength and certainty of steel.\n\nYour health is locked at 1 and all healing becomes shielding. Shielding comes in at full rate up to your max health, then slower, and stops at double your max health. Hunger and natural regeneration are turned off, and so is the Salt Cube.
gamemodes.tc_golden_colossus=Golden Colossus
gamemodes.tc_golden_colossus_desc=From Too Cruel PD. Cast into molten gold for his greed, he still stands.\n\nYour shielding comes from your gold, and losing shielding loses gold. Healing turns into gold at a poor rate that gets better with each region. The Master Thieves' Armband is turned off. Turns on Certainty of Steel.
gamemodes.tc_builder_paradox=Builder Paradox
gamemodes.tc_builder_paradox_desc=From Too Cruel PD. The construction plans were clearly not followed.\n\nEvery standard and corridor room has an equal chance to appear.
gamemodes.tc_retiered=Retiered
gamemodes.tc_retiered_desc=From Too Cruel PD. Gulp a bottle of that moonshine!\n\nEach weapon type has a 50% chance to be one tier lower, 25% to be one higher and 5% to be any tier. One melee weapon and one thrown weapon type become tier 6.
gamemodes.tc_untiered=Untiered
gamemodes.tc_untiered_desc=From Too Cruel PD. You are thoroughly wasted now!\n\nEvery weapon is tier 1, but gains bonus upgrades equal to its old tier minus one. Turns on Retiered.
gamemodes.tc_tier_up=Tier Up
gamemodes.tc_tier_up_desc=From Too Cruel PD. Every weapon goes up a tier after each boss you defeat. Turns on Untiered.
gamemodes.tc_unstable_accessories=Unstable Accessories
gamemodes.tc_unstable_accessories_desc=From Too Cruel PD. Those gems are not what they seem.\n\nWhen you get hit there is a chance that every ring and artifact you wear transmutes.
gamemodes.tc_pandemonium=Pandemonium
gamemodes.tc_pandemonium_desc=From Too Cruel PD. Your trusty sword twists and changes in your hand.\n\nYour weapon may turn into another after an attack, wands after use and thrown weapons after a throw. The spirit bow can turn into a random thrown weapon.
gamemodes.tc_barrier_breaker=Barrier Breaker
gamemodes.tc_barrier_breaker_desc=From Too Cruel PD. You hate barriers, and you show it in the most direct way.\n\nWalking into a door destroys it and takes a turn.
gamemodes.tc_moles=Moles
gamemodes.tc_moles_desc=From Too Cruel PD. They are in your walls.\n\nEnemies dig through walls. With Dungeon Loft on, every enemy flies. Boss floors are left alone.
gamemodes.tc_dungeon_loft=Dungeon Loft
gamemodes.tc_dungeon_loft_desc=From Too Cruel PD. See? It is much more spacious now!\n\nWalls are replaced with chasms, and you and your allies cannot see across chasms. With Moles on, every enemy flies. Boss floors are left alone.
gamemodes.tc_bulky_frame=Bulky Frame
gamemodes.tc_bulky_frame_desc=From Too Cruel PD. The monsters got seriously big.\n\nYou and your allies cannot see past monsters.
gamemodes.tc_shrouding_presence=Shrouding Presence
gamemodes.tc_shrouding_presence_desc=From Too Cruel PD. You cannot see me!\n\nMonsters block your sight in a 3 by 3 area around them. Turns on Bulky Frame.
gamemodes.tc_slippery_floor=Slippery Floor
gamemodes.tc_slippery_floor_desc=From Too Cruel PD. How do the monsters still walk normally?\n\nYou slide along water, and the water you slide over may dry up. Floors have half again as much water.
gamemodes.tc_insomnia=Insomnia
gamemodes.tc_insomnia_desc=From Too Cruel PD. Did you think you could sleep in a dungeon full of sleepless monsters?\n\nEnemies never sleep and act at double speed out of combat. Trying to rest calls short lived wraiths that cannot be harmed.
gamemodes.tc_loot_paradise=Loot Paradise
gamemodes.tc_loot_paradise_desc=From Too Cruel PD. Eleven times as much loot is scattered around the dungeon.
gamemodes.tc_bombermob=Bombermob
gamemodes.tc_bombermob_desc=From Too Cruel PD. Monsters drop a lit bomb when they die, and you cannot pick up lit bombs. Off boss floors there is a 1% chance of a supernova instead.
gamemodes.tc_constellation=Constellation
gamemodes.tc_constellation_desc=From Too Cruel PD. Every bomb a monster drops is a supernova, and a supernova sets off a random special bomb on every cell it reaches. Turns on Bombermob.
gamemodes.tc_cursed=Cursed
gamemodes.tc_cursed_desc=From Too Cruel PD. Somebody grabbed it by the wrong end.\n\nEvery item found in the dungeon is cursed, and so is your starting gear.
gamemodes.tc_curse_magnet=Curse Magnet
gamemodes.tc_curse_magnet_desc=From Too Cruel PD. Sadly, even your backpack is cursed.\n\nYou cannot drop or throw cursed items. Turns on Cursed.
gamemodes.tc_extermination=Extermination
gamemodes.tc_extermination_desc=From Too Cruel PD. A dungeon cleaner would be proud.\n\nA floor stays sealed until every monster that was on it when you arrived has been slain. Falling into a chasm on a sealed floor teleports you elsewhere on it.
gamemodes.tc_postpaid_loot=Postpaid Loot
gamemodes.tc_postpaid_loot_desc=From Too Cruel PD. Did you forget to ask for payment up front?\n\nEvery item on a floor is locked away until its extermination is complete. Turns on Extermination.
gamemodes.tc_fake_dungeon=Fake Dungeon
gamemodes.tc_fake_dungeon_desc=From Too Cruel PD. At least you never have to guess which chest is a mimic now.\n\nEvery normal chest is a weak mimic.
gamemodes.tc_fort_knox=Fort Knox
gamemodes.tc_fort_knox_desc=From Too Cruel PD. More chests means more treasure, right?\n\nEvery item lying on a floor is held by a weak mimic, and every weapon by a fragile living statue. Turns on Fake Dungeon.
gamemodes.tc_treasure_chest_party_quest=Treasure Chest Party Quest
gamemodes.tc_treasure_chest_party_quest_desc=From Too Cruel PD. We are only here for the loot!\n\nWeak mimics are as strong as normal mimics and drop extra loot like them. Turns on Fake Dungeon.
gamemodes.tc_jack_in_the_box=Jack-in-the-box
gamemodes.tc_jack_in_the_box_desc=From Too Cruel PD. Every monster is hidden inside a mimic. A mimic wakes and hunts you 3 turns after you come within 2 tiles of it, or after you hit a mimic near it.
gamemodes.tc_boxed=Boxed
gamemodes.tc_boxed_desc=From Too Cruel PD. The edges of every room are lined with mimics that hold monsters. They cannot be harmed until you see them.
gamemodes.tc_recursive_hierarchy=Recursive Hierarchy
gamemodes.tc_recursive_hierarchy_desc=From Too Cruel PD. Mimics have a 50% chance to be inside a smaller mimic, and what comes out of a mimic is a little larger. How deep this goes grows with each region. Turns on Jack-in-the-box.
gamemodes.tc_repopulation=Repopulation
gamemodes.tc_repopulation_desc=From Too Cruel PD. The dungeon hates being empty.\n\nMonsters come back faster the fewer are left, from every 50 turns on a full floor down to at once when almost none remain. Cannot be on with Infertility.
gamemodes.tc_resurrection=Resurrection
gamemodes.tc_resurrection_desc=From Too Cruel PD. For monsters, death is only a short inconvenience.\n\nMonsters come back every turn. Turns on Repopulation.
gamemodes.tc_fractal_hive=Fractal Hive
gamemodes.tc_fractal_hive_desc=From Too Cruel PD. Your mission is to test a new way to spawn endless monsters.\n\nThere is no limit to how many monsters a floor can hold, and they come back at least every 25 turns. Turns on Repopulation.
gamemodes.tc_infertility=Infertility
gamemodes.tc_infertility_desc=From Too Cruel PD. Monsters no longer come back on their own. Cannot be on with Repopulation.
gamemodes.tc_hydra=Hydra
gamemodes.tc_hydra_desc=From Too Cruel PD. Cut off one head and two more grow.\n\nEach enemy you kill brings two more somewhere on the floor. Turns on Infertility.
gamemodes.tc_crooked_die=Crooked Die
gamemodes.tc_crooked_die_desc=From Too Cruel PD. Many random rolls always give their highest result. Expect large rooms, high damage on both sides and much more. Be warned, bleeding never stops on its own.
gamemodes.tc_crumbled_stairs=Crumbled Stairs
gamemodes.tc_crumbled_stairs_desc=From Too Cruel PD. You cannot go up before you have the Amulet of Yendor, and you cannot go down once you have it. Teleporting between floors does not work.
gamemodes.tc_multiclassing=Multiclassing
gamemodes.tc_multiclassing_desc=From Too Cruel PD. Tengu's mask offers 3 random subclasses of other heroes, and you get the special item of the picked subclass's hero.
gamemodes.tc_exotic_goods=Exotic Goods
gamemodes.tc_exotic_goods_desc=From Too Cruel PD. Every potion and scroll you find is exotic, apart from strength potions and upgrade scrolls. The Exotic Crystals trinket is turned off.
gamemodes.tc_drought=Drought
gamemodes.tc_drought_desc=From Too Cruel PD. Almost all of the dungeon's water has dried up.\n\nFar less water and grass.
gamemodes.tc_over_the_edge=Over the Edge
gamemodes.tc_over_the_edge_desc=From Too Cruel PD. Careful not to fall.\n\nThe floors are badly crumbled, with chasms everywhere. The way through always stays open.
gamemodes.tc_whiplash=Whiplash
gamemodes.tc_whiplash_desc=From Too Cruel PD. Wheee!\n\nAny damage throws whoever took it toward a character further away, or toward a wall if nobody is in sight.
gamemodes.tc_casual_approach=Casual Approach
gamemodes.tc_casual_approach_desc=From Too Cruel PD. The first time you see a monster, it is pulled to you by the power of love and heavy steel chains.
gamemodes.tc_let_them_rest=Let Them Rest
gamemodes.tc_let_them_rest_desc=From Too Cruel PD. I am tired right now, could you just leave me be?\n\nYou are invisible while you rest or sleep.
gamemodes.tc_eternal_flames=Eternal Flames
gamemodes.tc_eternal_flames_desc=From Too Cruel PD. Fire on the ground never goes out but does not spread, and burnable tiles do not burn away.
gamemodes.tc_domain_of_hell=Domain of Hell
gamemodes.tc_domain_of_hell_desc=From Too Cruel PD. All grass is always on fire and enemies resist fire. Using the Brimstone glyph is a very bad idea. A free aqua brew lies near the entrance of every floor, and the grass of entrance rooms is water.
gamemodes.tc_crowd_diversity=Crowd Diversity
gamemodes.tc_crowd_diversity_desc=From Too Cruel PD. Look how small this cow is!\n\nEnemies come in random sizes. Size changes their attack and move speed, armor, evasion, health and damage. Bosses and minibosses keep their size.
gamemodes.tc_in_your_face=In Your Face
gamemodes.tc_in_your_face_desc=From Too Cruel PD. One to three monsters wait right next to the entrance of each floor. They hold still for the first turn and wake a turn later.
gamemodes.tc_perfect_information=Perfect Information
gamemodes.tc_perfect_information_desc=From Too Cruel PD. You always have mind vision and awareness, and every floor is magic mapped when you arrive.
gamemodes.tc_complete_knowledge=Complete Knowledge
gamemodes.tc_complete_knowledge_desc=From Too Cruel PD. Of course I know everything. Everything.\n\nItems are identified the moment you pick them up. The Shard of Oblivion is turned off.
gamemodes.tc_thoughtless=Thoughtless
gamemodes.tc_thoughtless_desc=From Too Cruel PD. You were never good at saving up.\n\nSome valuable consumables are destroyed when you leave a floor, both in your backpack and on the floor. You are warned before leaving about the ones you can see. These are upgrade, enchantment, magic mapping, recharging, transmutation, mystical energy and foresight scrolls, styli, stones of augmentation, enchantment, intuition and clairvoyance, potions of strength and mastery, elixirs of might, magical and curse infusions, alchemize, reclaim trap and recycle. Turns on Complete Knowledge.
gamemodes.tc_safety_buffer=Safety Buffer
gamemodes.tc_safety_buffer_desc=From Too Cruel PD. You paid how much for this blessing?\n\nYou start with 10 safety charges. Each charge strikes a monster you see, stunning it for a turn and dealing 10 damage the turn after.
gamemodes.tc_skeleton_crew=Skeleton Crew
gamemodes.tc_skeleton_crew_desc=From Too Cruel PD. Half as many monsters, and you earn twice the experience.
gamemodes.tc_abandoned_ship=Abandoned Ship
gamemodes.tc_abandoned_ship_desc=From Too Cruel PD. There are no regular monsters. Turns on Skeleton Crew, cannot be on with Horde.
gamemodes.tc_uninspired_to_learn=Uninspired to Learn
gamemodes.tc_uninspired_to_learn_desc=From Too Cruel PD. Enemies give no experience. Defeating a boss raises your level by 3 at once.
gamemodes.tc_forced_pacifism=Forced Pacifism
gamemodes.tc_forced_pacifism_desc=From Too Cruel PD. Enemies off boss floors take no damage. A free phase shift lies near the entrance of every floor. Turns on Uninspired to Learn.
gamemodes.tc_protected_goods=Protected Goods
gamemodes.tc_protected_goods_desc=From Too Cruel PD. Scrolls of upgrade, potions of strength and styli are not found in the dungeon. A note marks each one, and the next boss drops them all. The items from Head Start are not affected.
gamemodes.tc_blessing_for_the_worthy=Blessing for the Worthy
gamemodes.tc_blessing_for_the_worthy_desc=From Too Cruel PD. When you defeat a boss you heal fully, lose your debuffs and are blessed for 100 turns. With Safety Buffer on, its charges also refill and hit harder.

toocruel.insomnia_wakeup=You try to rest, but the dungeon will not let you sleep.
toocruel.bombermob_fuse=This is too dangerous to touch!
toocruel.extermination_lock=The floor is sealed, %s targets are still alive.
toocruel.extermination_lock_last=The floor is sealed, only one target is still alive.
toocruel.extermination_complete=Extermination complete.
toocruel.extermination_second_round=A wave of %d new pests has arrived, exterminate them all!
toocruel.crumbled_stairs_no_distractions=You cannot get distracted now! The surface awaits!
toocruel.thoughtless_ask_title=Thoughtless
toocruel.thoughtless_ask_both=Do you want to move on? Items in your backpack and items you can see on this floor will be destroyed forever.\n\nIn your backpack %1$s\n\nOn the floor %2$s
toocruel.thoughtless_ask_inventory=Do you want to move on? Items in your backpack will be destroyed forever.\n\nIn your backpack %1$s
toocruel.thoughtless_ask_heaps=Do you want to move on? Items you can see on this floor will be destroyed forever.\n\nOn the floor %2$s
toocruel.thoughtless_yes=Yes, I know what I am doing
toocruel.thoughtless_no=No, I changed my mind
toocruel.thoughtless_destroyed_heaps=You hear precious items being destroyed behind you.
toocruel.thoughtless_destroyed_inventory=You hear precious items being destroyed in your backpack.
toocruel.left_out_66=Prison Express (not in this game)
toocruel.left_out_93=Boss Rush (not in this game)

actors.buffs.toocruel.racingthedeath.name=Racing The Death
actors.buffs.toocruel.racingthedeath.desc=A trail of shadows follows you. Staying in one place for too long, or stepping back onto the trail, hurts you.
actors.buffs.toocruel.racingthedeath.ondeath=You were consumed by shadows.
actors.buffs.toocruel.arrowhead.name=Arrowhead
actors.buffs.toocruel.arrowhead.desc=You are riding the lightning!\n\nStacks %d\nExtra damage you take %d%%\nExtra damage enemies take %d%%
actors.buffs.toocruel.crystalshield.name=Crystal Barrier
actors.buffs.toocruel.crystalshield.desc=The barrier glitters with power, throwing reflections of dimensions you have never seen.\n\nIt nullifies weak hits and breaks when no layers remain. It nullifies up to %d damage.
actors.buffs.toocruel.crystalshield.desc_inactive=Shards of the barrier float around, trying to come back together.\n\nThe barrier is broken and will come back in %s turns.
actors.buffs.toocruel.crystalshield.blocked=nullified
actors.buffs.toocruel.crystalshield.shattered=shattered
actors.buffs.toocruel.crystalshield.restored=reassembled
actors.buffs.toocruel.crystalshield.layer_broken=cracked
actors.buffs.toocruel.crystalshield$layer.name=Crystal Layer
actors.buffs.toocruel.crystalshield$layer.desc=A single layer of the crystal barrier.\n\nIt nullifies one hit the barrier itself did not stop. The barrier is so large that dodging is almost impossible, and it breaks when no layers remain.
actors.buffs.toocruel.crystalshield$layer.desc_standalone=A thin crystal membrane, tempting you to touch it.\n\nIt nullifies one hit. It is so large that dodging is almost impossible.
actors.buffs.toocruel.crystalshield$deathmarker.name=Crystalline Blood
actors.buffs.toocruel.crystalshield$deathmarker.desc=No life is left in this body, but the shimmering husk still stands.\n\nIt dies when it loses all of its crystal layers.
actors.buffs.toocruel.revengerage.name=Revenge Rage
actors.buffs.toocruel.revengerage.desc=You should not have killed its friends!\n\nDamage bonus %d
actors.buffs.toocruel.revengefury.name=Revenge Fury
actors.buffs.toocruel.revengefury.desc=This monster is very angry at you! The good news is that it will run out of steam soon.\n\nIt deals double damage and takes 20%% more damage, bosses excepted. Turns left %s
actors.buffs.toocruel.patronsaints.name=Saint Aura
actors.buffs.toocruel.patronsaints.desc=A fallen enemy left a blessing behind for its allies.\n\n%1$d saints protect this foe, giving it %2$s%% more attack and %3$s%% less damage taken.
actors.buffs.toocruel.intoxication.name=Intoxicated
actors.buffs.toocruel.intoxication.desc=Intoxication left _%1$s_\nCurrent level _%2$s_
actors.buffs.toocruel.intoxication.t_none=safe
actors.buffs.toocruel.intoxication.t_light=light
actors.buffs.toocruel.intoxication.t_medium=medium
actors.buffs.toocruel.intoxication.t_heavy=heavy
actors.buffs.toocruel.intoxication.t_deadly=deadly
actors.buffs.toocruel.intoxication.notify_light=You feel slightly intoxicated.
actors.buffs.toocruel.intoxication.notify_medium=You feel intoxicated.
actors.buffs.toocruel.intoxication.notify_heavy=You feel that any more intoxication could kill you.
actors.buffs.toocruel.intoxication.notify_deadly=You feel you are about to die from intoxication.
actors.buffs.toocruel.holdingheap.name=Backpack
actors.buffs.toocruel.holdingheap.desc_both=A backpack carrying %d items and %d mystery bags.
actors.buffs.toocruel.holdingheap.desc_items=A backpack carrying %d items.
actors.buffs.toocruel.holdingheap.desc_heaps=A backpack carrying %d mystery bags.
actors.buffs.toocruel.holdingheap.desc_empty=An empty backpack.
actors.buffs.toocruel.resizing.name=Scaled
actors.buffs.toocruel.resizing.desc=This creature is an unusual size.\n\nIts size is %1$d%%, giving it %2$s times the attack damage, %3$s times the armor, %4$s times the evasion, %5$s times the health and %6$s times the speed.
actors.buffs.toocruel.safetybuffer.name=Safety Buffer
actors.buffs.toocruel.safetybuffer.desc=Wisps of ancient magic protect you.\n\nYou have %d safety charges left.
actors.buffs.toocruel.exterminating.name=Exterminate
actors.buffs.toocruel.exterminating.desc=This monster must be slain before you can leave the floor.
actors.blobs.toocruel.patronsaintsblob.desc=The blessing of the saints lingers in the air.
actors.blobs.toocruel.exterminationitemlock.desc=This item will be unlocked once the extermination is complete.
items.toocruel.iou.name=IOU for %s
items.toocruel.iou.desc=%s is protected. Defeat the next boss to claim it.

bosscrawl.gold=You get %d gold to spend. The merchant by the lake sells everything, and the glowing lake heals you. The manor stair leads on to the bosses.
gamemodes.modded_kit=Test Kit
gamemodes.modded_kit_desc=From Modded Pixel Dungeon, a modding guide mod by Cocoa. Every hero starts with a +100 plate armor and 20 potions of mind vision, as the mod's test code gave them. The warrior also gets two scrolls of identify.
gamemodes.speedrun_timer=Speedrun Timer
gamemodes.speedrun_timer_desc=From Speedrun Pixel Dungeon. A timer starts on the first turn and stops when the amulet is picked up. Each new floor takes a split, shown in the log. The time turns red when it falls behind the goal, the average of your finished runs lowered to your personal best. Runs with every challenge on and Bones% runs keep their own records. The game menu gets a restart button.
gamemodes.speedrun_bones=Bones%
gamemodes.speedrun_bones_desc=From Speedrun Pixel Dungeon. Floor 1 holds remains with an item you pick by the mode's level. 1 wand of corrosion, 2 wand of lightning, 3 wand of fireblast, 4 wand of magic missile, 5 wand of disintegration, 6 timekeeper's hourglass, 7 horn of plenty, 8 ethereal chains, 9 cape of thorns, 10 beacon of returning. Each is +3.
gamemodes.oldspeedrun_wand=Cursed Wand Start
gamemodes.oldspeedrun_wand_desc=From Old Speedrun Pixel Dungeon. Floor 1 always holds remains with a cursed +3 wand of lightning, for practising its famous speedrun route.
smallmodes.split=Floor %1$d reached at %2$s.
smallmodes.new_pb=Run finished in %s, a new personal best!
smallmodes.finished=Run finished in %s.
smallmodes.cat_any=Any%
smallmodes.cat_bones=Bones%
smallmodes.cat_allchallenges=All Challenges
gamemodes.lore_goo=The Goo's Story
gamemodes.lore_goo_desc=From Shattered Pixel Lore. Play the Goo's story through the sewers. The hero becomes the Goo, starts at level 2 with nothing and cannot pick up items. It never gets hungry, but it dries out away from water, and its attacks come from its moisture. The floors hold no items and monsters drop nothing. The Goo has its own four talents. Killing the Goo on floor 5 ends the run as a win.
loregoo.no_pickup=The Goo cannot carry anything.
gamemodes.trap_dungeon=Trap Dungeon
gamemodes.trap_dungeon_desc=From Shattered Trap Dungeon, a mod that makes the game a bit crazier. Every floor uses its list of 57 traps, and its monsters join each floor. Half of all armor comes as one of its special versions, the Rat King joins in with a clown, DM-300 calls goblins at half health, and it adds an extra shop room. Its items, monsters and traps can also be found in the sandbox without the mode.
trapdungeon.goblin_protocol=Goblin protocol active!
trapdungeon.ritual=Ah, so it's finally time to start the ritual. Good luck...
trapdungeon.no_dust=A mysterious force holds you here! Stick with the ritual and find some rat dust.
#musicimplant, Music Implant SPD
gamemodes.mi_horror=Light and Horror
gamemodes.mi_horror_desc=From Music Implant SPD. Horror grows while you explore in the dark and costs accuracy and surprise attacks at high levels. Kills, food and lit candles or torches hold it back. You start with a candle holder and two wax and wicks, shops sell torches and wax, and dark floors and the halls hold torches.
gamemodes.mi_satiation=Satiation
gamemodes.mi_satiation_desc=From Music Implant SPD. Hunger is replaced by seven stages of satiation. Eating well gives strength and fast healing, going hungry weakens your attacks and health, and starving hurts more the longer it lasts.
gamemodes.mi_cats_eyes=Perk, Cat Eye
gamemodes.mi_cats_eyes_desc=From Music Implant SPD. You see one tile further.
gamemodes.mi_inconspicuous=Perk, Inconspicuous
gamemodes.mi_inconspicuous_desc=From Music Implant SPD. Enemies are less likely to notice you.
gamemodes.mi_quick_draw=Perk, Quick Draw
gamemodes.mi_quick_draw_desc=From Music Implant SPD. A weapon swap takes no time, once every 5 turns.
gamemodes.mi_on_diet=Perk, On Diet
gamemodes.mi_on_diet_desc=From Music Implant SPD. You get hungry 30 percent more slowly.
gamemodes.mi_abstinence=Perk, Abstinence
gamemodes.mi_abstinence_desc=From Music Implant SPD. Hunger and starving weaken you less. Turns on Satiation.
gamemodes.mi_dexterous=Perk, Dexterous
gamemodes.mi_dexterous_desc=From Music Implant SPD. Drinking a potion or throwing an item takes no time, once every 2 turns.
gamemodes.mi_organized=Perk, Organized
gamemodes.mi_organized_desc=From Music Implant SPD. Your backpack holds 5 more items.
gamemodes.mi_lucky=Perk, Lucky
gamemodes.mi_lucky_desc=From Music Implant SPD. You find loot as if you wore a +2 ring of wealth.
gamemodes.mi_quick_learner=Perk, Quick Learner
gamemodes.mi_quick_learner_desc=From Music Implant SPD. You gain 25 percent more experience from monsters.
gamemodes.mi_stout=Perk, Stout
gamemodes.mi_stout_desc=From Music Implant SPD. You gain 1 strength every 10 levels.
gamemodes.mi_biologist=Perk, Biologist
gamemodes.mi_biologist_desc=From Music Implant SPD. Monster descriptions show their health, accuracy and evasion.
gamemodes.mi_adrenaline=Perk, Adrenaline
gamemodes.mi_adrenaline_desc=From Music Implant SPD. High horror also makes you faster, harder to hit and quicker to strike. Turns on Light and Horror.
gamemodes.mi_brave=Perk, Brave
gamemodes.mi_brave_desc=From Music Implant SPD. Below a quarter of your health you deal 15 percent more damage and horror stops growing. Turns on Light and Horror.
gamemodes.mi_confident=Perk, Confident
gamemodes.mi_confident_desc=From Music Implant SPD. Above 90 percent health you gain 15 percent accuracy and horror grows at half speed. Turns on Light and Horror.
gamemodes.mi_sturdy=Perk, Sturdy
gamemodes.mi_sturdy_desc=From Music Implant SPD. 3 more max health at the start and 2 more each level.
gamemodes.mi_very_strong=Perk, Very Strong
gamemodes.mi_very_strong_desc=From Music Implant SPD. 1 more strength, and 1 more every 7 levels.
gamemodes.mi_gobbler=Perk, Gobbler
gamemodes.mi_gobbler_desc=From Music Implant SPD. Eating takes a single turn.
gamemodes.mi_mind_compass=Perk, Mind Compass
gamemodes.mi_mind_compass_desc=From Music Implant SPD. You always see where each floor's exit is.
gamemodes.mi_short_sighted=Perk, Short Sighted
gamemodes.mi_short_sighted_desc=From Music Implant SPD. You see one tile less.
gamemodes.mi_conspicuous=Perk, Conspicuous
gamemodes.mi_conspicuous_desc=From Music Implant SPD. Enemies are more likely to notice you.
gamemodes.mi_slowpoke=Perk, Slowpoke
gamemodes.mi_slowpoke_desc=From Music Implant SPD. Swapping weapons and lighting a light source take ten times as long.
gamemodes.mi_big_stomach=Perk, Big Stomach
gamemodes.mi_big_stomach_desc=From Music Implant SPD. You get hungry 50 percent faster.
gamemodes.mi_clumsy=Perk, Clumsy
gamemodes.mi_clumsy_desc=From Music Implant SPD. Throwing an item or drinking a potion fails about one time in five, and now and then you drop the lot.
gamemodes.mi_disorganized=Perk, Disorganized
gamemodes.mi_disorganized_desc=From Music Implant SPD. Your backpack holds 5 fewer items.
gamemodes.mi_unlucky=Perk, Unlucky
gamemodes.mi_unlucky_desc=From Music Implant SPD. Gear you find is never upgraded and is more often cursed.
gamemodes.mi_illiterate=Perk, Illiterate
gamemodes.mi_illiterate_desc=From Music Implant SPD. You cannot open the journal, and most scrolls have a 40 percent chance to cast a random spell instead. Upgrade and transmutation always work.
gamemodes.mi_pacifist=Perk, Pacifist
gamemodes.mi_pacifist_desc=From Music Implant SPD. Killing enemies gives no relief from horror. Turns on Light and Horror.
gamemodes.mi_nictophobia=Perk, Nyctophobia
gamemodes.mi_nictophobia_desc=From Music Implant SPD. Horror grows twice as fast, and with no light source lit you lose 15 percent accuracy. Turns on Light and Horror.
gamemodes.mi_nyctalopia=Perk, Night Blindness
gamemodes.mi_nyctalopia_desc=From Music Implant SPD. You only see the tiles next to you, or three tiles away with a light.
gamemodes.mi_amnesia=Perk, Amnesia
gamemodes.mi_amnesia_desc=From Music Implant SPD. Places you have seen fade in your memory as if they were only mapped.
gamemodes.mi_lack_of_sense=Perk, Lack of Sense
gamemodes.mi_lack_of_sense_desc=From Music Implant SPD. Your health shows as a word instead of a number.
gamemodes.mi_unresponsive=Perk, Unresponsive
gamemodes.mi_unresponsive_desc=From Music Implant SPD. You cannot make surprise attacks.
gamemodes.mi_frail=Perk, Frail
gamemodes.mi_frail_desc=From Music Implant SPD. 2 less max health at the start and 2 less each level.
gamemodes.mi_nibbling=Perk, Nibbling
gamemodes.mi_nibbling_desc=From Music Implant SPD. Eating takes twice as long.
musicimplant.actrestore=You are ready for another quick potion or throw.
musicimplant.switchrestore=You are ready for another quick weapon swap.
musicimplant.clumsythrow=You get nervous and fumble the %s.
musicimplant.clumsydrink=You get nervous and fail to drink the %s.
musicimplant.clumsycrit=Worse, you drop all of them!
musicimplant.instantthrow=You deftly grab the %s and throw it.
musicimplant.instantdrink=You deftly grab the %s and drink it down.
musicimplant.illiterate=You misread some of the runes and a random spell goes off!
musicimplant.nojournal=You cannot read your journal.
musicimplant.hp_healthy=Healthy
musicimplant.hp_fine=Fine
musicimplant.hp_hurt=Hurt
musicimplant.hp_wounded=Wounded
musicimplant.hp_dying=Dying
musicimplant.hp_dead=Dead
musicimplant.biologist=Health _%d of %d_. Accuracy _%d_. Evasion _%d_.
gamemodes.espd_hp=More Health
gamemodes.espd_hp_desc=From Easier Sprouted PD. The hero starts with 200 more maximum health.
gamemodes.espd_atk=Sharp Aim
gamemodes.espd_atk_desc=From Easier Sprouted PD. The hero's accuracy goes up by 100, so almost every attack lands.
gamemodes.espd_def=Quick Feet
gamemodes.espd_def_desc=From Easier Sprouted PD. The hero's evasion goes up by 100, so most attacks miss.
gamemodes.espd_str=Mighty
gamemodes.espd_str_desc=From Easier Sprouted PD. The hero starts with 10 more strength.
gamemodes.espd_shops=Shops Everywhere
gamemodes.espd_shops_desc=From Easier Sprouted PD. Every regular floor from 1 to 24 has a shop.
gamemodes.espd_cheap=Bargain Prices
gamemodes.espd_cheap_desc=From Easier Sprouted PD. Everything in a shop costs 1 gold.
gamemodes.espd_upgrade=Big Upgrades
gamemodes.espd_upgrade_desc=From Easier Sprouted PD. A scroll of upgrade adds ten levels instead of one.
gamemodes.espd_loot=More Loot
gamemodes.espd_loot_desc=From Easier Sprouted PD. Monsters drop their loot three times as often.
gamemodes.espd_quest=Rich Rewards
gamemodes.espd_quest_desc=From Easier Sprouted PD. Quest rewards from the Ghost, the Wandmaker and the Imp have thirty more levels.
gamemodes.deistic_human=Human
gamemodes.deistic_human_desc=From Deistic PD. You are a human. Humans start with 2 less health, can use the basic power of every race artifact and get the most out of the Communications Relay. The floor 5 boss leaves your race's artifact and Tengu leaves a Tome of Specialty (Warlock or Monk). Burning scrolls go off with their own effect.
gamemodes.deistic_dwarf=Dwarf
gamemodes.deistic_dwarf_desc=From Deistic PD. You are a dwarf. Extra strength adds extra damage, fire, frost, ooze and poison hurt a little less, demons and the undead hurt a little more, and only dwarves use the Chains of Ares in full. The floor 5 boss leaves your race's artifact and Tengu leaves a Tome of Specialty (Demolitionist or Mercenary). Burning scrolls go off with their own effect.
gamemodes.deistic_wraith=Wraith
gamemodes.deistic_wraith_desc=From Deistic PD. You are a wraith. You dodge a little more often, fire and frost hurt a little less, the light of a scroll of remove curse stings you and only wraiths use the Wraithmetal Amulet in full. The floor 5 boss leaves your race's artifact and Tengu leaves a Tome of Specialty (Red or Blue Wraith). Burning scrolls go off with their own effect.
gamemodes.deistic_gnoll=Gnoll
gamemodes.deistic_gnoll_desc=From Deistic PD. You are a gnoll. You resist charm, start with two sungrass seeds, starve twice as fast once hungry and only gnolls use the Wooden Effigy in full. The floor 5 boss leaves your race's artifact and Tengu leaves a Tome of Specialty (Shaman or Brute). Burning scrolls go off with their own effect.
deisticpd.detonates=The burning %s goes off!
deisticpd.way_warlock=Warlock
deisticpd.way_warlock_desc=Effects from your wands last twice as long.
deisticpd.way_monk=Monk
deisticpd.way_monk_desc=Your bare fists hit harder as you level up.
deisticpd.way_demolitionist=Demolitionist
deisticpd.way_demolitionist_desc=Every bomb blast grows stronger as you level up.
deisticpd.way_mercenary=Mercenary
deisticpd.way_mercenary_desc=After you dodge an attack, your next strike comes twice as fast.
deisticpd.way_red=Red Wraith
deisticpd.way_red_desc=You are surprisingly lucky, monsters drop loot half again as often.
deisticpd.way_blue=Blue Wraith
deisticpd.way_blue_desc=You can sense every enemy you have hit for a while afterwards.
deisticpd.way_shaman=Shaman
deisticpd.way_shaman_desc=Walking through tall grass heals you a little.
deisticpd.way_brute=Brute
deisticpd.way_brute_desc=You hit harder for every enemy standing next to you.
